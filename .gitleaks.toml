# Gitleaks configuration for hyperbolic-core.
#
# Extends the full default gitleaks ruleset unmodified and adds one narrow,
# global allowlist covering two categories of confirmed non-secret findings.
# Do not broaden this allowlist beyond those two categories; do not weaken
# the scan any other way.
#
# Uses the singular [allowlist] table (not [[allowlists]]) because
# gitleaks-action defaults to gitleaks CLI 8.24.3, whose top-level allowlist
# support is singular-only; the newer plural syntax is silently ignored by
# that version. All entries live in one `regexes` array (not split across a
# `paths` filter) deliberately: gitleaks' allowlist match semantics AND
# categories together when more than one is present on the same table, and
# this repo's build cannot use a second [[allowlists]] table (see above) to
# separate them safely. Adding a `paths` scope here would silently break the
# anon-key regexes below, since those keys live in application code, not
# under a `paths` filter scoped to docs/.

[extend]
useDefault = true

[allowlist]
description = "Deliberately public Supabase anon/publishable keys, and planning-issue cross-reference filenames that trip generic-api-key on entropy alone"
regexes = [
  # Toolbelt / Prompt Organizer shared anon key, Supabase project woltgcggxaehtuypkxqk.
  # Committed in apps/toolbelt/config.mjs and apps/toolbelt/apps/prompt-organizer/web/index.html.
  '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndvbHRnY2dneGFlaHR1eXBreHFrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwNTc1NTYsImV4cCI6MjEwMTYzMzU1Nn0\.URuTQDA10GEiQUo82pyQPj3UgwvPKcg9Mjvz57v2Fv4''',
  # LifeOS publishable key, Supabase project vhbzblllaohuljtareza.
  # Committed in apps/lifeos/backend/docs/runbook.md.
  '''sb_publishable_rF0kYJWAjj1w9uwD4fr7ug_khrchuXJ''',
  # docs/planning/issues/*.md "Depends on:"/"Blocks:" lines list comma-separated
  # issue filenames (mN-NN-slug.md); generic-api-key's entropy heuristic
  # flags the last filename in such a list (confirmed: "m1-04-feat-ui-primitives.md"
  # in m2-01-feat-ui-chrome-palette.md:5, RuleID generic-api-key). Fully
  # anchored so this can only match a bare issue-filename token, not a
  # coincidental substring of something else.
  '''^m\d+-\d+-[a-z0-9-]+\.md$''',
]
