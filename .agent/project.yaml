# Repo-specific machine-readable facts. Policy prose lives in AGENTS.md.
name: lifeos-ui
type: web-app

standard:
  repo: https://github.com/kgsmith19/agent-engineering-standard
  sha: 81d58318a617ddf0777fef8f73d2fab25f433e34

commands:
  setup: npm ci
  build: npm run build
  format: npm run format
  lint: npm run lint
  fast_verify: npm run lint
  unit: npm run test
  e2e: npm run e2e
  full_verify: npm run lint && npm run test && npm run e2e && npm run build
  gen_api: npm run gen:api

risk:
  default: R1
  protected_paths:
    - src/api/client.ts
    - src/auth/
    - .github/workflows/
    - .agent/

ci:
  entry: .github/workflows/ci.yml
  required_check: "PR Gate"
  required_trigger: "ready pull request + merge_group"
  main_pipeline: "PR Gate -> deploy when DEPLOY_ENABLED"

deploy:
  mechanism: "merge to main -> PR Gate -> dist scp'd to the VPS over tailnet"
  runtime_smoke: null
