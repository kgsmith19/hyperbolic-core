# Repository facts and executable commands.

project:
  name: prompt-organizer
  type: static-web-app-with-supabase
  languages:
    - sql-postgres
    - vanilla-javascript

commands:
  unit_test: 'node --test "tests/*.test.mjs"'
  install_browser_test: "npm install --no-save --no-package-lock @playwright/test@1.52.0"
  install_browser: "npx playwright install --with-deps chromium"
  browser_test: "npx playwright test --config playwright.config.mjs"
  serve_local: "python3 -m http.server 8812 --directory web"

ci:
  workflow: .github/workflows/ci.yml
  workflow_name: "PR Gate"
  job_name: "PR Gate"
  triggers:
    - pull_request
    - merge_group

data:
  supabase_project: toolbelt
  supabase_project_ref: woltgcggxaehtuypkxqk
  owned_schema: prompt
  security_boundary: row-level-security
  accepted_client_key: public-anon-key
  forbidden_client_key: service-role-key

standard:
  lock_file: .agent/standard.lock
  mode: informational
