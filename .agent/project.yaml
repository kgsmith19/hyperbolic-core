# Repository-specific facts for tools and contributors. The external standard
# reference is informational; this repository owns its workflow and settings.

project:
  name: agentic-command-center-ui
  type: web-frontend
  stack: [react19, vite8, typescript7, tailwindcss4]

runtime:
  node_min: "22.22.0"
  package_manager: npm
  operating_systems: [linux]

commands:
  setup: npm ci
  build: npm run build
  e2e: npm run e2e
  dev: npm run dev

integration:
  repository: kgsmith19/agentic-command-center
  contract: gui/README.md
  local_checkout_variable: ACC_DIR

ci:
  workflow: .github/workflows/ci.yml
  check: "PR Gate"
  triggers: [pull_request, merge_group]

work_tracking:
  system: github-issues

standard_reference:
  file: .agent/standard.lock
  mode: informational
