# Repository facts. The shared standard reference is informational only.
name: lifeos-ui
type: web-app

standard:
  repository: kgsmith19/agent-engineering-standard
  commit: 46beaac2e4db915661a9fb9c0f4094f5daf8298d
  mode: informational

commands:
  setup: npm ci
  format: npm run format
  lint: npm run lint
  typecheck: npx tsc -b
  unit: npm run test
  e2e: npm run e2e
  build: npm run build
  verify: npm run lint && npx tsc -b && npm run test && npm run e2e && npm run build
  generate_api: npm run gen:api

ci:
  workflow: .github/workflows/ci.yml
  required_check: "PR Gate"
  triggers:
    - pull_request
    - merge_group
    - push_main

operations:
  workflows:
    - .github/workflows/release-smoke.yml

deploy:
  mechanism: "push to main -> PR Gate -> static bundle copied to the VPS when DEPLOY_ENABLED"
