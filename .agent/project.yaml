# Machine-readable, repository-specific facts only. See AGENTS.md for prose policy.

project:
  name: prompt-organizer
  type: web-app-supabase-backed
  language: [sql-postgres, vanilla-js]
  standard_lock: .agent/standard.lock

commands:
  setup: null
  build: null
  format: null
  lint: null
  typecheck: null
  fast_verify: node --test "tests/*.test.mjs"
  test: node --test "tests/*.test.mjs"
  full_verify: node --test "tests/*.test.mjs"
  e2e: null
  serve_local: python3 -m http.server 8812

platforms:
  os: any

risk:
  default: R2
  protected_paths:
    - supabase/migrations/**
    - specs/TEST-LEDGER.md
    - .github/workflows/**
    - .agent/**
  r4_forbidden:
    - "DELETE grant on prompt.prompt_version"
    - "DELETE grant on prompt.usage"
    - "service-role key committed anywhere in this repo"

budget_ceilings_per_slice:
  net_source_loc: 300
  test_loc: 200
  source_files: 3
  test_files: 3
  new_tables: 1
  new_columns: 6
  new_endpoints: 1
  new_ui_surfaces: 1
  new_libraries: 0
  new_third_party: 0
  new_tests: 8
  function_loc: 40
  file_loc: 250
  complexity: 8
  suite_seconds: 120
  red_green_cycles_before_halt: 3

deployment:
  mechanism: none
  smoke_command: null
  authority_boundary: not_applicable

ci:
  profile_entry_point: .github/workflows/ci.yml
  required_check: "PR Gate"
  required_trigger: "ready pull request + merge_group"

telemetry:
  acc_integration: none
  toolbelt_integration: none
