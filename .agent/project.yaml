project:
  name: toolbelt
  type: postgres-schema-plus-static-html

standard:
  repo: kgsmith19/agent-engineering-standard
  commit: 3e23f45363fb4e65a16427723cbd56774796c59d   # see .agent/standard.lock

commands:
  setup: "none -- no package manager, no dependencies, by design (SR-023)"
  build: "none -- no build step, by design"
  format: "none -- no formatter configured"
  lint: "none -- no linter configured"
  typecheck: "none -- vanilla JS, no type layer"
  test_fast: 'node --test "tests/*.test.mjs"'
  test_full: 'node --test "tests/*.test.mjs"'   # one suite, ~2.5s; fast and full are the same command
  e2e: "none automated -- manual browser verification against web/index.html, see AGENTS.md"
  run_local: "python3 -m http.server 8811   # then open /web/index.html"
  apply_migration: "via Supabase MCP / API against project woltgcggxaehtuypkxqk -- not a local command"

risk:
  default: R2
  protected_paths:
    - "supabase/migrations/**"     # schema changes to a shared, live, multi-tenant Postgres project
    - ".github/workflows/**"       # CI / enforcement plane
    - ".agent/**"                  # risk policy and standard pin
    - "rules/**"                   # superseded but historically load-bearing (cited by past specs)

ci:
  profile: node22-no-deps
  secrets_required: []             # tests run with the public anon key + committed fixture creds only

deployment:
  mechanism: "none -- Supabase is the only backend (its own hosted SLA); web/index.html is served ad hoc, not deployed; schema changes apply directly via the Supabase API/MCP, not a release pipeline"

telemetry:
  integration: "none yet -- core.log_run / core.event exist as the shared spine other tools write to, but this repo does not yet consume ACC/Toolbelt-side telemetry about its own delivery. See AGENTS.md Evidence & Learning note."
