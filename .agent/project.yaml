# Repo-specific machine-readable facts. Policy prose lives in AGENTS.md;
# this file is only tested commands and repo facts, nothing invented.
name: lifeos
type: api-service

standard:
  repo: https://github.com/kgsmith19/agent-engineering-standard
  sha: 3e23f45363fb4e65a16427723cbd56774796c59d # see .agent/standard.lock

commands:
  setup: python -m pip install -e .[dev]
  lint: ruff check .
  typecheck: mypy
  fast_verify: ruff check . && mypy
  # WARNING: wipes the database DATABASE_URL points at — lifeos-test only,
  # never prod (docs/runbook.md). CI runs this against an ephemeral service
  # container, never a shared database.
  unit: pytest
  full_verify: ruff check . && mypy && pytest

risk:
  default: R2 # kernel + API: most changes touch surface other domains depend on
  protected_paths:
    - src/kernel/ # domain-agnostic invariants — see .agents/invariants.md
    - src/api/auth.py # principal/claims verification
    - src/domains/*/dispute.py # ADR 018 approval/authority gate
    - supabase/migrations/ # schema changes

ci:
  entry: .github/workflows/ci.yml
  required_check: "ci / checks"

deploy:
  mechanism: "merge to main -> CI checks -> docker build+push to ghcr.io (sha-tagged) -> OIDC+tailscale SSH deploy"
  runtime_smoke: "curl -fsS http://127.0.0.1:8000/healthz # the deploy job's own post-deploy check"
  rollback: "no automated rollback job; images are immutable and sha-tagged in ghcr.io, so the closest existing path is git revert on main -> the normal pipeline redeploys the reverted code as a new sha-tagged image"
