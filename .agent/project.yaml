# Machine-readable repo facts. Prose policy lives in AGENTS.md and the pinned standard.

project:
  name: netcheck
  type: cli
  standard: .agent/standard.lock

stack:
  language: python
  language_version_declared: "3.12"
  dependencies: none
  test_framework: unittest

commands:
  setup: none
  build: none
  format: none
  lint: python3 tools/code_simplification.py netcheck -i medium
  typecheck: none
  test_fast: python3 -m unittest discover -s tests -t .
  test_full: bash tools/check.sh
  e2e: none
  security_scan: python3 tools/security_review.py . -i high
  docs_check: python3 tools/documentation_check.py . -i medium
  release_build: bash tools/deploy.sh
  release_notes: python3 tools/release.py changelog

ci_profile:
  required_workflow: .github/workflows/pr-gate.yml
  required_check: "PR Gate"
  required_trigger: "ready pull request + merge_group"
  required_gate: bash tools/check.sh
  deep_or_release_workflows:
    - .github/workflows/tests.yml
    - .github/workflows/code-quality.yml
    - .github/workflows/release.yml
  note: >
    The ~30-second local-equivalent gate runs automatically only for ready PRs
    and merge groups. Manual workflows remain available for explicit deep/release use.

risk:
  default: R1
  protected_paths:
    - netcheck/remote.py
    - netcheck/docsis.py
    - netcheck/snmp.py
    - netcheck/store.py
    - supabase/migrations/
    - .github/workflows/
    - .agent/
  notes: >
    Automated writes to network devices remain out of scope. A change that
    sends configuration writes to modem/router hardware is R4.

platforms:
  primary: windows
  secondary: macos
  ci_runner: ubuntu-latest
