# Repo-specific machine-readable facts. Policy prose lives in AGENTS.md.
name: lifeos
type: api-service

standard:
  repo: https://github.com/kgsmith19/agent-engineering-standard
  sha: a9d1bf7a43dd8727d8ae7f031da2abe9ad9ff0b1

commands:
  setup: python -m pip install -e .[dev]
  lint: ruff check .
  typecheck: mypy
  fast_verify: ruff check . && mypy
  unit: pytest
  full_verify: ruff check . && mypy && pytest

risk:
  default: R2
  protected_paths:
    - src/kernel/
    - src/api/auth.py
    - src/domains/*/dispute.py
    - supabase/migrations/
    - .github/workflows/
    - .agent/
    - .agents/domains/

ci:
  entry: .github/workflows/ci.yml
  required_check: "PR Gate"
  required_trigger: "ready pull request + merge_group"
  main_pipeline: "PR Gate -> docker build/push -> deploy when DEPLOY_ENABLED"

deploy:
  mechanism: "merge to main -> PR Gate -> docker build+push to ghcr.io (sha-tagged) -> OIDC+tailscale SSH deploy"
  runtime_smoke: "curl -fsS http://127.0.0.1:8000/healthz"
  rollback: "git revert on main -> normal pipeline redeploys reverted code as a new sha-tagged image"
