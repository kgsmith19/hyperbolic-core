# Machine-readable project facts for ACC/Toolbelt and agents. Prose policy
# lives in AGENTS.md and the pinned standard.

project:
  name: agentic-command-center-ui
  type: web-frontend
  stack: [react19, vite7, typescript, tailwindcss4]
  runtime: node
  node_version: ">=22"

commands:
  setup: npm ci
  build: npm run build
  dev: npm run dev
  fast_verify: npm run build
  full_verify: npm run e2e
  test: npm run e2e

platform:
  os: [linux]

risk:
  default: R1
  notes:
    - "src/api.ts changes are R2: it is the typed mirror of ACC's gui/README.md contract."
    - "Guards/vault changes that alter secret handling are R3."
  protected_paths:
    - .github/workflows/
    - .agent/standard.lock

ci:
  required_workflow: .github/workflows/ci.yml
  required_check: "PR Gate"
  required_trigger: "ready pull request + merge_group"
  gate_evidence: [build, contract-e2e]
  deep_lane: []

deployment:
  mechanism: "ACC serves this repo's built dist/ same-origin via --ui-dist"
  authority: "manual"

telemetry: none
