# Repo-specific machine-readable facts. Policy prose lives in AGENTS.md;
# this file is only tested commands and repo facts, nothing invented.
name: lifeos-ui
type: web-app

standard:
  repo: https://github.com/kgsmith19/agent-engineering-standard
  sha: 3e23f45363fb4e65a16427723cbd56774796c59d # see .agent/standard.lock

commands:
  setup: npm ci
  build: npm run build # tsc -b && vite build
  format: npm run format
  lint: npm run lint # oxlint
  fast_verify: npm run lint
  unit: npm run test # vitest run
  e2e: npm run e2e # playwright test
  full_verify: npm run lint && npm run test && npm run e2e && npm run build
  gen_api: npm run gen:api # regenerate src/api/types.gen.ts from the deployed backend

risk:
  default: R1
  protected_paths:
    - src/api/client.ts # sole HTTP boundary — auth header + 401 sign-out live here
    - src/auth/ # session handling

ci:
  entry: .github/workflows/ci.yml
  required_check: "ci / checks"

deploy:
  mechanism: "merge to main -> CI gate -> dist scp'd to the VPS over tailnet (Infisical OIDC, no static secrets)"
  runtime_smoke: null # none configured; HealthDot polls /healthz client-side only, not a deploy-gate check
