# Repository facts. The shared standard reference is informational only.
name: lifeos
type: api-service

standard:
  repository: kgsmith19/agent-engineering-standard
  commit: 46beaac2e4db915661a9fb9c0f4094f5daf8298d
  mode: informational

commands:
  setup: python -m pip install -e .[dev]
  lint: ruff check .
  typecheck: mypy
  test: pytest
  verify: ruff check . && mypy && pytest

ci:
  workflow: .github/workflows/ci.yml
  required_check: "PR Gate"
  triggers:
    - pull_request
    - merge_group
    - push_main

operations:
  workflows:
    - .github/workflows/ops.yml
    - .github/workflows/backup.yml
  backup_scope: "Postgres database only; document blob storage is excluded"

deploy:
  mechanism: "push to main -> PR Gate -> container build -> deploy when DEPLOY_ENABLED"
  smoke: "curl -fsS http://127.0.0.1:8000/healthz"
