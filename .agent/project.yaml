# Repository-specific facts for tools and contributors. The external standard
# reference is informational; this repository owns its workflow and settings.

project:
  name: agentic-command-center
  type: node-cli-and-webapp

runtime:
  node_min: "22"
  package_manager: npm
  operating_systems: [linux, windows]
  runtime_dependencies: 0

commands:
  setup: npm install
  test: npm test
  test_windows: npm run test:windows
  coverage: npm run covgate
  e2e: npm run e2e:gui
  dev: npm run gui

ci:
  workflow: .github/workflows/ci.yml
  check: "PR Gate"
  triggers: [pull_request, merge_group]

work_tracking:
  system: github-issues

standard_reference:
  file: .agent/standard.lock
  mode: informational
