<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>toolbelt — idea list</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 60rem; margin: 2rem auto; padding: 0 1rem; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: 0.4rem 0.6rem; border-bottom: 1px solid #ddd; }
    #sign-in-error, #idea-error { color: #b00020; }
    #idea-section, #sign-in-error, #idea-error, #empty-note { display: none; }
  </style>
</head>
<body>
  <h1>Idea backlog</h1>

  <form id="sign-in-form">
    <label>Email <input type="email" id="email" required autocomplete="username" /></label>
    <label>Password <input type="password" id="password" required autocomplete="current-password" /></label>
    <button type="submit">Sign in</button>
    <p id="sign-in-error"></p>
  </form>

  <section id="idea-section">
    <p id="idea-error"></p>
    <p id="empty-note">No ideas are recorded.</p>
    <table id="idea-table">
      <thead>
        <tr><th>Name</th><th>Category</th><th>One-liner</th><th>Status</th><th>Score</th><th>Depends on</th></tr>
      </thead>
      <tbody id="idea-rows"></tbody>
    </table>
  </section>

  <script type="module">
    import { SUPABASE_URL, SUPABASE_ANON_KEY } from "../config.mjs";

    async function signIn(email, password) {
      const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
        method: "POST",
        headers: { apikey: SUPABASE_ANON_KEY, "Content-Type": "application/json" },
        body: JSON.stringify({ email, password }),
      });
      const body = await res.json();
      if (!res.ok) throw new Error(body.error_description || body.msg || `sign-in failed: ${res.status}`);
      return body.access_token;
    }

    async function fetchIdeas(token) {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/idea?select=id,name,category,one_liner,status`, {
        headers: {
          apikey: SUPABASE_ANON_KEY,
          Authorization: `Bearer ${token}`,
          "Accept-Profile": "idea",
        },
      });
      if (!res.ok) throw new Error(`idea list failed: ${res.status}`);
      return res.json();
    }

    // FR-004: idea.score is (idea, metric) -> value, appended to over time
    // (PRD DR-004), never overwritten. Two flat reads plus a client-side
    // join, rather than a cross-schema PostgREST embed (idea.score and
    // core.metric_def are different exposed schemas).
    async function fetchScores(token) {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/score?select=idea_id,metric_id,value,scored_at`, {
        headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${token}`, "Accept-Profile": "idea" },
      });
      if (!res.ok) throw new Error(`score list failed: ${res.status}`);
      return res.json();
    }

    async function fetchMetricNames(token) {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/metric_def?select=id,name`, {
        headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${token}`, "Accept-Profile": "core" },
      });
      if (!res.ok) throw new Error(`metric list failed: ${res.status}`);
      return res.json();
    }

    // FR-004: the most recent score per (idea, metric) wins, since a
    // superseded row must not also render. Ideas with no score row get no
    // map entry at all -- rendered as blank, never 0 (AC-009).
    function latestScoresByIdea(scores, metricNames) {
      const nameById = new Map(metricNames.map((m) => [m.id, m.name]));
      const latest = new Map();
      for (const s of scores) {
        const key = `${s.idea_id}:${s.metric_id}`;
        const prev = latest.get(key);
        if (!prev || s.scored_at > prev.scored_at) latest.set(key, s);
      }
      const byIdea = new Map();
      for (const s of latest.values()) {
        const label = `${nameById.get(s.metric_id)}: ${s.value}`;
        byIdea.set(s.idea_id, [...(byIdea.get(s.idea_id) || []), label]);
      }
      return byIdea;
    }

    // FR-006: each dependency edge names the idea it depends on by id;
    // resolve to a display name using the already-fetched idea list, no
    // extra fetch (ASM-008: same-schema PostgREST embedding would work too,
    // but this stays consistent with latestScoresByIdea's proven pattern).
    async function fetchDependencies(token) {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/dependency?select=idea_id,depends_on,reason`, {
        headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${token}`, "Accept-Profile": "idea" },
      });
      if (!res.ok) throw new Error(`dependency list failed: ${res.status}`);
      return res.json();
    }

    function dependenciesByIdea(dependencies, ideas) {
      const nameById = new Map(ideas.map((i) => [i.id, i.name]));
      const byIdea = new Map();
      for (const d of dependencies) {
        const label = `${nameById.get(d.depends_on)}: ${d.reason}`;
        byIdea.set(d.idea_id, [...(byIdea.get(d.idea_id) || []), label]);
      }
      return byIdea;
    }

    function renderIdeas(ideas, scoresByIdea, dependenciesByIdeaMap) {
      document.getElementById("idea-section").style.display = "block";
      if (ideas.length === 0) {
        document.getElementById("empty-note").style.display = "block";
        return;
      }
      const tbody = document.getElementById("idea-rows");
      for (const idea of ideas) {
        const row = tbody.insertRow();
        for (const field of ["name", "category", "one_liner", "status"]) {
          row.insertCell().textContent = idea[field];
        }
        row.insertCell().textContent = (scoresByIdea.get(idea.id) || []).join(", ");
        row.insertCell().textContent = (dependenciesByIdeaMap.get(idea.id) || []).join("; ");
      }
    }

    document.getElementById("sign-in-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const errorEl = document.getElementById("sign-in-error");
      errorEl.style.display = "none";
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      try {
        const token = await signIn(email, password);
        const [ideas, scores, metricNames, dependencies] = await Promise.all([
          fetchIdeas(token),
          fetchScores(token),
          fetchMetricNames(token),
          fetchDependencies(token),
        ]);
        renderIdeas(ideas, latestScoresByIdea(scores, metricNames), dependenciesByIdea(dependencies, ideas));
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.style.display = "block";
      }
    });
  </script>
</body>
</html>
