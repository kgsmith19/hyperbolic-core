<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Forgepad</title>
<style>
  body { font: 14px 'Segoe UI', sans-serif; margin: 16px; max-width: 860px; }
  fieldset { margin: 0 0 14px; border: 1px solid #ccc; }
  label { display: inline-block; margin: 4px 14px 4px 0; }
  input[type=text] { width: 320px; }
  select { width: 200px; }
  textarea { width: 98%; box-sizing: border-box; }
  button { margin: 2px 6px 2px 0; }
  .ok { color: #1a7a1a; }
  .err { color: #b22222; }
  .muted { color: #666; }
  #msg { margin-left: 8px; font-weight: 600; }
  #ideaList { margin-top: 8px; }
  .idea-card {
    border: 1px solid #ddd; border-radius: 4px; padding: 8px 12px; margin: 6px 0;
    background: #fafafa;
  }
  .idea-card .idea-title { font-weight: 700; font-size: 15px; }
  .idea-card .idea-meta { color: #666; font-size: 12px; margin: 2px 0; }
  .idea-card .idea-body { margin: 4px 0 6px; }
  .idea-card .idea-actions button { font-size: 12px; padding: 2px 8px; }
  .badge {
    display: inline-block; border-radius: 3px; padding: 1px 6px; font-size: 11px;
    font-weight: 700; margin-right: 4px; color: #fff;
  }
  .badge-draft { background: #888; }
  .badge-definite { background: #1a7a1a; }
  .badge-research-needed { background: #d47a00; }
  .badge-rejected { background: #b22222; }
  .badge-low { background: #aaa; }
  .badge-medium { background: #4a90d9; }
  .badge-high { background: #7b2fa3; }
  #editPanel { border: 2px solid #4a90d9; border-radius: 4px; padding: 10px; margin: 8px 0; display: none; }
</style>
</head>
<body>
<h3>Forgepad <span class="muted" style="font-size:13px;font-weight:400">idea → GitHub springboard</span></h3>

<fieldset><legend>Capture an idea</legend>
  <label style="display:block;margin:4px 0">Title *
    <input type="text" id="newTitle" style="width:98%;display:block" placeholder="One-line description of the idea">
  </label>
  <label style="display:block;margin:4px 0">Problem
    <textarea id="newProblem" rows="2" placeholder="What problem does this solve?"></textarea>
  </label>
  <label style="display:block;margin:4px 0">Desired outcome
    <textarea id="newOutcome" rows="2" placeholder="What does success look like?"></textarea>
  </label>
  <label style="display:block;margin:4px 0">Notes
    <textarea id="newNotes" rows="2" placeholder="Anything else — links, constraints, open questions"></textarea>
  </label>
  <div style="margin:6px 0">
    <label>State
      <select id="newState">
        <option value="draft">draft</option>
        <option value="definite">definite</option>
        <option value="research-needed">research-needed</option>
        <option value="rejected">rejected</option>
      </select>
    </label>
    <label>Confidence
      <select id="newConfidence">
        <option value="low">low</option>
        <option value="medium" selected>medium</option>
        <option value="high">high</option>
      </select>
    </label>
    <label>Target (repo or "new app")
      <input type="text" id="newTarget" placeholder="owner/repo or new app">
    </label>
    <label>Source (optional provenance)
      <input type="text" id="newSource" placeholder="chat link, note, etc.">
    </label>
  </div>
  <button id="saveNew" style="font-weight:700">Save idea</button>
  <span id="msg" class="muted"></span>
</fieldset>

<fieldset><legend>My ideas</legend>
  <label>Filter by state
    <select id="filterState">
      <option value="">all</option>
      <option value="draft">draft</option>
      <option value="definite">definite</option>
      <option value="research-needed">research-needed</option>
      <option value="rejected">rejected</option>
    </select>
  </label>
  <button id="refreshList">Refresh</button>
  <div id="ideaList" class="muted">Loading…</div>
</fieldset>

<div id="editPanel">
  <strong>Edit idea</strong><br>
  <input type="hidden" id="editId">
  <label style="display:block;margin:4px 0">Title *
    <input type="text" id="editTitle" style="width:98%;display:block">
  </label>
  <label style="display:block;margin:4px 0">Problem
    <textarea id="editProblem" rows="2"></textarea>
  </label>
  <label style="display:block;margin:4px 0">Desired outcome
    <textarea id="editOutcome" rows="2"></textarea>
  </label>
  <label style="display:block;margin:4px 0">Notes
    <textarea id="editNotes" rows="2"></textarea>
  </label>
  <label>State
    <select id="editState">
      <option value="draft">draft</option>
      <option value="definite">definite</option>
      <option value="research-needed">research-needed</option>
      <option value="rejected">rejected</option>
    </select>
  </label>
  <label>Confidence
    <select id="editConfidence">
      <option value="low">low</option>
      <option value="medium">medium</option>
      <option value="high">high</option>
    </select>
  </label>
  <label>Target
    <input type="text" id="editTarget">
  </label>
  <label>Source
    <input type="text" id="editSource">
  </label>
  <br>
  <button id="saveEdit" style="font-weight:700">Save changes</button>
  <button id="cancelEdit">Cancel</button>
  <span id="editMsg" class="muted"></span>
</div>

<script>
const $ = (id) => document.getElementById(id);
const ACC = { "content-type": "application/json", "X-ACC": "1" };
const post = (url, body) => fetch(url, { method: "POST", headers: ACC, body: JSON.stringify(body) });

function badge(cls, text) {
  const s = document.createElement("span");
  s.className = `badge badge-${cls}`;
  s.textContent = text;
  return s;
}

function setMsg(el, text, ok) {
  el.textContent = text;
  el.className = ok ? "ok" : (text ? "err" : "muted");
}

async function loadList() {
  const state = $("filterState").value;
  const url = "/api/forgepad" + (state ? `?state=${encodeURIComponent(state)}` : "");
  const list = $("ideaList");
  list.innerHTML = "";
  let ideas;
  try {
    const r = await fetch(url);
    ideas = await r.json();
    if (!r.ok) { list.textContent = ideas.error || "error"; return; }
  } catch (e) { list.textContent = e.message; return; }

  if (!ideas.length) { list.innerHTML = '<span class="muted">No ideas yet.</span>'; return; }
  for (const idea of ideas) {
    const card = document.createElement("div");
    card.className = "idea-card";
    const header = document.createElement("div");
    header.appendChild(badge(idea.state, idea.state));
    header.appendChild(badge(idea.confidence, idea.confidence + " confidence"));
    const title = document.createElement("span");
    title.className = "idea-title";
    title.textContent = idea.title;
    header.appendChild(title);
    card.appendChild(header);

    const meta = document.createElement("div");
    meta.className = "idea-meta";
    meta.textContent = `${idea.id} · created ${idea.created.slice(0, 10)}` +
      (idea.target ? ` · target: ${idea.target}` : "") +
      (idea.githubIssue ? ` · 🔗 promoted` : "");
    card.appendChild(meta);

    if (idea.problem) {
      const body = document.createElement("div");
      body.className = "idea-body muted";
      body.textContent = "Problem: " + idea.problem.slice(0, 200) + (idea.problem.length > 200 ? "…" : "");
      card.appendChild(body);
    }
    if (idea.githubIssue) {
      const link = document.createElement("div");
      link.innerHTML = `<a href="${escapeHtml(idea.githubIssue)}" target="_blank">View GitHub Issue →</a>`;
      card.appendChild(link);
    }

    const actions = document.createElement("div");
    actions.className = "idea-actions";
    const editBtn = document.createElement("button");
    editBtn.textContent = "Edit";
    editBtn.onclick = () => openEdit(idea);
    actions.appendChild(editBtn);

    if (idea.state === "definite" && !idea.githubIssue) {
      const promBtn = document.createElement("button");
      promBtn.textContent = "Promote → GitHub Issue";
      promBtn.onclick = () => promote(idea.id, card);
      actions.appendChild(promBtn);
    }

    const delBtn = document.createElement("button");
    delBtn.textContent = "Delete";
    delBtn.style.color = "#b22222";
    delBtn.onclick = () => deleteCard(idea.id, card);
    actions.appendChild(delBtn);
    card.appendChild(actions);
    list.appendChild(card);
  }
}

function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function openEdit(idea) {
  $("editId").value = idea.id;
  $("editTitle").value = idea.title;
  $("editProblem").value = idea.problem || "";
  $("editOutcome").value = idea.outcome || "";
  $("editNotes").value = idea.notes || "";
  $("editState").value = idea.state;
  $("editConfidence").value = idea.confidence;
  $("editTarget").value = idea.target || "";
  $("editSource").value = idea.source || "";
  $("editMsg").textContent = "";
  $("editPanel").style.display = "block";
  $("editTitle").focus();
  $("editPanel").scrollIntoView({ behavior: "smooth" });
}

async function deleteCard(id, card) {
  if (!confirm("Delete this idea?")) return;
  const r = await post("/api/forgepad/delete", { id });
  if (r.ok) { card.remove(); }
  else { alert((await r.json()).error || "delete failed"); }
}

async function promote(id, card) {
  const r = await post("/api/forgepad/promote", { id });
  const data = await r.json();
  if (!r.ok) { alert(data.error || "promote failed"); return; }
  alert("Promoted! Issue: " + data.githubIssue);
  loadList();
}

$("saveNew").onclick = async () => {
  const msg = $("msg");
  const body = {
    title: $("newTitle").value.trim(),
    problem: $("newProblem").value,
    outcome: $("newOutcome").value,
    notes: $("newNotes").value,
    state: $("newState").value,
    confidence: $("newConfidence").value,
    target: $("newTarget").value.trim(),
    source: $("newSource").value.trim(),
  };
  if (!body.title) { setMsg(msg, "title is required", false); return; }
  const r = await post("/api/forgepad", body);
  const data = await r.json();
  if (!r.ok) { setMsg(msg, data.error || "error", false); return; }
  setMsg(msg, `Saved ${data.id}`, true);
  // Clear the form
  ["newTitle","newProblem","newOutcome","newNotes","newTarget","newSource"].forEach((id) => $(id).value = "");
  $("newState").value = "draft";
  $("newConfidence").value = "medium";
  loadList();
};

$("saveEdit").onclick = async () => {
  const msg = $("editMsg");
  const id = $("editId").value;
  const body = {
    id,
    title: $("editTitle").value.trim(),
    problem: $("editProblem").value,
    outcome: $("editOutcome").value,
    notes: $("editNotes").value,
    state: $("editState").value,
    confidence: $("editConfidence").value,
    target: $("editTarget").value.trim(),
    source: $("editSource").value.trim(),
  };
  if (!body.title) { setMsg(msg, "title is required", false); return; }
  const r = await post("/api/forgepad/update", body);
  const data = await r.json();
  if (!r.ok) { setMsg(msg, data.error || "error", false); return; }
  setMsg(msg, "Saved", true);
  $("editPanel").style.display = "none";
  loadList();
};

$("cancelEdit").onclick = () => { $("editPanel").style.display = "none"; };
$("filterState").onchange = loadList;
$("refreshList").onclick = loadList;
loadList();
</script>
</body>
</html>
