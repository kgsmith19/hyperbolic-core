# Repository facts. The standard pin lives once, at the repo root.
name: lifeos
type: python-api-and-react-ui-monorepo

commands:
  backend_setup: cd backend && python -m pip install -e .[dev]
  backend_verify: cd backend && ruff check . && mypy && pytest
  frontend_setup: cd frontend && npm ci
  frontend_verify: cd frontend && npm run lint && npx tsc -b && npm run test && npm run e2e && npm run build

ci:
  # The merge gate is the root PR Gate. Its "LifeOS" lane runs
  # .github/actions/verify-tests-lifeos; lifeos-ci.yml runs the same action on
  # push to main. No .github/ directory exists below the repository root (#450).
  workflow: ../../.github/workflows/pr-verify.yml
  lane: "LifeOS"
  required_check: "PR Gate"
  triggers:
    - pull_request
    - merge_group

operations:
  # Local-only platform (owner decision 2026-10-29): SQLite on localhost.
  # Backup and restore drill are the root Makefile targets, which read
  # ops/stores.json (database plus the document blob directory).
  backup: make backup
  restore_drill: make restore-drill
  store: var/lifeos/lifeos.db
  blobs: var/lifeos/blobs

deploy:
  # Local only: the root compose stack (make up), released with make release.
  mechanism: "make up / make release NAME=vN from the repository root"
  smoke: "curl -fsS http://127.0.0.1:8000/healthz"
