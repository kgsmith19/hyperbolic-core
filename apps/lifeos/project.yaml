# Repository facts. The standard pin lives once, at the repo root.
name: lifeos
type: python-api-and-react-ui-monorepo

commands:
  backend_setup: cd backend && python -m pip install -e .[dev]
  backend_verify: cd backend && ruff check . && mypy && pytest
  frontend_setup: cd frontend && npm ci
  frontend_verify: cd frontend && npm run lint && npx tsc -b && npm run test && npm run e2e && npm run build

ci:
  # In this monorepo the merge gate is the ROOT workflow below. The app-local
  # apps/lifeos/.github/workflows/ copies are inert here (GitHub only runs
  # root workflows) and are kept for the standalone kgsmith19/lifeos repo;
  # see apps/lifeos/AGENTS.md for why they must never be relocated.
  workflow: ../../.github/workflows/lifeos-ci.yml
  required_check: "LifeOS PR Gate"
  triggers:
    - pull_request
    - merge_group

operations:
  # ROOT workflows own the lifecycle after the cutover (docs/ops/runbook.md,
  # "LifeOS cutover"); the app-local .github/workflows/ copies remain inert
  # standalone-repo references. release-smoke.yml exists only in the
  # standalone repo.
  workflows:
    - ../../.github/workflows/lifeos-backup.yml
    - ../../.github/workflows/lifeos-ops.yml
  backup_scope: "Nightly pg_dump of the public schema PLUS a tar of the
    document blob volume (/app/var/blobs), verified, age-encrypted, uploaded
    as a GitHub Actions artifact with 90-day retention (lifeos-backup.yml,
    gated LIFEOS_BACKUP_ENABLED)"

deploy:
  # ROOT workflow, dark until cutover: backend container + /life/ UI as
  # versioned dirs behind lifeos-ui/current with auto-rollback.
  workflow: ../../.github/workflows/lifeos-deploy.yml
  mechanism: "push to main -> lifeos-deploy.yml when DEPLOY_ENABLED and LIFEOS_DEPLOY_ENABLED"
  smoke: "curl -fsS http://127.0.0.1:8000/healthz"
