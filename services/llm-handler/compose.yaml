# Production runtime on the VPS (docs/ops/runbook.md). Shipped by
# deploy.yml's deploy-llm-handler job to deploy@host:llm-handler/compose.yaml
# -- mirrors apps/lifeos/backend/compose.yaml's shape exactly (same
# loopback-only + tailscale-serve-fronts-it posture, same image-tag-from-env
# convention, same healthcheck-then-log-rotation pattern).
services:
  llm-handler:
    # Every deploy records LLM_HANDLER_IMAGE (a sha tag) in the project
    # directory's .env; no fallback tag, since the box only ever loads
    # sha-tagged images over SSH (no registry credentials on the VPS).
    image: ${LLM_HANDLER_IMAGE:?recorded in ./.env by every deploy (deploy.yml's deploy-llm-handler job)}
    restart: unless-stopped
    env_file: .env
    # Matches the Dockerfile's own USER, the same way services/brain's
    # compose pins `user: brain`. Stated here too so a stale image without
    # the USER directive still cannot come up as root.
    user: handler
    # Issue #187 Phase 0 slice B: joins the shared platform-internal network
    # ADDITIVELY. Naming networks explicitly removes Compose's implicit
    # default-network attachment, so `default` (this project's own bridge --
    # real egress, unchanged today) is named alongside `platform-internal`
    # (the shared --internal network where `broker:8300` resolves). Phase 1's
    # owner-gated enforcement flip is exactly one change here: remove
    # `default` from this list, leaving the broker as the only path out.
    networks:
      - default
      - platform-internal
    ports:
      - "127.0.0.1:8200:8200"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8200/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# Compose requires `default` to be declared here once a service names it
# explicitly (the empty value keeps Compose's own per-project bridge
# defaults). platform-internal is created once on the host -- idempotently by
# deploy.yml's two "Ensure the shared platform-internal network exists" steps
# and by docs/ops/bootstrap-vps.sh -- never owned by any single project's
# lifecycle, hence external.
networks:
  default:
  platform-internal:
    external: true
