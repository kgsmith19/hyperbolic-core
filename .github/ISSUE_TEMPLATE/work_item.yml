name: Work item
description: Define a concrete outcome for prompt-organizer.
title: ""
labels: []
body:
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: State the useful result that should exist when this work is complete.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Explain the current behavior, relevant constraints, and why the change is needed.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable conditions that determine whether the outcome is complete.
      placeholder: |
        - [ ] Given ..., when ..., then ...
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: Identify the tests, checks, or manual observations that should verify the change.

  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: List related work that is intentionally excluded.
