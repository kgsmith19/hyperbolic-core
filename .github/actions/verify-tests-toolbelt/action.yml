name: Verify Tests Toolbelt
description: >-
  Toolbelt's full test suite: manifests, migration ledger, CLI, hermetic
  suites, Guards, Prompt Organizer, Idea Intake, and the Prompt Organizer /
  Network Checker browser journeys. Shared by pr-verify.yml's native
  "Toolbelt" job and toolbelt-ci.yml's own
  merge_group/push/workflow_dispatch triggers, so the suite has exactly one
  source. Assumes the caller already checked out the repository.

runs:
  using: composite
  steps:
    - name: Setup · Configure Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: "22"

    - name: Setup · Configure Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"

    - name: Database · Start disposable PostgreSQL for migration E2E tests
      shell: bash
      run: |
        sudo systemctl start postgresql.service
        sudo -u postgres psql -v ON_ERROR_STOP=1 -tAc "select 1"

    - name: Dependencies · Install root workspace dependencies
      shell: bash
      run: npm ci

    - name: Toolbelt · Check manifests
      shell: bash
      working-directory: apps/toolbelt
      run: npm run manifests:check -- --registry

    - name: Migrations · Validate and stage the unified migration ledger
      shell: bash
      working-directory: apps/toolbelt
      run: |
        npm run migrations:check
        stage_dir="${RUNNER_TEMP}/platform-migration-stage"
        npm run migrations:stage -- "${stage_dir}"
        test -n "$(find "${stage_dir}/supabase/migrations" -maxdepth 1 -type f -name '*.sql' -print -quit)"

    - name: Test · Run Toolbelt CLI tests
      shell: bash
      run: npm test --workspace=@hyperbolic/toolbelt-cli

    - name: Test · Run hermetic Toolbelt tests
      shell: bash
      working-directory: apps/toolbelt
      env:
        TOOLBELT_REQUIRE_POSTGRES: "1"
      run: |
        node --test \
          tests/core-rpc-migration.test.mjs \
          tests/core-event-retention-atomic.test.mjs \
          tests/generate-broker-policy.test.mjs \
          tests/registration-toolbelt.test.mjs \
          tests/registry-manifest-hash.test.mjs \
          tests/registry-migrations-idempotency.test.mjs \
          tests/stage-migrations.test.mjs \
          tests/toolbelt-workflow.test.mjs \
          tests/validate-manifests.test.mjs \
          tests/validate-migrations.property.test.mjs \
          tests/validate-migrations.test.mjs

    - name: Test · Run Guards tests
      shell: bash
      working-directory: apps/toolbelt/guards
      run: node --test *.test.mjs

    # Enumerated, not globbed: these are unit + disposable-Postgres suites.
    # The live-Supabase suites in this directory remain separate deployment
    # contract proofs because they authenticate to and mutate hosted state.
    - name: Test · Run Prompt Organizer tests
      shell: bash
      working-directory: apps/toolbelt/apps/prompt-organizer
      env:
        PROMPT_REQUIRE_POSTGRES: "1"
      run: |
        node --test --test-concurrency=1 \
          backend/tests/contract.test.mjs \
          backend/tests/get-prompt.test.mjs \
          backend/tests/helpers.unit.test.mjs \
          backend/tests/migration-contract.test.mjs \
          frontend/tests/panel.test.mjs \
          backend/tests/performance.test.mjs \
          backend/tests/prompt-usage-retention-atomic.test.mjs \
          backend/tests/purge_old_usage_revoke_public.test.mjs \
          frontend/tests/render.test.mjs \
          backend/tests/retention.test.mjs \
          frontend/tests/search.test.mjs \
          frontend/tests/sections.test.mjs \
          backend/tests/seed.test.mjs

    - name: Test · Run Idea Intake tests
      shell: bash
      working-directory: apps/toolbelt/apps/idea-intake
      env:
        TOOLBELT_REQUIRE_POSTGRES: "1"
      run: node --test --test-concurrency=1 "tests/*.test.mjs"

    - name: Dependencies · Cache Playwright Chromium
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: toolbelt-playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

    - name: Dependencies · Install Playwright Chromium
      shell: bash
      run: ./node_modules/.bin/playwright install --with-deps chromium

    - name: E2E · Start Prompt Organizer
      shell: bash
      working-directory: apps/toolbelt/apps/prompt-organizer
      run: python3 -m http.server 8812 --directory frontend >/tmp/prompt-organizer.log 2>&1 &

    - name: E2E · Wait for Prompt Organizer
      shell: bash
      run: |
        for attempt in $(seq 1 20); do
          if curl --fail --silent http://localhost:8812 >/dev/null; then
            exit 0
          fi
          sleep 1
        done
        cat /tmp/prompt-organizer.log
        echo "Prompt Organizer did not become ready." >&2
        exit 1

    # The browser journey is deliberately hermetic. It drives the real UI and
    # verifies its bearer/session threading, REST request shapes, persistence
    # lifecycle, render/copy behavior, usage event, and log_run side effect via
    # a deterministic page.route fixture. The real authorization oracle stays
    # in contract.test.mjs, which applies the committed migrations to disposable
    # PostgreSQL and proves owner-vs-stranger RLS/grants without hosted secrets.
    - name: E2E · Run Prompt Organizer critical browser journey
      shell: bash
      env:
        PLAYWRIGHT_BASE_URL: http://localhost:8812
      run: ./node_modules/.bin/playwright test --config apps/toolbelt/apps/prompt-organizer/frontend/playwright.config.mjs

    - name: Evidence · Upload Prompt Organizer browser evidence
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: prompt-organizer-e2e-evidence
        path: |
          apps/toolbelt/apps/prompt-organizer/frontend/playwright-report/
          apps/toolbelt/apps/prompt-organizer/frontend/test-results/
        if-no-files-found: ignore
        retention-days: 14

    - name: Test · Run Network Checker tests and deterministic scanners
      shell: bash
      working-directory: apps/toolbelt/apps/network-checker
      run: bash backend/tools/check.sh

    - name: E2E · Prepare Network Checker dashboard fixture
      shell: bash
      working-directory: apps/toolbelt/apps/network-checker
      run: python3 backend/tests/e2e/seed_dashboard_fixture.py

    - name: E2E · Start Network Checker dashboard
      shell: bash
      working-directory: apps/toolbelt/apps/network-checker/backend
      env:
        NETWORK_CHECKER_DB: ${{ github.workspace }}/apps/toolbelt/apps/network-checker/backend/tests/e2e/dashboard-fixture.db
      run: python3 -m network_checker serve --no-open >network-checker.log 2>&1 &

    - name: E2E · Wait for Network Checker dashboard
      shell: bash
      run: |
        for attempt in $(seq 1 20); do
          if curl --fail --silent http://127.0.0.1:8787 >/dev/null; then
            exit 0
          fi
          sleep 1
        done
        cat apps/toolbelt/apps/network-checker/backend/network-checker.log
        echo "Network Checker did not become ready." >&2
        exit 1

    - name: E2E · Run Network Checker critical browser journey
      shell: bash
      env:
        PLAYWRIGHT_BASE_URL: http://127.0.0.1:8787
      run: ./node_modules/.bin/playwright test --config apps/toolbelt/apps/network-checker/frontend/playwright.config.mjs

    - name: Evidence · Upload Network Checker browser evidence
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: network-checker-e2e-evidence
        path: |
          apps/toolbelt/apps/network-checker/frontend/playwright-report/
          apps/toolbelt/apps/network-checker/frontend/test-results/
          apps/toolbelt/apps/network-checker/backend/network-checker.log
        if-no-files-found: ignore
        retention-days: 14
