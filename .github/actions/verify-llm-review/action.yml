name: Verify LLM Review
description: >-
  Adversarial LLM review of the diff against the linked Issue, AGENTS.md, and
  the pull request's own conversation so far, via packages/review's CLI.
  Shared by pr-verify.yml's native "AI Review" job and llm-review.yml's own
  "Verify: LLM Review" push/workflow_dispatch job. Assumes the caller already
  checked out the repository with full history, and that the calling job
  grants id-token: write for the Infisical OIDC exchange.

  Fails closed: the CLI exits 1 on a valid blocking finding and 2 when the
  review could not be performed at all. That is intended for an
  unprovisioned gate -- it must never report green by default -- which is
  exactly why an unprovisioned run must fail outright (exit 1) rather than
  default green: AI Review is mandatory in substance through PR Gate's
  needs:, so a failing preflight here now blocks every PR until the owner
  provisions the credentials llm-review.yml documents.

  The model gets a structured-output tool and nothing else: no shell, no
  filesystem, no network, and no ability to alter the verdict's shape.
  packages/review forces a single `submit_review` tool call via toolChoice
  and recomputes the block/pass decision itself from the findings, ignoring
  the model's own `verdict` field. Repository content reaches the model as
  fenced DATA with an explicit instruction that it is never to be obeyed --
  see packages/review/src/prompt.ts, whose injection-resistance clause is
  pinned by a test. Provider separation is mechanically enforced:
  packages/review/src/config.ts REFUSES to run when REVIEW_PROVIDER and
  REVIEW_BUILDER_PROVIDER resolve to the same provider company, so this gate
  cannot degrade into one model family grading its own work (AGENTS.md > Risk
  classification, R2/R3).

inputs:
  pr_number:
    description: Pull request number under review. Empty no-ops (nothing to review outside a pull request).
    required: false
    default: ""
  base_sha:
    description: Base commit SHA of the diff to review.
    required: false
    default: ""
  head_sha:
    description: Head commit SHA of the diff to review.
    required: false
    default: ""
  github_token:
    description: Token used to read the PR and its linked Issue.
    required: false
    default: ""
  infisical_identity_id:
    description: Infisical machine identity for the OIDC exchange (vars.INFISICAL_REVIEW_IDENTITY_ID).
    required: false
    default: ""
  infisical_project_slug:
    description: Infisical project slug (vars.INFISICAL_PROJECT_SLUG).
    required: false
    default: ""
  review_provider:
    description: Reviewer model family — anthropic|openai|gemini (vars.REVIEW_PROVIDER).
    required: false
    default: ""
  review_model:
    description: Exact model id served by that family (vars.REVIEW_MODEL).
    required: false
    default: ""
  review_builder_provider:
    description: Legacy vars.REVIEW_BUILDER_PROVIDER mirror. If set, it must match agent-roles.yaml's dev.provider.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # Node must be available before the credential-free configuration
    # preflight imports packages/review's canonical provider validator. No npm
    # install is needed: config.ts has only type imports, which Node strips.
    - name: Setup · Install Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: package-lock.json

    # Read the default branch rather than the pull-request checkout: a PR must
    # not be able to claim a different builder family for its own review. This
    # is the same source-of-truth boundary used by the dev dispatcher.
    - name: Preflight · Resolve the builder provider from agent-roles.yaml
      id: roles
      if: inputs.pr_number != ''
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
      with:
        github-token: ${{ inputs.github_token }}
        script: |
          const { owner, repo } = context.repo;
          const { data } = await github.rest.repos.getContent({
            owner,
            repo,
            path: "agent-roles.yaml",
          });
          if (Array.isArray(data) || data.type !== "file" || !data.content) {
            core.setFailed("Could not read agent-roles.yaml from the default branch as a file.");
            return;
          }

          const content = Buffer.from(data.content, data.encoding).toString("utf8");
          const devSection = /(?:^|\n)dev:\s*(?:#.*)?\n((?:[ \t]+[^\n]*(?:\n|$))*)/.exec(content);
          const providerMatch = devSection?.[1].match(
            /^[ \t]+provider:\s*(?:"([^"]+)"|'([^']+)'|([^\s#]+))/m
          );
          const provider = (providerMatch?.[1] ?? providerMatch?.[2] ?? providerMatch?.[3] ?? "")
            .trim()
            .toLowerCase();
          if (!new Set(["anthropic", "openai", "google"]).has(provider)) {
            core.setFailed(
              "Could not resolve a valid dev.provider from default-branch agent-roles.yaml; refusing to guess the builder family."
            );
            return;
          }
          core.setOutput("builder_provider", provider);

    # Runs first so an unprovisioned gate says WHICH knob is missing rather
    # than dying inside Infisical/secrets-action with "Missing identity ID
    # for OIDC auth" -- an error that names neither the GitHub variable that
    # was empty nor the fact that a GitHub variable, not anything in
    # Infisical, is what's absent (issue #212). Reports set/unset only,
    # never values, so it is safe on a public repository.
    - name: Preflight · Verify the reviewer is configured
      if: inputs.pr_number != ''
      shell: bash
      env:
        IDENTITY_ID: ${{ inputs.infisical_identity_id }}
        PROJECT_SLUG: ${{ inputs.infisical_project_slug }}
        REVIEW_PROVIDER: ${{ inputs.review_provider }}
        REVIEW_MODEL: ${{ inputs.review_model }}
        REVIEW_BUILDER_PROVIDER: ${{ steps.roles.outputs.builder_provider }}
        DECLARED_REVIEW_BUILDER_PROVIDER: ${{ inputs.review_builder_provider }}
      run: |
        set -euo pipefail
        missing=()
        [ -n "$IDENTITY_ID" ]    || missing+=("vars.INFISICAL_REVIEW_IDENTITY_ID")
        [ -n "$PROJECT_SLUG" ]   || missing+=("vars.INFISICAL_PROJECT_SLUG")
        [ -n "$REVIEW_PROVIDER" ]|| missing+=("vars.REVIEW_PROVIDER")
        [ -n "$REVIEW_MODEL" ]   || missing+=("vars.REVIEW_MODEL")

        if [ ${#missing[@]} -gt 0 ]; then
          {
            echo "This gate is not fully provisioned. Empty repository variables:"
            printf '  - %s\n' "${missing[@]}"
            echo
            echo "All four are read through the \`vars.\` context, so each must exist as a"
            echo "repository VARIABLE (Settings -> Secrets and variables -> Actions -> the"
            echo "Variables tab). Two placements look correct but are invisible here:"
            echo "  * added under Secrets instead of Variables -- \`vars.\` cannot read secrets;"
            echo "  * scoped to an Environment -- this job declares no \`environment:\`, so"
            echo "    environment-scoped variables never reach it. Repository scope is required."
            echo
            echo "Also needed, and not checkable from here: the reviewer key at Infisical"
            echo "path /review/ (env prod), named REVIEW_ANTHROPIC_API_KEY /"
            echo "REVIEW_OPENAI_API_KEY / REVIEW_GEMINI_API_KEY. Only the one matching"
            echo "REVIEW_PROVIDER is read."
          } >&2
          exit 1
        fi

        # Reuse the exact runtime validator before any credential is imported.
        # This keeps role-specific raw values while rejecting company-family
        # collisions, including dev google plus review gemini, at the earliest
        # security boundary instead of after Infisical has already run.
        node --input-type=module <<'NODE'
        import { resolveConfig } from "./packages/review/src/config.ts";

        try {
          const config = resolveConfig(process.env);
          const declaredBuilder = (process.env.DECLARED_REVIEW_BUILDER_PROVIDER ?? "")
            .trim()
            .toLowerCase();
          if (declaredBuilder !== "" && declaredBuilder !== config.builderProvider) {
            throw new Error(
              `vars.REVIEW_BUILDER_PROVIDER (${declaredBuilder}) does not match ` +
                `agent-roles.yaml dev.provider (${config.builderProvider}).`
            );
          }
          console.log(
            `Reviewer configuration present: provider=${config.reviewerProvider} model=${config.reviewerModel} builder=${config.builderProvider}`
          );
        } catch (error) {
          console.error(error instanceof Error ? error.message : String(error));
          process.exit(1);
        }
        NODE

    # npm ci runs BEFORE credentials are pulled, so install lifecycle
    # scripts never execute with a provider key in the environment.
    - name: Setup · Install workspace dependencies
      shell: bash
      run: npm ci

    - name: Setup · Pull reviewer credentials from Infisical
      if: inputs.pr_number != ''
      uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
      with:
        method: oidc
        identity-id: ${{ inputs.infisical_identity_id }}
        project-slug: ${{ inputs.infisical_project_slug }}
        env-slug: prod
        secret-path: "/review/"
        domain: https://app.infisical.com

    # Writes TWO files: the linked Issue's body (intent, acceptance criteria)
    # and the pull request's own body (the author's claimed evidence). These
    # used to be one variable, with the PR body only ever a silent fallback
    # that got unconditionally overwritten the moment an Issue number
    # resolved -- which is effectively always, since verify-pr-description
    # requires every PR body to carry a Closes/Fixes/Resolves reference. That
    # meant the reviewer never actually saw a PR's own Verification section,
    # oracle-change disclosure, or scope reasoning in normal operation
    # (Issue #251). They are two different kinds of claim -- the Issue states
    # intent, the PR states evidence -- so they are now two files, and
    # prompt.ts fences them as two separately-labelled sections.
    - name: Context · Write the linked Issue body and the pull request body to files
      if: inputs.pr_number != ''
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
      env:
        PR_NUMBER: ${{ inputs.pr_number }}
      with:
        github-token: ${{ inputs.github_token }}
        script: |
          const fs = require("node:fs");
          const { owner, repo } = context.repo;
          const { data: pr } = await github.rest.pulls.get({
            owner,
            repo,
            pull_number: Number(process.env.PR_NUMBER),
          });

          // The Issue number is derived from data only -- the deterministic
          // branch name this standard mandates (issue/<n>-<slug>), then the
          // PR body's closing keyword as a fallback. Both values are used as
          // a NUMBER, never interpolated into a shell command, and every body
          // is written straight to a file rather than echoed.
          let issueNumber = null;
          const fromBranch = /^issue\/(\d+)-/.exec(pr.head.ref ?? "");
          if (fromBranch) {
            issueNumber = Number(fromBranch[1]);
          } else {
            const fromBody = /\b(?:closes|fixes|resolves)\s+#(\d+)\b/i.exec(pr.body ?? "");
            if (fromBody) {
              issueNumber = Number(fromBody[1]);
            }
          }

          let issueBody = "(no linked Issue could be identified from the branch name or the pull request body)";
          if (issueNumber !== null) {
            try {
              const issue = await github.rest.issues.get({ owner, repo, issue_number: issueNumber });
              issueBody = `Issue #${issueNumber}: ${issue.data.title}\n\n${issue.data.body ?? "(empty body)"}`;
            } catch (error) {
              core.warning(`Could not read issue #${issueNumber}: ${error.message}`);
            }
          }

          // Always the PR's own body, independent of whether an Issue was
          // found -- never a fallback substitute for issueBody above.
          const prBody = pr.body ?? "(this pull request has no description)";

          fs.mkdirSync(process.env.RUNNER_TEMP, { recursive: true });
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/issue-body.md`, issueBody, "utf8");
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/pr-body.md`, prBody, "utf8");
          core.info(`Wrote ${issueBody.length} chars of Issue context and ${prBody.length} chars of PR body for the reviewer.`);

    # Every comment on the pull request, chronological -- the reviewer's own
    # prior verdict (continuity across rounds) and any reply since (a fix
    # description, a rebuttal, a proposal to defer a finding to a follow-up
    # Issue). Deliberately unfiltered: guessing which comments are "real
    # dialogue" client-side is a brittle heuristic the model is better
    # positioned to judge than this step is, and packages/review/src/prompt.ts
    # fences this exactly like every other repository-influenced input --
    # DATA to weigh, never instructions to obey.
    - name: Context · Write the pull request's conversation to a file
      if: inputs.pr_number != ''
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
      env:
        PR_NUMBER: ${{ inputs.pr_number }}
      with:
        github-token: ${{ inputs.github_token }}
        script: |
          const fs = require("node:fs");
          const { owner, repo } = context.repo;
          const pull_number = Number(process.env.PR_NUMBER);

          // Two kinds of comment live on a pull request, from two different
          // API surfaces: top-level conversation (issues.listComments) and
          // inline review-thread comments (pulls.listReviewComments). A dev
          // agent's rebuttal or an owner's line-level question can land in
          // either, so both are fetched and merged into one chronological
          // stream -- omitting either would leave part of "every comment"
          // (this repo's own stated acceptance criterion for this step)
          // structurally invisible to the reviewer.
          const [issueComments, reviewComments] = await Promise.all([
            github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: pull_number, per_page: 100 }),
            github.paginate(github.rest.pulls.listReviewComments, { owner, repo, pull_number, per_page: 100 }),
          ]);

          const comments = [...issueComments, ...reviewComments].sort(
            (a, b) => new Date(a.created_at).getTime() - new Date(b.created_at).getTime()
          );

          const conversation = comments
            .map((comment) => {
              const where = comment.path ? ` on ${comment.path}${comment.line ? `:${comment.line}` : ""}` : "";
              return `${comment.user?.login ?? "(unknown)"} (${comment.created_at})${where}:\n${comment.body ?? ""}`;
            })
            .join("\n\n---\n\n");

          fs.mkdirSync(process.env.RUNNER_TEMP, { recursive: true });
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/pr-conversation.md`, conversation, "utf8");
          core.info(`Wrote ${conversation.length} chars of pull request conversation for the reviewer (${comments.length} comments).`);

    - name: Review · Run the adversarial LLM reviewer
      id: review
      if: inputs.pr_number != ''
      shell: bash
      env:
        REVIEW_PROVIDER: ${{ inputs.review_provider }}
        REVIEW_MODEL: ${{ inputs.review_model }}
        REVIEW_BUILDER_PROVIDER: ${{ steps.roles.outputs.builder_provider }}
        BASE_SHA: ${{ inputs.base_sha }}
        HEAD_SHA: ${{ inputs.head_sha }}
      run: |
        set -euo pipefail
        node packages/review/bin/review.mjs \
          --base "$BASE_SHA" \
          --head "$HEAD_SHA" \
          --issue-body-file "$RUNNER_TEMP/issue-body.md" \
          --pr-body-file "$RUNNER_TEMP/pr-body.md" \
          --conversation-file "$RUNNER_TEMP/pr-conversation.md" \
          --out "$RUNNER_TEMP/review-verdict.json"

    - name: Review · Publish the verdict to the run summary
      if: always() && inputs.pr_number != ''
      shell: bash
      run: |
        set -euo pipefail
        {
          # Deliberately name-agnostic: this step runs under two callers whose
          # jobs have different actual check names -- pr-verify.yml's
          # "AI Review" and llm-review.yml's own "Verify: LLM Review" -- so
          # hardcoding either one would be wrong for the other caller.
          echo "### LLM Review Verdict"
          echo ""
          if [ -f "$RUNNER_TEMP/review-verdict.json" ]; then
            echo '```json'
            cat "$RUNNER_TEMP/review-verdict.json"
            echo '```'
          else
            echo "No verdict file was produced -- the review did not complete. See the reviewer step's log."
          fi
        } >> "$GITHUB_STEP_SUMMARY"

    # The verdict has to outlive this job, and it cannot be posted from
    # here: this job executes pull-request-authored code while holding a
    # provider credential, so it deliberately holds no token that can speak
    # on a pull request's behalf (see llm-review.yml's permissions comment,
    # and commit 1e4f8e5 which removed that grant on purpose). An artifact
    # is the handoff -- llm-review-dialogue.yml reads it from a workflow_run
    # that never checks this code out, and does the posting there.
    #
    # always(), because the case that MUST reach the pull request is the one
    # where the step above exited non-zero. A success-only upload would
    # publish nothing exactly when there is something to say.
    - name: Review · Stage the verdict for the dialogue workflow
      if: always() && inputs.pr_number != ''
      shell: bash
      env:
        PR_NUMBER: ${{ inputs.pr_number }}
        BASE_SHA: ${{ inputs.base_sha }}
        HEAD_SHA: ${{ inputs.head_sha }}
        REVIEW_OUTCOME: ${{ steps.review.outcome }}
      run: |
        set -euo pipefail
        staging="$RUNNER_TEMP/llm-review-artifact"
        mkdir -p "$staging"

        # "Reviewed and passed" and "never ran" are different facts, and the
        # consumer must not conflate them -- an unprovisioned preflight or an
        # infrastructure failure produces NO verdict file at all, and
        # reporting that as a clean bill of health would be a lie.
        if [ -f "$RUNNER_TEMP/review-verdict.json" ]; then
          cp "$RUNNER_TEMP/review-verdict.json" "$staging/review-verdict.json"
          export VERDICT_PRESENT=true
        else
          export VERDICT_PRESENT=false
        fi

        # The verdict itself carries no SHAs and no PR number by design
        # (packages/review/src/types.ts keeps ReviewVerdict pure), so the
        # identity of what was judged travels beside it, not inside it.
        python3 - "$staging/review-meta.json" <<'PY'
        import json, os, sys
        json.dump(
            {
                "prNumber": int(os.environ["PR_NUMBER"]),
                "baseSha": os.environ["BASE_SHA"],
                "headSha": os.environ["HEAD_SHA"],
                "reviewOutcome": os.environ["REVIEW_OUTCOME"],
                "verdictPresent": os.environ["VERDICT_PRESENT"] == "true",
            },
            open(sys.argv[1], "w"),
            indent=2,
        )
        PY
        echo "Staged verdict for the dialogue workflow (verdictPresent=${VERDICT_PRESENT}, reviewOutcome=${REVIEW_OUTCOME})."

    - name: Review · Upload the verdict artifact
      if: always() && inputs.pr_number != ''
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: llm-review-verdict
        path: ${{ runner.temp }}/llm-review-artifact
        if-no-files-found: error
        retention-days: 7

    - name: Review · Not applicable outside pull requests
      if: inputs.pr_number == ''
      shell: bash
      run: 'echo "Verify: LLM Review only evaluates pull requests; nothing to review for this event."'
