name: Verify Tests Creative Studio
description: >-
  Creative Studio's lane. The app holds documentation, a structured registry
  and one validator, so its check is the registry validator, scripts/validate.py
  (formerly the app's own validate.yml, removed with its nested .github/). It
  has no application code to lint or type-check. Assumes the caller already
  checked out the repository.

runs:
  using: composite
  steps:
    - name: Setup · Configure Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"

    - name: Validate · registry (scripts/validate.py)
      shell: bash
      working-directory: apps/creative-studio
      run: python3 scripts/validate.py
