name: Verify Repo Policy
description: >-
  Structural checks: CLAUDE.md/GEMINI.md are exact adapters, AGENTS.md has
  every required section, every workflow action is SHA-pinned,
  project.yaml/standard.lock parse as valid YAML,
  dev and review providers are valid and distinct, and
  no trailing whitespace was introduced. Shared by pr-verify.yml's
  "Repository Standards" job and repo-policy.yml's own
  merge_group/push/workflow_dispatch triggers, so the actual checks have
  exactly one source.

  The CALLER must have already checked out the repository with
  fetch-depth: 0 -- this action does not check out, so a job running
  several of these actions back to back checks out exactly once, and the
  whitespace check below needs history back to the base commit.

inputs:
  base_sha:
    description: Base commit SHA to diff against for the whitespace check. Empty skips that one check only.
    required: false
    default: ""
  review_provider:
    description: Live vars.REVIEW_PROVIDER, the review model provider family.
    required: false
    default: ""
  dev_provider:
    description: Live vars.DEV_PROVIDER, the coding-agent provider family.
    required: false
    default: ""
  dev_model:
    description: Live vars.DEV_MODEL, the coding-agent model.
    required: false
    default: ""
  review_model:
    description: Live vars.REVIEW_MODEL, the review model.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Setup · Install Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"

    - name: Setup · Install PyYAML
      shell: bash
      run: pip install --quiet pyyaml

    - name: Policy · Confirm CLAUDE.md and GEMINI.md are exact adapters
      shell: bash
      run: |
        set -euo pipefail
        printf '# CLAUDE.md\n\n@AGENTS.md\n' > /tmp/expected-claude.md
        printf '# GEMINI.md\n\n@AGENTS.md\n' > /tmp/expected-gemini.md
        fail=0
        if ! cmp -s CLAUDE.md /tmp/expected-claude.md; then
          echo "CLAUDE.md is not the exact 2-line adapter (# CLAUDE.md / blank / @AGENTS.md)." >&2
          fail=1
        fi
        if ! cmp -s GEMINI.md /tmp/expected-gemini.md; then
          echo "GEMINI.md is not the exact 2-line adapter (# GEMINI.md / blank / @AGENTS.md)." >&2
          fail=1
        fi
        exit "$fail"

    - name: Policy · Confirm AGENTS.md has every required section
      shell: bash
      run: |
        set -euo pipefail
        missing=()
        while IFS= read -r heading; do
          [ -z "$heading" ] && continue
          grep -qF -- "$heading" AGENTS.md || missing+=("$heading")
        done <<'HEADINGS'
        ## Objective
        ## 🎯 Repository purpose
        ## ⚠️ Workflow Safety Invariant
        ## ⚠️ The platform publishable key has six hardcoded copies
        ## Owner authority
        ## Sources of truth
        ## Session bootstrap
        ## Active agent roles
        ## Provider-neutral roles
        ## Releases and milestones
        ## Thin Issues and work claiming
        ## Worktrees and parallel work
        ## Context recovery and subagent tracking
        ## Risk classification
        ## Intent and behavioral claims
        ## Test quality
        ## Verification flow
        ## Evidence and artifacts
        ## Lean engineering
        ## Documentation and handoff
        ## PR Gate and merge behavior
        ## Agent boundaries
        ## Completion standard
        HEADINGS
        if [ "${#missing[@]}" -gt 0 ]; then
          echo "AGENTS.md is missing required sections:" >&2
          printf '  - %s\n' "${missing[@]}" >&2
          exit 1
        fi
        echo "AGENTS.md has every required section."

    - name: Policy · Confirm every workflow and composite action is SHA-pinned
      shell: bash
      run: |
        set -euo pipefail
        fail=0
        while IFS= read -r -d '' file; do
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            # Local reusable-workflow/composite-action references (uses:
            # ./path) are pinned by definition to the calling workflow's own
            # checkout; only external third-party actions need an explicit
            # SHA pin.
            if echo "$line" | grep -qE 'uses:[[:space:]]*\./'; then
              continue
            fi
            if ! echo "$line" | grep -qE '@[0-9a-f]{40}[[:space:]]+# v[0-9]'; then
              echo "Unpinned action or missing version comment in $file: $line" >&2
              fail=1
            fi
          done < <(grep -E '^\s*uses:' "$file" || true)
        done < <(find .github/workflows -maxdepth 1 -name '*.yml' -print0; find .github/actions -mindepth 2 -maxdepth 2 -name 'action.yml' -print0)
        exit "$fail"

    - name: Policy · Confirm project.yaml and standard.lock parse as valid YAML
      shell: bash
      run: |
        set -euo pipefail
        python3 -c "import yaml; yaml.safe_load(open('project.yaml'))"
        python3 -c "import yaml; yaml.safe_load(open('standard.lock'))"
        echo "project.yaml and standard.lock parse as valid YAML."

    # This is the mechanical half of the provider-company separation rule
    # AGENTS.md > Active agent roles states in prose: fail the whole PR Gate
    # closed rather than let a misconfigured role configuration leave both roles on
    # the same vendor.
    - name: Policy · Confirm agent-roles.yaml is valid and dev/review providers differ
      shell: bash
      env:
        LIVE_DEV_PROVIDER: ${{ inputs.dev_provider }}
        LIVE_DEV_MODEL: ${{ inputs.dev_model }}
        LIVE_REVIEW_PROVIDER: ${{ inputs.review_provider }}
        LIVE_REVIEW_MODEL: ${{ inputs.review_model }}
      run: |
        set -euo pipefail
        python3 <<'PYEOF'
        import os
        import sys
        import yaml

        # dev.provider and review.provider are deliberately different value
        # spaces, not one enum reused twice. dev names the coding-agent TOOL's
        # COMPANY (Claude Code = anthropic, Codex = openai, Antigravity = google);
        # review names the raw model API family the structured-output review call
        # targets (AI Review never runs an agent harness, so "google" here is
        # the Gemini API). The raw values stay role-specific but both resolve to
        # the same company family, which is validated to differ from the dev family.
        VALID_PROVIDERS_BY_ROLE = {
            "dev": {"anthropic", "openai", "google"},
            "review": {"anthropic", "openai", "google"},
        }
        PROVIDER_FAMILIES = {
            "anthropic": "anthropic",
            "openai": "openai",
            "google": "google",
        }

        # Validate the live role configuration.
        dev_provider = os.environ.get("LIVE_DEV_PROVIDER", "").strip().lower()
        dev_model = os.environ.get("LIVE_DEV_MODEL", "").strip()
        review_provider = os.environ.get("LIVE_REVIEW_PROVIDER", "").strip().lower()
        review_model = os.environ.get("LIVE_REVIEW_MODEL", "").strip()

        # If agent-roles.yaml exists (legacy/transitional fallback), parse it
        data = {}
        if os.path.exists("agent-roles.yaml"):
            try:
                with open("agent-roles.yaml") as f:
                    data = yaml.safe_load(f) or {}
            except Exception as error:
                print(f"agent-roles.yaml could not be read or parsed: {error}", file=sys.stderr)
                sys.exit(1)

            if isinstance(data, dict):
                declared_provider = data.get("review", {}).get("provider") if isinstance(data.get("review"), dict) else None
                if isinstance(declared_provider, str) and review_provider and declared_provider.strip().lower() != review_provider:
                    print(
                        f"agent-roles.yaml's review.provider ({declared_provider.strip().lower()!r}) does not match the live "
                        f"vars.REVIEW_PROVIDER ({review_provider!r}) that actually drives the review call.",
                        file=sys.stderr,
                    )
                    sys.exit(1)
                declared_model = data.get("review", {}).get("model") if isinstance(data.get("review"), dict) else None
                if isinstance(declared_model, str) and review_model and declared_model.strip() != review_model:
                    print(
                        f"agent-roles.yaml's review.model ({declared_model.strip()!r}) does not match the live "
                        f"vars.REVIEW_MODEL ({review_model!r}) that actually drives the review call.",
                        file=sys.stderr,
                    )
                    sys.exit(1)

        if not dev_provider and isinstance(data.get("dev"), dict):
            dev_provider = (data["dev"].get("provider") or "").strip().lower()
            dev_model = dev_model or (data["dev"].get("model") or "").strip()
        if not review_provider and isinstance(data.get("review"), dict):
            review_provider = (data["review"].get("provider") or "").strip().lower()
            review_model = review_model or (data["review"].get("model") or "").strip()

        errors = []
        if dev_provider:
            if dev_provider not in VALID_PROVIDERS_BY_ROLE["dev"]:
                errors.append(f"'dev.provider' is {dev_provider!r}; must be one of {sorted(VALID_PROVIDERS_BY_ROLE['dev'])}.")
            if not dev_model:
                errors.append("'dev.model' is missing or empty.")

        if review_provider:
            if review_provider not in VALID_PROVIDERS_BY_ROLE["review"]:
                errors.append(f"'review.provider' is {review_provider!r}; must be one of {sorted(VALID_PROVIDERS_BY_ROLE['review'])}.")
            if not review_model:
                errors.append("'review.model' is missing or empty.")

        if dev_provider and review_provider:
            dev_family = PROVIDER_FAMILIES.get(dev_provider, dev_provider)
            review_family = PROVIDER_FAMILIES.get(review_provider, review_provider)
            if dev_family == review_family:
                if dev_provider == review_provider:
                    role_detail = f"dev.provider and review.provider are both {dev_provider!r}."
                else:
                    role_detail = f"dev.provider is {dev_provider!r} and review.provider is {review_provider!r}."
                errors.append(
                    f"{role_detail} They resolve to same provider family {dev_family!r}; "
                    "different provider companies are required -- see AGENTS.md > Active agent roles."
                )

        if errors:
            print("agent-roles.yaml failed validation:", file=sys.stderr)
            for error in errors:
                print(f"  - {error}", file=sys.stderr)
            sys.exit(1)

        print(
            f"Repository role variables are valid: dev={dev_provider or '(none)'}, review={review_provider or '(none)'}."
        )
        PYEOF

    - name: Policy · Confirm no trailing whitespace was introduced
      shell: bash
      env:
        BASE_SHA: ${{ inputs.base_sha }}
      run: |
        set -euo pipefail
        if [ -n "${BASE_SHA}" ] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
          git diff --check "${BASE_SHA}...HEAD"
        else
          echo "No comparable base for this event; skipping incremental whitespace check."
        fi
