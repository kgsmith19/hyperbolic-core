name: Verify Repo Policy
description: >-
  Structural checks: CLAUDE.md/GEMINI.md are exact adapters, AGENTS.md has
  every required section, every workflow action is SHA-pinned,
  project.yaml/standard.lock/agent-roles.yaml parse as valid YAML,
  agent-roles.yaml's dev and review providers are valid and distinct, and
  no trailing whitespace was introduced. Shared by pr-verify.yml's
  "Repository Standards" job and repo-policy.yml's own
  merge_group/push/workflow_dispatch triggers, so the actual checks have
  exactly one source.

  The CALLER must have already checked out the repository with
  fetch-depth: 0 -- this action does not check out, so a job running
  several of these actions back to back checks out exactly once, and the
  whitespace check below needs history back to the base commit.

inputs:
  base_sha:
    description: Base commit SHA to diff against for the whitespace check. Empty skips that one check only.
    required: false
    default: ""
  review_provider:
    description: >-
      Live vars.REVIEW_PROVIDER, cross-checked against agent-roles.yaml's
      review.provider (Issue #289). Empty skips that one check only -- e.g.
      before the repo variable is first provisioned.
    required: false
    default: ""
  review_model:
    description: >-
      Live vars.REVIEW_MODEL, cross-checked against agent-roles.yaml's
      review.model (Issue #289). Empty skips that one check only.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Setup · Install Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"

    - name: Setup · Install PyYAML
      shell: bash
      run: pip install --quiet pyyaml

    - name: Policy · Confirm CLAUDE.md and GEMINI.md are exact adapters
      shell: bash
      run: |
        set -euo pipefail
        printf '# CLAUDE.md\n\n@AGENTS.md\n' > /tmp/expected-claude.md
        printf '# GEMINI.md\n\n@AGENTS.md\n' > /tmp/expected-gemini.md
        fail=0
        if ! cmp -s CLAUDE.md /tmp/expected-claude.md; then
          echo "CLAUDE.md is not the exact 2-line adapter (# CLAUDE.md / blank / @AGENTS.md)." >&2
          fail=1
        fi
        if ! cmp -s GEMINI.md /tmp/expected-gemini.md; then
          echo "GEMINI.md is not the exact 2-line adapter (# GEMINI.md / blank / @AGENTS.md)." >&2
          fail=1
        fi
        exit "$fail"

    - name: Policy · Confirm AGENTS.md has every required section
      shell: bash
      run: |
        set -euo pipefail
        missing=()
        while IFS= read -r heading; do
          [ -z "$heading" ] && continue
          grep -qF -- "$heading" AGENTS.md || missing+=("$heading")
        done <<'HEADINGS'
        ## Objective
        ## 🎯 Repository purpose
        ## ⚠️ Workflow Safety Invariant
        ## ⚠️ The platform publishable key has six hardcoded copies
        ## Owner authority
        ## Sources of truth
        ## Session bootstrap
        ## Active agent roles
        ## Provider-neutral roles
        ## Releases and milestones
        ## Thin Issues and work claiming
        ## Worktrees and parallel work
        ## Context recovery and subagent tracking
        ## Risk classification
        ## Intent and behavioral claims
        ## Test quality
        ## Verification flow
        ## Evidence and artifacts
        ## Lean engineering
        ## Documentation and handoff
        ## PR Gate and merge behavior
        ## Agent boundaries
        ## Completion standard
        HEADINGS
        if [ "${#missing[@]}" -gt 0 ]; then
          echo "AGENTS.md is missing required sections:" >&2
          printf '  - %s\n' "${missing[@]}" >&2
          exit 1
        fi
        echo "AGENTS.md has every required section."

    - name: Policy · Confirm every workflow and composite action is SHA-pinned
      shell: bash
      run: |
        set -euo pipefail
        fail=0
        while IFS= read -r -d '' file; do
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            # Local reusable-workflow/composite-action references (uses:
            # ./path) are pinned by definition to the calling workflow's own
            # checkout; only external third-party actions need an explicit
            # SHA pin.
            if echo "$line" | grep -qE 'uses:[[:space:]]*\./'; then
              continue
            fi
            if ! echo "$line" | grep -qE '@[0-9a-f]{40}[[:space:]]+# v[0-9]'; then
              echo "Unpinned action or missing version comment in $file: $line" >&2
              fail=1
            fi
          done < <(grep -E '^\s*uses:' "$file" || true)
        done < <(find .github/workflows -maxdepth 1 -name '*.yml' -print0; find .github/actions -mindepth 2 -maxdepth 2 -name 'action.yml' -print0)
        exit "$fail"

    - name: Policy · Confirm project.yaml and standard.lock parse as valid YAML
      shell: bash
      run: |
        set -euo pipefail
        python3 -c "import yaml; yaml.safe_load(open('project.yaml'))"
        python3 -c "import yaml; yaml.safe_load(open('standard.lock'))"
        echo "project.yaml and standard.lock parse as valid YAML."

    # This is the mechanical half of the provider-company separation rule
    # AGENTS.md > Active agent roles states in prose: fail the whole PR Gate
    # closed rather than let a misconfigured file quietly leave both roles on
    # the same vendor. This is one of three independent checks of
    # the same constraint (the dev dispatcher and the reviewer gate each
    # re-verify it too, once those slices land) -- defense in depth, never
    # trust a single check alone.
    - name: Policy · Confirm agent-roles.yaml is valid and dev/review providers differ
      shell: bash
      env:
        LIVE_REVIEW_PROVIDER: ${{ inputs.review_provider }}
        LIVE_REVIEW_MODEL: ${{ inputs.review_model }}
      run: |
        set -euo pipefail
        python3 <<'PYEOF'
        import os
        import sys
        import yaml

        # dev.provider and review.provider are deliberately different value
        # spaces, not one enum reused twice -- see agent-roles.yaml's own
        # comments. dev names the coding-agent TOOL's COMPANY (Claude Code =
        # anthropic, Codex = openai, Antigravity = google); review names the
        # raw model API family the structured-output review call targets (AI
        # Review never runs an agent harness, so "gemini" there is the real
        # Gemini API). The raw values stay role-specific, but google (dev) and
        # gemini (review) both resolve to the Google company family before the
        # separation comparison.
        VALID_PROVIDERS_BY_ROLE = {
            "dev": {"anthropic", "openai", "google"},
            "review": {"anthropic", "openai", "gemini"},
        }
        PROVIDER_FAMILIES = {
            "anthropic": "anthropic",
            "openai": "openai",
            "google": "google",
            "gemini": "google",
        }

        try:
            with open("agent-roles.yaml") as f:
                data = yaml.safe_load(f)
        except (OSError, yaml.YAMLError) as error:
            print(f"agent-roles.yaml could not be read or parsed: {error}", file=sys.stderr)
            sys.exit(1)

        if not isinstance(data, dict):
            print("agent-roles.yaml must parse to a mapping with 'dev' and 'review' keys.", file=sys.stderr)
            sys.exit(1)

        errors = []
        providers = {}
        for role in ("dev", "review"):
            section = data.get(role)
            if not isinstance(section, dict):
                errors.append(f"'{role}' section is missing or not a mapping.")
                continue
            valid_providers = VALID_PROVIDERS_BY_ROLE[role]
            raw_provider = section.get("provider")
            # Canonicalize the same way packages/review/src/config.ts does
            # for REVIEW_PROVIDER: trim + lowercase before comparison, so
            # harmless casing ("OpenAI") never causes a spurious failure or,
            # worse, silently evades the collision check below.
            provider = raw_provider.strip().lower() if isinstance(raw_provider, str) else raw_provider
            if provider not in valid_providers:
                errors.append(
                    f"'{role}.provider' is {raw_provider!r}; must be one of {sorted(valid_providers)}."
                )
            else:
                providers[role] = provider
            if not isinstance(section.get("model"), str) or not section.get("model", "").strip():
                errors.append(f"'{role}.model' is missing or empty.")

        if "dev" in providers and "review" in providers:
            dev_family = PROVIDER_FAMILIES[providers["dev"]]
            review_family = PROVIDER_FAMILIES[providers["review"]]
            if dev_family == review_family:
                if providers["dev"] == providers["review"]:
                    role_detail = (
                        f"dev.provider and review.provider are both {providers['dev']!r}."
                    )
                else:
                    role_detail = (
                        f"dev.provider is {providers['dev']!r} and review.provider is "
                        f"{providers['review']!r}."
                    )
                errors.append(
                    f"{role_detail} They resolve to same provider family {dev_family!r}; "
                    "different provider companies are required -- see AGENTS.md > Active agent roles."
                )

        # Issue #289: agent-roles.yaml declares review.provider/review.model
        # as this repo's stated source of truth, but nothing previously
        # confirmed they match vars.REVIEW_PROVIDER/REVIEW_MODEL -- the
        # values that actually drive the live review call in
        # verify-llm-review, and what the new AI Review footer states. If
        # they drift, the footer would state a provider/model that isn't
        # the one that actually ran. Empty inputs (the var not provisioned
        # yet) skip this check rather than failing closed on nothing to
        # compare against -- matching this action's own base_sha input.
        live_review_provider = os.environ.get("LIVE_REVIEW_PROVIDER", "").strip()
        live_review_model = os.environ.get("LIVE_REVIEW_MODEL", "").strip()
        if live_review_provider:
            declared = providers.get("review")
            if declared is not None and declared != live_review_provider.strip().lower():
                errors.append(
                    f"agent-roles.yaml's review.provider ({declared!r}) does not match the live "
                    f"vars.REVIEW_PROVIDER ({live_review_provider!r}) that actually drives the review call."
                )
        if live_review_model:
            declared_model = data.get("review", {}).get("model") if isinstance(data.get("review"), dict) else None
            if declared_model is not None and declared_model.strip() != live_review_model.strip():
                errors.append(
                    f"agent-roles.yaml's review.model ({declared_model!r}) does not match the live "
                    f"vars.REVIEW_MODEL ({live_review_model!r}) that actually drives the review call."
                )

        if errors:
            print("agent-roles.yaml failed validation:", file=sys.stderr)
            for error in errors:
                print(f"  - {error}", file=sys.stderr)
            sys.exit(1)

        print(
            f"agent-roles.yaml is valid: dev={providers['dev']}, review={providers['review']}."
        )
        PYEOF

    - name: Policy · Confirm no trailing whitespace was introduced
      shell: bash
      env:
        BASE_SHA: ${{ inputs.base_sha }}
      run: |
        set -euo pipefail
        if [ -n "${BASE_SHA}" ] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
          git diff --check "${BASE_SHA}...HEAD"
        else
          echo "No comparable base for this event; skipping incremental whitespace check."
        fi
