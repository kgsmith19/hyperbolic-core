name: Verify PR Description
description: >-
  Confirms a pull request's body includes every required
  PULL_REQUEST_TEMPLATE.md section and links an Issue (a Closes line, or an
  Issue derivable from an issue/<n>- branch or a "(#N)" title; std #333). A no-op
  when there is no pull request context. Shared by pr-verify.yml's
  "Repository Standards" job and template-lint.yml's own
  merge_group/push/workflow_dispatch triggers, so the actual check has
  exactly one source. Reads the PR body from the API, so it needs no
  checkout of its own.

inputs:
  pr_number:
    description: Pull request number to check. Empty no-ops (nothing to lint outside a pull_request event).
    required: false
    default: ""
  github_token:
    description: Token used to fetch the PR body via the REST API. Required only when pr_number is set.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Lint · Confirm PR body matches the required template sections
      if: inputs.pr_number != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ inputs.pr_number }}
      run: |
        set -euo pipefail
        dir="$(mktemp -d "${RUNNER_TEMP:-/tmp}/pr-description.XXXXXX")"
        curl --fail --silent \
          -H "Authorization: Bearer ${GH_TOKEN}" \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/${REPO}/pulls/${PR_NUMBER}" > "$dir/pr.json"
        python3 -I -c 'import json,sys; pr=json.load(open(sys.argv[1])); open(sys.argv[2],"w").write(pr.get("body") or ""); open(sys.argv[3],"w").write(pr["head"]["ref"]); open(sys.argv[4],"w").write(pr.get("title") or "")' \
          "$dir/pr.json" "$dir/body.md" "$dir/head_ref" "$dir/title"
        status=0
        missing=()
        # The template is the single source of the required sections; the
        # fixed list is only a fallback when it is absent from the checkout.
        headings=()
        if [ -f .github/PULL_REQUEST_TEMPLATE.md ]; then
          mapfile -t headings < <(grep -E '^## ' .github/PULL_REQUEST_TEMPLATE.md)
        fi
        if [ "${#headings[@]}" -eq 0 ]; then
          headings=("## 📋 Summary" "## 🔗 Related Issue" "## 🔨 Changes" "## 🧪 Verification" "## ✅ Scope Check")
        fi
        for heading in "${headings[@]}"; do
          if ! grep -qF -- "$heading" "$dir/body.md"; then
            missing+=("$heading")
          fi
        done
        if [ "${#missing[@]}" -gt 0 ]; then
          echo "PR body is missing required template sections:" >&2
          printf '  - %s\n' "${missing[@]}" >&2
          echo "Add them without touching existing text: python3 tools/conventions.py repair-pr --body-file BODY --template .github/PULL_REQUEST_TEMPLATE.md (agent-engineering-standard)" >&2
          status=1
        fi
        # The linked Issue (std #333): the body's 'Closes #N' line, else an
        # issue/<n>- branch, else a title ending "(#N)". One rule, from std main
        # (unpinned, like the queue guard). Unreachable std fails closed.
        base="${STANDARD_BASE_URL:-https://raw.githubusercontent.com/kgsmith19/agent-engineering-standard/main/tools}"
        curl --fail --silent --show-error --max-time 30 -o "$dir/conventions.py" "$base/conventions.py"
        if ! python3 -I "$dir/conventions.py" check-pr --body-file "$dir/body.md" \
            --head-ref "$(cat "$dir/head_ref")" --title "$(cat "$dir/title")"; then
          status=1
        fi
        if [ "$status" -eq 0 ]; then
          echo "PR body includes every required template section."
        fi
        exit "$status"

    - name: Lint · Not applicable outside pull_request events
      if: inputs.pr_number == ''
      shell: bash
      run: 'echo "Verify: PR Description only evaluates pull_request bodies; nothing to check for this event."'
