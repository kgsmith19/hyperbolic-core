name: Verify Tests ACC Windows
description: >-
  ACC's Windows-native suite: the native test run plus the PowerShell
  launch-shim, cap-watcher, and cap-watcher-installer tests. Separate from
  verify-tests-acc ONLY because these require a windows-latest runner and a
  single job cannot span two runner images -- that is why ACC reports two
  check rows rather than one. Shared by pr-verify.yml's native
  "ACC Windows" job and acc-ci.yml's own
  merge_group/push/workflow_dispatch triggers. Assumes the caller already
  checked out the repository.

runs:
  using: composite
  steps:
    - name: Setup · Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'

    - name: Test · Native test suite
      # Reporter flags ride in NODE_OPTIONS so package.json's own
      # test:windows stays untouched for local runs. They cannot be appended
      # as npm `--` passthrough args: node parses no options after the test
      # globs. Bare `node --test` defaults to TAP when stdout is not a TTY,
      # and TAP buries nested-subtest failures -- the intermittent failures
      # issue #211 chased were invisible in the log. `spec` names every
      # failing subtest on stdout; `junit` writes the same names to a file
      # the evidence step below can upload after the log is gone. The
      # destination is `..`-relative because test:windows runs from
      # backend/, so the report lands at
      # apps/agentic-command-center/acc-windows-test-report.xml. Plain node
      # child processes the tests spawn ignore these flags outside --test
      # mode.
      shell: bash
      working-directory: apps/agentic-command-center
      env:
        NODE_OPTIONS: >-
          --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=junit --test-reporter-destination=../acc-windows-test-report.xml
      run: npm run test:windows

    - name: Test · Launch-shim tests
      shell: pwsh
      working-directory: apps/agentic-command-center
      run: powershell -File backend/shim/claude.test.ps1

    - name: Test · Cap-watcher tests
      shell: pwsh
      working-directory: apps/agentic-command-center
      run: powershell -File backend/watcher/claude-cap-watch.test.ps1

    - name: Test · Cap-watcher installer tests
      shell: pwsh
      working-directory: apps/agentic-command-center
      run: powershell -File backend/watcher/install-cap-watch-task.test.ps1

    - name: Evidence · Upload native-suite failure report
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: acc-windows-test-evidence
        path: apps/agentic-command-center/acc-windows-test-report.xml
        # `error`, not `ignore`: this step only runs on failure, and a failed
        # native run that produced no report is itself a defect worth failing
        # loudly on -- the same reasoning as verify-tests-shell's evidence
        # step (#148). A PowerShell-suite failure still finds the report the
        # native step already wrote.
        if-no-files-found: error
        retention-days: 14
