name: Verify Tests ACC
description: >-
  ACC's Linux test suite: the UI build and contract e2e, then the portable
  suite and its changed-file coverage gate. Shared by pr-verify.yml's native
  "ACC Linux" job and acc-ci.yml's own
  merge_group/push/workflow_dispatch triggers, so the suite has exactly one
  source. ACC's Windows suite lives in verify-tests-acc-windows -- it needs
  a windows-latest runner and so cannot share a job with these steps.
  Assumes the caller already checked out the repository with full history
  (the coverage gate below rewrites HEAD to expose the integration diff).

  Step ORDER is load-bearing: the UI steps run BEFORE the portable suite,
  because the coverage gate's `git reset --soft` moves HEAD and anything
  after it would run against a rewritten ref.

inputs:
  base_sha:
    description: Base commit SHA the changed-file coverage gate diffs against. Empty skips the reset (full-tree coverage).
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Setup · Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: apps/agentic-command-center/frontend/package-lock.json

    - name: Setup · Install frontend dependencies
      shell: bash
      working-directory: apps/agentic-command-center/frontend
      run: npm ci

    - name: Build · Build frontend
      shell: bash
      working-directory: apps/agentic-command-center/frontend
      run: npm run build

    - name: Setup · Cache Playwright Chromium
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: acc-ui-playwright-chromium-${{ runner.os }}-${{ hashFiles('apps/agentic-command-center/frontend/package-lock.json') }}

    - name: Setup · Install Playwright Chromium
      shell: bash
      working-directory: apps/agentic-command-center/frontend
      run: npx playwright install --with-deps chromium

    - name: E2E · Contract end-to-end against the monorepo ACC server
      shell: bash
      working-directory: apps/agentic-command-center/frontend
      env:
        ACC_DIR: ${{ github.workspace }}/apps/agentic-command-center
        ACC_ROUTING_MD: ${{ github.workspace }}/apps/agentic-command-center/backend/hooks/fixtures/ROUTING.md
      run: npm run e2e

    - name: Evidence · Upload UI Playwright failure evidence
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: acc-ui-playwright-failure-evidence
        path: |
          apps/agentic-command-center/frontend/playwright-report/
          apps/agentic-command-center/frontend/test-results/
        if-no-files-found: ignore
        retention-days: 14

    - name: Test · Portable test suite
      shell: bash
      working-directory: apps/agentic-command-center
      env:
        ACC_ROUTING_MD: ${{ github.workspace }}/apps/agentic-command-center/backend/hooks/fixtures/ROUTING.md
      run: npm test

    - name: Coverage · Expose the integration diff to covgate
      shell: bash
      env:
        BASE_SHA: ${{ inputs.base_sha }}
      run: |
        set -euo pipefail
        if [ -z "${BASE_SHA}" ]; then
          echo "No base SHA provided; leaving HEAD alone and letting covgate see the full tree."
          exit 0
        fi
        # BASE_SHA is the base branch's CURRENT tip at event time, not
        # necessarily this branch's fork point -- if main has advanced since
        # the pull request was opened (any later PR merging is enough), that
        # commit was never an ancestor of HEAD and fetch-depth: 0 on `ref:
        # head.sha` only unshallows HEAD's own ancestry, never fetching it.
        # `git merge-base` then fails outright on a missing object, not a
        # real "no common ancestor" case (Issue #245). Fetching BASE_SHA
        # alone (even unshallowed) is not enough on its own: merge-base has
        # to walk back from it to find the actual shared commit, which could
        # be several merges further back than BASE_SHA's immediate parent --
        # a shallow fetch would only ever accidentally work. Fetching main's
        # own full history is the only fetch guaranteed to contain whatever
        # that shared commit turns out to be, since that is where every
        # merge that could have advanced BASE_SHA past this branch's fork
        # point actually landed. If that also fails (network issue, a
        # genuinely bad/rewritten SHA), fail open the same way the
        # empty-BASE_SHA branch above already does -- the same posture this
        # job's own detect-changes step takes for the identical "base commit
        # not available locally" case.
        if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
          echo "Base commit ${BASE_SHA} not yet fetched; fetching main's full history to reach it."
          # Defensive, not redundant: this job's own checkout always passes
          # fetch-depth: 0, but this action is also invoked by other CI
          # entry points with their own checkout config, and a caller that
          # ever used a shallow fetch would otherwise leave `git fetch origin
          # main` bounded by that existing shallow horizon instead of truly
          # reaching back to BASE_SHA.
          if [ -f "$(git rev-parse --git-dir)/shallow" ]; then
            echo "Repository is shallow; unshallowing before fetching main."
            git fetch --unshallow origin 2>/dev/null || true
          fi
          if ! git fetch origin main 2>/dev/null; then
            echo "Could not fetch main; leaving HEAD alone and letting covgate see the full tree."
            exit 0
          fi
          # A successful fetch of main does not guarantee BASE_SHA itself
          # exists anywhere -- a stale or malformed value is real input, not
          # hypothetical, since it travels through an event payload. Fail
          # open here too rather than letting a bad SHA reach merge-base and
          # crash the job.
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "Base commit ${BASE_SHA} still not found after fetching main; leaving HEAD alone and letting covgate see the full tree."
            exit 0
          fi
        fi
        merge_base="$(git merge-base "${BASE_SHA}" HEAD)"
        git reset --soft "${merge_base}"

    - name: Coverage · Changed-file coverage
      shell: bash
      working-directory: apps/agentic-command-center
      env:
        ACC_ROUTING_MD: ${{ github.workspace }}/apps/agentic-command-center/backend/hooks/fixtures/ROUTING.md
      run: npm run covgate
