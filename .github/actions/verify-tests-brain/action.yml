name: Verify Tests Brain
description: >-
  Brain's suite: type-check, unit/integration tests, the ADR-05 isolation
  check, the eval corpus gate, and a Docker build-and-smoke of the service
  image (verification only, never pushed from CI). Shared by pr-verify.yml's
  native "Brain" job and brain-ci.yml's own
  merge_group/push/workflow_dispatch triggers, so the suite has exactly one
  source. Assumes the caller already checked out the repository.

runs:
  using: composite
  steps:
    - name: Setup · Install Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: "22"

    - name: Setup · Install root workspace dependencies
      shell: bash
      run: npm ci

    - name: Build · Type-check services/brain
      shell: bash
      working-directory: services/brain
      run: npm run typecheck

    - name: Test · Run services/brain tests
      shell: bash
      working-directory: services/brain
      run: npm test

    - name: "Security · ADR-05 isolation check (m4-18, BR-3/II-4): this runner is a real non-Brain process context -- no Brain secret file is ever mounted here"
      shell: bash
      run: |
        if node services/brain/scripts/isolation-check.mjs; then
          echo "isolation-check exited 0 (secret readable) from a non-Brain CI runner -- this must never happen" >&2
          exit 1
        fi
        echo "isolation-check correctly exited non-zero: the Brain secret is not readable from this context"

    - name: "Test · Eval corpus gate (m4-19, 07 section 7.11): brain eval run over services/brain/evals/cases/*.case.json"
      shell: bash
      working-directory: services/brain
      env:
        # Scratch state, never the production /data or /workspaces
        # volumes -- this CLI invocation only needs somewhere to open a
        # throwaway SQLite store and check out worktrees for the
        # duration of the eval run. config.ts's own default
        # workspacesRoot ("/workspaces") assumes the Dockerfile's own
        # VOLUME mkdir -- this bare runner has neither that directory
        # nor permission to create one at the filesystem root, so the
        # m6-01 seed corpus (the first real cases ever dispatched
        # through this step) needs an explicit, writable path.
        BRAIN_DATA_DIR: ${{ runner.temp }}/brain-eval-data
        BRAIN_WORKSPACES_ROOT: ${{ runner.temp }}/brain-eval-workspaces
      run: node bin/brain.mjs eval run --json

    - name: Docker · Build the Brain image (verification only, never pushed from CI)
      shell: bash
      run: docker build -f services/brain/Dockerfile -t brain:pr-gate .

    - name: Docker · Smoke-run the built image (brain status --offline, no live daemon required)
      shell: bash
      run: |
        out="$(docker run --rm --entrypoint node brain:pr-gate services/brain/bin/brain.mjs status --offline)"
        echo "$out"
        echo "$out" | grep -q '"status":"ok"'
