version: 2

# github-actions only: netcheck is standard-library-only Python (no pip
# manifest exists to scan) and the Dockerfile-based release lane is manual.
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    open-pull-requests-limit: 2
    groups:
      routine-actions:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "chore(deps)"
