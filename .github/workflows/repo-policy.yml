name: "Verify: Repo Policy"

# Repo-wide structural check with NO paths: filter, deliberately. See
# AGENTS.md's "Path-scoped gates in monorepo topologies" note (mirrored
# from the pinned standard): a required status check tied to a paths:
# filter blocks forever on any PR that never triggers it.
#
# Standalone entry point for merge_group/push/workflow_dispatch only -- the
# pull_request path runs this same logic as a native job in pr-verify.yml
# (see that file's header), both calling the verify-repo-policy composite
# action under .github/actions/ so the actual checks have exactly one
# source.

on:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  verify-repo-policy:
    name: "Verify: Repo Policy"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup · Checkout repository (so the local action is resolvable)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/verify-repo-policy
        with:
          base_sha: ${{ github.event.merge_group.base_sha }}
