name: Code Quality

on:
  workflow_dispatch:  # manual only -- see tools/check.sh to run this locally instead

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # tools/check.sh is the gate: it runs the suite, all three quality tools
      # at the intensities rules/01-BUDGETS.md declares, and the shell syntax
      # checks, printing PASS/FAIL per step and exiting non-zero if any failed.
      # Running it here rather than restating its steps means local and CI
      # cannot drift, and there is one place to add a check.
      - name: Run the gate
        run: bash tools/check.sh
