name: Release

# Tag push (v1.2.3) builds the Docker image, verifies it actually runs, and
# publishes a GitHub Release with the CHANGELOG.md section for that version.
# No PyPI/Homebrew publish step: this project is stdlib-only with no
# setup.py/pyproject.toml by design (see AGENTS.md), so there is nothing to
# build for pip and no wheel for a Homebrew formula to fetch. See
# docs/DEPLOYMENT.md for the full release process, including why.

on:
  # Manual only -- pick the vX.Y.Z tag to run from in the Actions UI's "Run
  # workflow" dropdown ("Use workflow from"). github.ref_name below still
  # resolves to that tag. See tools/deploy.sh to build/smoke-test the image
  # locally without spending Actions minutes at all; use this workflow only
  # when you actually want the published GitHub Release.
  workflow_dispatch:

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  build-and-verify-image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t netcheck:${{ github.ref_name }} .

      - name: Smoke test the image
        run: |
          docker run --rm netcheck:${{ github.ref_name }} --version
          docker run --rm netcheck:${{ github.ref_name }} full-check --format quick

      - name: Save image as a release artifact
        run: docker save netcheck:${{ github.ref_name }} | gzip > netcheck-image.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: netcheck-image.tar.gz

  publish-release:
    needs: build-and-verify-image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Extract this version's CHANGELOG.md section
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python3 - "$VERSION" << 'PYEOF' > release_notes.md
          import re, sys
          version = sys.argv[1]
          text = open("CHANGELOG.md").read()
          pattern = rf"## \[{re.escape(version)}\].*?\n(.*?)(?=\n## \[|\Z)"
          m = re.search(pattern, text, re.DOTALL)
          print(m.group(1).strip() if m else f"See CHANGELOG.md for {version}.")
          PYEOF

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release_notes.md
          files: netcheck-image.tar.gz
          draft: true
