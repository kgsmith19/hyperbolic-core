name: debug-oidc

on: workflow_dispatch

permissions:
  id-token: write
  contents: read

jobs:
  claims:
    runs-on: ubuntu-latest
    steps:
      - name: Print the OIDC claims GitHub issues for this job
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.request
          req = urllib.request.Request(
              os.environ['ACTIONS_ID_TOKEN_REQUEST_URL'],
              headers={'Authorization': 'bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
          tok = json.load(urllib.request.urlopen(req))['value']
          pay = tok.split('.')[1]
          pay += '=' * (-len(pay) % 4)
          claims = json.loads(base64.urlsafe_b64decode(pay))
          print(json.dumps({k: claims.get(k) for k in ('iss', 'sub', 'aud')}, indent=1))
          PY
