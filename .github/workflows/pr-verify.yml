name: "PR Verification"

# THE single entry point for every PR-time verification gate AND for merge
# orchestration. There is no second workflow on pull requests -- merge
# policy lives in the "PR Gate" job below.
#
# The architecture, in one sentence: Repository Standards verifies the
# repository, each app lane verifies its own software, AI Review
# independently evaluates the change, and PR Gate verifies that every
# mandatory lane succeeded and alone controls merge authorization.
#
# EVERY job here is a NATIVE job producing exactly ONE check row with its
# exact bare name. That is deliberate and load-bearing:
#
#   * A required status check is matched by its literal reported name. A
#     workflow_call-invoked job is ALWAYS reported as
#     "<caller job name> / <callee job name>", so a bare name typed into the
#     ruleset would silently create a required check that NEVER reports and
#     blocks every PR forever (AGENTS.md > PR Gate and merge behavior; the
#     PR #118/#120 incident).
#   * So nothing here uses workflow_call. The real work lives in composite
#     actions under .github/actions/, which run INSIDE the calling job and
#     therefore add no rows of their own. Those same composite actions are
#     reused by the standalone workflow files (secret-scan.yml,
#     repo-policy.yml, template-lint.yml, toolbelt-ci.yml, acc-ci.yml,
#     brain-ci.yml, shell-ci.yml, lifeos-ci.yml, llm-review.yml) for their
#     own merge_group/push/workflow_dispatch triggers, so every check has
#     exactly one source of logic despite two trigger paths.
#
# The lanes run in PARALLEL, one job per app (plus one repository-wide
# standards lane), by owner decision: clear ownership, independent logs and
# runners, faster wall-clock, and easy app onboarding are worth more than a
# short checks list. Only ONE of these rows is required by the ruleset --
# "PR Gate" -- so the abstraction "one required check" lives at the final
# aggregation layer, not in the job count. The worker lanes are mandatory
# in substance because PR Gate refuses to pass unless every one of them
# reports exactly "success".
#
# EVERY lane reports on EVERY pull request. Relevance is decided INSIDE
# each app job via the shared detect-changes action -- never a paths:
# filter on this file -- so an irrelevant lane reports success in seconds
# via an explicit "not applicable" step instead of disappearing. That keeps
# PR Gate's invariant brutally simple: every expected dependency exists and
# must conclude exactly "success". A change to .github/workflows/** or
# .github/actions/** marks every app relevant (see detect-changes), so a CI
# change is exercised end to end rather than trivially passing.
#
# AI Review is the one lane with a dependency: it needs Repository
# Standards, and ONLY Repository Standards, so the leaked-credential scan
# completes before any diff content is sent to an external model provider.
# It deliberately does NOT wait for the app suites -- that would serialize
# the pipeline for no security benefit. If Repository Standards fails, AI
# Review is skipped, and PR Gate treats "skipped" as failure.
#
# The rows:
#   Repository Standards -- repository integrity only: secret scan, repo
#                           policy, PR description, tested-SHA consistency.
#                           App-specific checks NEVER belong here.
#   Toolbelt / ACC Linux / ACC Windows / Brain / Platform / LifeOS
#                        -- each app's complete engineering verification,
#                           self-contained. ACC spans two rows because one
#                           job runs on one runner image and its PowerShell
#                           suites need windows-latest; that is a platform
#                           constraint, not a choice.
#   AI Review            -- adversarial LLM review (packages/review),
#                           provider-separated from the builder, fail
#                           closed. Mandatory via PR Gate's needs.
#   PR Gate              -- rollup AND merge orchestration. THE only
#                           required check, and the only place merge is
#                           armed. See its own header comment.
#
# Every checkout below pins ref: to the PR's head SHA. Without that, a
# pull_request-triggered checkout defaults to GitHub's synthetic merge ref
# (head merged onto whatever main currently points to), which can drift
# ahead of the base.sha every diff-scoped gate (detect-changes,
# verify-secrets, verify-repo-policy, verify-tests-acc, verify-llm-review)
# diffs against on a re-trigger with no new push (labeled/edited/etc.).
# That only ever widens the diff those gates see -- base.sha stays an
# ancestor of the merge commit, so it can produce a false-positive
# "relevant" verdict, never a false negative -- but it also meant the tree
# actually tested was not exactly the PR head, contradicting the "Confirm
# tested SHA matches the live PR head" check below. Pinning ref: fixes both
# (Issue #224).

# EVERY event listed here costs a pipeline run. The draft/label/auto-merge
# events have to stay, because PR Gate is the only thing that enforces
# owner:hold-merge, clears an unauthorized draft, and re-arms auto-merge
# when it is switched off -- none of which can happen if the workflow never
# runs. With the lanes parallel, a re-trigger on an unchanged head costs
# wall-clock equal to the slowest relevant lane, and concurrency below
# (cancel-in-progress) keeps rapid successive edits from queueing runs.
# Do not add an event here without weighing that cost.
#
# "closed" is the one exception to "every event here costs a full pipeline
# run": it exists solely so PR Gate can run its issue-close fallback (see
# its own job comment) at the exact moment a PR merges. GitHub's own
# closing-keyword linkage ("Closes #N") reliably fires on a direct/manual
# merge but was observed, across this repository's own history (Issue
# #267), to silently NOT fire when the merge is instead completed
# asynchronously by native auto-merge -- 8 of 8 auto-merge-completed merges
# in this repo's history failed to close their linked Issue, while both
# directly-merged ones succeeded. All eight verification lanes below carry
# `if: github.event.action != 'closed'` so this event costs only PR Gate's
# own near-instant fallback check, never a second run of the full suite
# (including a second, wasted AI Review call).
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
      - edited
      - labeled
      - unlabeled
      - auto_merge_disabled
      - closed

# Read-only by default. "PR Gate" raises its own permissions to what merge
# orchestration needs; no job that executes pull-request-authored code ever
# holds a write token. "AI Review" adds only id-token: write for Infisical
# OIDC.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # =====================================================================
  # Repository Standards -- repository integrity, nothing app-specific
  # =====================================================================
  # Owns: leaked-secret detection, repository structure/policy, PR
  # description requirements, and exact-head consistency. It must NOT
  # accumulate app-specific engineering checks -- lint, typecheck, build,
  # coverage and tests belong to the app lanes, so adding a lint rule to an
  # app six months from now touches that app's verification, not this
  # architecture. No detect-changes here: every check below is repo-wide
  # and runs unconditionally.
  repository-standards:
    name: "Repository Standards"
    # "closed" exists only to let PR Gate run its issue-close fallback after
    # the PR has already merged and every lane here has already passed --
    # re-running the full suite against a settled PR verifies nothing new.
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # fetch-depth: 0 because the secret scan needs the commit range and
      # the whitespace check needs history back to the base commit.
      - name: Setup · Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      # Cheapest-to-most-expensive, fail-fast: nothing runs after a leaked
      # secret is found.
      - name: Standards · Secrets
        uses: ./.github/actions/verify-secrets
        with:
          base_sha: ${{ github.event.pull_request.base.sha }}
          head_sha: ${{ github.event.pull_request.head.sha }}

      - name: Standards · Repo policy
        uses: ./.github/actions/verify-repo-policy
        with:
          base_sha: ${{ github.event.pull_request.base.sha }}
          dev_provider: ${{ vars.DEV_PROVIDER }}
          dev_model: ${{ vars.DEV_MODEL }}
          review_provider: ${{ vars.REVIEW_PROVIDER }}
          review_model: ${{ vars.REVIEW_MODEL }}

      - name: Standards · PR description
        uses: ./.github/actions/verify-pr-description
        with:
          pr_number: ${{ github.event.pull_request.number }}
          github_token: ${{ github.token }}

      - name: Standards · Confirm tested SHA matches the live PR head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TESTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          live_sha="$(curl --fail --silent \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/pulls/${PR_NUMBER}" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["head"]["sha"])')"
          if [ "${live_sha}" != "${TESTED_SHA}" ]; then
            echo "Tested SHA (${TESTED_SHA}) no longer matches the live PR head (${live_sha})." >&2
            exit 1
          fi
          echo "Tested SHA matches the live PR head (${TESTED_SHA})."

  # =====================================================================
  # App lanes -- one self-contained job per app, all parallel
  # =====================================================================
  # Every lane: checkout, detect relevance, run the app's composite action
  # when relevant, otherwise an explicit successful "not applicable" step.
  # Never continue-on-error, never a job-level path condition -- the job
  # must exist and report on every PR so PR Gate can demand its success.
  toolbelt:
    name: "Toolbelt"
    # See repository-standards above: skip the closed-PR fallback trigger.
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Setup · Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Detect · Is Toolbelt touched by this change?
        id: detect
        uses: ./.github/actions/detect-changes
        with:
          base_sha: ${{ github.event.pull_request.base.sha }}

      - name: Tests · Toolbelt
        if: steps.detect.outputs.toolbelt == 'true'
        uses: ./.github/actions/verify-tests-toolbelt
        with:
          owner_refresh_token: ${{ secrets.TOOLBELT_OWNER_REFRESH_TOKEN }}

      - name: Tests · Not applicable to this change
        if: steps.detect.outputs.toolbelt != 'true'
        shell: bash
        run: echo "Toolbelt was not touched by this change; nothing to verify."

  acc-linux:
    name: "ACC Linux"
    # See repository-standards above: skip the closed-PR fallback trigger.
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      # fetch-depth: 0 also feeds covgate's merge-base coverage diff inside
      # verify-tests-acc.
      - name: Setup · Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Detect · Is ACC touched by this change?
        id: detect
        uses: ./.github/actions/detect-changes
        with:
          base_sha: ${{ github.event.pull_request.base.sha }}

      - name: Tests · ACC (Linux suites)
        if: steps.detect.outputs.acc == 'true'
        uses: ./.github/actions/verify-tests-acc
        with:
          base_sha: ${{ github.event.pull_request.base.sha }}
          base_ref: ${{ github.event.pull_request.base.ref }}

      - name: Tests · Not applicable to this change
        if: steps.detect.outputs.acc != 'true'
        shell: bash
        run: echo "ACC was not touched by this change; nothing to verify."

  # ACC's second row: one job runs on one runner image, and the PowerShell
  # launch-shim, cap-watcher and installer suites need windows-latest. The
  # split is a platform constraint -- do not fake Windows coverage on Linux.
  acc-windows:
    name: "ACC Windows"
    # See repository-standards above: skip the closed-PR fallback trigger.
    if: github.event.action != 'closed'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Setup · Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Detect · Is ACC touched by this change?
        id: detect
        uses: ./.github/actions/detect-changes
        with:
          base_sha: ${{ github.event.pull_request.base.sha }}

      - name: Tests · ACC (Windows suites)
        if: steps.detect.outputs.acc == 'true'
        uses: ./.github/actions/verify-tests-acc-windows

      - name: Tests · Not applicable to this change
        if: steps.detect.outputs.acc != 'true'
        shell: bash
        run: echo "ACC was not touched by this change; nothing to verify."

  brain:
    name: "Brain"
    # See repository-standards above: skip the closed-PR fallback trigger.
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Setup · Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Detect · Is Brain touched by this change?
        id: detect
        uses: ./.github/actions/detect-changes
        with:
          base_sha: ${{ github.event.pull_request.base.sha }}

      - name: Tests · Brain
        if: steps.detect.outputs.brain == 'true'
        uses: ./.github/actions/verify-tests-brain

      - name: Tests · Not applicable to this change
        if: steps.detect.outputs.brain != 'true'
        shell: bash
        run: echo "Brain was not touched by this change; nothing to verify."

  # The shared platform surface: apps/shell, every packages/* workspace,
  # services/llm-handler, services/broker, and the docs/ops operator
  # tooling (including this workflow's own contract test).
  platform:
    name: "Platform"
    # See repository-standards above: skip the closed-PR fallback trigger.
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Setup · Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Detect · Is the platform surface touched by this change?
        id: detect
        uses: ./.github/actions/detect-changes
        with:
          base_sha: ${{ github.event.pull_request.base.sha }}

      - name: Tests · Platform (Shell, packages, services)
        if: steps.detect.outputs.shell == 'true'
        uses: ./.github/actions/verify-tests-shell

      - name: Tests · Not applicable to this change
        if: steps.detect.outputs.shell != 'true'
        shell: bash
        run: echo "The platform surface was not touched by this change; nothing to verify."

  lifeos:
    name: "LifeOS"
    # See repository-standards above: skip the closed-PR fallback trigger.
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Setup · Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Detect · Is LifeOS touched by this change?
        id: detect
        uses: ./.github/actions/detect-changes
        with:
          base_sha: ${{ github.event.pull_request.base.sha }}

      # LifeOS owns its lint: it is the only app with lint commands
      # configured, and verify-tests-lifeos runs them itself, early in each
      # half of its suite, rather than as a separate composite action. (No
      # port-5432 juggling here any more: this lane's own Postgres
      # container is the only thing on this runner that binds it, exactly
      # as in lifeos-ci.yml.)
      - name: Tests · LifeOS
        if: steps.detect.outputs.lifeos == 'true'
        uses: ./.github/actions/verify-tests-lifeos

      - name: Tests · Not applicable to this change
        if: steps.detect.outputs.lifeos != 'true'
        shell: bash
        run: echo "LifeOS was not touched by this change; nothing to verify."

  # =====================================================================
  # AI Review -- adversarial LLM review, after the secret scan only
  # =====================================================================
  # Depends on Repository Standards and ONLY Repository Standards: the
  # leaked-credential scan must complete before this repository's diff is
  # sent to an external model provider, and nothing else about the app
  # suites is a security precondition for reviewing. Deliberately no
  # dependency on the app lanes -- waiting for them would serialize the
  # pipeline just to conserve reviewer tokens on a doomed PR, and PR Gate
  # already refuses to merge anything whose tests failed.
  #
  # No if: on this job. If Repository Standards fails, GitHub skips this
  # job, needs.ai-review.result becomes "skipped", and PR Gate fails --
  # exactly the intended fail-closed behavior.
  #
  # Mandatory in substance: this job is in PR Gate's needs, so a failed or
  # skipped review blocks auto-merge. It is NOT separately listed in the
  # ruleset's required checks -- "PR Gate" is the one required name. It
  # fails closed on infrastructure problems (missing credential, invalid
  # provider config, API error, timeout) and never substitutes a default
  # green verdict; a weak or malformed model ANSWER, by contrast, is a
  # pass (see packages/review).
  ai-review:
    name: "AI Review"
    needs: [repository-standards]
    # See repository-standards above: skip the closed-PR fallback trigger.
    # (Redundant with the needs: skip cascade once repository-standards is
    # itself skipped, but explicit here so this job's own trigger shape does
    # not depend on a reader tracing that cascade through a sibling job.)
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    steps:
      - name: Setup · Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/verify-llm-review
        with:
          pr_number: ${{ github.event.pull_request.number }}
          base_sha: ${{ github.event.pull_request.base.sha }}
          head_sha: ${{ github.event.pull_request.head.sha }}
          github_token: ${{ github.token }}
          infisical_identity_id: ${{ vars.INFISICAL_REVIEW_IDENTITY_ID }}
          infisical_project_slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          review_provider: ${{ vars.REVIEW_PROVIDER }}
          review_model: ${{ vars.REVIEW_MODEL }}
          review_builder_provider: ${{ vars.DEV_PROVIDER }}
          dev_model: ${{ vars.DEV_MODEL }}

  # =====================================================================
  # PR Gate -- the sole required check AND the sole merge authority
  # =====================================================================
  # This job is deliberately boring. It is both:
  #
  #   (a) the rollup gate -- it fails unless every lane above reports
  #       exactly "success", and it is the ONLY name in the branch
  #       ruleset's required-status-checks list. One name instead of many
  #       is one fewer thing to drift out of sync with this file, the
  #       exact failure mode that stranded PRs #118, #120 and #160 on
  #       stale required-check lists.
  #
  #   (b) the merge orchestrator -- it maintains the managed Work State
  #       comments, enforces owner:hold-merge and owner:allow-draft, and
  #       arms native squash auto-merge. Arming happens HERE, structurally
  #       after every lane has already succeeded, so "the last gate
  #       finishing is the only thing that can enable a merge" is true by
  #       construction. Nothing else in this repository may call
  #       enablePullRequestAutoMerge.
  #
  # AI Review is in needs: by owner decision -- it is mandatory in
  # substance. An LLM provider outage or a blocking finding therefore
  # stops auto-merge until resolved; the owner's ruleset bypass remains
  # the escape hatch, and no agent may use it.
  #
  # This job MUST stay last in this file, and its github-script step must
  # remain the only embedded script block here: the workflow contract test
  # extracts everything after that step's script input and executes it, so
  # a second such block (or a job below this one) would silently corrupt
  # what the behavioral tests exercise.
  #
  # It raises its own permissions to write and deliberately performs NO
  # checkout and runs NO shell over repository content: the only thing it
  # executes is actions/github-script against context.payload and API
  # responses. Keep it that way -- it is the one job in this workflow
  # holding a write token, and the sibling jobs that DO execute
  # pull-request-authored code hold only the read-only workflow default.
  pr-gate:
    name: "PR Gate"
    needs: [repository-standards, toolbelt, acc-linux, acc-windows, brain, platform, lifeos, ai-review]
    # always(), not the default: the default skips this job the moment a
    # needs: job fails, which would leave THIS row -- the one row the
    # ruleset actually requires -- permanently absent on exactly the pull
    # requests that most need it to report failure.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Gates · Reconcile merge state and report the rollup verdict
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          GATE_RESULTS: ${{ toJSON(needs) }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const ownerLogin =
              (context.payload.repository &&
                context.payload.repository.owner &&
                context.payload.repository.owner.login) ||
              null;
            const defaultBranch =
              (context.payload.repository &&
                context.payload.repository.default_branch) ||
              null;

            const WORK_STATE_MARKER =
              "<!-- agent-engineering-standard:work-state:v1 -->";
            const ISSUE_CLOSE_FALLBACK_MARKER =
              "<!-- agent-engineering-standard:issue-close-fallback:v1 -->";
            // Same marker and embedded-state convention llm-review-dialogue.yml
            // uses for its own managed comment (Issue #319, Option B, owner-
            // confirmed) -- read here, never written: this job only consumes
            // the confirmedIssues state that workflow already maintains.
            const LLM_REVIEW_MARKER = "<!-- agent-engineering-standard:llm-review:v1 -->";
            const LLM_REVIEW_STATE_OPEN = "<!-- llm-review-state: ";
            const LLM_REVIEW_STATE_CLOSE = " -->";
            const DRAFT_LABEL = "owner:allow-draft";
            const HOLD_LABEL = "owner:hold-merge";
            const CHECKLIST_LABEL = "owner:allow-incomplete-issue";

            // "closed" only ever reaches this job so the fallback below can
            // run at the exact moment a PR merges (see the on: block's own
            // comment for why -- Issue #267). Every other branch in this
            // script -- the gate verdict, arming, draft/hold policy, the
            // Work State comment -- is meaningless once the PR is already
            // closed, so this flag steers straight to the fallback and
            // bypasses all of it, including the terminal setFailed check.
            const isCloseEvent = context.payload.action === "closed";

            const summaryLines = [];

            // The verdict comes straight from this workflow's own needs
            // context -- no check-runs API round trip, no name matching,
            // and nothing to keep in sync with a list elsewhere. A job
            // that stops reporting turns this red rather than silently
            // counting as a pass, because anything that is not exactly
            // "success" fails the gate.
            // The lanes this gate exists to roll up. Naming them explicitly
            // is what makes an EMPTY or truncated needs payload fail closed:
            // a bare "nothing failed" test over an empty object is vacuously
            // true, so a needs: list that was edited away, or a GATE_RESULTS
            // that arrived empty, would report GREEN and arm a merge having
            // verified nothing at all. Measured: with GATE_RESULTS="{}" the
            // unguarded form armed auto-merge and passed. Keep this list in
            // step with the job ids above -- a lane present here but missing
            // from needs: fails the gate rather than being skipped silently,
            // and the workflow contract test holds the two lists equal.
            const EXPECTED_GATE_JOBS = ["repository-standards", "toolbelt", "acc-linux", "acc-windows", "brain", "platform", "lifeos", "ai-review"];

            let gateResults;
            try {
              gateResults = JSON.parse(process.env.GATE_RESULTS || "");
            } catch (parseError) {
              gateResults = null;
            }

            const failedGates = [];
            if (!gateResults || typeof gateResults !== "object") {
              failedGates.push("needs payload was missing or unparseable");
            } else {
              for (const jobId of EXPECTED_GATE_JOBS) {
                const value = gateResults[jobId];
                if (!value) failedGates.push(`${jobId} (absent from needs)`);
                else if (value.result !== "success") failedGates.push(`${jobId} (${value.result || "no result"})`);
              }
              // Anything else that IS present must also have succeeded, so a
              // newly added dependency cannot pass unnoticed by this list.
              for (const [jobId, value] of Object.entries(gateResults)) {
                if (EXPECTED_GATE_JOBS.includes(jobId)) continue;
                if ((value || {}).result !== "success") {
                  failedGates.push(`${jobId} (${(value || {}).result || "no result"})`);
                }
              }
            }
            const gatesGreen = failedGates.length === 0;

            // Mirrors the pinned standard's owner_label_authorized exactly: walk
            // timeline events in chronological order and track whether the label
            // is currently trustworthy. A "labeled" event for the target label
            // sets authorization to (actor === ownerLogin); an "unlabeled" event
            // for the same label always clears it.
            function ownerLabelAuthorized(events, label, ownerLoginValue) {
              let authorized = false;
              for (const event of events) {
                const labelObj = event.label || {};
                const name = labelObj.name || event.label_name;
                if (name !== label) continue;
                if (event.event === "labeled") {
                  const actor = event.actor || {};
                  const login = actor.login || event.actor_login;
                  authorized = login === ownerLoginValue;
                } else if (event.event === "unlabeled") {
                  authorized = false;
                }
              }
              return authorized;
            }

            async function isLabelAuthorizedByOwner(prNumber, label) {
              if (!ownerLogin) return false;
              const events = await github.paginate(
                github.rest.issues.listEventsForTimeline,
                { owner, repo, issue_number: prNumber, per_page: 100 }
              );
              return ownerLabelAuthorized(events, label, ownerLogin);
            }

            function hasLabel(pr, label) {
              return (pr.labels || []).some((entry) => entry && entry.name === label);
            }

            async function removeUnauthorizedLabel(pr, label) {
              if (!hasLabel(pr, label)) return;
              try {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: pr.number,
                  name: label,
                });
                summaryLines.push(
                  `- Label \`${label}\`: present without owner provenance; removed (no public comment, per AGENTS.md).`
                );
              } catch (error) {
                summaryLines.push(
                  `- Label \`${label}\`: present without owner provenance; could not be removed: ${error.message}`
                );
              }
            }

            function parseLinkedIssue(body) {
              const match = /^closes\s+#(\d+)/im.exec(body || "");
              return match ? Number(match[1]) : null;
            }

            // Fallback for Issue #267: GitHub's own "Closes #N" linkage
            // reliably closes the linked Issue on a direct/manual merge, but
            // was observed -- 8 times out of 8 in this repository's history
            // -- to silently NOT fire when the merge is instead completed
            // asynchronously by native auto-merge (the only merge path this
            // workflow ever arms). This replicates that one linkage as an
            // explicit, idempotent close: it only acts when the Issue is
            // still open, so it is a no-op whenever GitHub's own native
            // linkage already did the job (as it did for both directly
            // merged PRs in this repo's history).
            async function handleIssueCloseFallback(pr, eligible) {
              if (!pr.merged) {
                summaryLines.push(
                  "- Issue close fallback: PR closed without merging; nothing to do."
                );
                return;
              }
              if (!eligible) {
                summaryLines.push(
                  "- Issue close fallback: fork pull request or non-default base branch; skipped by directive."
                );
                return;
              }
              const linkedIssue = parseLinkedIssue(pr.body);
              if (!linkedIssue) {
                summaryLines.push(
                  "- Issue close fallback: no linked issue found in the PR body."
                );
                return;
              }
              let issue;
              try {
                const { data } = await github.rest.issues.get({
                  owner,
                  repo,
                  issue_number: linkedIssue,
                });
                issue = data;
              } catch (error) {
                summaryLines.push(
                  `- Issue close fallback: could not read #${linkedIssue}: ${error.message}`
                );
                return;
              }
              if (issue.state !== "open") {
                summaryLines.push(
                  `- Issue close fallback: #${linkedIssue} already ${issue.state} -- GitHub's native closing-keyword linkage handled it.`
                );
                return;
              }
              try {
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: linkedIssue,
                  state: "closed",
                  state_reason: "completed",
                });
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: linkedIssue,
                  body: [
                    ISSUE_CLOSE_FALLBACK_MARKER,
                    `Closed automatically: linked pull request #${pr.number} merged, but GitHub's ` +
                      "native closing-keyword linkage did not fire (a known platform gap on merges " +
                      "completed by native auto-merge rather than a direct merge call -- see Issue " +
                      "#267). This is a fallback close performed by PR Gate's merge orchestration, " +
                      "not a manual or reviewed action.",
                  ].join("\n"),
                });
                summaryLines.push(
                  `- Issue close fallback: #${linkedIssue} was still open after the merge; closed via fallback (native linkage did not fire).`
                );
              } catch (error) {
                core.warning(
                  `PR Gate: issue close fallback failed for #${linkedIssue} on PR #${pr.number}: ${error.message}`
                );
                summaryLines.push(
                  `- Issue close fallback: attempted to close #${linkedIssue} but failed: ${error.message}`
                );
              }
            }

            // Plural sibling of parseLinkedIssue above: that one is anchored
            // to the start of a line (the Work State comment's single
            // "primary" Issue) and stops at the first match. This finds
            // EVERY closing-keyword reference anywhere in the body, because
            // Issue #274 must fail on ANY incomplete linked Issue, not just
            // the first -- a PR closing three Issues is not "done" because
            // the first one happens to be. Same keyword set this repo
            // already uses elsewhere for the same purpose (verify-pr-description,
            // llm-review-dialogue.yml's own PR-body fallback): closes/fixes/resolves,
            // present tense. A comma-compressed list after one keyword
            // ("Closes #260, #261") is not expanded -- neither is the
            // existing singular parser -- only distinct "<keyword> #N"
            // occurrences are recognized.
            function parseLinkedIssues(body) {
              const matches = [...(body || "").matchAll(/\b(?:closes|fixes|resolves)\s+#(\d+)\b/gi)];
              return [...new Set(matches.map((entry) => Number(entry[1])))];
            }

            // Issue #319 (Option B, owner-confirmed on the Issue: "Yes,
            // option B sounds good"): a proposed blocking Issue that AI
            // Review's dialogue filed after explicit confirmation
            // (llm-review-dialogue.yml's confirmedIssues state, Issue
            // #320/#321) is never written into the PR body -- Option A
            // (mutating the body from that workflow) was rejected on
            // measured cost: ~9 min and ~7 min CI re-trigger latency
            // observed from two PR-body edits while landing #321. This
            // reads that same state directly from the managed AI Review
            // comment instead, so a confirmed blocking Issue gates merge
            // exactly like any other linked Issue, with no PR-body
            // mutation and no new check row. Mirrors
            // llm-review-dialogue.yml's own parseState() exactly (same
            // marker, same embedded-state delimiters) -- read-only here,
            // that workflow remains the sole writer of this state.
            //
            // Fails OPEN on any read/parse problem (comment missing,
            // state markers absent, malformed JSON): reported in the
            // summary and treated as "no confirmed Issues", never as a
            // reason to block every PR -- same orchestration-error
            // tolerance checkLinkedIssueChecklists already applies to a
            // single unreadable linked Issue below.
            async function readConfirmedIssueNumbers(prNumber) {
              let comment;
              try {
                comment = await findCommentByMarker(prNumber, LLM_REVIEW_MARKER);
              } catch (error) {
                summaryLines.push(
                  `- Issue checklist: could not read the AI Review comment for confirmed blocking Issues: ${error.message}`
                );
                return [];
              }
              if (!comment) return [];
              const body = comment.body || "";
              const start = body.indexOf(LLM_REVIEW_STATE_OPEN);
              if (start < 0) return [];
              const end = body.indexOf(LLM_REVIEW_STATE_CLOSE, start);
              if (end < 0) return [];
              let state;
              try {
                state = JSON.parse(body.slice(start + LLM_REVIEW_STATE_OPEN.length, end));
              } catch (error) {
                summaryLines.push(
                  `- Issue checklist: could not parse the AI Review comment's state; confirmed blocking Issues not counted: ${error.message}`
                );
                return [];
              }
              const confirmedIssues = (state && typeof state === "object" && state.confirmedIssues) || {};
              return [...new Set(Object.values(confirmedIssues).map(Number).filter(Number.isInteger))];
            }

            // Issue #274: block auto-merge (and fail this check row visibly,
            // not just skip arming) when a linked Issue is still open and its
            // body has at least one unchecked "- [ ]" item. Closed for ANY
            // reason -- completed, or GitHub's native "not planned" (this
            // repo's own existing convention for superseded/no-longer-relevant
            // work; see AGENTS.md > Releases and milestones) -- exempts an
            // Issue entirely; only an OPEN Issue with unchecked items blocks.
            // Since Issue #319, "linked" means either a body "Closes #N"
            // reference (parseLinkedIssues above) or a confirmed-and-filed
            // proposed blocking Issue (readConfirmedIssueNumbers above) --
            // both feed the same loop below identically.
            //
            // Fails OPEN on a read error for one Issue (bad number, deleted,
            // a transient API problem): that Issue is reported as
            // unverifiable in the summary and does not itself block, matching
            // this job's existing orchestration-error tolerance elsewhere
            // (armAutoMerge's own catch blocks warn and continue). A typo'd
            // issue number or a momentary API blip must not wedge every PR
            // shut, and PR Gate re-evaluates on every subsequent event, so a
            // transient failure does not persist past the run that hit it.
            async function checkLinkedIssueChecklists(pr) {
              const confirmedIssueNumbers = await readConfirmedIssueNumbers(pr.number);
              const issueNumbers = [...new Set([...parseLinkedIssues(pr.body), ...confirmedIssueNumbers])];
              const incomplete = [];
              for (const issueNumber of issueNumbers) {
                let issue;
                try {
                  const { data } = await github.rest.issues.get({ owner, repo, issue_number: issueNumber });
                  issue = data;
                } catch (error) {
                  summaryLines.push(
                    `- Issue checklist: could not read #${issueNumber}, not counted as incomplete: ${error.message}`
                  );
                  continue;
                }
                if (issue.state !== "open") continue;
                const uncheckedCount = ((issue.body || "").match(/^\s*-\s*\[\s?\]/gim) || []).length;
                if (uncheckedCount > 0) {
                  incomplete.push({ number: issueNumber, uncheckedCount });
                }
              }
              return incomplete;
            }

            async function findCommentByMarker(issueNumber, marker) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: issueNumber,
                per_page: 100,
              });
              return comments.find((entry) => (entry.body || "").startsWith(marker)) || null;
            }

            async function upsertComment(issueNumber, marker, body) {
              const existing = await findCommentByMarker(issueNumber, marker);
              if (existing) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  body,
                });
              }
            }

            // Returns true only when the enablePullRequestAutoMerge mutation
            // itself did not throw -- every other outcome below (repository
            // policy, an already-mergeable PR, "already enabled", an
            // unstable refusal, or any unexpected error) returns false, so
            // the caller only polls for a merge (below) when this run is
            // actually the one that just armed it.
            async function armAutoMerge(pr) {
              if (pr.mergeable_state === "behind") {
                try {
                  await github.rest.pulls.updateBranch({
                    owner,
                    repo,
                    pull_number: pr.number,
                  });
                  summaryLines.push("- Branch update: requested (base moved ahead).");
                } catch (error) {
                  summaryLines.push(
                    `- Branch update: not applied, left untouched (likely a real conflict): ${error.message}`
                  );
                }
              }

              try {
                await github.graphql(
                  `mutation($id: ID!, $sha: GitObjectID!) {
                    enablePullRequestAutoMerge(input: {
                      pullRequestId: $id
                      mergeMethod: SQUASH
                      expectedHeadOid: $sha
                    }) {
                      pullRequest { id }
                    }
                  }`,
                  { id: pr.node_id, sha: pr.head.sha }
                );
                summaryLines.push(
                  `- Auto-merge: armed (squash, expected head \`${pr.head.sha}\`).`
                );
                return true;
              } catch (error) {
                const message = (error && error.message) || String(error);
                if (/auto.?merge is not allowed|auto.?merge is disabled|not enabled for this repository/i.test(message)) {
                  summaryLines.push(
                    "- Auto-merge: disabled at the repository level; nothing to arm."
                  );
                } else if (/clean status|you can merge directly|already.*(clean|mergeable)/i.test(message)) {
                  summaryLines.push(
                    "- Auto-merge: PR already in a mergeable/clean state; GitHub refused arming (expected)."
                  );
                } else if (/already.*enabled/i.test(message)) {
                  summaryLines.push("- Auto-merge: already enabled.");
                } else if (/unstable status/i.test(message)) {
                  // GitHub refuses the mutation outright on an "unstable" PR
                  // (some non-required check is red) -- it does not
                  // arm-and-wait, so nothing is pending and a later run has
                  // to re-attempt. With every lane in this workflow already
                  // inside this job's needs, our own rows cannot cause this
                  // any more; a red third-party check or a stale re-run of a
                  // sibling workflow still can. Observed verbatim on PR #219:
                  //   "Pull request Pull request is in unstable status"
                  summaryLines.push(
                    "- Auto-merge: refused while the PR is `unstable` (a non-required check outside this " +
                    "workflow's lanes is red). Nothing is armed and nothing is queued; a later run of this " +
                    "workflow re-attempts arming once the PR leaves that state."
                  );
                } else {
                  core.warning(
                    `PR Gate: unexpected error arming auto-merge for PR #${pr.number}, continuing without failing the run: ${message}`
                  );
                  summaryLines.push(
                    `- Auto-merge: unexpected error, not failing the run: ${message}`
                  );
                }
              }
              return false;
            }

            function sleep(ms) {
              return new Promise((resolve) => setTimeout(resolve, ms));
            }

            // Issue #283 root cause: GitHub Actions never fires a NEW
            // workflow run for an event caused by the job's own default
            // GITHUB_TOKEN (recursion prevention), and enabling auto-merge
            // above does exactly that -- so the #267 fallback's own `closed`
            // event never runs for the one scenario it exists to cover (an
            // auto-merge-completed PR).
            //
            // This poll is deliberately short (15 seconds, not minutes) and
            // is NOT what resolves that recursion problem for the merge THIS
            // job's own armAutoMerge call just armed -- structurally, it
            // cannot be. `pr-gate` is the SOLE required status check in this
            // repo's branch ruleset (see AGENTS.md's PR Gate table), and a
            // GitHub Actions check-run only transitions to `completed` once
            // every step of the job has finished running. Native auto-merge
            // only completes the actual merge once every required check
            // reports `completed`+`success`. So the merge armed a few lines
            // above cannot complete until THIS job's own check-run reports
            // done -- which requires this poll (and the rest of the job) to
            // finish first. A poll waiting on an event gated on its own
            // completion can never observe that event.
            //
            // This is confirmed against this repo's own history, not just
            // theory: PR #280's `PR Gate` job (run 32458751359) completed at
            // 2026-08-21T07:32:46Z; the PR's actual merge happened at
            // 2026-08-21T07:32:49Z -- three seconds AFTER the job's own
            // check concluded, not during it. PR #285 shows the same
            // pattern (armed, then merged seconds after the job had already
            // finished). The merge always follows job completion, never
            // happens while the job -- including this poll -- is still
            // running.
            //
            // So what is this poll actually for? Cheap insurance for the
            // rare case a DIFFERENT event completes the merge while this job
            // happens to still be running -- e.g. the owner manually
            // completing the merge through the GitHub UI concurrently with
            // this run. It is not, and cannot be, the primary fix for the
            // auto-merge this job itself just armed. Do NOT "fix" this
            // window back to something long thinking the short window is a
            // bug -- read this comment and PR #280's timing evidence first.
            // The documented primary mechanism is the scheduled sweep
            // (issue-close-sweep.yml, every 15 minutes), which runs
            // independently of this job's own lifecycle and so is not
            // subject to the same structural gate.
            const POLL_INTERVAL_MS = 5000;
            const POLL_MAX_ATTEMPTS = 3; // 3 * 5s = 15 seconds.

            async function pollForMergeAfterArming(pr, eligible) {
              for (let attempt = 1; attempt <= POLL_MAX_ATTEMPTS; attempt++) {
                await sleep(POLL_INTERVAL_MS);
                let polled;
                try {
                  const { data } = await github.rest.pulls.get({
                    owner,
                    repo,
                    pull_number: pr.number,
                  });
                  polled = data;
                } catch (error) {
                  core.warning(
                    `PR Gate: post-arm merge poll failed to read PR #${pr.number} (attempt ${attempt}/${POLL_MAX_ATTEMPTS}): ${error.message}`
                  );
                  continue;
                }
                if (polled.merged === true) {
                  summaryLines.push(
                    `- Issue close fallback: merge observed via post-arm poll (attempt ${attempt}/${POLL_MAX_ATTEMPTS}); running the fallback inline.`
                  );
                  await handleIssueCloseFallback(polled, eligible);
                  return;
                }
              }
              summaryLines.push(
                "- Issue close fallback: post-arm poll window (15 seconds) expired without observing a merge; the scheduled sweep is the documented primary mechanism."
              );
            }

            function deriveStatus(pr, stillDraft, holdAuthorized, checklistBlocked) {
              if (stillDraft) return "draft (owner:allow-draft honored)";
              if (holdAuthorized) return "held (owner:hold-merge honored)";
              if (pr.mergeable_state === "dirty") return "blocked: merge conflict against base";
              if (checklistBlocked) return "blocked: incomplete linked-Issue checklist";
              if (!gatesGreen) return "waiting on verification lanes";
              return "ready";
            }

            function deriveBlocker(pr, stillDraft, holdAuthorized, checklistBlocked, incompleteIssues) {
              if (holdAuthorized) return "owner:hold-merge is in effect";
              if (pr.mergeable_state === "dirty") {
                return "merge conflict against base; resolve manually, this workflow never resolves conflicts";
              }
              if (stillDraft) return "PR is a draft (owner:allow-draft honored)";
              if (checklistBlocked) {
                const names = incompleteIssues
                  .map((entry) => `#${entry.number} (${entry.uncheckedCount} unchecked)`)
                  .join(", ");
                return `incomplete checklist on ${names}; override with \`${CHECKLIST_LABEL}\` if intentional`;
              }
              if (!gatesGreen) return failedGates.join("; ");
              return "none";
            }

            // Controller/Builder both describe the same dev role
            // (agent-roles.yaml's dev.provider), read from the DEFAULT
            // branch for the same reason dev-agent-dispatch.yml's own
            // preflight does: a pull request must not be able to edit its
            // own agent-roles.yaml and claim a different dev identity for
            // itself. Falls back to "unknown" rather than throwing -- this
            // is a status comment, and an unreadable agent-roles.yaml here
            // must not turn into an orchestration error that masks the real
            // verdict (see the outer try/catch's own comment).
            async function readDevProvider() {
              try {
                const { owner, repo } = context.repo;
                const { data } = await github.rest.repos.getContent({ owner, repo, path: "agent-roles.yaml" });
                const content = Buffer.from(data.content, data.encoding).toString("utf8");
                const match = /\bdev:\s*\n(?:[^\n]*\n)*?\s*provider:\s*(\S+)/.exec(content);
                return match ? match[1].trim().toLowerCase() : "unknown";
              } catch (error) {
                core.warning(`Could not read agent-roles.yaml for the Work State comment: ${error.message}`);
                return "unknown";
              }
            }

            function buildWorkStateBody(pr, linkedIssue, stillDraft, holdAuthorized, checklistBlocked, incompleteIssues, devProvider) {
              return [
                WORK_STATE_MARKER,
                "## Work State",
                "",
                `- Issue: ${linkedIssue ? "#" + linkedIssue : "unknown"}`,
                "- Milestone: vNext",
                `- Branch: \`${pr.head.ref}\``,
                `- Base SHA: \`${pr.base.sha}\``,
                `- Current head: \`${pr.head.sha}\``,
                `- Controller: ${devProvider}`,
                `- Builder: ${devProvider}`,
                `- Pull request: #${pr.number}`,
                `- Status: ${deriveStatus(pr, stillDraft, holdAuthorized, checklistBlocked)}`,
                `- Blocker: ${deriveBlocker(pr, stillDraft, holdAuthorized, checklistBlocked, incompleteIssues)}`,
              ].join("\n");
            }

            // Declared outside the try block, like gatesGreen/failedGates,
            // so the terminal verdict below can see them even if an
            // orchestration error interrupts the try block before they are
            // computed -- the safe default (unblocked) matches this job's
            // existing "orchestration problems must never mask the verdict"
            // handling for every other check in here.
            let checklistBlocked = false;
            let incompleteIssues = [];

            try {
              // Always re-fetch: it is the only shape carrying
              // mergeable_state, and context.payload can be stale after a
              // force-push.
              const { data: pr } = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: context.payload.pull_request.number,
              });

              summaryLines.push(`### PR #${pr.number}: ${pr.title}`);

              const targetsDefaultBranch =
                Boolean(defaultBranch) && pr.base.ref === defaultBranch;
              const sameRepo = Boolean(
                pr.head &&
                  pr.head.repo &&
                  pr.base &&
                  pr.base.repo &&
                  pr.head.repo.full_name === pr.base.repo.full_name
              );
              const eligible = sameRepo && targetsDefaultBranch;

              if (isCloseEvent) {
                await handleIssueCloseFallback(pr, eligible);
              } else {
                summaryLines.push(
                  gatesGreen
                    ? "- Gates: every verification lane succeeded."
                    : `- Gates: NOT green -- ${failedGates.join(", ")}.`
                );

                // Issue #274: every linked Issue's checklist, checked
                // unconditionally -- relevance comes from whether the PR
                // links an Issue with a checklist, never from fork/base-branch
                // eligibility (a fork PR still deserves an accurate status,
                // even though it could never auto-merge regardless).
                incompleteIssues = await checkLinkedIssueChecklists(pr);
                const checklistOverrideAuthorized = await isLabelAuthorizedByOwner(
                  pr.number,
                  CHECKLIST_LABEL
                );
                if (!checklistOverrideAuthorized) {
                  await removeUnauthorizedLabel(pr, CHECKLIST_LABEL);
                }
                checklistBlocked = incompleteIssues.length > 0 && !checklistOverrideAuthorized;
                if (incompleteIssues.length > 0) {
                  const names = incompleteIssues
                    .map((entry) => `#${entry.number} (${entry.uncheckedCount} unchecked)`)
                    .join(", ");
                  summaryLines.push(
                    checklistBlocked
                      ? `- Issue checklist: NOT complete -- ${names}. Blocking. Override with \`${CHECKLIST_LABEL}\` if intentional.`
                      : `- Issue checklist: incomplete on ${names}, but \`${CHECKLIST_LABEL}\` is authorized -- not blocking.`
                  );
                }

                // Draft policy -- REST cannot un-draft a PR; GraphQL only.
                let stillDraft = Boolean(pr.draft);
                if (pr.draft) {
                  const draftAuthorized = await isLabelAuthorizedByOwner(
                    pr.number,
                    DRAFT_LABEL
                  );
                  if (!draftAuthorized) {
                    await removeUnauthorizedLabel(pr, DRAFT_LABEL);
                    try {
                      await github.graphql(
                        `mutation($id: ID!) {
                          markPullRequestReadyForReview(input: { pullRequestId: $id }) {
                            pullRequest { id }
                          }
                        }`,
                        { id: pr.node_id }
                      );
                      stillDraft = false;
                      summaryLines.push(
                        "- Draft: unauthorized draft state cleared (marked ready for review)."
                      );
                    } catch (error) {
                      core.warning(
                        `PR Gate: failed to clear unauthorized draft state on PR #${pr.number}: ${error.message}`
                      );
                      summaryLines.push(
                        `- Draft: failed to clear unauthorized draft state: ${error.message}`
                      );
                    }
                  } else {
                    summaryLines.push(
                      "- Draft: preserved (owner:allow-draft is authorized)."
                    );
                  }
                }

                // Hold policy.
                const holdAuthorized = await isLabelAuthorizedByOwner(
                  pr.number,
                  HOLD_LABEL
                );
                if (!holdAuthorized) {
                  await removeUnauthorizedLabel(pr, HOLD_LABEL);
                } else {
                  try {
                    await github.graphql(
                      `mutation($id: ID!) {
                        disablePullRequestAutoMerge(input: { pullRequestId: $id }) {
                          pullRequest { id }
                        }
                      }`,
                      { id: pr.node_id }
                    );
                    summaryLines.push(
                      "- Hold: owner:hold-merge is authorized; auto-merge disabled."
                    );
                  } catch (error) {
                    const message = (error && error.message) || String(error);
                    if (/not enabled/i.test(message)) {
                      summaryLines.push(
                        "- Hold: owner:hold-merge is authorized; auto-merge was already off."
                      );
                    } else {
                      core.warning(
                        `PR Gate: owner:hold-merge honored for PR #${pr.number} but disabling auto-merge failed: ${message}`
                      );
                      summaryLines.push(
                        `- Hold: owner:hold-merge is authorized, but disabling auto-merge failed: ${message}`
                      );
                    }
                  }
                }

                // Arming is gated on the verdict this very job is about to
                // report, so a merge can never be enabled ahead of the
                // verification it depends on.
                if (!gatesGreen) {
                  summaryLines.push(
                    "- Auto-merge: not armed -- verification did not pass."
                  );
                } else if (checklistBlocked) {
                  summaryLines.push(
                    "- Auto-merge: not armed -- an incomplete linked-Issue checklist is blocking (see above)."
                  );
                } else if (!eligible) {
                  summaryLines.push(
                    "- Eligibility: fork pull request or non-default base branch; auto-merge arming is skipped by directive -- same-repository PRs to the default branch only."
                  );
                } else if (holdAuthorized) {
                  summaryLines.push(
                    "- Auto-merge: skipped while owner:hold-merge is authorized."
                  );
                } else if (stillDraft) {
                  summaryLines.push(
                    "- Auto-merge: skipped while the PR remains a draft."
                  );
                } else {
                  const armed = await armAutoMerge(pr);
                  if (armed) {
                    await pollForMergeAfterArming(pr, eligible);
                  }
                }

                // Managed Work State comment, on the PR and its linked Issue.
                const linkedIssue = parseLinkedIssue(pr.body);
                const devProvider = await readDevProvider();
                const workStateBody = buildWorkStateBody(
                  pr,
                  linkedIssue,
                  stillDraft,
                  holdAuthorized,
                  checklistBlocked,
                  incompleteIssues,
                  devProvider
                );
                await upsertComment(pr.number, WORK_STATE_MARKER, workStateBody);
                if (linkedIssue) {
                  await upsertComment(linkedIssue, WORK_STATE_MARKER, workStateBody);
                }
              }
            } catch (error) {
              // Orchestration problems must never mask the verdict, in
              // either direction: they are logged, and the gate result
              // below is still reported from needs.* alone.
              core.error(
                `PR Gate: orchestration error, verdict unaffected: ${error.message}`
              );
              summaryLines.push(`- Orchestration error: ${error.message}`);
            } finally {
              try {
                core.summary.addHeading("PR Gate");
                core.summary.addRaw(
                  summaryLines.join("\n") || "_No actions recorded._",
                  true
                );
                await core.summary.write();
              } catch (summaryError) {
                core.warning(
                  `PR Gate: failed to write job summary: ${summaryError.message}`
                );
              }
            }

            // THE verdict. Last, so the orchestration above always runs.
            // Skipped on a close event: every lane above was deliberately
            // skipped too (see the on: block's own comment), so gatesGreen
            // reflects nothing meaningful once the PR has already merged --
            // only the issue-close fallback above ran, and it never fails
            // this job.
            if (!isCloseEvent && (!gatesGreen || checklistBlocked)) {
              const reasons = [];
              if (!gatesGreen) {
                reasons.push(`one or more verification lanes did not succeed: ${failedGates.join(", ")}`);
              }
              if (checklistBlocked) {
                const names = incompleteIssues
                  .map((entry) => `#${entry.number} (${entry.uncheckedCount} unchecked)`)
                  .join(", ");
                reasons.push(
                  `linked Issue checklist incomplete on ${names} (override with the \`${CHECKLIST_LABEL}\` label if intentional)`
                );
              }
              core.setFailed(`${reasons.join("; ")}. See the individual lane rows and this job's summary.`);
            }
