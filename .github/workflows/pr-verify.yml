name: "PR Verification"

# THE single entry point for every PR-time verification gate AND for merge
# orchestration. There is no second workflow on pull requests any more --
# merge-policy.yml was deleted and its behavior lives in "Verify: All
# Gates" below.
#
# EVERY job here is a NATIVE job whose name starts with "Verify: ", and each
# produces exactly ONE check row with that exact bare name. That is
# deliberate and load-bearing:
#
#   * A required status check is matched by its literal reported name. A
#     workflow_call-invoked job is ALWAYS reported as
#     "<caller job name> / <callee job name>", so a bare name typed into the
#     ruleset would silently create a required check that NEVER reports and
#     blocks every PR forever (AGENTS.md > PR Gate and merge behavior; the
#     PR #118/#120 incident).
#   * So nothing here uses workflow_call. The real work lives in composite
#     actions under .github/actions/, which run INSIDE the calling job and
#     therefore add no rows of their own. Those same composite actions are
#     reused by the standalone workflow files (secret-scan.yml,
#     repo-policy.yml, template-lint.yml, toolbelt-ci.yml, acc-ci.yml,
#     brain-ci.yml, shell-ci.yml, lifeos-ci.yml, llm-review.yml) for their
#     own merge_group/push/workflow_dispatch triggers, so every check has
#     exactly one source of logic despite two trigger paths.
#
# ONE CHECK ROW PER JOB is a GitHub invariant with no suppression
# mechanism, so the ONLY way to shorten the PR checks list is to run fewer
# jobs. That is why the five Linux suites and every repo-wide conformance
# check share ONE job here rather than running in parallel: four rows total
# instead of ten. The cost is real and was accepted deliberately -- measured
# on PR #205 (a CI change, so every suite ran for real), the parallel shape
# finished in 8.0 min and the sum of the same work is 17.3 min. Wall-clock
# roughly doubles; the checks list drops from ten rows to four.
#
# ACC's Windows suite CANNOT join the Linux job -- one job runs on one
# runner image -- so it stays its own row. That is a platform constraint,
# not a choice. It runs its own change detection (via the shared
# detect-changes action) rather than consuming a Linux job output, so it
# still runs in parallel instead of waiting ~16 min to learn whether ACC
# was even touched.
#
# The rows, in order:
#   1. Verify: Tests (Linux)   -- every repo-wide conformance check (which
#                                 apps changed, leaked-secret scan, repo
#                                 structure, PR description, lint) followed
#                                 by the five Linux app suites, each still
#                                 skipped in seconds when its app was not
#                                 touched. Fail-fast ordering is preserved:
#                                 a failing step stops the job, so nothing
#                                 below runs on a PR with a leaked secret.
#   1. Verify: Tests (Windows) -- ACC's PowerShell/native suites, parallel
#                                 with the Linux job.
#   2. Verify: LLM Review      -- needs both test jobs, so no reviewer
#                                 tokens are spent on a PR that would fail
#                                 anything else. NOT required, and it fails
#                                 closed while reviewer credentials are
#                                 unprovisioned.
#   3. Verify: All Gates       -- needs both test jobs, if: always() so it
#                                 still reports when one failed. THE only
#                                 required check, and the only place merge
#                                 is armed. See its own header comment.
#
# No paths: filter anywhere in this file, deliberately. Path scoping is done
# INSIDE the jobs via the detect-changes action, precisely so every required
# check still reports on every PR.
#
# Every checkout below pins ref: to the PR's head SHA. Without that, a
# pull_request-triggered checkout defaults to GitHub's synthetic merge ref
# (head merged onto whatever main currently points to), which can drift
# ahead of the base.sha every diff-scoped gate (detect-changes,
# verify-secrets, verify-repo-policy, verify-tests-acc, verify-llm-review)
# diffs against on a re-trigger with no new push (labeled/edited/etc.).
# That only ever widens the diff those gates see -- base.sha stays an
# ancestor of the merge commit, so it can produce a false-positive
# "relevant" verdict, never a false negative -- but it also meant the tree
# actually tested was not exactly the PR head, contradicting the "Confirm
# tested SHA matches the live PR head" check below. Pinning ref: fixes both
# (Issue #224).

# EVERY event listed here now costs a full pipeline run -- roughly 16 minutes
# when a change makes all five Linux suites relevant. That is a real
# regression from the shape that preceded it, and it is deliberate: the
# draft/label/auto-merge events used to be handled by merge-policy.yml's
# separate pull_request_target job in about five seconds, and absorbing that
# job into Verify: All Gates is what removed a permanent check row. Those
# events have to stay, because All Gates is now the only thing that enforces
# owner:hold-merge, clears an unauthorized draft, and re-arms auto-merge when
# it is switched off -- none of which can happen if the workflow never runs.
#
# concurrency below (cancel-in-progress) keeps the damage bounded: relabelling
# or re-editing in quick succession cancels the superseded run rather than
# queueing another. Do not add an event here without weighing that same cost.
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
      - edited
      - labeled
      - unlabeled
      - auto_merge_disabled

# Read-only by default. "Verify: All Gates" raises its own permissions to
# what merge orchestration needs; no job that executes pull-request-authored
# code ever holds a write token.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # =====================================================================
  # 1. Verify: Tests (Linux) -- conformance + every Linux app suite
  # =====================================================================
  verify-tests-linux:
    name: "Verify: Tests (Linux)"
    runs-on: ubuntu-latest
    # Generous on purpose: this is the sum of what used to be six jobs
    # (measured ~16 min when every suite runs for real), and the previous
    # per-job timeouts summed to 175. A hang should fail, not run for an
    # hour and a half, but a slow-but-healthy full run must not be killed.
    timeout-minutes: 90
    steps:
      # One checkout for every composite action below -- none of them
      # checks out on its own, precisely so this job does it once.
      # fetch-depth: 0 because change detection needs the base commit, the
      # secret scan needs the commit range, and the whitespace check needs
      # history back to the base commit.
      - name: Setup · Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Detect · Which apps does this change touch?
        id: detect
        uses: ./.github/actions/detect-changes
        with:
          base_sha: ${{ github.event.pull_request.base.sha }}

      # --- repo-wide conformance, fail-fast, cheapest first --------------
      - name: Standards · Secrets
        uses: ./.github/actions/verify-secrets
        with:
          base_sha: ${{ github.event.pull_request.base.sha }}
          head_sha: ${{ github.event.pull_request.head.sha }}

      - name: Standards · Repo policy
        uses: ./.github/actions/verify-repo-policy
        with:
          base_sha: ${{ github.event.pull_request.base.sha }}

      - name: Standards · PR description
        uses: ./.github/actions/verify-pr-description
        with:
          pr_number: ${{ github.event.pull_request.number }}
          github_token: ${{ github.token }}

      - name: Standards · Linting
        if: steps.detect.outputs.lifeos == 'true'
        uses: ./.github/actions/verify-linting

      - name: Standards · Linting not applicable to this change
        if: steps.detect.outputs.lifeos != 'true'
        shell: bash
        run: echo "LifeOS was not touched by this change, and it is the only app with a lint command configured; nothing to lint."

      - name: Standards · Confirm tested SHA matches the live PR head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TESTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          live_sha="$(curl --fail --silent \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/pulls/${PR_NUMBER}" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["head"]["sha"])')"
          if [ "${live_sha}" != "${TESTED_SHA}" ]; then
            echo "Tested SHA (${TESTED_SHA}) no longer matches the live PR head (${live_sha})." >&2
            exit 1
          fi
          echo "Tested SHA matches the live PR head (${TESTED_SHA})."

      # --- the Linux app suites -----------------------------------------
      # Each still skips in seconds when its app was not touched; merging
      # the jobs did not merge the relevance decisions.
      - name: Tests · Toolbelt
        if: steps.detect.outputs.toolbelt == 'true'
        uses: ./.github/actions/verify-tests-toolbelt
        with:
          owner_refresh_token: ${{ secrets.TOOLBELT_OWNER_REFRESH_TOKEN }}

      - name: Tests · Toolbelt not applicable to this change
        if: steps.detect.outputs.toolbelt != 'true'
        shell: bash
        run: echo "Toolbelt was not touched by this change; nothing to verify."

      - name: Tests · ACC (Linux suites)
        if: steps.detect.outputs.acc == 'true'
        uses: ./.github/actions/verify-tests-acc
        with:
          base_sha: ${{ github.event.pull_request.base.sha }}

      - name: Tests · ACC not applicable to this change
        if: steps.detect.outputs.acc != 'true'
        shell: bash
        run: echo "ACC was not touched by this change; nothing to verify."

      - name: Tests · Brain
        if: steps.detect.outputs.brain == 'true'
        uses: ./.github/actions/verify-tests-brain

      - name: Tests · Brain not applicable to this change
        if: steps.detect.outputs.brain != 'true'
        shell: bash
        run: echo "Brain was not touched by this change; nothing to verify."

      - name: Tests · Shell
        if: steps.detect.outputs.shell == 'true'
        uses: ./.github/actions/verify-tests-shell

      - name: Tests · Shell not applicable to this change
        if: steps.detect.outputs.shell != 'true'
        shell: bash
        run: echo "Shell was not touched by this change; nothing to verify."

      # LifeOS is LAST on purpose, and this step is why. Its suite runs its
      # own Postgres in Docker bound to host port 5432, while the Toolbelt
      # and Shell suites above use the runner's SYSTEM postgresql service on
      # that same port. As separate jobs they never met; in one job the
      # container fails to bind with "port is already allocated" unless the
      # service is stopped first. Nothing after this step needs the system
      # service, so stopping it here is safe, and `|| true` keeps it a no-op
      # on a PR where neither earlier suite ever started it.
      - name: Tests · Free port 5432 for LifeOS's own Postgres container
        if: steps.detect.outputs.lifeos == 'true'
        shell: bash
        run: sudo systemctl stop postgresql.service || true

      - name: Tests · LifeOS
        if: steps.detect.outputs.lifeos == 'true'
        uses: ./.github/actions/verify-tests-lifeos

      - name: Tests · LifeOS not applicable to this change
        if: steps.detect.outputs.lifeos != 'true'
        shell: bash
        run: echo "LifeOS was not touched by this change; nothing to verify."

  # =====================================================================
  # 1. Verify: Tests (Windows) -- ACC's windows-latest suites
  # =====================================================================
  # A separate row because one job cannot span two runner images. It runs
  # its own detect-changes rather than depending on the Linux job, so it
  # stays parallel instead of idling ~16 min for an output.
  verify-tests-windows:
    name: "Verify: Tests (Windows)"
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Setup · Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Detect · Which apps does this change touch?
        id: detect
        uses: ./.github/actions/detect-changes
        with:
          base_sha: ${{ github.event.pull_request.base.sha }}

      - name: Tests · ACC (Windows suites)
        if: steps.detect.outputs.acc == 'true'
        uses: ./.github/actions/verify-tests-acc-windows

      - name: Tests · Not applicable to this change
        if: steps.detect.outputs.acc != 'true'
        shell: bash
        run: echo "ACC was not touched by this change; nothing to verify."

  # =====================================================================
  # 2. Verify: LLM Review (non-required)
  # =====================================================================
  verify-llm-review:
    name: "Verify: LLM Review"
    needs: [verify-tests-linux, verify-tests-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    steps:
      - name: Setup · Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/verify-llm-review
        with:
          pr_number: ${{ github.event.pull_request.number }}
          base_sha: ${{ github.event.pull_request.base.sha }}
          head_sha: ${{ github.event.pull_request.head.sha }}
          github_token: ${{ github.token }}
          infisical_identity_id: ${{ vars.INFISICAL_REVIEW_IDENTITY_ID }}
          infisical_project_slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          review_provider: ${{ vars.REVIEW_PROVIDER }}
          review_model: ${{ vars.REVIEW_MODEL }}
          review_builder_provider: ${{ vars.REVIEW_BUILDER_PROVIDER }}

  # =====================================================================
  # 3. Verify: All Gates -- the single required check AND merge orchestration
  # =====================================================================
  # This job replaces the deleted merge-policy.yml entirely. It is both:
  #
  #   (a) the rollup gate -- it fails unless every verification job above
  #       succeeded, and it is the ONLY name in the branch ruleset's
  #       required-status-checks list. One name instead of many is one
  #       fewer thing to drift out of sync with this file, which is the
  #       exact failure mode that stranded PRs #118, #120 and #160 on stale
  #       required-check lists.
  #
  #   (b) the merge orchestrator -- it maintains the managed Work State /
  #       Evidence Index comments, enforces owner:hold-merge and
  #       owner:allow-draft, and arms native squash auto-merge. Arming now
  #       happens HERE, structurally after every gate has already
  #       succeeded, rather than in a pull_request_target workflow that
  #       fired immediately on push and had to re-read check conclusions
  #       from the API to find out whether verification had even run.
  #       "The last gate finishing is the only thing that can enable a
  #       merge" is now true by construction.
  #
  # Verify: LLM Review is deliberately NOT in needs: -- it is not required
  # and fails closed while reviewer credentials are unprovisioned, so
  # depending on it would make this required check permanently red. NOTE:
  # while that row is red the pull request stays "unstable", and GitHub's
  # own auto-merge does not fire on an unstable pull request even when
  # every required check passes. Auto-merge therefore begins working the
  # moment LLM Review stops reporting failure; until then this job still
  # arms it and the arming simply waits.
  #
  # This job raises its own permissions to write and deliberately performs
  # NO checkout and runs NO shell script over repository content: the only
  # thing it executes is actions/github-script against context.payload and
  # API responses. Keep it that way -- it is the one job in this workflow
  # holding a write token, and the sibling jobs that DO execute
  # pull-request-authored code hold only the read-only workflow default.
  verify-all-gates:
    name: "Verify: All Gates"
    needs: [verify-tests-linux, verify-tests-windows]
    # always(), not the default: the default skips this job the moment a
    # needs: job fails, which would leave THIS row -- the one row the
    # ruleset actually requires -- permanently absent on exactly the pull
    # requests that most need it to report failure.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Gates · Reconcile merge state and report the rollup verdict
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          GATE_RESULTS: ${{ toJSON(needs) }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const ownerLogin =
              (context.payload.repository &&
                context.payload.repository.owner &&
                context.payload.repository.owner.login) ||
              null;
            const defaultBranch =
              (context.payload.repository &&
                context.payload.repository.default_branch) ||
              null;

            const WORK_STATE_MARKER =
              "<!-- agent-engineering-standard:work-state:v1 -->";
            const DRAFT_LABEL = "owner:allow-draft";
            const HOLD_LABEL = "owner:hold-merge";

            const summaryLines = [];

            // The verdict comes straight from this workflow's own needs
            // context -- no check-runs API round trip, no name matching,
            // and nothing to keep in sync with a list elsewhere. A job
            // that stops reporting turns this red rather than silently
            // counting as a pass, because anything that is not exactly
            // "success" fails the gate.
            // The jobs this gate exists to roll up. Naming them explicitly is
            // what makes an EMPTY or truncated needs payload fail closed: a
            // bare "nothing failed" test over an empty object is vacuously
            // true, so a needs: list that was edited away, or a GATE_RESULTS
            // that arrived empty, would report GREEN and arm a merge having
            // verified nothing at all. Measured: with GATE_RESULTS="{}" the
            // unguarded form armed auto-merge and passed. Keep this list in
            // step with the job ids above -- a job present here but missing
            // from needs: fails the gate rather than being skipped silently.
            const EXPECTED_GATE_JOBS = ["verify-tests-linux", "verify-tests-windows"];

            let gateResults;
            try {
              gateResults = JSON.parse(process.env.GATE_RESULTS || "");
            } catch (parseError) {
              gateResults = null;
            }

            const failedGates = [];
            if (!gateResults || typeof gateResults !== "object") {
              failedGates.push("needs payload was missing or unparseable");
            } else {
              for (const jobId of EXPECTED_GATE_JOBS) {
                const value = gateResults[jobId];
                if (!value) failedGates.push(`${jobId} (absent from needs)`);
                else if (value.result !== "success") failedGates.push(`${jobId} (${value.result || "no result"})`);
              }
              // Anything else that IS present must also have succeeded, so a
              // newly added dependency cannot pass unnoticed by this list.
              for (const [jobId, value] of Object.entries(gateResults)) {
                if (EXPECTED_GATE_JOBS.includes(jobId)) continue;
                if ((value || {}).result !== "success") {
                  failedGates.push(`${jobId} (${(value || {}).result || "no result"})`);
                }
              }
            }
            const gatesGreen = failedGates.length === 0;

            // Mirrors the pinned standard's owner_label_authorized exactly: walk
            // timeline events in chronological order and track whether the label
            // is currently trustworthy. A "labeled" event for the target label
            // sets authorization to (actor === ownerLogin); an "unlabeled" event
            // for the same label always clears it.
            function ownerLabelAuthorized(events, label, ownerLoginValue) {
              let authorized = false;
              for (const event of events) {
                const labelObj = event.label || {};
                const name = labelObj.name || event.label_name;
                if (name !== label) continue;
                if (event.event === "labeled") {
                  const actor = event.actor || {};
                  const login = actor.login || event.actor_login;
                  authorized = login === ownerLoginValue;
                } else if (event.event === "unlabeled") {
                  authorized = false;
                }
              }
              return authorized;
            }

            async function isLabelAuthorizedByOwner(prNumber, label) {
              if (!ownerLogin) return false;
              const events = await github.paginate(
                github.rest.issues.listEventsForTimeline,
                { owner, repo, issue_number: prNumber, per_page: 100 }
              );
              return ownerLabelAuthorized(events, label, ownerLogin);
            }

            function hasLabel(pr, label) {
              return (pr.labels || []).some((entry) => entry && entry.name === label);
            }

            async function removeUnauthorizedLabel(pr, label) {
              if (!hasLabel(pr, label)) return;
              try {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: pr.number,
                  name: label,
                });
                summaryLines.push(
                  `- Label \`${label}\`: present without owner provenance; removed (no public comment, per AGENTS.md).`
                );
              } catch (error) {
                summaryLines.push(
                  `- Label \`${label}\`: present without owner provenance; could not be removed: ${error.message}`
                );
              }
            }

            function parseLinkedIssue(body) {
              const match = /^closes\s+#(\d+)/im.exec(body || "");
              return match ? Number(match[1]) : null;
            }

            async function findCommentByMarker(issueNumber, marker) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: issueNumber,
                per_page: 100,
              });
              return comments.find((entry) => (entry.body || "").startsWith(marker)) || null;
            }

            async function upsertComment(issueNumber, marker, body) {
              const existing = await findCommentByMarker(issueNumber, marker);
              if (existing) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  body,
                });
              }
            }

            async function armAutoMerge(pr) {
              if (pr.mergeable_state === "behind") {
                try {
                  await github.rest.pulls.updateBranch({
                    owner,
                    repo,
                    pull_number: pr.number,
                  });
                  summaryLines.push("- Branch update: requested (base moved ahead).");
                } catch (error) {
                  summaryLines.push(
                    `- Branch update: not applied, left untouched (likely a real conflict): ${error.message}`
                  );
                }
              }

              try {
                await github.graphql(
                  `mutation($id: ID!, $sha: GitObjectID!) {
                    enablePullRequestAutoMerge(input: {
                      pullRequestId: $id
                      mergeMethod: SQUASH
                      expectedHeadOid: $sha
                    }) {
                      pullRequest { id }
                    }
                  }`,
                  { id: pr.node_id, sha: pr.head.sha }
                );
                summaryLines.push(
                  `- Auto-merge: armed (squash, expected head \`${pr.head.sha}\`).`
                );
              } catch (error) {
                const message = (error && error.message) || String(error);
                if (/auto.?merge is not allowed|auto.?merge is disabled|not enabled for this repository/i.test(message)) {
                  summaryLines.push(
                    "- Auto-merge: disabled at the repository level; nothing to arm."
                  );
                } else if (/clean status|you can merge directly|already.*(clean|mergeable)/i.test(message)) {
                  summaryLines.push(
                    "- Auto-merge: PR already in a mergeable/clean state; GitHub refused arming (expected)."
                  );
                } else if (/already.*enabled/i.test(message)) {
                  summaryLines.push("- Auto-merge: already enabled.");
                } else if (/unstable status/i.test(message)) {
                  // The steady state while Verify: LLM Review reports failure,
                  // NOT an anomaly. GitHub refuses the mutation outright on an
                  // unstable PR -- it does not arm-and-wait -- so nothing is
                  // pending and a later run has to re-attempt this once the PR
                  // leaves unstable. Observed verbatim on PR #219:
                  //   "Pull request Pull request is in unstable status"
                  summaryLines.push(
                    "- Auto-merge: refused while the PR is `unstable` (a non-required check is red, " +
                    "normally `Verify: LLM Review`). Nothing is armed and nothing is queued; a later " +
                    "run of this workflow re-attempts arming once the PR leaves that state."
                  );
                } else {
                  core.warning(
                    `All Gates: unexpected error arming auto-merge for PR #${pr.number}, continuing without failing the run: ${message}`
                  );
                  summaryLines.push(
                    `- Auto-merge: unexpected error, not failing the run: ${message}`
                  );
                }
              }
            }

            function deriveStatus(pr, stillDraft, holdAuthorized) {
              if (stillDraft) return "draft (owner:allow-draft honored)";
              if (holdAuthorized) return "held (owner:hold-merge honored)";
              if (pr.mergeable_state === "dirty") return "blocked: merge conflict against base";
              if (!gatesGreen) return "waiting on Verify: * gates";
              return "ready";
            }

            function deriveBlocker(pr, stillDraft, holdAuthorized) {
              if (holdAuthorized) return "owner:hold-merge is in effect";
              if (pr.mergeable_state === "dirty") {
                return "merge conflict against base; resolve manually, this workflow never resolves conflicts";
              }
              if (stillDraft) return "PR is a draft (owner:allow-draft honored)";
              if (!gatesGreen) return failedGates.join("; ");
              return "none";
            }

            function buildWorkStateBody(pr, linkedIssue, stillDraft, holdAuthorized) {
              return [
                WORK_STATE_MARKER,
                "## Work State",
                "",
                `- Issue: ${linkedIssue ? "#" + linkedIssue : "unknown"}`,
                "- Milestone: vNext",
                `- Branch: \`${pr.head.ref}\``,
                `- Base SHA: \`${pr.base.sha}\``,
                `- Current head: \`${pr.head.sha}\``,
                "- Controller: anthropic",
                "- Builder: anthropic",
                `- Pull request: #${pr.number}`,
                `- Status: ${deriveStatus(pr, stillDraft, holdAuthorized)}`,
                `- Blocker: ${deriveBlocker(pr, stillDraft, holdAuthorized)}`,
              ].join("\n");
            }

            try {
              // Always re-fetch: it is the only shape carrying
              // mergeable_state, and context.payload can be stale after a
              // force-push.
              const { data: pr } = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: context.payload.pull_request.number,
              });

              summaryLines.push(`### PR #${pr.number}: ${pr.title}`);
              summaryLines.push(
                gatesGreen
                  ? "- Gates: every verification job succeeded."
                  : `- Gates: NOT green -- ${failedGates.join(", ")}.`
              );

              const targetsDefaultBranch =
                Boolean(defaultBranch) && pr.base.ref === defaultBranch;
              const sameRepo = Boolean(
                pr.head &&
                  pr.head.repo &&
                  pr.base &&
                  pr.base.repo &&
                  pr.head.repo.full_name === pr.base.repo.full_name
              );
              const eligible = sameRepo && targetsDefaultBranch;

              // Draft policy -- REST cannot un-draft a PR; GraphQL only.
              let stillDraft = Boolean(pr.draft);
              if (pr.draft) {
                const draftAuthorized = await isLabelAuthorizedByOwner(
                  pr.number,
                  DRAFT_LABEL
                );
                if (!draftAuthorized) {
                  await removeUnauthorizedLabel(pr, DRAFT_LABEL);
                  try {
                    await github.graphql(
                      `mutation($id: ID!) {
                        markPullRequestReadyForReview(input: { pullRequestId: $id }) {
                          pullRequest { id }
                        }
                      }`,
                      { id: pr.node_id }
                    );
                    stillDraft = false;
                    summaryLines.push(
                      "- Draft: unauthorized draft state cleared (marked ready for review)."
                    );
                  } catch (error) {
                    core.warning(
                      `All Gates: failed to clear unauthorized draft state on PR #${pr.number}: ${error.message}`
                    );
                    summaryLines.push(
                      `- Draft: failed to clear unauthorized draft state: ${error.message}`
                    );
                  }
                } else {
                  summaryLines.push(
                    "- Draft: preserved (owner:allow-draft is authorized)."
                  );
                }
              }

              // Hold policy.
              const holdAuthorized = await isLabelAuthorizedByOwner(
                pr.number,
                HOLD_LABEL
              );
              if (!holdAuthorized) {
                await removeUnauthorizedLabel(pr, HOLD_LABEL);
              } else {
                try {
                  await github.graphql(
                    `mutation($id: ID!) {
                      disablePullRequestAutoMerge(input: { pullRequestId: $id }) {
                        pullRequest { id }
                      }
                    }`,
                    { id: pr.node_id }
                  );
                  summaryLines.push(
                    "- Hold: owner:hold-merge is authorized; auto-merge disabled."
                  );
                } catch (error) {
                  const message = (error && error.message) || String(error);
                  if (/not enabled/i.test(message)) {
                    summaryLines.push(
                      "- Hold: owner:hold-merge is authorized; auto-merge was already off."
                    );
                  } else {
                    core.warning(
                      `All Gates: owner:hold-merge honored for PR #${pr.number} but disabling auto-merge failed: ${message}`
                    );
                    summaryLines.push(
                      `- Hold: owner:hold-merge is authorized, but disabling auto-merge failed: ${message}`
                    );
                  }
                }
              }

              // Arming is gated on the verdict this very job is about to
              // report, so a merge can never be enabled ahead of the
              // verification it depends on.
              if (!gatesGreen) {
                summaryLines.push(
                  "- Auto-merge: not armed -- verification did not pass."
                );
              } else if (!eligible) {
                summaryLines.push(
                  "- Eligibility: fork pull request or non-default base branch; auto-merge arming is skipped by directive -- same-repository PRs to the default branch only."
                );
              } else if (holdAuthorized) {
                summaryLines.push(
                  "- Auto-merge: skipped while owner:hold-merge is authorized."
                );
              } else if (stillDraft) {
                summaryLines.push(
                  "- Auto-merge: skipped while the PR remains a draft."
                );
              } else {
                await armAutoMerge(pr);
              }

              // Managed Work State comment, on the PR and its linked Issue.
              const linkedIssue = parseLinkedIssue(pr.body);
              const workStateBody = buildWorkStateBody(
                pr,
                linkedIssue,
                stillDraft,
                holdAuthorized
              );
              await upsertComment(pr.number, WORK_STATE_MARKER, workStateBody);
              if (linkedIssue) {
                await upsertComment(linkedIssue, WORK_STATE_MARKER, workStateBody);
              }
            } catch (error) {
              // Orchestration problems must never mask the verdict, in
              // either direction: they are logged, and the gate result
              // below is still reported from needs.* alone.
              core.error(
                `All Gates: orchestration error, verdict unaffected: ${error.message}`
              );
              summaryLines.push(`- Orchestration error: ${error.message}`);
            } finally {
              try {
                core.summary.addHeading("Verify: All Gates");
                core.summary.addRaw(
                  summaryLines.join("\n") || "_No actions recorded._",
                  true
                );
                await core.summary.write();
              } catch (summaryError) {
                core.warning(
                  `All Gates: failed to write job summary: ${summaryError.message}`
                );
              }
            }

            // THE verdict. Last, so the orchestration above always runs.
            if (!gatesGreen) {
              core.setFailed(
                `One or more required gates did not succeed: ${failedGates.join(", ")}. See the individual Verify: * rows on this PR.`
              );
            }
