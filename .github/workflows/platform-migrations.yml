name: Platform Migrations

# Applies the platform project's (Supabase woltgcggxaehtuypkxqk) migrations.
# Not a PR check: invoked by deploy.yml (workflow_call, added in a later
# milestone) or manually (workflow_dispatch, used for the one-time ledger
# baseline). PR-side validation of these same migration directories runs as
# a step inside toolbelt-ci.yml instead, via scripts/validate-migrations.mjs.
#
# All source directories share one physical database and one global Supabase
# migration ledger. CI therefore stages every forward migration into one
# version-sorted tree and performs one push. Paired `_down.sql` files remain in
# their owning source directories for review/rollback but never enter the CLI's
# forward-migration directory.

on:
  workflow_call:
    inputs:
      baseline_legacy_ledger:
        description: Confirm the reviewed one-time live-schema baseline before applying newer migrations.
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      baseline_legacy_ledger:
        description: Confirm the reviewed one-time live-schema baseline before applying newer migrations.
        required: true
        type: boolean
        default: false

concurrency:
  group: toolbelt-db
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  migrate:
    name: Apply platform migrations
    runs-on: ubuntu-latest
    environment: platform-migrations-production
    timeout-minutes: 20
    env:
      PGCONNECT_TIMEOUT: "15"
      GH_TOKEN: ${{ github.token }}
    outputs:
      fully_migrated: ${{ steps.outcome.outputs.fully_migrated }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse a stale or non-main deployment ref
        shell: bash
        run: |
          set -euo pipefail
          current_main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [ "${GITHUB_REF}" != "refs/heads/main" ] || [ "${GITHUB_SHA}" != "$current_main_sha" ]; then
            echo "Refusing database mutation from ${GITHUB_REF}@${GITHUB_SHA}; current main is ${current_main_sha}." >&2
            exit 1
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/toolbelt/package-lock.json

      - name: Install migration-validator dependencies
        run: npm ci --prefix apps/toolbelt --workspaces=false

      - name: Validate migration directories
        run: |
          node apps/toolbelt/scripts/validate-migrations.mjs
          node apps/toolbelt/scripts/stage-migrations.mjs \
            "${RUNNER_TEMP}/platform-migrations"

      - uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_PLATFORM_MIGRATIONS_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          secret-path: "/platform/"
          domain: https://app.infisical.com

      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          version: 2.114.0

      - name: Assert the pinned Supabase CLI version
        run: test "$(supabase --version)" = "2.114.0"

      - name: Verify database credentials
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "SUPABASE_DB_URL was not supplied by Infisical." >&2
            exit 1
          fi

      - name: Inspect the global migration ledger
        id: ledger
        working-directory: ${{ runner.temp }}/platform-migrations
        shell: bash
        run: |
          set -euo pipefail
          ledger_file="${RUNNER_TEMP}/remote-platform-ledger-versions"
          ledger_exists="$(psql "$SUPABASE_DB_URL" -X --no-psqlrc \
            --set=ON_ERROR_STOP=1 --tuples-only --no-align \
            --command="select to_regclass('supabase_migrations.schema_migrations') is not null")"
          if [ "$ledger_exists" = "t" ]; then
            psql "$SUPABASE_DB_URL" -X --no-psqlrc \
              --set=ON_ERROR_STOP=1 --tuples-only --no-align \
              --command="select version::text from supabase_migrations.schema_migrations order by version::text" \
              > "$ledger_file"
          elif [ "$ledger_exists" = "f" ]; then
            : > "$ledger_file"
          else
            echo "Could not determine whether the remote migration ledger exists." >&2
            exit 1
          fi
          if grep -Ev '^$|^[0-9]{14}$' "$ledger_file" | grep -q .; then
            echo "The remote ledger contains a malformed version." >&2
            cat "$ledger_file" >&2
            exit 1
          fi
          ledger_count="$(grep -Ec '^[0-9]{14}$' "$ledger_file" || true)"
          echo "count=${ledger_count}" >> "$GITHUB_OUTPUT"

      # Legacy adoption is deliberately a separate, explicit mode. The 18
      # migrations listed here were applied before the Supabase CLI ledger was
      # adopted. Marking anything as applied is metadata mutation, so require
      # an exact reviewed prefix, a schema diff, and non-schema assertions.
      # Any exact prefix through S1 is restartable; a divergent ledger fails.
      # This mode then applies only the additive S1 platform/test bootstrap and
      # stops. The operator configures the owner (S2) before a normal run is
      # allowed to apply the owner-pinned migrations (S4+).
      - name: Build and verify the legacy schema baseline
        if: inputs.baseline_legacy_ledger
        shell: bash
        run: |
          set -euo pipefail
          legacy_dir="${RUNNER_TEMP}/platform-legacy-baseline"
          full_dir="${RUNNER_TEMP}/platform-migrations"
          legacy_versions="${RUNNER_TEMP}/platform-legacy-versions"
          find "${full_dir}/supabase/migrations" -maxdepth 1 -type f -name '*.sql' -printf '%f\n' \
            | sed 's/_.*//' | sort -u | head -n 18 > "$legacy_versions"
          node "${GITHUB_WORKSPACE}/apps/toolbelt/scripts/stage-migrations.mjs" \
            "${legacy_dir}" --subset-file "$legacy_versions"
          reference_dir="${RUNNER_TEMP}/platform-baseline-reference"
          node "${GITHUB_WORKSPACE}/apps/toolbelt/scripts/stage-migrations.mjs" \
            "${reference_dir}" --stop-before-owner-dependency
          mapfile -t expected_versions < <(
            find "${reference_dir}/supabase/migrations" -maxdepth 1 -type f -name '*.sql' -printf '%f\n' \
              | sed 's/_.*//' | sort -u
          )
          mapfile -t remote_versions < "${RUNNER_TEMP}/remote-platform-ledger-versions"
          if [ "${#expected_versions[@]}" -ne 20 ] || [ "${#remote_versions[@]}" -gt 20 ]; then
            echo "Expected an exact prefix of the reviewed 20-version S1 ledger." >&2
            exit 1
          fi
          for index in "${!remote_versions[@]}"; do
            if [ "${remote_versions[$index]}" != "${expected_versions[$index]}" ]; then
              echo "Remote ledger diverges at position $index: expected ${expected_versions[$index]}, found ${remote_versions[$index]}." >&2
              exit 1
            fi
          done
          diff_file="${RUNNER_TEMP}/platform-legacy-schema.diff.sql"
          set +e
          (
            cd "$legacy_dir"
            supabase init --force >&2
            supabase db diff --db-url "$SUPABASE_DB_URL" \
              --schema core,idea,prompt --use-migra
          ) > "$diff_file"
          diff_status=$?
          set -e
          if [ "$diff_status" -ne 0 ]; then
            echo "The live-schema diff command failed; the ledger was not changed." >&2
            exit "$diff_status"
          fi
          if grep -Ev '^[[:space:]]*(--.*)?$' "$diff_file" | grep -q .; then
            echo "The live schema differs from the 18-migration baseline; the ledger was not changed." >&2
            cat "$diff_file"
            exit 1
          fi
          mapfile -t legacy_versions < <(
            find "${legacy_dir}/supabase/migrations" -maxdepth 1 -type f -name '*.sql' -printf '%f\n' \
              | sed 's/_.*//' | sort -u
          )
          if [ "${#legacy_versions[@]}" -ne 18 ]; then
            echo "Expected exactly 18 legacy migration versions; found ${#legacy_versions[@]}." >&2
            exit 1
          fi

          # Schema diff cannot prove seed rows, status transitions, grants,
          # extensions, or scheduled jobs. Assert every legacy DML/non-schema
          # effect before certifying migration versions as applied.
          psql "$SUPABASE_DB_URL" -X --no-psqlrc --set=ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare
            v_seed_ids text[] := array[
              'optimize-metrics','constraint-finder','cost-per-outcome-tracker','decision-journal-outcome-scoring',
              'step-back','assumption-ledger','autonomy-trust-calibrator','prompt-organizer','instruction-optimizer',
              'prompt-agent-regression-tracker','llm-to-rules-based-transition','reformat-code-context-for-llm-readability',
              'context-rot-detector','tool-optimizer-connect-lite','agent-provenance-graph','autonomous-optimizer',
              'workflow-time-lag-analyzer','promo-optimizer','optimize-life','self-correcting-code','tiered-error-logging',
              'idea-generator','golden-goose','right-under-my-nose','break-it-down-reduce-complexity','unconstrained-solver',
              'personal-correlation-engine','learn-xyz-app','cognitive-load-balancer','consistency-engine',
              'knowledge-half-life-tracker','reverse-requirements-extractor','timing-opportunity-scanner'
            ];
          begin
            if (select count(*) from idea.idea where id = any(v_seed_ids)) <> 33 then
              raise exception 'legacy baseline is missing one or more of the 33 reviewed idea seeds';
            end if;
            if (
              select md5(string_agg(
                concat_ws(chr(31), id, name, category, one_liner, status, project, schema_name),
                chr(30) order by id
              ))
              from idea.idea where id = any(v_seed_ids)
            ) <> 'b85f04b5ad56e481f57854fa033c4dc9' then
              raise exception 'legacy idea seed payloads differ from the reviewed final values';
            end if;
            if not exists (select 1 from idea.idea where id = 'prompt-organizer' and status = 'building') then
              raise exception 'legacy prompt-organizer idea status is not building';
            end if;
            if not exists (
              select 1 from core.app
              where id = 'prompt-organizer' and name = 'Prompt Organizer'
                and schema_name = 'prompt' and status = 'building'
            ) then
              raise exception 'legacy prompt-organizer registry row is missing or stale';
            end if;
            if not exists (
              select 1 from core.metric_def
              where id = 'idea_effectiveness' and min_value = 0 and max_value = 10 and is_proxy
            ) then
              raise exception 'legacy idea_effectiveness metric is missing or stale';
            end if;
            if not exists (
              select 1 from idea.dependency
              where idea_id = 'constraint-finder' and depends_on = 'optimize-metrics'
            ) then
              raise exception 'legacy constraint-finder dependency is missing';
            end if;
            if exists (
              select 1 from prompt.prompt as p
              where not exists (
                select 1 from prompt.prompt_version as pv
                where pv.prompt_id = p.id and pv.version_no = 1
                  and pv.user_id = p.user_id
              )
              or not exists (
                select 1 from prompt.prompt_version as current_version
                where current_version.prompt_id = p.id
                  and current_version.user_id = p.user_id
                  and current_version.body = p.body
                  and current_version.version_no = (
                    select max(latest.version_no)
                    from prompt.prompt_version as latest
                    where latest.prompt_id = p.id
                      and latest.user_id = p.user_id
                  )
              )
            ) then
              raise exception 'legacy prompt version history is incomplete or its latest snapshot is stale';
            end if;
            if not has_schema_privilege('anon', 'core', 'USAGE')
               or not has_schema_privilege('authenticated', 'core', 'USAGE')
               or not has_schema_privilege('anon', 'idea', 'USAGE')
               or not has_schema_privilege('authenticated', 'idea', 'USAGE')
               or not has_schema_privilege('anon', 'prompt', 'USAGE')
               or not has_schema_privilege('authenticated', 'prompt', 'USAGE') then
              raise exception 'legacy API schema usage grants are missing';
            end if;
            if not has_table_privilege('anon', 'prompt.prompt', 'SELECT')
               or not has_table_privilege('authenticated', 'prompt.prompt', 'SELECT')
               or not has_table_privilege('authenticated', 'prompt.prompt', 'INSERT')
               or not has_table_privilege('authenticated', 'prompt.prompt', 'UPDATE')
               or not has_table_privilege('authenticated', 'prompt.prompt_version', 'SELECT')
               or not has_table_privilege('authenticated', 'prompt.prompt_version', 'INSERT')
               or not has_table_privilege('authenticated', 'prompt.tag', 'SELECT')
               or not has_table_privilege('authenticated', 'prompt.tag', 'INSERT')
               or not has_table_privilege('authenticated', 'prompt.usage', 'SELECT')
               or not has_table_privilege('authenticated', 'prompt.usage', 'INSERT')
               or not has_table_privilege('authenticated', 'prompt.configuration', 'SELECT')
               or not has_table_privilege('authenticated', 'prompt.configuration', 'INSERT') then
              raise exception 'legacy Prompt Organizer table grants are missing';
            end if;
            if to_regprocedure('core.log_run(text,text,bigint,text)') is null
               or not has_function_privilege(
                 'authenticated', 'core.log_run(text,text,bigint,text)', 'EXECUTE'
               )
               or to_regprocedure('prompt.render_prompt(text,text)') is null
               or not has_function_privilege(
                 'authenticated', 'prompt.render_prompt(text,text)', 'EXECUTE'
               ) then
              raise exception 'legacy API function grants are missing';
            end if;
            if not exists (
              select 1
              from pg_db_role_setting as role_setting
              join pg_roles as role on role.oid = role_setting.setrole
              cross join lateral unnest(role_setting.setconfig) as setting(value)
              where role.rolname = 'authenticator'
                and role_setting.setdatabase in (
                  0,
                  (select oid from pg_database where datname = current_database())
                )
                and split_part(setting.value, '=', 1) = 'pgrst.db_schemas'
                and array['public', 'core', 'idea', 'prompt']::text[] <@
                  string_to_array(
                    replace(split_part(setting.value, '=', 2), ' ', ''), ','
                  )
            ) then
              raise exception 'legacy PostgREST exposed-schema configuration is missing or stale';
            end if;
            if to_regprocedure('core.purge_old_events()') is null
               or not has_function_privilege('authenticated', 'core.purge_old_events()', 'EXECUTE') then
              raise exception 'legacy event-retention function/grant is missing';
            end if;
            if not exists (select 1 from pg_extension where extname = 'pg_cron')
               or not exists (
                 select 1 from cron.job
                 where jobname = 'core-purge-old-events' and schedule = '0 3 * * *'
                   and command = 'select core.purge_old_events();'
               ) then
              raise exception 'legacy pg_cron extension/job is missing or stale';
            end if;
          end;
          $$;
          SQL

          repair_from="${#remote_versions[@]}"
          if [ "$repair_from" -lt 18 ]; then
            current_main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
            if [ "${GITHUB_SHA}" != "$current_main_sha" ]; then
              echo "main moved during baseline verification; refusing ledger repair." >&2
              exit 1
            fi
            missing_legacy=("${legacy_versions[@]:$repair_from}")
            (
              cd "$legacy_dir"
              supabase migration repair "${missing_legacy[@]}" \
                --db-url "$SUPABASE_DB_URL" --status applied
            )
          fi

      - name: Attach a non-empty or failed baseline diff
        if: ${{ inputs.baseline_legacy_ledger && failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-legacy-schema-diff
          path: ${{ runner.temp }}/platform-legacy-schema.diff.sql
          if-no-files-found: ignore
          retention-days: 14

      - name: Apply only the additive S1 bootstrap
        if: inputs.baseline_legacy_ledger
        shell: bash
        run: |
          set -euo pipefail
          bootstrap_dir="${RUNNER_TEMP}/platform-owner-bootstrap"
          node "${GITHUB_WORKSPACE}/apps/toolbelt/scripts/stage-migrations.mjs" \
            "$bootstrap_dir" --stop-before-owner-dependency
          cd "$bootstrap_dir"
          supabase db push --db-url "$SUPABASE_DB_URL" --include-all --dry-run
          current_main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [ "${GITHUB_SHA}" != "$current_main_sha" ]; then
            echo "main moved during baseline bootstrap preview; refusing database mutation." >&2
            exit 1
          fi
          supabase db push --db-url "$SUPABASE_DB_URL" --include-all --yes
          supabase db push --db-url "$SUPABASE_DB_URL" --include-all --dry-run

      - name: Stop after S1 for owner provisioning
        if: inputs.baseline_legacy_ledger
        run: |
          echo "Legacy ledger adopted and S1 bootstrap applied."
          echo "Configure platform.config and the owner CI credential before a normal migration run."

      - name: Refuse a normal push into an unbaselined live schema
        if: ${{ !inputs.baseline_legacy_ledger && fromJSON(steps.ledger.outputs.count) < 20 }}
        run: |
          echo "The remote migration ledger has not completed the reviewed 20-version S1 prefix. Run baseline_legacy_ledger mode first." >&2
          exit 1

      - name: Require the remote ledger to be an exact local prefix
        if: ${{ !inputs.baseline_legacy_ledger }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t local_versions < <(
            find "${RUNNER_TEMP}/platform-migrations/supabase/migrations" -maxdepth 1 -type f -name '*.sql' -printf '%f\n' \
              | sed 's/_.*//' | sort -u
          )
          mapfile -t remote_versions < "${RUNNER_TEMP}/remote-platform-ledger-versions"
          if [ "${#remote_versions[@]}" -gt "${#local_versions[@]}" ]; then
            echo "The remote ledger contains more versions than this checkout." >&2
            exit 1
          fi
          for index in "${!remote_versions[@]}"; do
            if [ "${remote_versions[$index]}" != "${local_versions[$index]}" ]; then
              echo "Remote ledger is not a local prefix at position $index: expected ${local_versions[$index]}, found ${remote_versions[$index]}." >&2
              exit 1
            fi
          done

      - name: Verify production owner prerequisite
        if: ${{ !inputs.baseline_legacy_ledger }}
        run: |
          set -euo pipefail
          owner_table_exists="$(psql "$SUPABASE_DB_URL" -X --no-psqlrc \
            --set=ON_ERROR_STOP=1 --tuples-only --no-align \
            --command="select to_regclass('platform.config') is not null")"
          if [ "$owner_table_exists" != "t" ]; then
            echo "platform.config is absent. Complete the explicit baseline S1 run first." >&2
            exit 1
          fi
          owner_count="$(psql "$SUPABASE_DB_URL" -X --no-psqlrc \
            --set=ON_ERROR_STOP=1 --tuples-only --no-align \
            --command="
              select count(*)
              from platform.config as c
              join auth.users as u on u.id = c.owner_uuid
              where c.singleton
                and c.owner_uuid is not null
                and u.confirmed_at is not null
                and (u.banned_until is null or u.banned_until <= now())")"
          if [ "$owner_count" != "1" ]; then
            echo "Expected exactly one confirmed, unbanned platform owner before owner-pinned migrations; found $owner_count." >&2
            exit 1
          fi

      - name: Prove the ledger-applied schema has not drifted
        if: ${{ !inputs.baseline_legacy_ledger }}
        shell: bash
        run: |
          set -euo pipefail
          last_applied="$(tail -n 1 "${RUNNER_TEMP}/remote-platform-ledger-versions")"
          applied_dir="${RUNNER_TEMP}/platform-applied-reference"
          node "${GITHUB_WORKSPACE}/apps/toolbelt/scripts/stage-migrations.mjs" \
            "$applied_dir" --subset-file "${RUNNER_TEMP}/remote-platform-ledger-versions"
          diff_file="${RUNNER_TEMP}/platform-live-drift.diff.sql"
          (
            cd "$applied_dir"
            supabase init --force >&2
            supabase db diff --db-url "$SUPABASE_DB_URL" \
              --schema core,idea,intake,platform,prompt,test --use-migra
          ) > "$diff_file"
          if grep -Ev '^[[:space:]]*(--.*)?$' "$diff_file" | grep -q .; then
            echo "The live schema has drifted from its applied migration ledger; refusing to push." >&2
            cat "$diff_file"
            exit 1
          fi

      - name: Attach a non-empty or failed live-drift diff
        if: ${{ !inputs.baseline_legacy_ledger && failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-live-drift-diff
          path: ${{ runner.temp }}/platform-live-drift.diff.sql
          if-no-files-found: ignore
          retention-days: 14

      - name: Preview the single global migration ledger
        if: ${{ !inputs.baseline_legacy_ledger }}
        working-directory: ${{ runner.temp }}/platform-migrations
        run: |
          supabase migration list --db-url "$SUPABASE_DB_URL"
          supabase db push --db-url "$SUPABASE_DB_URL" --include-all --dry-run

      - name: Apply all forward platform migrations once
        if: ${{ !inputs.baseline_legacy_ledger }}
        working-directory: ${{ runner.temp }}/platform-migrations
        run: |
          set -euo pipefail
          current_main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [ "${GITHUB_SHA}" != "$current_main_sha" ]; then
            echo "main moved after migration preview; refusing database mutation." >&2
            exit 1
          fi
          supabase db push --db-url "$SUPABASE_DB_URL" --include-all --yes

      - name: Prove the ledger has no pending migrations
        if: ${{ !inputs.baseline_legacy_ledger }}
        working-directory: ${{ runner.temp }}/platform-migrations
        run: supabase db push --db-url "$SUPABASE_DB_URL" --include-all --dry-run

      - name: Record migration outcome
        id: outcome
        run: echo "fully_migrated=${{ !inputs.baseline_legacy_ledger }}" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify deployed platform contract
    needs: migrate
    if: needs.migrate.outputs.fully_migrated == 'true'
    uses: ./.github/workflows/platform-contract.yml
    secrets: inherit
