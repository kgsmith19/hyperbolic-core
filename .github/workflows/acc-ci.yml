name: "Verify: Tests (ACC)"

# Standalone entry point for merge_group/push/workflow_dispatch only. The
# pull_request path runs these same suites as native jobs in pr-verify.yml
# (see that file's header for why nothing here is workflow_call any more),
# both calling the verify-tests-acc / verify-tests-acc-windows composite
# actions under .github/actions/ so each suite has exactly one source.
#
# Two jobs, not one, and that is a hard platform constraint: the PowerShell
# shim and cap-watcher suites need a windows-latest runner, and a single job
# cannot span two runner images.

on:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  verify-tests-acc:
    name: "Verify: Tests (ACC)"
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Setup · Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/verify-tests-acc
        with:
          base_sha: ${{ github.event.merge_group.base_sha }}

  verify-tests-acc-windows:
    name: "Verify: Tests (ACC Windows)"
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Setup · Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/verify-tests-acc-windows
