name: Tests

on:
  workflow_dispatch:  # manual only -- see tools/check.sh to run this locally instead
  workflow_call:      # so release.yml can run the same suite when dispatched

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # No pip install: netcheck is standard library only (AGENTS.md), and its
      # tests are stdlib unittest. A CI step that installs packages is the one
      # place that constraint would rot without anyone noticing.
      - name: Run the suite
        run: python -m unittest discover -s tests -t . -v
