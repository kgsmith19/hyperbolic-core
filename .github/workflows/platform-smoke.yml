name: "Platform Smoke"

# Post-deploy smoke verdict against the LIVE one-origin surface, from a
# tailnet-joined runner -- the root-owned answer to gap G-1 (the docs promised
# a post-deploy smoke suite; none existed; the standalone repo's
# release-smoke.yml is superseded). Read-only by design: every probe is a GET
# against a health endpoint or a static index; nothing mutates state.
#
# Called with `secrets: inherit`-free workflow_call from the tail of
# deploy.yml and lifeos-deploy.yml (a red smoke fails the calling run), and
# directly dispatchable for on-demand verification.
#
# Probe map (docs/ops/runbook.md, "Single-origin Tailscale Serve route");
# Tailscale owns only / and nginx owns the application paths below:
#   /healthz            Shell static health asset ({"status":"ok"})
#   /                   Shell index (must reference a /assets/*.js bundle)
#   /login              Shell browser-history document route
#   /settings           representative authenticated Shell document route
#   /api/healthz        Handler A through nginx's /api/ route (full-path forward;
#                       server.ts handles /api/healthz for exactly this probe)
#   /api/brain/health   the Brain through nginx's /api/brain/ route
#   /life/              LifeOS UI index (only once LIFEOS_DEPLOY_ENABLED --
#                       before cutover the route serves the standalone layout,
#                       which this repo must not assert about)
#   /life/capture       representative LifeOS browser-history document route
#   /life/api/healthz   LifeOS API through nginx's /life/api/ route (same gate)
#
# Credentials: only the tailnet OAuth client (shell-deploy Infisical path).
# No SSH for the shared-origin probes above -- the box is probed exactly the
# way a user's browser reaches it, over the tailnet HTTPS origin.
#
# The broker (issue #185) is the one exception: it is deliberately
# loopback-only with no nginx route of its own -- its callers are
# other containers on the same Docker network, not external clients, and
# giving it an nginx route would make it reachable from any tailnet device,
# defeating the point. It is probed over Tailscale SSH instead (the same
# transport ops-serve-apply.yml and ops-edge.yml already use for a
# credential-free, keyless join+SSH round trip -- deploy.yml's own jobs
# still authenticate with an Infisical-sourced SSH key today, ADR 008's
# planned-but-not-yet-scheduled unification target, per docs/ops/vendors.md),
# reusing this job's own tailnet join rather than a second one. Gated
# behind BROKER_DEPLOY_ENABLED (below) since the broker, unlike every other
# unit here, has no live deployment yet.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Probe the live origin
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    # Matches deploy.yml's deploy-shell job: the shell-deploy Infisical
    # identity trusts the environment-scoped OIDC subject
    # (...:environment:shell-deploy-production), not the no-environment
    # ref:refs/heads/main fallback this job would otherwise present
    # (runbook.md, "Tailscale Serve" OIDC subject table).
    environment: shell-deploy-production
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Secrets · Pull the tailnet OAuth client from Infisical
        uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_SHELL_DEPLOY_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          secret-path: "/platform/shell-deploy/"
          domain: https://app.infisical.com

      - name: Network · Join tailnet
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ env.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ env.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ vars.DEPLOY_HOST }}

      - name: Smoke · Probe every live unit through the shared origin
        shell: bash
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          LIFEOS_LIVE: ${{ vars.LIFEOS_DEPLOY_ENABLED }}
          BROKER_LIVE: ${{ vars.BROKER_DEPLOY_ENABLED }}
        run: |
          set -euo pipefail
          if [[ ! "$DEPLOY_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]{0,252}[A-Za-z0-9]$ ]]; then
            echo "DEPLOY_HOST must be a non-empty DNS name or IPv4 address." >&2
            exit 1
          fi
          origin="https://$DEPLOY_HOST"
          failures=0
          results=()
          smoke_tmp="$(mktemp -d)"

          cleanup_smoke_tmp() {
            rm -rf -- "$smoke_tmp"
          }
          trap cleanup_smoke_tmp EXIT
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM

          probe() {
            local label="$1" path="$2" expect="$3"
            local body
            if ! body="$(curl --fail --silent --show-error --max-time 15 "$origin$path" 2>&1)"; then
              results+=("| $label | \`$path\` | ❌ unreachable |")
              echo "FAIL $label ($path): $body" >&2
              failures=$((failures + 1))
              return 0
            fi
            if [[ -n "$expect" ]] && ! grep -qE "$expect" <<<"$body"; then
              results+=("| $label | \`$path\` | ❌ unexpected body |")
              echo "FAIL $label ($path): body did not match /$expect/" >&2
              failures=$((failures + 1))
              return 0
            fi
            results+=("| $label | \`$path\` | ✅ |")
            echo "ok   $label ($path)"
          }

          is_json_health() {
            local content_type="${1,,}"
            [[ "$content_type" =~ ^application/json([[:space:]]*;|$) ]] || return 1
            python3 -c 'import json, sys; payload = json.load(sys.stdin); raise SystemExit(0 if isinstance(payload, dict) and payload.get("status") == "ok" else 1)'
          }

          probe_json_health() {
            local label="$1" path="$2"
            local body_file error_file response_meta http_status content_type error_message
            body_file="$smoke_tmp/json-health-body"
            error_file="$smoke_tmp/json-health-error"
            : >"$body_file"
            : >"$error_file"
            if ! response_meta="$(curl --fail --silent --show-error --max-time 15 --output "$body_file" --write-out '%{http_code} %{content_type}' "$origin$path" 2>"$error_file")"; then
              error_message="$(<"$error_file")"
              results+=("| $label | \`$path\` | ❌ unreachable |")
              echo "FAIL $label ($path): $error_message" >&2
              failures=$((failures + 1))
              return 0
            fi
            http_status="${response_meta%% *}"
            content_type="${response_meta#* }"
            if [[ "$http_status" != "200" ]]; then
              results+=("| $label | \`$path\` | ❌ HTTP $http_status (expected 200) |")
              echo "FAIL $label ($path): expected HTTP 200; got $http_status" >&2
              failures=$((failures + 1))
              return 0
            fi
            if ! is_json_health "$content_type" <"$body_file" 2>/dev/null; then
              results+=("| $label | \`$path\` | ❌ invalid JSON health response |")
              echo "FAIL $label ($path): expected application/json with top-level status=ok; got content-type '$content_type'" >&2
              failures=$((failures + 1))
              return 0
            fi
            results+=("| $label | \`$path\` | ✅ |")
            echo "ok   $label ($path)"
          }

          # The broker has no nginx route (see this file's own header
          # comment) -- reached over Tailscale SSH instead, the same
          # ssh_options shape deploy.yml's own jobs use.
          probe_ssh() {
            local label="$1" url="$2"
            local ssh_options=(-o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new)
            local output
            if output="$(ssh "${ssh_options[@]}" "deploy@$DEPLOY_HOST" "curl --fail --silent --show-error --max-time 15 '$url'" 2>&1)"; then
              results+=("| $label | \`$url\` (via SSH) | ✅ |")
              echo "ok   $label ($url, via SSH)"
            else
              results+=("| $label | \`$url\` (via SSH) | ❌ unreachable |")
              echo "FAIL $label ($url, via SSH): $output" >&2
              failures=$((failures + 1))
            fi
          }

          probe "Shell health" "/healthz" '\{"status":"ok"\}'
          probe "Shell index" "/" 'src="/assets/[A-Za-z0-9_.-]+\.js"'
          probe "Shell login deep link" "/login" 'src="/assets/[A-Za-z0-9_.-]+\.js"'
          probe "Shell settings deep link" "/settings" 'src="/assets/[A-Za-z0-9_.-]+\.js"'
          probe_json_health "Handler A" "/api/healthz"
          probe_json_health "Brain" "/api/brain/health"

          if [[ "${BROKER_LIVE:-}" == "true" ]]; then
            probe_ssh "Broker" "http://127.0.0.1:8300/healthz"
          else
            # Unlike Shell/Handler A/Brain (already continuously live since
            # earlier milestones), the broker has never been deployed until
            # the owner provisions Infisical /platform/broker/ and confirms
            # it -- an unconditional probe here would turn EVERY future
            # deploy of every OTHER unit red for a service that was never
            # supposed to be live yet (an independent adversarial review of
            # this file's first draft caught exactly this: no gate meant no
            # release tag for shell/llm-handler/brain either, indefinitely).
            results+=("| Broker | \`http://127.0.0.1:8300/healthz\` (via SSH) | ⏭️ skipped (not yet deployed) |")
            echo "skip Broker probe: BROKER_DEPLOY_ENABLED != 'true' (not yet deployed)"
          fi

          if [[ "${LIFEOS_LIVE:-}" == "true" ]]; then
            probe "LifeOS UI" "/life/" '/life/assets/[A-Za-z0-9_.-]+\.js'
            probe "LifeOS capture deep link" "/life/capture" '/life/assets/[A-Za-z0-9_.-]+\.js'
            probe_json_health "LifeOS API" "/life/api/healthz"
          else
            results+=("| LifeOS UI | \`/life/\` | ⏭️ skipped (pre-cutover) |")
            results+=("| LifeOS API | \`/life/api/healthz\` | ⏭️ skipped (pre-cutover) |")
            echo "skip LifeOS probes: LIFEOS_DEPLOY_ENABLED != 'true' (pre-cutover)"
          fi

          {
            echo "### Platform Smoke"
            echo ""
            echo "| Unit | Path | Result |"
            echo "| --- | --- | --- |"
            printf '%s\n' "${results[@]}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$failures" -gt 0 ]]; then
            echo "::error::Platform smoke failed: $failures probe(s) red. The deploy that triggered this is NOT verified." >&2
            exit 1
          fi
          echo "All probes green."

      # Additive and independently gated (issue #170): the tailnet-private
      # probes above are entirely unaffected by this step's presence, state,
      # or outcome -- it only runs at all once the owner has both enabled
      # the edge and set the public hostname it answers on.
      - name: Smoke · Public edge — unauthenticated request must redirect toward Access, never reach the app
        # success() || failure(), not a bare gate: GitHub Actions implicitly ANDs a bare
        # `if:` with success(), which would silently skip this step whenever the private
        # probe step above fails -- exactly when the public edge might ALSO be broken and
        # nothing would report it. success()||failure() (not always(), which would also
        # fire on a cancelled run) decouples the two without masking a real cancellation.
        if: (success() || failure()) && vars.CLOUDFLARE_EDGE_ENABLED == 'true'
        shell: bash
        env:
          CLOUDFLARE_PUBLIC_HOSTNAME: ${{ vars.CLOUDFLARE_PUBLIC_HOSTNAME }}
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_PUBLIC_HOSTNAME:-}" ]]; then
            echo "::error::CLOUDFLARE_EDGE_ENABLED is true but CLOUDFLARE_PUBLIC_HOSTNAME is not set -- cannot run the public-edge probe." >&2
            exit 1
          fi
          public_origin="https://$CLOUDFLARE_PUBLIC_HOSTNAME"
          # -o /dev/null -w '%{http_code}': the status code alone is the
          # assertion here, deliberately without --fail or -L -- --fail
          # only flags >=400 (a 3xx redirect toward Access would pass
          # silently), and -L would follow the redirect into Access's own
          # login page instead of confirming the redirect itself happened.
          status="$(curl --silent --show-error --max-time 15 -o /dev/null -w '%{http_code}' "$public_origin/")"
          if (( status < 300 || status >= 400 )); then
            echo "::error::Public edge probe expected a 3xx redirect toward Cloudflare Access, got HTTP $status from $public_origin/ instead -- either the app is reachable unauthenticated (2xx) or the edge is broken (5xx)." >&2
            {
              echo "### Public edge probe"
              echo ""
              echo "| Path | Result |"
              echo "| --- | --- |"
              echo "| \`$public_origin/\` | ❌ HTTP $status (expected 3xx) |"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          {
            echo "### Public edge probe"
            echo ""
            echo "| Path | Result |"
            echo "| --- | --- |"
            echo "| \`$public_origin/\` | ✅ HTTP $status (redirected toward Access) |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Public edge probe green: HTTP $status (redirect toward Access)."
