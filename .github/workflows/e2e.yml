name: E2E Acceptance

# Runs separately from the fast PR Gate so the PR Gate stays lightweight.
# Trigger manually (workflow_dispatch) or on a daily schedule to catch
# environment-level regressions without blocking every PR merge.
# Issue #18 acceptance criterion: keeps existing Node/Supabase suite as PR Gate.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: E2E — Critical prompt flow (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      # Install Playwright plus its Chromium browser. Uses npx so no
      # package.json dependency is needed (zero-dependency project policy).
      - name: Install Playwright + Chromium
        run: npx --yes playwright@1.52.0 install --with-deps chromium

      # Serve the static web/ directory on the default port (8812) used by
      # the project's own serve_local command.
      - name: Start local server
        run: python3 -m http.server 8812 --directory web &
        shell: bash

      - name: Wait for server
        run: |
          for i in $(seq 1 10); do
            curl -sf http://localhost:8812 && break || sleep 1
          done

      - name: Run E2E acceptance tests
        run: npx playwright@1.52.0 test --config playwright.config.mjs
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8812
          # USER_A_EMAIL and USER_A_PASSWORD are not set here: the test falls
          # back to the shared fixture credentials embedded in tests/helpers.mjs
          # (same accounts used by every integration test; the anon key is
          # public by design — RLS is the security boundary, SR-05).

      # Upload both the HTML report and the raw test-results (screenshots,
      # traces) as a single artifact — Issue #18 evidence requirement.
      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 30
