name: PR Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:

permissions:
  contents: read

concurrency:
  group: pr-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-gate:
    name: PR Gate
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Decide whether runtime verification is required
        id: changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "runtime=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! changed=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD); then
            echo "::warning::Could not compute the PR diff; running the full gate."
            echo "runtime=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$changed" ]; then
            echo "::warning::PR diff was unexpectedly empty; running the full gate."
            echo "runtime=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf 'Changed files:\n%s\n' "$changed"
          runtime_files=$(printf '%s\n' "$changed" | grep -Ev '(^|/).*\.md$|^\.agent/' || true)

          if [ -n "$runtime_files" ]; then
            echo "runtime=true" >> "$GITHUB_OUTPUT"
            printf 'Runtime verification required by:\n%s\n' "$runtime_files"
          else
            echo "runtime=false" >> "$GITHUB_OUTPUT"
            echo 'Documentation/governance-only diff; preserving PR Gate while skipping the full suite.'
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.changes.outputs.runtime == 'true'
        with:
          python-version: '3.12'
      - name: Objective local-equivalent gate
        if: steps.changes.outputs.runtime == 'true'
        run: bash tools/check.sh
      - name: Documentation/governance-only verification
        if: steps.changes.outputs.runtime != 'true'
        run: echo 'No runtime-affecting files changed; required PR Gate remains green.'
