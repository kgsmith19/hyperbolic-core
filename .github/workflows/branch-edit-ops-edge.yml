name: Branch Edit Ops Edge

on:
  push:
    branches: [issue/378-manual-ops-serve-convergence]
    paths:
      - ".github/workflows/branch-edit-ops-edge.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Stage exact one-line workflow blob
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen

          path = Path('.github/workflows/ops-edge.yml')
          text = path.read_text()
          old = "    if: inputs.apply_serve_after_origin == true && needs.deploy.result == 'success' && needs.deploy.outputs.serve_state == 'legacy'"
          new = "    if: needs.deploy.result == 'success' && needs.deploy.outputs.serve_state == 'legacy' && (github.event_name == 'push' || inputs.apply_serve_after_origin == true)"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one old apply-serve condition, found {count}')
          modified = text.replace(old, new, 1).encode()
          payload = json.dumps({
              'content': base64.b64encode(modified).decode(),
              'encoding': 'base64',
          }).encode()
          request = Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/git/blobs",
              data=payload,
              method='POST',
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f"Bearer {os.environ['GITHUB_TOKEN']}",
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
              },
          )
          with urlopen(request) as response:
              result = json.load(response)
          print(f"__TARGET_BLOB_SHA__={result['sha']}")
          PY
