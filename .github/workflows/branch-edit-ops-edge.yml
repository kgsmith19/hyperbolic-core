name: Branch Edit Ops Edge

on:
  push:
    branches: [issue/378-manual-ops-serve-convergence]
    paths:
      - ".github/workflows/branch-edit-ops-edge.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Apply exact one-line workflow fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/ops-edge.yml')
          text = path.read_text()
          old = "    if: inputs.apply_serve_after_origin == true && needs.deploy.result == 'success' && needs.deploy.outputs.serve_state == 'legacy'"
          new = "    if: needs.deploy.result == 'success' && needs.deploy.outputs.serve_state == 'legacy' && (github.event_name == 'push' || inputs.apply_serve_after_origin == true)"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one old apply-serve condition, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY
          git rm .github/workflows/branch-edit-ops-edge.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ops-edge.yml
          git commit -m "fix(ops): converge legacy Serve after push (#378)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
