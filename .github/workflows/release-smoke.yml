name: Release Smoke

# Runs against the REAL deployed UI + REAL backend.
# Never triggered by PRs — only manually or on a weekly schedule.
# Requires SMOKE_EMAIL and SMOKE_PASSWORD repository secrets
# (dedicated staging/test account, no production writes).
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Deployed UI URL to test against (leave blank for default)'
        required: false
        default: ''
  schedule:
    - cron: '0 06 * * 1'   # Mondays 06:00 UTC — weekly release canary

permissions:
  contents: read

concurrency:
  group: release-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: Full-stack smoke (real auth + real backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Cache Playwright Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium

      - name: Run release smoke test
        run: npx playwright test --config playwright.smoke.config.ts
        env:
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
          SMOKE_BASE_URL: ${{ inputs.base_url || '' }}

      - name: Upload smoke evidence (screenshots + traces)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-smoke-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 30
