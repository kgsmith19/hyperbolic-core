name: Ops Broker Canary

# Issue #478: a daily end-to-end check that the production broker still answers a
# real Anthropic Messages request. One minimal call (max_tokens 1, the word
# "ping") is sent through the broker's loopback /proxy on the box, with the same
# envelope packages/llm/src/drivers/anthropic-via-broker.ts builds. The run
# passes only when the broker returns HTTP 200 with a message and writes exactly
# one broker_proxy_request audit line during the call.
#
# The request spends a fraction of a cent of provider money per run. The token
# and the provider key stay inside the broker and this step's environment: the
# envelope is built in node from env and piped to the box on stdin, and no step
# prints the token, the key, or the response body.

on:
  schedule:
    - cron: "23 11 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  broker-canary:
    name: Broker canary (one synthetic call)
    runs-on: ubuntu-latest
    environment: broker-deploy-production
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: ops-broker-canary
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same identity and path as ops-broker-soak-report.yml, so no new secret,
      # identity, or variable is introduced. Exports the broker's caller token
      # and the provider credential name's secret to the environment, read by
      # the main step only.
      - uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_BROKER_DEPLOY_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          secret-path: "/platform/broker/"
          domain: https://app.infisical.com

      - name: Join tailnet
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ env.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ env.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ vars.DEPLOY_HOST }}

      - name: Send one synthetic broker call and assert it
        # The container name is Compose's default for project "broker" (cd broker),
        # service "broker", replica 1: the broker service sets no container_name.
        # The only remote command is the single curl below and one docker logs
        # count; nothing on the box is started, stopped, or written.
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          CANARY_MODEL: claude-haiku-5-5
        shell: bash
        run: |
          set -euo pipefail
          : "${BROKER_CALLER_TOKEN_LLM_HANDLER:?not provisioned in Infisical /platform/broker/}"
          ssh_options=(-o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new)

          # Envelope built in node from env: the token never reaches argv or a log.
          body="$(node -e '
            const env = process.env;
            process.stdout.write(JSON.stringify({
              caller: "llm-handler",
              token: env.BROKER_CALLER_TOKEN_LLM_HANDLER,
              targetHost: "api.anthropic.com",
              protocol: "https",
              method: "POST",
              path: "/v1/messages",
              headers: { "anthropic-version": "2023-06-01", "content-type": "application/json" },
              body: JSON.stringify({
                model: env.CANARY_MODEL,
                max_tokens: 1,
                messages: [{ role: "user", content: "ping" }],
                stream: false,
              }),
              credential: "LLM_KEYS_ANTHROPIC",
              credentialHeader: "x-api-key",
            }));
          ')"

          # The audit window starts on the box's own clock, so runner/box skew
          # can neither hide the call's audit line nor admit an older one.
          started="$(ssh "${ssh_options[@]}" "deploy@$DEPLOY_HOST" "date -u +%Y-%m-%dT%H:%M:%SZ")"
          # The envelope arrives on the box's stdin. The status is the last line
          # of the output and the reply is everything above it; neither is echoed.
          out="$(printf '%s' "$body" | ssh "${ssh_options[@]}" "deploy@$DEPLOY_HOST" \
            "curl -sS --max-time 30 -H 'content-type: application/json' --data-binary @- -w '\n%{http_code}' http://127.0.0.1:8300/proxy")"
          status="${out##*$'\n'}"
          reply="${out%$'\n'*}"

          if [[ "$status" != "200" ]]; then
            echo "canary: HTTP $status (expected 200)" >&2
            exit 1
          fi
          if ! node -e 'const m = JSON.parse(require("fs").readFileSync(0, "utf8")); if (m.type !== "message") process.exit(1);' <<<"$reply"; then
            echo "canary: HTTP 200 but the reply is not a message" >&2
            exit 1
          fi

          n="$(ssh "${ssh_options[@]}" "deploy@$DEPLOY_HOST" \
            "docker logs --timestamps --since $started broker-broker-1 2>&1 | grep -c broker_proxy_request || true")"
          if [[ "$n" != "1" ]]; then
            echo "canary: $n audit lines since $started (expected exactly 1)" >&2
            exit 1
          fi
          echo "canary: HTTP $status, $n audit line"
