name: "Template Lint"

# Repo-wide check with NO paths: filter, deliberately -- see repo-policy.yml's
# header comment and AGENTS.md's "Path-scoped gates in monorepo topologies"
# note for why that matters for a required status check.
#
# Confirms a PR's own description follows PULL_REQUEST_TEMPLATE.md's
# required sections. Called as the "Verify: PR Description" stage of
# pr-verify.yml's sequential chain; the push/workflow_dispatch/merge_group
# triggers below exist only for convention consistency with the repo's
# other required checks and no-op cleanly when there is nothing to lint.
# The PR body is fetched live from the API using the passed-in PR number
# rather than as a workflow_call input, since body length is unbounded.

on:
  workflow_call:
    inputs:
      pr_number:
        type: string
        required: false
      pr_head_sha:
        type: string
        required: false
      pr_base_sha:
        type: string
        required: false
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.pr_number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Lint · Confirm PR body matches the required template sections
        if: inputs.pr_number != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          PR_BODY="$(curl --fail --silent \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/pulls/${PR_NUMBER}" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin).get("body") or "")')"
          missing=()
          for heading in "## 📋 Summary" "## 🔗 Related Issue" "## 🔨 Changes" "## 🧪 Verification" "## ✅ Scope Check"; do
            if ! grep -qF -- "$heading" <<< "$PR_BODY"; then
              missing+=("$heading")
            fi
          done
          if ! grep -qiE '(closes|fixes|resolves)[[:space:]]+#[0-9]+' <<< "$PR_BODY"; then
            missing+=("a Closes/Fixes/Resolves #<issue-number> reference")
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "PR body is missing required template sections:" >&2
            printf '  - %s\n' "${missing[@]}" >&2
            exit 1
          fi
          echo "PR body includes every required template section."

      - name: Lint · Not applicable outside pull_request events
        if: inputs.pr_number == ''
        run: echo "Template Lint only evaluates pull_request bodies; nothing to check for this event."

  pr-gate:
    name: "Verify: PR Description"
    needs: [checks]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - name: Gate · Confirm every required job passed
        shell: bash
        run: |
          test "${{ needs.checks.result }}" = "success"
      - name: Gate · Confirm tested SHA matches the live PR head
        if: inputs.pr_number != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          TESTED_SHA: ${{ inputs.pr_head_sha }}
        run: |
          set -euo pipefail
          live_sha="$(curl --fail --silent \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/pulls/${PR_NUMBER}" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["head"]["sha"])')"
          if [ "${live_sha}" != "${TESTED_SHA}" ]; then
            echo "Tested SHA (${TESTED_SHA}) no longer matches the live PR head (${live_sha})." >&2
            exit 1
          fi
          echo "Tested SHA matches the live PR head (${TESTED_SHA})."
      - name: Gate · Publish step summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Verify: PR Description"
            echo ""
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "| checks | ${{ needs.checks.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
