name: "Verify: PR Description"

# Repo-wide check with NO paths: filter, deliberately -- see repo-policy.yml's
# header comment and AGENTS.md's "Path-scoped gates in monorepo topologies"
# note for why that matters for a required status check.
#
# Confirms a PR's own description follows PULL_REQUEST_TEMPLATE.md's
# required sections. Standalone entry point for merge_group/push/
# workflow_dispatch only, kept for convention consistency with the repo's
# other required checks -- the pull_request path runs this same logic as a
# native job in pr-verify.yml (see that file's header). Both call the
# verify-pr-description composite action under .github/actions/, which
# no-ops cleanly when there is no PR body to check.

on:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  verify-pr-description:
    name: "Verify: PR Description"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Setup · Checkout repository (so the local action is resolvable)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/verify-pr-description
