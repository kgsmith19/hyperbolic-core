name: Ops Broker Soak Report

# Issue #466, feeding the owner's decision in #343: whether the broker's two
# log-only enforcement flips are safe to make live. The egress host-allowlist
# (#187) and the budget 429 (#200) each sit behind a soak period, and this run
# reads the evidence that soak produced: the broker's own audit log, one JSON
# line per proxied request.
#
# Strictly read-only, by construction. The only remote commands are the two
# that the wrapper below can ever send: docker inspect (the container start
# time) and docker logs --timestamps (the audit log). Nothing is started,
# stopped, restarted, written, or re-deployed on the box. The spend ledger, if
# provisioned, is read with a single GET from the runner. Dispatch-only, so a
# person decides when to read the soak.

on:
  workflow_dispatch:
    inputs:
      since:
        description: Read the audit log only from this ISO-8601 timestamp onward (optional, blank reads everything the log still holds)
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  broker-soak-report:
    name: Broker soak report (read-only)
    runs-on: ubuntu-latest
    environment: broker-deploy-production
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: ops-broker-soak-report
      cancel-in-progress: false
    env:
      SINCE: ${{ inputs.since }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same identity and path as deploy-broker, so no new secret, identity,
      # or variable is introduced. The SUPABASE_* values this exports (when
      # provisioned) are only ever read by the report script's spend query.
      - uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_BROKER_DEPLOY_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          secret-path: "/platform/broker/"
          domain: https://app.infisical.com

      - name: Join tailnet
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ env.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ env.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ vars.DEPLOY_HOST }}

      - name: Read the broker's start time and audit log (read-only, allowlisted)
        # The only place this workflow reaches the box. Every remote command is
        # built inside broker_remote, from the two verbs its case statement
        # names; any other verb is refused before ssh runs. The container name
        # is Compose's default for project "broker" (cd broker), service
        # "broker", replica 1: the broker service sets no container_name.
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        shell: bash
        run: |
          set -euo pipefail
          iso_pattern='^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}(:[0-9]{2}(\.[0-9]+)?)?(Z|[+-][0-9]{2}:[0-9]{2})$'
          if [[ -n "$SINCE" && ! "$SINCE" =~ $iso_pattern ]]; then
            echo "since must be an ISO-8601 timestamp; refusing to build a remote command from it" >&2
            exit 1
          fi
          ssh_options=(-o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new)
          BROKER_CONTAINER=broker-broker-1

          broker_remote() {
            local verb="$1" remote
            case "$verb" in
              started-at)
                remote="docker inspect --format '{{.State.StartedAt}}' $BROKER_CONTAINER"
                ;;
              audit-log)
                if [[ -n "$SINCE" ]]; then
                  remote="docker logs --timestamps --since $SINCE $BROKER_CONTAINER"
                else
                  remote="docker logs --timestamps $BROKER_CONTAINER"
                fi
                ;;
              *)
                echo "refusing unlisted broker verb: $verb" >&2
                return 1
                ;;
            esac
            ssh "${ssh_options[@]}" "deploy@$DEPLOY_HOST" "$remote"
          }

          broker_remote started-at > "$RUNNER_TEMP/broker-started-at.txt"
          broker_remote audit-log > "$RUNNER_TEMP/broker-audit.log" 2>&1

      - name: Build the soak report (analysis only, no remote access)
        shell: bash
        run: |
          set -euo pipefail
          node docs/ops/broker-soak-report.mjs \
            --log "$RUNNER_TEMP/broker-audit.log" \
            --started-at-file "$RUNNER_TEMP/broker-started-at.txt" \
            --since "$SINCE" \
            --json "$RUNNER_TEMP/broker-soak-report.json" \
            --markdown "$RUNNER_TEMP/broker-soak-report.md"
          cat "$RUNNER_TEMP/broker-soak-report.md" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: broker-soak-report-${{ github.run_id }}
          path: ${{ runner.temp }}/broker-soak-report.json
          retention-days: 30
          if-no-files-found: error
