name: "Verify: LLM Review"

# Standalone entry point for push/workflow_dispatch only. The pull_request
# path runs this same review as a native job in pr-verify.yml (see that
# file's header for why nothing here is workflow_call any more), both
# calling the verify-llm-review composite action under .github/actions/ so
# the reviewer has exactly one source.
#
# NOT a required status check: this repo has not yet provisioned the
# owner-only prerequisites listed below. Until then the gate fails closed
# (exit 2, "the review did not run") by design, and must stay out of the
# required-checks list so an unprovisioned run never blocks a merge. Add it
# to the required list only once the prerequisites exist and a real run has
# been observed passing.
#
# OWNER-PROVISIONED PREREQUISITES. This cannot run until the owner has
# created all of the following; none of them is agent-settable:
#   - vars.REVIEW_PROVIDER              reviewer family: anthropic|openai|gemini
#   - vars.REVIEW_MODEL                 exact model id served by that family
#   - vars.REVIEW_BUILDER_PROVIDER      family that writes code here (optional;
#                                       packages/review defaults to anthropic)
#   - vars.INFISICAL_REVIEW_IDENTITY_ID Infisical machine identity for OIDC
#   - vars.INFISICAL_PROJECT_SLUG       (already used by deploy.yml)
#   - Infisical secrets at path /review/ (env prod), named exactly
#     REVIEW_ANTHROPIC_API_KEY / REVIEW_OPENAI_API_KEY / REVIEW_GEMINI_API_KEY.
#     Only the key for vars.REVIEW_PROVIDER is required; the CLI reads that one
#     and no other.
#
# TRUST NOTE: this is `pull_request` (via pr-verify.yml), never
# `pull_request_target`. Fork pull requests therefore get a read-only token
# and no OIDC identity, so the Infisical step cannot mint credentials for
# them and this gate fails closed on forks rather than exposing a key to
# fork-authored code. For same-repo branches -- the only kind this
# standard's agents push -- the reviewer CLI does run from the PR's own
# checkout, the same posture as every other CI job in this repo.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege at the top; the job widens only to what it actually uses.
# Nothing here writes to a pull request, so no job gets
# pull-requests: write -- this job installs and runs repository code while
# holding a provider credential, and must not also carry a token that could
# speak on a PR's behalf.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-llm-review:
    name: "Verify: LLM Review"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    steps:
      - name: Setup · Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # pr_number is deliberately empty for these triggers: there is no pull
      # request to review outside pull_request, and the composite action
      # no-ops cleanly rather than failing.
      - uses: ./.github/actions/verify-llm-review
        with:
          github_token: ${{ github.token }}
          infisical_identity_id: ${{ vars.INFISICAL_REVIEW_IDENTITY_ID }}
          infisical_project_slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          review_provider: ${{ vars.REVIEW_PROVIDER }}
          review_model: ${{ vars.REVIEW_MODEL }}
          review_builder_provider: ${{ vars.REVIEW_BUILDER_PROVIDER }}
