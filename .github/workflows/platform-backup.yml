name: Platform Backup

# m6-03 (10-cicd-deployment.md sections 8.4/9): extends the age-encrypted
# backup pattern already proven for the LifeOS stack
# (apps/lifeos/.github/workflows/backup.yml -- inert here, that pipeline
# runs only from the standalone kgsmith19/lifeos repo; this is a fresh
# root workflow, not a copy of that inert file) to the platform Supabase
# project (woltgcggxaehtuypkxqk). A fresh run of this workflow, with its
# run id recorded in the PR, is the prerequisite 10-cicd-deployment.md
# section 8.4 requires before any destructive platform migration.
#
# Nightly plus dispatchable, same shape as the LifeOS pipeline. Not a PR
# check: never gates a merge, only produces the encrypted artifact
# 8.4's rule points at.

on:
  schedule:
    - cron: "52 9 * * *" # off-peak, distinct from brain-eval-nightly (9:17) and the LifeOS pipeline's own 8:17
  workflow_dispatch:

concurrency:
  group: platform-backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bundle:
    if: vars.PLATFORM_BACKUP_ENABLED == 'true'
    name: Encrypted platform schema backup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # SUPABASE_DB_URL comes from Infisical via OIDC, its own dedicated
      # identity (never platform-migrations.yml's or deploy.yml's identity
      # -- ADR-05's one-identity-per-pipeline rule, docs/ops/runbook.md's
      # own "One-time platform migration adoption" section states the same
      # rule for that sibling pipeline). GitHub stores no secrets.
      - uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_PLATFORM_BACKUP_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          secret-path: "/toolbelt/"
          domain: https://app.infisical.com

      - name: Validate backup configuration
        env:
          AGE_PUBLIC_KEY: ${{ vars.PLATFORM_AGE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "SUPABASE_DB_URL was not supplied by Infisical." >&2
            exit 1
          fi
          if [ -z "$AGE_PUBLIC_KEY" ]; then
            echo "PLATFORM_AGE_PUBLIC_KEY repository variable is not set." >&2
            exit 1
          fi
          # Refuse an identity file masquerading as a recipient: encrypting to
          # a private key would silently produce an unopenable archive.
          case "$AGE_PUBLIC_KEY" in
            age1*) ;;
            *) echo "PLATFORM_AGE_PUBLIC_KEY must be an age1... recipient, not an identity." >&2; exit 1 ;;
          esac

      - name: Install age
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age

      - name: Create, verify, and encrypt the platform schema bundle
        env:
          AGE_PUBLIC_KEY: ${{ vars.PLATFORM_AGE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          umask 077
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          payload="$work/payload"
          mkdir "$payload"

          # Every schema that carries real operator data (platform.config's
          # owner row; core/idea/prompt/intake's own tables). "test" is a
          # CI-only fence schema (06-supabase-schema.md) with nothing worth
          # restoring, deliberately excluded. Pin the client major to the
          # target project's Postgres major -- 17, matching the LifeOS
          # pipeline's own pin; adjust this tag if the platform project's
          # actual server version ever differs (pg_dump's own version-skew
          # error names the fix directly).
          docker run --rm -e SUPABASE_DB_URL postgres:17 \
            sh -ec 'pg_dump --format=custom --no-owner \
              --schema=platform --schema=core --schema=idea --schema=prompt --schema=intake \
              "$SUPABASE_DB_URL"' \
            > "$payload/platform.dump"

          test -s "$payload/platform.dump"
          docker run --rm -i postgres:17 pg_restore --list \
            < "$payload/platform.dump" > /dev/null

          # Handed off to the restic step below (RUNNER_TEMP survives across
          # steps in the same job, unlike $work). Unconditional: this copy
          # costs nothing when RESTIC_BACKUP_ENABLED is off, and the age
          # path below it is completely unaffected either way.
          cp "$payload/platform.dump" "$RUNNER_TEMP/platform.dump"

          # Record the migration ledger state alongside the dump: a restore
          # has to know which migrations the snapshot already contains.
          docker run --rm -e SUPABASE_DB_URL postgres:17 \
            sh -ec 'psql "$SUPABASE_DB_URL" -X --no-psqlrc -At \
              -c "select version from supabase_migrations.schema_migrations order by version"' \
            > "$payload/MIGRATION_LEDGER.txt"

          (cd "$payload" && sha256sum platform.dump MIGRATION_LEDGER.txt > SHA256SUMS)

          tar -C "$payload" -cf "$work/platform-backup.tar" \
            platform.dump MIGRATION_LEDGER.txt SHA256SUMS
          age -r "$AGE_PUBLIC_KEY" \
            -o "platform-backup-${GITHUB_RUN_ID}.tar.age" \
            "$work/platform-backup.tar"

          # Proves the artifact really is age-encrypted, not a tar that was
          # renamed because the encryption step silently no-opped.
          head -c 22 "platform-backup-${GITHUB_RUN_ID}.tar.age" | grep -q "age-encryption.org"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-backup-${{ github.run_id }}
          path: platform-backup-${{ github.run_id }}.tar.age
          retention-days: 90
          if-no-files-found: error

      # Restic primary, gated on its own var: the age->artifact path above
      # is unconditional and unaffected by this being on or off. A separate
      # Infisical identity/path from the SUPABASE_DB_URL step above (ADR-05
      # -- a compromised restic credential must not also unlock the
      # database, and vice versa), scoped to exactly the restic
      # credentials, never SUPABASE_DB_URL.
      - name: Storage Box restic credentials
        if: vars.RESTIC_BACKUP_ENABLED == 'true'
        uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_PLATFORM_RESTIC_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          secret-path: "/platform/backup/"
          domain: https://app.infisical.com

      - name: Back up the platform dump to the Hetzner Storage Box (restic)
        if: vars.RESTIC_BACKUP_ENABLED == 'true'
        run: |
          set -euo pipefail
          if [ ! -s "$RUNNER_TEMP/platform.dump" ]; then
            echo "platform.dump was not produced by the earlier bundle step -- refusing to back up nothing." >&2
            exit 1
          fi
          if [ -z "${RESTIC_PASSWORD:-}" ] || [ -z "${STORAGEBOX_SSH_KEY:-}" ]; then
            echo "RESTIC_PASSWORD/STORAGEBOX_SSH_KEY were not supplied by Infisical (/platform/backup/)." >&2
            exit 1
          fi

          key_file=$(mktemp)
          trap 'rm -f "$key_file"' EXIT
          umask 077
          printf '%s\n' "$STORAGEBOX_SSH_KEY" > "$key_file"

          # Installs a pinned, checksum-verified restic and writes the
          # Storage Box's SSH config alias; idempotently a no-op against an
          # already-initialized repository (docs/ops/restic-setup.sh, #164).
          ./docs/ops/restic-setup.sh --apply \
            --storagebox-host="${{ vars.STORAGEBOX_HOST }}" \
            --storagebox-user="${{ vars.STORAGEBOX_USER }}" \
            --ssh-key-file="$key_file" \
            --repos=platform

          repository="sftp:hetzner-storagebox:/platform"
          restic -r "$repository" backup "$RUNNER_TEMP/platform.dump" \
            --host platform-backup --tag "run-${GITHUB_RUN_ID}"
          restic -r "$repository" forget \
            --keep-daily 7 --keep-weekly 4 --keep-monthly 6 --prune

          # Proves the snapshot actually landed, not just that restic exited 0.
          restic -r "$repository" snapshots --tag "run-${GITHUB_RUN_ID}" --json \
            | grep -q "run-${GITHUB_RUN_ID}"

      - name: Record the run id for the destructive-migration precondition
        run: |
          {
            echo "### Platform backup complete"
            echo
            echo "Backup run id: \`${GITHUB_RUN_ID}\`"
            echo
            echo "A destructive platform migration PR must cite this run id (see"
            echo "docs/ops/runbook.md, \"Platform project backup and restore\")."
          } >> "$GITHUB_STEP_SUMMARY"
