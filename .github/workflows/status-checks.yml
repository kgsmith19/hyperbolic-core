name: Status Checks

on:
  workflow_run:
    workflows: [Tests, Code Quality, Fixer Validation]
    types: [completed]

jobs:
  status:
    runs-on: ubuntu-latest
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: Check workflow statuses
        run: |
          echo "# CI/CD Status Report"
          echo ""
          echo "**Workflow Status:**"
          echo "- Tests: Check Actions tab"
          echo "- Code Quality: Check Actions tab"
          echo "- Fixer Validation: Check Actions tab"
          echo ""
          echo "All required checks must pass before merge."
