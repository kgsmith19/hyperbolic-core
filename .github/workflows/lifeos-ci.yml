name: "Verify: Tests (LifeOS)"

# Standalone entry point for merge_group/push/workflow_dispatch only. The
# pull_request path runs this same suite as a native job in pr-verify.yml
# (see that file's header for why nothing here is workflow_call any more),
# both calling the verify-tests-lifeos composite action under
# .github/actions/ so the suite has exactly one source.
#
# LifeOS had NO merge gate in this monorepo before this file existed. Its
# own apps/lifeos/.github/workflows/ci.yml is inert by design -- GitHub only
# runs workflows from the repository root -- and no root workflow covered
# apps/lifeos/**, so 680 test cases never ran on a pull request while the
# app's AGENTS.md told readers a root gate verified them.
#
# The composite action this calls is AUTHORED FRESH, not relocated. The
# repo-root AGENTS.md invariant exists precisely because that nested file
# also carries `build-backend` and `deploy-backend` jobs, and
# `build-backend` has no repository-variable gate: running that file from
# the root would publish a Docker image to ghcr.io on every push to main.
# So verify-tests-lifeos contains the TEST steps only -- there is no build
# or deploy step anywhere in it for the push trigger below to key off.

on:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  verify-tests-lifeos:
    name: "Verify: Tests (LifeOS)"
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Setup · Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/verify-tests-lifeos
