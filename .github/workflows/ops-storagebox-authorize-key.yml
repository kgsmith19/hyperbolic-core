name: Ops Storage Box Authorize Key

# hyperbolic-core#469 (AC2): the Storage Box rejects the restic key that
# platform-backup.yml presents (CI run 40597091186: Permission denied on port
# 23). This run installs the key's public half on the box, then proves a
# key-only login. It is the one place the box's SSH password is ever set, and
# that password is generated here, masked, used once, and never stored.
#
# Dispatch-only, so a person decides when the box's password rotates. The
# Hetzner Console API token (HETZNER_API_TOKEN) and the private key come from
# Infisical /platform/backup/, never from GitHub secrets.
#
# The box is not reachable from outside Hetzner (run 40628312552:
# reachable_externally=false), and the owner keeps it that way (#469,
# 2026-10-28). So every box login runs on the VPS, reached over keyless
# Tailscale SSH with the same identities, environment, and file-handoff
# shape as lifeos-backup.yml's restic leg. The Hetzner API calls stay on the
# runner: the API is public.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ops-storagebox-authorize-key
  cancel-in-progress: false

jobs:
  authorize-key:
    name: Authorize the restic key on the Storage Box
    runs-on: ubuntu-latest
    environment: lifeos-backup-production
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same identity, project, and path as platform-backup.yml's restic step.
      # It exports STORAGEBOX_SSH_KEY and HETZNER_API_TOKEN to GITHUB_ENV; the
      # main step below picks them up through env: and never by ${{ }} in run.
      - uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_PLATFORM_RESTIC_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          secret-path: "/platform/backup/"
          domain: https://app.infisical.com

      # The tailnet OAuth client lives with the LifeOS deploy identity, read
      # exactly as lifeos-backup.yml reads it.
      - uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_LIFEOS_DEPLOY_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          secret-path: "/platform/lifeos-deploy/"
          domain: https://app.infisical.com

      - name: Join the tailnet
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ env.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ env.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ vars.DEPLOY_HOST }}

      - name: Authorize the restic key on the Storage Box
        env:
          STORAGEBOX_HOST: ${{ vars.STORAGEBOX_HOST }}
          STORAGEBOX_USER: ${{ vars.STORAGEBOX_USER }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          STORAGEBOX_SSH_KEY: ${{ env.STORAGEBOX_SSH_KEY }}
          HETZNER_API_TOKEN: ${{ env.HETZNER_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          # Fail fast with the one prerequisite the owner provides (runbook,
          # "Authorize the restic key on the Storage Box").
          if [[ -z "${HETZNER_API_TOKEN:-}" ]]; then
            echo "::error::HETZNER_API_TOKEN is not set in Infisical /platform/backup/; see docs/ops/runbook.md, "Authorize the restic key on the Storage Box"" >&2
            exit 1
          fi

          api="https://api.hetzner.com/v1"
          key_file="$RUNNER_TEMP/storagebox-authorize.key"
          pub_file="$RUNNER_TEMP/storagebox-authorize.pub"

          # 1-2. The private key goes to a 0600 file. A here-string, not printf,
          #      so no secret is ever printed or echoed.
          umask 077
          cat > "$key_file" <<<"$STORAGEBOX_SSH_KEY"
          chmod 0600 "$key_file"

          # 3. The public key is derived from the private key.
          ssh-keygen -y -f "$key_file" > "$pub_file"

          api_get() {
            curl -fsS -H "Authorization: Bearer $HETZNER_API_TOKEN" "$api$1"
          }
          # The request body arrives on stdin, so it never reaches argv.
          api_post() {
            curl -fsS -X POST -H "Authorization: Bearer $HETZNER_API_TOKEN" \
              -H "Content-Type: application/json" --data-binary @- "$api$1"
          }
          wait_for_action() {
            local action_id="$1" deadline status
            deadline=$((SECONDS + 120))
            while :; do
              status="$(api_get "/storage_boxes/actions/$action_id" | jq -r '.action.status')"
              case "$status" in
                success) return 0 ;;
                error)
                  echo "Hetzner action $action_id ended in error" >&2
                  return 1
                  ;;
              esac
              if (( SECONDS >= deadline )); then
                echo "Hetzner action $action_id did not finish within 120s" >&2
                return 1
              fi
              sleep 5
            done
          }

          # 4. Find the box. Exactly one match, or refuse.
          box_ids=()
          page=1
          while :; do
            resp="$(api_get "/storage_boxes?page=$page&per_page=50")"
            while IFS= read -r id; do
              box_ids+=("$id")
            done < <(jq -r --arg user "$STORAGEBOX_USER" '.storage_boxes[] | select(.username == $user) | .id' <<< "$resp")
            next="$(jq -r '.meta.pagination.next_page // empty' <<< "$resp")"
            [[ -n "$next" ]] || break
            page="$next"
          done
          if (( ${#box_ids[@]} != 1 )); then
            echo "expected exactly one Storage Box for user $STORAGEBOX_USER, found ${#box_ids[@]}; refusing to continue" >&2
            exit 1
          fi
          box_id="${box_ids[0]}"

          # 5. Enable SSH on the box, and wait for Hetzner to apply it.
          action_id="$(jq -cn '{ssh_enabled: true}' \
            | api_post "/storage_boxes/$box_id/actions/update_access_settings" \
            | jq -r '.action.id')"
          wait_for_action "$action_id"

          # 6. Generate the password and mask it before any other use. The
          #    fixed suffix guarantees an upper, a lower, a digit, and a special.
          pw="$(openssl rand -base64 48 | tr -dc 'A-Za-z0-9' | head -c 28)Aa1!"
          echo "::add-mask::$pw"
          # jq reads the password from its environment, never from argv.
          action_id="$(PW="$pw" jq -cn '{password: env.PW}' \
            | api_post "/storage_boxes/$box_id/actions/reset_password" \
            | jq -r '.action.id')"
          wait_for_action "$action_id"

          # 7. Hand the files to the VPS: the public key, the private key (for
          #    the proof), and the password, each as a 0600 file in a 0700
          #    directory, the same handoff lifeos-backup.yml uses. Two cleanups,
          #    as there: the remote script's own trap, and this fallback.
          remote_dir="storagebox-authorize-tmp"
          vps() {
            ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
              "deploy@$DEPLOY_HOST" "$@"
          }
          handoff="$RUNNER_TEMP/storagebox-authorize-handoff"
          cleanup_remote() {
            vps "rm -rf \"$remote_dir\"" 2>/dev/null || true
            rm -rf "$handoff"
          }
          trap cleanup_remote EXIT
          mkdir -m 700 "$handoff"
          cp "$pub_file" "$handoff/pub"
          cp "$key_file" "$handoff/key"
          cat > "$handoff/pw" <<<"$pw"
          vps "mkdir -p -m 700 \"$remote_dir\""
          scp -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            "$handoff/pub" "$handoff/key" "$handoff/pw" "deploy@$DEPLOY_HOST:$remote_dir/"

          # 8. On the VPS: install the public key (install-ssh-key appends and
          #    never overwrites), then prove a key-only login. ssh reads the
          #    password from an SSH_ASKPASS file, never argv or the
          #    environment. A fresh password can take a moment to apply, so a
          #    failed install is retried every 20s, at most 6 times.
          vps "STORAGEBOX_HOST='$STORAGEBOX_HOST' STORAGEBOX_USER='$STORAGEBOX_USER' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$HOME/storagebox-authorize-tmp"
          trap 'rm -rf "$HOME/storagebox-authorize-tmp"' EXIT
          chmod 600 pub key pw
          printf '#!/bin/sh\ncat "%s/pw"\n' "$PWD" > askpass
          chmod 700 askpass
          attempts=6
          for ((attempt = 1; ; attempt++)); do
            rc=0
            SSH_ASKPASS="$PWD/askpass" SSH_ASKPASS_REQUIRE=force \
              ssh -p23 -o StrictHostKeyChecking=accept-new -o PubkeyAuthentication=no \
              -o NumberOfPasswordPrompts=1 "$STORAGEBOX_USER@$STORAGEBOX_HOST" install-ssh-key < pub || rc=$?
            (( rc != 0 && attempt < attempts )) || break
            echo "install-ssh-key attempt $attempt of $attempts failed (ssh exit $rc); retrying in 20s." >&2
            sleep 20
          done
          if (( rc != 0 )); then
            echo "install-ssh-key failed after $attempt attempt(s) (ssh exit $rc)" >&2
            exit 1
          fi
          ssh -p23 -i ./key -o BatchMode=yes -o PasswordAuthentication=no \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new "$STORAGEBOX_USER@$STORAGEBOX_HOST" ls >/dev/null
          REMOTE

          # 9. The only summary output: the box id and the key fingerprint.
          fingerprint="$(ssh-keygen -lf "$pub_file" | awk '{print $2}')"
          printf 'Storage Box id %s: key fingerprint %s authorized; key-only login verified.\n' \
            "$box_id" "$fingerprint" >> "$GITHUB_STEP_SUMMARY"

      # 10. Runs even when the main step failed, so the key never outlives the run.
      - name: Shred the temporary key files
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for f in "$RUNNER_TEMP/storagebox-authorize.key" "$RUNNER_TEMP/storagebox-authorize.pub"; do
            if [ -e "$f" ]; then
              shred -u "$f"
            fi
          done
