name: Probe A no-uses

# TEMPORARY DIAGNOSTIC. Has every structural feature the three failing PR
# gates share (merge_group trigger, paths filter, concurrency with the same
# expression, workflow- and job-level permissions) but NO `uses:` step.
# If this succeeds, none of those structural features is the cause.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "apps/**"
      - "packages/**"
      - ".github/**"
  merge_group:

concurrency:
  group: probe-a-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - run: echo "structural features are fine"
