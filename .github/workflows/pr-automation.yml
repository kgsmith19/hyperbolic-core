name: PR Automation

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, converted_to_draft, synchronize, labeled, unlabeled, review_requested]
  workflow_run:
    workflows: ["PR Gate"]
    types: [completed]
  pull_request_review:
    types: [submitted, dismissed]
  issue_comment:
    types: [created, edited]
  schedule:
    - cron: "17 */6 * * *"

concurrency:
  group: pr-automation-${{ github.event.pull_request.number || github.event.issue.number || github.event.workflow_run.pull_requests[0].number || github.repository }}
  cancel-in-progress: false

jobs:
  pr-event:
    if: github.event_name == 'pull_request_target'
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: kgsmith19/agent-engineering-standard/.github/workflows/pr-automation-reusable.yml@a9d1bf7a43dd8727d8ae7f031da2abe9ad9ff0b1
    with:
      mode: pr-event
      pr_number: ${{ github.event.pull_request.number }}
      standard_sha: a9d1bf7a43dd8727d8ae7f031da2abe9ad9ff0b1

  gate-result:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0] != null
    permissions:
      checks: write
      contents: read
      issues: write
      pull-requests: write
    uses: kgsmith19/agent-engineering-standard/.github/workflows/pr-automation-reusable.yml@a9d1bf7a43dd8727d8ae7f031da2abe9ad9ff0b1
    with:
      mode: gate-result
      pr_number: ${{ github.event.workflow_run.pull_requests[0].number }}
      gate_conclusion: ${{ github.event.workflow_run.conclusion }}
      gate_head_sha: ${{ github.event.workflow_run.head_sha }}
      gate_run_id: ${{ github.event.workflow_run.id }}
      standard_sha: a9d1bf7a43dd8727d8ae7f031da2abe9ad9ff0b1

  review-event:
    if: github.event_name == 'pull_request_review'
    permissions:
      checks: write
      contents: read
      issues: write
      pull-requests: write
    uses: kgsmith19/agent-engineering-standard/.github/workflows/pr-automation-reusable.yml@a9d1bf7a43dd8727d8ae7f031da2abe9ad9ff0b1
    with:
      mode: review-event
      pr_number: ${{ github.event.pull_request.number }}
      standard_sha: a9d1bf7a43dd8727d8ae7f031da2abe9ad9ff0b1

  comment-event:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      (github.event.comment.user.login == 'Copilot' || github.event.comment.user.login == 'copilot-pull-request-reviewer[bot]' || github.event.comment.user.login == 'copilot-swe-agent[bot]') &&
      (contains(github.event.comment.body, 'AI-REVIEW PASS') || contains(github.event.comment.body, 'AI-REVIEW FAIL'))
    permissions:
      checks: write
      contents: read
      issues: write
      pull-requests: write
    uses: kgsmith19/agent-engineering-standard/.github/workflows/pr-automation-reusable.yml@a9d1bf7a43dd8727d8ae7f031da2abe9ad9ff0b1
    with:
      mode: comment-event
      pr_number: ${{ github.event.issue.number }}
      standard_sha: a9d1bf7a43dd8727d8ae7f031da2abe9ad9ff0b1

  watchdog:
    if: github.event_name == 'schedule'
    permissions:
      checks: write
      contents: read
      issues: write
      pull-requests: write
    uses: kgsmith19/agent-engineering-standard/.github/workflows/pr-automation-reusable.yml@a9d1bf7a43dd8727d8ae7f031da2abe9ad9ff0b1
    with:
      mode: watchdog
      standard_sha: a9d1bf7a43dd8727d8ae7f031da2abe9ad9ff0b1
