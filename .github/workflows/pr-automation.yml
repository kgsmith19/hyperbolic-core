name: "Orchestrator: PR Lifecycle"

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, converted_to_draft, synchronize, edited, labeled, unlabeled, review_requested, auto_merge_enabled, auto_merge_disabled]

# One repo-wide non-canceling authority lock shared by evaluator and orchestrator; GitHub keeps only the newest pending run per group and the six-hourly watchdog is the convergence net.
concurrency:
  group: automation-authority-${{ github.repository }}
  cancel-in-progress: false

jobs:
  pr-event:
    if: github.event.pull_request == null || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: kgsmith19/agent-engineering-standard/.github/workflows/pr-automation-reusable.yml@4a635f0ffd438196632886af53ba56072ca5b143
    with:
      mode: pr-event
      pr_number: ${{ github.event.pull_request.number }}
      standard_sha: 4a635f0ffd438196632886af53ba56072ca5b143
    secrets:
      automation_token: ${{ secrets.AUTOMATION_TOKEN }}
