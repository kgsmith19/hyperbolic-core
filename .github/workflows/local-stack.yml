name: "Proof: Local Stack"

# #504 live proof on a clean GitHub-hosted runner with no cloud credentials:
# the whole local stack comes up from the root compose.yaml, every service
# reports healthy, a backup restores and verifies, and a canary on shifted
# ports passes and tears itself down. Not a PR check (pr-verify.yml is the
# only pull-request workflow): it runs on demand and after a merge that
# touches the stack.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - compose.yaml
      - Makefile
      - ops/**
      - "**/Dockerfile"

permissions:
  contents: read

concurrency:
  group: local-stack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stack:
    name: "Proof: make up, telemetry, backup, restore drill, canary"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install workspace dependencies (broker policy generator)
        run: npm ci --no-audit --no-fund
      - name: make up
        run: make up
      - name: make telemetry
        run: make telemetry
      - name: make backup and restore-drill
        run: make backup && make restore-drill && cat var/restore-drill.json
      - name: make canary
        run: make canary
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: make down
        if: always()
        run: make down
