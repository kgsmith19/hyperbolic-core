name: "LLM Review Dialogue"

# Posts AI Review's findings into the pull request as ONE managed comment,
# keeps a round counter, wakes the developer agent, and escalates to the
# owner when the disagreement will not resolve. Issue #128 claims 7 and 8
# specified this; PR #130 deferred it and Issue #231 tracks it.
#
# WHY THIS IS A SEPARATE workflow_run WORKFLOW, and not a step somewhere in
# pr-verify.yml -- three constraints intersect, and workflow_run is the only
# shape that satisfies all three at once:
#
#   1. The reviewer job CANNOT post. ai-review runs `npm ci` and executes
#      pull-request-authored code while holding a provider credential.
#      llm-review.yml says so verbatim ("must not also carry a token that
#      could speak on a PR's behalf") and commit 1e4f8e5 removed that grant
#      deliberately. Giving it pull-requests: write would hand a PR author's
#      own code a token over their PR. This holds regardless of AI Review
#      being a mandatory needs: dependency of PR Gate now (#232) -- being
#      required in substance changes nothing about which job is safe to
#      trust with a write token.
#   2. PR Gate CANNOT post it either, even though it already runs after
#      ai-review and already holds pull-requests: write. Its own contract
#      test (docs/ops/pr-verify-workflow.test.mjs) pins it as the terminal
#      job with exactly one embedded script block, on the strength that this
#      keeps it auditable in one read; adding verdict-rendering logic there
#      would grow that one script into two concerns with different trust
#      inputs (context.payload/API responses vs. an artifact carrying
#      model-authored text) and break the "boring, single script" contract
#      the file's own header now states explicitly.
#   3. A new job in pr-verify.yml would add a new check row. One check row
#      per job is a GitHub invariant with no suppression mechanism, and the
#      nine-lane-into-one-rollup shape was bought deliberately (AGENTS.md >
#      PR Gate and merge behavior, and its own #232 rollup comment).
#
# A workflow_run workflow reports NO pull-request check row, so it adds
# none, and it runs from the base repository with its own token rather than
# the triggering run's -- which is exactly why it may hold write scope while
# the job that ran the PR's code may not.
#
# TRUST NOTE. This workflow holds pull-requests: write and therefore obeys
# the same discipline as PR Gate: NO actions/checkout, and no shell over
# repository content. It touches exactly two things from the untrusted
# side -- a downloaded artifact, parsed as JSON data and never executed, and
# the model-authored strings inside it, which are neutralized before they are
# rendered (see `neutralize` below). The pull request number travels in that
# artifact, so it is treated as a claim, not a fact: it is verified against
# the triggering run's own head SHA before anything is posted.
#
# OPTIONAL owner-provisioned setting: vars.LLM_REVIEW_ESCALATE_AFTER (round
# threshold before tagging the owner; defaults to 10 when unset or invalid --
# raised from 9 by explicit owner directive, Issue #284 (itself raised from 3
# by Issue #281), so the reviewer gets more rounds to converge before
# escalating). Everything else this workflow
# needs -- posting findings, counting rounds -- works with no setup at all;
# only the developer-agent handoff in dev-agent-dispatch.yml needs a credential,
# and only for whichever vendor agent-roles.yaml's dev.provider currently
# names (see below).
on:
  workflow_run:
    # "LLM Review Recheck" (Issue #262's follow-on slice 8) reuses the exact
    # same verify-llm-review composite action ai-review does, so its verdict
    # artifact is fetched and rendered here identically -- this workflow
    # does not care WHICH of the two produced it, only that github.event
    # .workflow_run.id names the run that actually did.
    workflows: ["PR Verification", "LLM Review Recheck"]
    types: [completed]

permissions:
  contents: read

concurrency:
  # Keyed on the head SHA rather than the run: a re-run for the same commit
  # must update the same comment, not race a second copy of itself.
  group: llm-review-dialogue-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  dialogue:
    name: "Review dialogue"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only same-repository pull requests. A fork's run gets no managed
    # comment, exactly as it gets no auto-merge arming today -- and a fork
    # must never reach a write token by way of an artifact it authored.
    # head_repository.fork is GitHub's own purpose-built field for this
    # check (docs: "Events that trigger workflows"), not a same-repo
    # full_name comparison reimplementing the same fact less directly.
    #
    # A recheck run (event == 'repository_dispatch') has no PR head/base
    # repo shape to check the same way -- but it needs none: it exists only
    # because dev-agent-dispatch.yml fired it, which itself only ever runs
    # for a dispatch this same fork check already passed once, upstream, the
    # first time the PR was woken. There is no path to a repository_dispatch
    # run here that did not already clear this exact check.
    if: >-
      (github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.head_repository.fork == false) ||
      github.event.workflow_run.event == 'repository_dispatch'
    permissions:
      contents: read
      pull-requests: write
      issues: write
      # Needed to read an artifact belonging to the triggering run.
      actions: read
      # Needed only for the Infisical OIDC exchange below -- this job never
      # gained this before because it never authenticated as anything but
      # github.token. Scoped to this job like every other OIDC consumer in
      # this repo (ai-review, dev-agent-dispatch).
      id-token: write
    steps:
      # continue-on-error, not a hard failure: the artifact is absent for
      # every legitimate run where the reviewer never produced one -- most
      # commonly because Repository Standards failed, so AI Review was
      # skipped by its own needs:. That is silence, not breakage.
      - name: Dialogue · Fetch the reviewer's verdict
        id: fetch
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: llm-review-verdict
          path: ${{ runner.temp }}/llm-review
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Dialogue · No verdict to report
        if: steps.fetch.outcome != 'success'
        run: 'echo "AI Review produced no verdict artifact for this run; nothing to post."'

      # The reviewer's own posting identity (Issue #272). Reuses the same
      # Infisical identity and /review/ secret path verify-llm-review already
      # pulls REVIEW_GITHUB_APP_ID/REVIEW_GITHUB_APP_PRIVATE_KEY from -- that
      # OIDC identity's access to this path is already proven live (the AI
      # Review job exports these two alongside the model provider keys), so
      # this reuses rather than provisions a second identity for the same
      # role. continue-on-error: true is deliberate and asymmetric with how
      # verify-llm-review's own preflight fails closed: THAT gate computes
      # the actual pass/block verdict, so an unprovisioned credential there
      # must never silently report green. THIS workflow only delivers
      # findings someone else already computed -- posting under the generic
      # identity is a real, correct outcome if the App credential is
      # missing, never posting at all (because minting failed) is not. See
      # REVIEW_APP_TOKEN_MINTED below for how the fallback is made visible
      # rather than silent.
      - name: Dialogue · Pull the reviewer App's credentials from Infisical
        if: steps.fetch.outcome == 'success'
        id: review-app-secrets
        continue-on-error: true
        uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_REVIEW_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          secret-path: "/review/"
          domain: https://app.infisical.com

      - name: Dialogue · Mint the reviewer App's installation token
        if: steps.fetch.outcome == 'success' && steps.review-app-secrets.outcome == 'success'
        id: review-app-token
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ env.REVIEW_GITHUB_APP_ID }}
          private-key: ${{ env.REVIEW_GITHUB_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      # Cheap presence-check only, for the "should we wake the fixer" decision
      # below -- a different Infisical identity (vars.INFISICAL_DEV_IDENTITY_ID)
      # and secret path (/dev/) than the reviewer's own pull above, because dev
      # and review are separate identities with separate access scopes.
      # continue-on-error: true for the same reason as the reviewer pull: this
      # workflow only decides whether to dispatch a fixer, it must never fail
      # the whole posting job over that decision.
      - name: Dialogue · Check whether the dev agent's Anthropic credential is provisioned in Infisical
        if: steps.fetch.outcome == 'success'
        id: dev-agent-secrets
        continue-on-error: true
        uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_DEV_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          secret-path: "/dev/"
          domain: https://app.infisical.com

      - name: Dialogue · Post findings, count the round, escalate if unresolved
        if: steps.fetch.outcome == 'success'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          # Everything the script reads arrives through env, never through
          # ${{ }} interpolation into the script body -- that is the standard
          # script-injection hardening, and it matters more than usual here
          # because some of these values originate in a pull request.
          ARTIFACT_DIR: ${{ runner.temp }}/llm-review
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          ESCALATE_AFTER: ${{ vars.LLM_REVIEW_ESCALATE_AFTER }}
          # Booleans only, computed at the expression level -- the actual
          # credential values never enter this script's env, matching this
          # job's own no-checkout/no-repository-content discipline (see TRUST
          # NOTE above). Sourced from the dev-agent-secrets Infisical pull
          # above (env.DEV_*), the same /dev/ path dev-agent-dispatch.yml's
          # own preflight reads -- not a GitHub secret, so there is exactly
          # one place this credential is stored. dev-agent-dispatch.yml only
          # implements anthropic today (see its own header comment), so
          # agentProvisioned below requires dev.provider === "anthropic" in
          # addition to one of these.
          HAS_ANTHROPIC_OAUTH: ${{ env.DEV_CLAUDE_CODE_OAUTH_TOKEN != '' }}
          HAS_ANTHROPIC_API_KEY: ${{ env.DEV_ANTHROPIC_API_KEY != '' }}
          # Visible-fallback signal for the summary (Issue #272) -- whether
          # this run actually posted under the reviewer's own identity or
          # fell back to github.token.
          REVIEW_APP_TOKEN_MINTED: ${{ steps.review-app-token.outcome == 'success' }}
        with:
          # Falls back to the job's own github.token when the App token
          # could not be minted (unprovisioned credential, Infisical outage,
          # or an invalid key) -- see the continue-on-error note above. Never
          # empty: github.token always exists for a same-repository run.
          github-token: ${{ steps.review-app-token.outputs.token || github.token }}
          script: |
            const fs = require("node:fs");
            const path = require("node:path");

            const { owner, repo } = context.repo;

            // Specified in Issue #128 claim 7. Must be the FIRST bytes of the
            // comment body: the upsert finds it with startsWith, the same
            // convention the Work State comment uses.
            const MARKER = "<!-- agent-engineering-standard:llm-review:v1 -->";
            const STATE_OPEN = "<!-- llm-review-state: ";
            const STATE_CLOSE = " -->";
            const OWNER_HANDLE = "kgsmith19";
            const DEFAULT_ESCALATE_AFTER = 10;

            const escalateAfter = (() => {
              const raw = Number.parseInt(process.env.ESCALATE_AFTER || "", 10);
              return Number.isInteger(raw) && raw > 0 ? raw : DEFAULT_ESCALATE_AFTER;
            })();

            // Issue #272: this run's `github` client is authenticated as the
            // reviewer's own App identity when that credential minted
            // successfully, or falls back to github.token (posting under
            // github-actions[bot]) when it did not. The fallback is a real,
            // correct outcome -- findings must still reach the pull request
            // -- so it is surfaced here rather than failing the job.
            const reviewAppTokenMinted = process.env.REVIEW_APP_TOKEN_MINTED === "true";
            if (!reviewAppTokenMinted) {
              core.warning(
                "Posting as github-actions[bot]: the reviewer's own App credential did not mint " +
                  "(unprovisioned, an Infisical outage, or an invalid key). Findings are still " +
                  "posted -- only the posting identity fell back."
              );
            }

            // Read agent-roles.yaml from the DEFAULT branch, never a pull
            // request's own branch -- this job never checks out repository
            // content at all (see TRUST NOTE above), and even if it did, a
            // PR branch must not be able to edit its own agent-roles.yaml and
            // claim a different dev identity for itself. Duplicated in
            // dev-agent-dispatch.yml's own preflight step rather than shared:
            // there is no import mechanism between two workflow files' embedded
            // scripts, and the parse is eight lines against one fixed shape.
            async function readDevProvider() {
              try {
                const { data } = await github.rest.repos.getContent({ owner, repo, path: "agent-roles.yaml" });
                const content = Buffer.from(data.content, data.encoding).toString("utf8");
                const match = /\bdev:\s*\n(?:[^\n]*\n)*?\s*provider:\s*(\S+)/.exec(content);
                return match ? match[1].trim().toLowerCase() : null;
              } catch (error) {
                core.warning(`Could not read agent-roles.yaml: ${error.message}`);
                return null;
              }
            }
            const devProvider = await readDevProvider();

            // dev-agent-dispatch.yml only implements anthropic today (its own
            // header comment explains why openai/antigravity fail closed
            // there instead of guessing at an unverified action shape), so
            // firing the dispatch for any other provider would just wake a
            // job whose own preflight immediately fails -- treat it the same
            // as "not provisioned" here, which escalates to the owner
            // immediately instead of waiting out a dispatch doomed to fail.
            const agentProvisioned =
              devProvider === "anthropic" &&
              (process.env.HAS_ANTHROPIC_OAUTH === "true" || process.env.HAS_ANTHROPIC_API_KEY === "true");

            // ---------------------------------------------------------------
            // Read the artifact. It is DATA: parsed, never executed.
            // ---------------------------------------------------------------
            const dir = process.env.ARTIFACT_DIR;
            function readJson(name) {
              const file = path.join(dir, name);
              if (!fs.existsSync(file)) return null;
              try {
                return JSON.parse(fs.readFileSync(file, "utf8"));
              } catch (error) {
                core.warning(`Could not parse ${name}: ${error.message}`);
                return null;
              }
            }

            const meta = readJson("review-meta.json");
            if (!meta || !Number.isInteger(meta.prNumber)) {
              core.warning("Verdict artifact carried no usable pull request number; nothing posted.");
              return;
            }

            // The PR number came from the untrusted side, so prove it names
            // the pull request this run actually judged before writing to it.
            // Without this check a crafted artifact could aim a write token
            // at an unrelated pull request.
            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: meta.prNumber,
            });
            if (pr.head.sha !== process.env.RUN_HEAD_SHA) {
              core.warning(
                `Artifact names PR #${meta.prNumber}, whose head is ${pr.head.sha}, but this run judged ${process.env.RUN_HEAD_SHA}. Refusing to post.`
              );
              return;
            }

            const verdict = readJson("review-verdict.json");
            const headSha = process.env.RUN_HEAD_SHA;
            const shortSha = headSha.slice(0, 7);

            // ---------------------------------------------------------------
            // Neutralize model-authored text before it is rendered.
            // ---------------------------------------------------------------
            // Every one of these strings is written by the reviewer model,
            // and `evidence` is verbatim code quoted out of the pull request
            // -- so both a confused model and a hostile diff can steer it. It
            // is rendered, never trusted: mentions and issue references are
            // defused with a zero-width space so quoted code cannot ping a
            // third party or cross-link an unrelated issue, and length is
            // capped so one finding cannot exhaust the comment budget.
            function neutralize(value, cap = 1200) {
              let text = typeof value === "string" ? value : String(value ?? "");
              text = text.replace(/\r/g, "");
              if (text.length > cap) text = `${text.slice(0, cap)}\n…[truncated]`;
              // The zero-width space only needs to land between "@" and the
              // FIRST username character to break GitHub's mention adjacency
              // -- a valid username can never start with "-", so "@kg-smith"
              // was already defused by inserting it before "k". Broadened to
              // [A-Za-z0-9-] anyway: explicit and inert-either-way is better
              // than "relies on a GitHub username-shape rule the reader has
              // to reconstruct to trust it" (AI Review finding on PR #234).
              text = text.replace(/@([A-Za-z0-9-])/g, "@​$1");
              text = text.replace(/(^|[^\w`])#(\d)/g, "$1#​$2");
              return text;
            }

            // A fence long enough that nothing inside can close it early.
            function codeBlock(value) {
              const text = neutralize(value);
              const longest = (text.match(/`+/g) || []).reduce((n, run) => Math.max(n, run.length), 0);
              const fence = "`".repeat(Math.max(3, longest + 1));
              return `${fence}\n${text}\n${fence}`;
            }

            function locate(finding) {
              if (!finding.file) return "";
              return finding.line ? ` — \`${neutralize(finding.file, 200)}:${finding.line}\`` : ` — \`${neutralize(finding.file, 200)}\``;
            }

            function renderFinding(finding, index) {
              return [
                `#### ${index}. \`${neutralize(finding.category || "unspecified", 60)}\`${locate(finding)}`,
                "",
                `**Claim.** ${neutralize(finding.claim)}`,
                "",
                "**Evidence.**",
                codeBlock(finding.evidence),
                "",
                `**Requested change.** ${neutralize(finding.requestedChange)}`,
                "",
                `**Cites.** ${neutralize(finding.citation, 300)}`,
              ].join("\n");
            }

            // ---------------------------------------------------------------
            // Prior state lives in the comment itself -- there is nowhere
            // else to keep it that survives a run.
            // ---------------------------------------------------------------
            async function findManagedComment() {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: meta.prNumber,
                per_page: 100,
              });
              return comments.find((entry) => (entry.body || "").startsWith(MARKER)) || null;
            }

            function parseState(body) {
              if (!body) return null;
              const start = body.indexOf(STATE_OPEN);
              if (start < 0) return null;
              const end = body.indexOf(STATE_CLOSE, start);
              if (end < 0) return null;
              try {
                return JSON.parse(body.slice(start + STATE_OPEN.length, end));
              } catch {
                return null;
              }
            }

            const existing = await findManagedComment();
            const prior = parseState(existing?.body) || { round: 0, headSha: null, escalated: false, deferredIssues: {} };

            // ---------------------------------------------------------------
            // Classify this run.
            // ---------------------------------------------------------------
            // "Reviewed and passed" and "never ran" both have to be told
            // apart from each other AND from "blocked" -- reporting a gate
            // that never ran as a clean bill of health would be the worst of
            // the three failures.
            const ran = Boolean(verdict) && meta.verdictPresent === true;
            const blocking = ran && verdict.verdict === "block";
            const findings = ran && Array.isArray(verdict.findings) ? verdict.findings : [];
            const discarded = ran && Array.isArray(verdict.discarded) ? verdict.discarded : [];
            // outOfScope excuses a finding from blocking without changing its
            // severity (packages/review/src/types.ts) -- so it must come out
            // of blockingFindings here too, or the render would keep showing
            // "blocking" on a finding the verdict itself no longer blocks on.
            const blockingFindings = findings.filter((f) => f.severity === "blocking" && f.outOfScope !== true);
            const advisoryFindings = findings.filter((f) => f.severity !== "blocking" && f.outOfScope !== true);
            const deferredFindings = findings.filter((f) => f.outOfScope === true);

            if (!ran) {
              core.info("The reviewer produced no verdict (unprovisioned or infrastructure failure); leaving the dialogue comment untouched.");
              return;
            }

            // A new head with the objection still standing is a new round. A
            // re-run on the same commit is the same round -- re-running must
            // not inflate the counter toward an escalation nobody earned.
            const sameHead = prior.headSha === headSha;
            let round = prior.round || 0;
            let escalated = Boolean(prior.escalated);
            if (blocking && !sameHead) round += 1;
            if (blocking && round === 0) round = 1;
            if (!blocking) {
              // Resolved: the streak resets, so a later regression starts its
              // own count rather than inheriting a spent one.
              round = 0;
              escalated = false;
            }

            // ---------------------------------------------------------------
            // Wake the developer agent.
            // ---------------------------------------------------------------
            // repository_dispatch, not an @mention: a comment posted with
            // GITHUB_TOKEN cannot trigger issue_comment workflows (GitHub's
            // recursion prevention), and repository_dispatch is one of the two
            // documented exceptions. So the handoff needs no PAT and no App
            // token. The payload carries identifiers only -- the agent reads
            // the findings from the comment, so no model text crosses here.
            let dispatchFailed = false;
            if (blocking && agentProvisioned) {
              try {
                await github.rest.repos.createDispatchEvent({
                  owner,
                  repo,
                  event_type: "llm-review-finding",
                  client_payload: {
                    prNumber: meta.prNumber,
                    headSha,
                    round,
                    runUrl: process.env.RUN_URL,
                  },
                });
                core.info(`Dispatched llm-review-finding for PR #${meta.prNumber} (round ${round}).`);
              } catch (error) {
                dispatchFailed = true;
                core.warning(`Could not wake the developer agent: ${error.message}`);
              }
            }

            // ---------------------------------------------------------------
            // Escalate. This is the part that must never silently not happen.
            // ---------------------------------------------------------------
            // Three ways to earn an escalation, and the last two matter as
            // much as the first: a loop that CANNOT advance must not wait out
            // a round counter that will never increment, because rounds only
            // tick when somebody pushes a new head. An unprovisioned or
            // broken agent is a true gap needing manual intervention, which
            // is exactly what the owner asked to be told about.
            const cannotAdvance = !agentProvisioned || dispatchFailed;
            const escalateNow = blocking && !escalated && (round >= escalateAfter || cannotAdvance);
            if (escalateNow) escalated = true;

            // ---------------------------------------------------------------
            // File a non-blocking Issue for each finding the reviewer and the
            // dev agent agreed is legitimate but out of this pull request's
            // scope (packages/review/src/types.ts's outOfScope field). This
            // NEVER blocks: deferredFindings is already excluded from
            // blockingFindings above, and nothing here can change `blocking`.
            // ---------------------------------------------------------------
            const DEFERRED_MARKER_OPEN = "<!-- llm-review-deferred: ";
            const DEFERRED_MARKER_CLOSE = " -->";

            function fingerprintOf(finding) {
              return require("node:crypto")
                .createHash("sha256")
                .update(`${finding.category}|${finding.file ?? ""}|${finding.line ?? ""}`)
                .digest("hex")
                .slice(0, 16);
            }

            // Prose can drift slightly between rounds even at temperature 0
            // (packages/review/src/review.ts), so the fingerprint deliberately
            // hashes only the STRUCTURAL fields (category/file/line) -- never
            // the free-text claim/evidence, which would make the fingerprint
            // too sensitive and fail toward duplicate Issues, the bad
            // direction for an "only ever file this once" guarantee.
            const deferredIssues = { ...(prior.deferredIssues || {}) };

            for (const finding of deferredFindings) {
              const fingerprint = fingerprintOf(finding);
              if (deferredIssues[fingerprint]) {
                continue; // already filed and recorded in the managed comment's own state
              }

              // Fallback: the managed comment's state can be lost (hand-edited,
              // or a marker parse failure) without the Issue itself vanishing.
              // Search for it by the same fingerprint before creating a new
              // one, so state loss degrades to "found by search" rather than
              // "filed again."
              let existingIssueNumber = null;
              try {
                const searchResult = await github.rest.search.issuesAndPullRequests({
                  q: `repo:${owner}/${repo} is:issue in:body "${DEFERRED_MARKER_OPEN}${fingerprint}${DEFERRED_MARKER_CLOSE}"`,
                });
                existingIssueNumber = searchResult.data.items[0]?.number ?? null;
              } catch (error) {
                core.warning(`Could not search for an existing deferred Issue (fingerprint ${fingerprint}): ${error.message}`);
              }

              if (existingIssueNumber !== null) {
                deferredIssues[fingerprint] = existingIssueNumber;
                continue;
              }

              try {
                const created = await github.rest.issues.create({
                  owner,
                  repo,
                  title: `[AI Review, deferred] ${neutralize(finding.claim, 120)}`,
                  body: [
                    `${DEFERRED_MARKER_OPEN}${fingerprint}${DEFERRED_MARKER_CLOSE}`,
                    `Opened by the automated reviewer during review of #${meta.prNumber} — legitimate finding, agreed with the dev agent to be out of that pull request's scope. **Does not block #${meta.prNumber}.**`,
                    "",
                    `**Category.** \`${neutralize(finding.category, 60)}\``,
                    finding.file ? `**Location.** \`${neutralize(finding.file, 200)}${finding.line ? `:${finding.line}` : ""}\`` : "",
                    "",
                    `**Claim.** ${neutralize(finding.claim, 1200)}`,
                    "",
                    "**Evidence.**",
                    "```",
                    neutralize(finding.evidence, 1200),
                    "```",
                    "",
                    `**Requested change.** ${neutralize(finding.requestedChange, 1200)}`,
                    "",
                    `**Cites.** ${neutralize(finding.citation, 300)}`,
                  ]
                    .filter((line) => line !== "")
                    .join("\n"),
                  labels: ["source:ai-review"],
                });
                deferredIssues[fingerprint] = created.data.number;
                core.info(`Filed deferred Issue #${created.data.number} for PR #${meta.prNumber} (fingerprint ${fingerprint}).`);
              } catch (error) {
                core.warning(`Could not file a deferred Issue for fingerprint ${fingerprint}: ${error.message}`);
              }
            }

            const state = { round, headSha, escalated, verdict: verdict.verdict, deferredIssues };

            // ---------------------------------------------------------------
            // Build the comment.
            // ---------------------------------------------------------------
            const lines = [MARKER, `${STATE_OPEN}${JSON.stringify(state)}${STATE_CLOSE}`, ""];

            if (blocking) {
              lines.push(`## 🔍 LLM Review — round ${round}`, "");
              lines.push(
                `**Verdict: \`block\`** · head \`${shortSha}\` · [review run](${process.env.RUN_URL})`,
                ""
              );
            } else {
              lines.push("## 🔍 LLM Review — resolved", "");
              lines.push(
                `**Verdict: \`pass\`** · head \`${shortSha}\` · [review run](${process.env.RUN_URL})`,
                ""
              );
            }

            lines.push(neutralize(verdict.summary, 2000), "");

            if (blockingFindings.length > 0) {
              lines.push(`### Blocking findings (${blockingFindings.length})`, "");
              blockingFindings.forEach((finding, i) => lines.push(renderFinding(finding, i + 1), ""));
            }

            if (advisoryFindings.length > 0) {
              lines.push(
                "<details>",
                `<summary><b>Advisory findings (${advisoryFindings.length})</b> — these do not block</summary>`,
                ""
              );
              advisoryFindings.forEach((finding, i) => lines.push(renderFinding(finding, i + 1), ""));
              lines.push("</details>", "");
            }

            if (deferredFindings.length > 0) {
              lines.push(`### Deferred findings (${deferredFindings.length}) — agreed out of scope, does not block`, "");
              deferredFindings.forEach((finding, i) => {
                const fingerprint = fingerprintOf(finding);
                const issueNumber = deferredIssues[fingerprint];
                lines.push(renderFinding(finding, i + 1));
                lines.push(issueNumber ? `**Tracked in.** #${issueNumber}` : "_Could not file a tracking Issue for this finding; see the run log._", "");
              });
            }

            if (discarded.length > 0) {
              lines.push(
                "<details>",
                `<summary><b>Discarded (${discarded.length})</b> — missing evidence or citation, cannot block</summary>`,
                "",
                "Per `AGENTS.md` > Independent LLM Review, a finding without both concrete evidence and a citation is invalid output. These are shown for transparency and carry no weight.",
                ""
              );
              discarded.forEach((finding, i) => lines.push(renderFinding(finding, i + 1), ""));
              lines.push("</details>", "");
            }

            if (blocking) {
              lines.push("---", "");
              if (agentProvisioned && !dispatchFailed) {
                lines.push(
                  "@claude — you authored this change. Read each blocking finding above and resolve it:",
                  "",
                  "1. **Fix it** — push a commit and let the gates re-run, or",
                  "2. **Rebut it** — reply here with the argument, grounded in the linked Issue's acceptance criteria, `AGENTS.md`, and the diff. Objectively, never from taste.",
                  "",
                  `A finding you neither fix nor rebut is unresolved, and after ${escalateAfter} rounds this comment escalates to @${OWNER_HANDLE}.`,
                  ""
                );
              } else {
                lines.push(
                  "_The developer agent could not be woken automatically, so this finding needs a human._",
                  ""
                );
              }
            }

            if (escalated) {
              lines.push("> [!IMPORTANT]", `> @${OWNER_HANDLE} — this needs your decision.`, ">");
              if (cannotAdvance) {
                lines.push(
                  `> The reviewer is blocking, but the developer agent ${agentProvisioned ? "could not be reached" : "is not provisioned"}, so no automated resolution is coming. Nothing will advance this without you.`,
                  ">"
                );
              } else {
                lines.push(
                  `> ${round} rounds have passed on this pull request with the gate still red and the disagreement unresolved.`,
                  ">"
                );
              }
              lines.push(
                `> Unresolved: ${blockingFindings.length} blocking finding(s), the first being — ${neutralize(blockingFindings[0]?.claim || verdict.summary, 400)}`,
                ">",
                "> You may merge over this at any time; a red review is a status check and never a veto on you.",
                ""
              );
            }

            const body = lines.join("\n");

            // Exactly one comment, updated in place. A stream of new comments
            // per run is a named forbidden outcome in Issue #128.
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: meta.prNumber, body });
            }

            core.summary.addHeading("LLM Review Dialogue");
            core.summary.addRaw(
              [
                `- Pull request: #${meta.prNumber} (head \`${shortSha}\`)`,
                `- Verdict: \`${verdict.verdict}\``,
                `- Round: ${round} (escalates at ${escalateAfter})`,
                `- Agent woken: ${blocking && agentProvisioned && !dispatchFailed ? "yes" : "no"}`,
                `- Owner escalated: ${escalated ? "yes" : "no"}`,
                `- Posted as: ${reviewAppTokenMinted ? "reviewer App identity" : "github-actions[bot] (fallback)"}`,
              ].join("\n"),
              true
            );
            await core.summary.write();
