name: Platform Deploy

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy.yml"
      - "apps/shell/**"
      - "packages/**"
      - "services/llm-handler/**"
      - "services/brain/**"
      - "apps/agentic-command-center/backend/kernel/**"
      - "apps/agentic-command-center/backend/hooks/**"
      - "apps/agentic-command-center/backend/runner/**"
      - "apps/agentic-command-center/backend/policy.json"
      - "apps/toolbelt/guards/**"
      - "apps/toolbelt/**/supabase/migrations/**"
      - "docs/ops/prune-dist-dirs.sh"
      - "docs/ops/prune-docker-images.sh"
  workflow_dispatch:
    inputs:
      deploy_shell:
        description: Build and deploy Shell from the current main commit.
        required: true
        type: boolean
        default: true
      deploy_llm_handler:
        description: Build and deploy Handler A (services/llm-handler) from the current main commit.
        required: true
        type: boolean
        default: true
      deploy_brain:
        description: Build and deploy the Brain (services/brain) from the current main commit.
        required: true
        type: boolean
        default: true
      apply_migrations:
        description: Apply pending platform migrations before Shell/Handler A/Brain deploy.
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  changes:
    name: Determine changed units
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shell: ${{ steps.changes.outputs.shell }}
      llm_handler: ${{ steps.changes.outputs.llm_handler }}
      brain: ${{ steps.changes.outputs.brain }}
      migrations: ${{ steps.changes.outputs.migrations }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: changes
        name: Classify deployable changes
        env:
          BEFORE: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            {
              echo "shell=${{ inputs.deploy_shell }}"
              echo "llm_handler=${{ inputs.deploy_llm_handler }}"
              echo "brain=${{ inputs.deploy_brain }}"
              echo "migrations=${{ inputs.apply_migrations }}"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$BEFORE" =~ ^0+$ ]]; then
            {
              echo "shell=true"
              echo "llm_handler=true"
              echo "brain=true"
              echo "migrations=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$BEFORE" "$GITHUB_SHA" > "$RUNNER_TEMP/changed-paths"
          if grep -Eq '^(apps/shell/|packages/|docs/ops/prune-dist-dirs\.sh$|\.github/workflows/deploy\.yml$)' "$RUNNER_TEMP/changed-paths"; then
            echo "shell=true" >> "$GITHUB_OUTPUT"
          else
            echo "shell=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -Eq '^(services/llm-handler/|packages/|docs/ops/prune-docker-images\.sh$|\.github/workflows/deploy\.yml$)' "$RUNNER_TEMP/changed-paths"; then
            echo "llm_handler=true" >> "$GITHUB_OUTPUT"
          else
            echo "llm_handler=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -Eq '^(services/brain/|apps/agentic-command-center/backend/(kernel|hooks|runner)/|apps/agentic-command-center/backend/policy\.json$|apps/toolbelt/guards/|packages/|docs/ops/prune-docker-images\.sh$|\.github/workflows/deploy\.yml$)' "$RUNNER_TEMP/changed-paths"; then
            echo "brain=true" >> "$GITHUB_OUTPUT"
          else
            echo "brain=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -Eq '^apps/toolbelt/(.*/)?supabase/migrations/' "$RUNNER_TEMP/changed-paths"; then
            echo "migrations=true" >> "$GITHUB_OUTPUT"
          else
            echo "migrations=false" >> "$GITHUB_OUTPUT"
          fi

  migrate-platform:
    name: Apply platform migrations
    needs: changes
    if: >-
      needs.changes.outputs.migrations == 'true' &&
      vars.DEPLOY_ENABLED == 'true' &&
      github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/platform-migrations.yml
    secrets: inherit

  build-shell:
    name: Build Shell
    needs: changes
    if: >-
      needs.changes.outputs.shell == 'true' &&
      vars.DEPLOY_ENABLED == 'true' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build --workspace=packages/ui
      - name: Build production Shell
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_ACC_API: ${{ vars.VITE_ACC_API }}
          VITE_LIFEOS_API: ${{ vars.VITE_LIFEOS_API }}
          # '/' = same-origin: the client strips the trailing slash and issues
          # /api/brain/* requests through the shared serve route table. Without
          # this the bundle falls back to the browser's own 127.0.0.1:8100.
          VITE_BRAIN_API: ${{ vars.VITE_BRAIN_API || '/' }}
        shell: bash
        run: |
          set -euo pipefail
          npm run build:app --workspace=apps/shell
          npm run healthz-check --workspace=apps/shell
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shell-dist-${{ github.sha }}
          path: apps/shell/frontend/dist/
          if-no-files-found: error
          retention-days: 7

  deploy-shell:
    name: Deploy Shell
    needs: [changes, migrate-platform, build-shell]
    if: >-
      always() &&
      needs.changes.outputs.shell == 'true' &&
      vars.DEPLOY_ENABLED == 'true' &&
      github.ref == 'refs/heads/main' &&
      needs.build-shell.result == 'success' &&
      (needs.migrate-platform.result == 'success' || needs.migrate-platform.result == 'skipped')
    runs-on: ubuntu-latest
    environment: shell-deploy-production
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-shell-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: shell-dist-${{ github.sha }}
          path: shell-dist
      - uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_SHELL_DEPLOY_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          secret-path: "/platform/shell-deploy/"
          domain: https://app.infisical.com
      - name: Load the deploy SSH key
        # Infisical/secrets-action only ever exports secrets as plain
        # environment variables (GITHUB_ENV) or a .env file -- it has no
        # SSH-key-file or ssh-agent feature of its own [confirmed against
        # the action's own README]. Every ssh/scp call below authenticates
        # as deploy@$DEPLOY_HOST with no -i flag, relying on OpenSSH's
        # default identity-file lookup, so the private key injected from
        # Infisical's /platform/shell-deploy/ path (variable name
        # SHELL_DEPLOY_SSH_KEY, this job's own convention) must be
        # materialized at that default path before the first ssh call.
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SHELL_DEPLOY_SSH_KEY:-}" ]; then
            echo "::error::SHELL_DEPLOY_SSH_KEY was not injected from Infisical (/platform/shell-deploy/) -- cannot authenticate to the deploy host." >&2
            exit 1
          fi
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SHELL_DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
      - name: Join tailnet
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ env.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ env.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ vars.DEPLOY_HOST }}
      - name: Validate deploy target
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$DEPLOY_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]{0,252}[A-Za-z0-9]$ ]]; then
            echo "DEPLOY_HOST must be a non-empty DNS name or IPv4 address." >&2
            exit 1
          fi
      - name: Stage release on the deploy host
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          INCOMING: shell/incoming-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          ssh_options=(-o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new)
          ssh "${ssh_options[@]}" "deploy@$DEPLOY_HOST" "rm -rf -- '$INCOMING'; mkdir -p -- '$INCOMING' shell"
          scp "${ssh_options[@]}" -r shell-dist/. "deploy@$DEPLOY_HOST:$INCOMING/"
          scp "${ssh_options[@]}" docs/ops/prune-dist-dirs.sh "deploy@$DEPLOY_HOST:shell/prune-dist-dirs.sh"
      - name: Activate staged release
        id: activate
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          INCOMING: shell/incoming-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          SHA: ${{ github.sha }}
          RELEASE: dist-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          ssh_options=(-o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new)
          previous="$(ssh "${ssh_options[@]}" "deploy@$DEPLOY_HOST" 'readlink shell/current 2>/dev/null || true')"
          if [[ -n "$previous" && ! "$previous" =~ ^dist-[0-9a-f]{40}(-[0-9]+-[0-9]+)?$ ]]; then
            echo "Refusing to replace an unexpected current target: $previous" >&2
            exit 1
          fi
          echo "previous=${previous:-__none__}" >> "$GITHUB_OUTPUT"
          ssh "${ssh_options[@]}" "deploy@$DEPLOY_HOST" "
            set -euo pipefail
            target='shell/$RELEASE'
            test ! -e \"\$target\"
            mv -- '$INCOMING' \"\$target\"
            next='shell/current.next-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}'
            rm -f -- \"\$next\"
            ln -s '$RELEASE' \"\$next\"
            mv -Tf -- \"\$next\" shell/current
          "
      - name: Verify live release
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(curl --fail --silent --show-error --max-time 15 "https://$DEPLOY_HOST/healthz")" = '{"status":"ok"}'
          asset="$(grep -m1 -oE '/assets/[A-Za-z0-9_.-]+\.js' shell-dist/index.html)"
          test -n "$asset"
          curl --fail --silent --show-error --max-time 15 "https://$DEPLOY_HOST/" > "$RUNNER_TEMP/live-shell.html"
          grep -qF "$asset" "$RUNNER_TEMP/live-shell.html"
      - name: Roll back an unhealthy release
        if: ${{ failure() && steps.activate.outputs.previous != '' }}
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          PREVIOUS: ${{ steps.activate.outputs.previous }}
        shell: bash
        run: |
          set -euo pipefail
          ssh_options=(-o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new)
          if [[ "$PREVIOUS" == "__none__" ]]; then
            ssh "${ssh_options[@]}" "deploy@$DEPLOY_HOST" 'rm -f -- shell/current'
          else
            ssh "${ssh_options[@]}" "deploy@$DEPLOY_HOST" "
              set -euo pipefail
              ln -s '$PREVIOUS' shell/current.rollback
              mv -Tf -- shell/current.rollback shell/current
            "
          fi
      - name: Prune superseded releases
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        shell: bash
        run: |
          set -euo pipefail
          ssh_options=(-o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new)
          ssh "${ssh_options[@]}" "deploy@$DEPLOY_HOST" 'chmod 0755 shell/prune-dist-dirs.sh && shell/prune-dist-dirs.sh shell'

  build-llm-handler:
    name: Build Handler A
    needs: changes
    if: >-
      needs.changes.outputs.llm_handler == 'true' &&
      vars.DEPLOY_ENABLED == 'true' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Handler A image
        # Deliberately a NEW image name under this repository, not the bare
        # ghcr.io/kgsmith19/hyperbolic-core the root AGENTS.md warns about --
        # same pattern build-brain will use when it lands (10-cicd-deployment.md
        # section 2.3). Build context is the monorepo root (Dockerfile's own
        # header comment explains why: npm workspaces need every workspace's
        # package.json to resolve the one shared root package-lock.json).
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: services/llm-handler/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/llm-handler:main
            ghcr.io/${{ github.repository }}/llm-handler:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-llm-handler:
    name: Deploy Handler A
    needs: [changes, migrate-platform, build-llm-handler]
    if: >-
      always() &&
      needs.changes.outputs.llm_handler == 'true' &&
      vars.DEPLOY_ENABLED == 'true' &&
      github.ref == 'refs/heads/main' &&
      needs.build-llm-handler.result == 'success' &&
      (needs.migrate-platform.result == 'success' || needs.migrate-platform.result == 'skipped')
    runs-on: ubuntu-latest
    environment: llm-handler-deploy-production
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      packages: read
    concurrency:
      group: deploy-llm-handler-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_LLM_HANDLER_DEPLOY_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          secret-path: "/platform/llm-handler/"
          domain: https://app.infisical.com
      - name: Load the deploy SSH key
        # Same gap and same fix as deploy-shell's own "Load the deploy SSH
        # key" step (this file, above): Infisical/secrets-action never
        # writes an SSH key file itself. A distinct key from Shell's
        # (ADR-05: one identity's leaked secret must not grant another
        # identity's access), materialized at the same default path since
        # each job runs on its own fresh, single-use runner.
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${LLM_HANDLER_SSH_KEY:-}" ]; then
            echo "::error::LLM_HANDLER_SSH_KEY was not injected from Infisical (/platform/llm-handler/) -- cannot authenticate to the deploy host." >&2
            exit 1
          fi
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$LLM_HANDLER_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
      - name: Join tailnet
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ env.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ env.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ vars.DEPLOY_HOST }}
      - name: Record the running Handler A image for rollback
        id: previous
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        shell: bash
        run: |
          set -euo pipefail
          ssh_options=(-o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new)
          # The image reference the box is running now, from the compose .env
          # this workflow itself renders on every deploy. First-ever deploy
          # (no .env yet) records __none__ and rollback degrades gracefully.
          previous="$(ssh "${ssh_options[@]}" "deploy@$DEPLOY_HOST" \
            "grep -m1 '^LLM_HANDLER_IMAGE=' llm-handler/.env 2>/dev/null | cut -d= -f2- || true")"
          if [[ -n "$previous" && ! "$previous" =~ ^ghcr\.io/[A-Za-z0-9_./-]+:sha-[0-9a-f]{40}$ ]]; then
            echo "Refusing to trust an unexpected running-image reference: $previous" >&2
            exit 1
          fi
          echo "image=${previous:-__none__}" >> "$GITHUB_OUTPUT"

      - name: Deploy Handler A
        # Mirrors apps/lifeos/.github/workflows/ci.yml's deploy-backend job
        # shape exactly (docker pull the just-pushed image back to the
        # runner, save|gzip|ssh|load onto the VPS, which holds no registry
        # credentials of its own -- see compose.yaml's own comment).
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          IMAGE: ghcr.io/${{ github.repository }}/llm-handler:sha-${{ github.sha }}
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          ssh_options=(-o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new)
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_PUBLISHABLE_KEY"
          test -n "${TOOLBELT_GITHUB_INTAKE_PAT:-}"
          test -n "${SUPABASE_SERVICE_ROLE_KEY:-}"
          umask 077
          {
            printf 'SUPABASE_URL=%s\nSUPABASE_PUBLISHABLE_KEY=%s\nTOOLBELT_GITHUB_INTAKE_PAT=%s\nSUPABASE_SERVICE_ROLE_KEY=%s\nLLM_HANDLER_IMAGE=%s\n' \
              "$SUPABASE_URL" "$SUPABASE_PUBLISHABLE_KEY" "$TOOLBELT_GITHUB_INTAKE_PAT" "$SUPABASE_SERVICE_ROLE_KEY" "$IMAGE"
            # Provider keys for the service's /api/v1/* LLM routes, from Infisical
            # /platform/llm-handler/. Optional at daemon boot (config.ts), so an
            # unprovisioned key is omitted from .env rather than rendered empty --
            # the same optional-var shape deploy-brain uses.
            [ -n "${LLM_KEYS_ANTHROPIC:-}" ] && printf 'LLM_KEYS_ANTHROPIC=%s\n' "$LLM_KEYS_ANTHROPIC"
            [ -n "${LLM_KEYS_OPENAI:-}" ] && printf 'LLM_KEYS_OPENAI=%s\n' "$LLM_KEYS_OPENAI"
            [ -n "${LLM_KEYS_GEMINI:-}" ] && printf 'LLM_KEYS_GEMINI=%s\n' "$LLM_KEYS_GEMINI"
          } > "$RUNNER_TEMP/.env.prod"
          docker pull --quiet "$IMAGE"
          docker save "$IMAGE" | gzip | ssh "${ssh_options[@]}" "deploy@$DEPLOY_HOST" 'gunzip | docker load'
          ssh "${ssh_options[@]}" "deploy@$DEPLOY_HOST" 'mkdir -p llm-handler'
          scp "${ssh_options[@]}" services/llm-handler/compose.yaml "deploy@$DEPLOY_HOST:llm-handler/compose.yaml"
          scp "${ssh_options[@]}" "$RUNNER_TEMP/.env.prod" "deploy@$DEPLOY_HOST:llm-handler/.env"
          ssh "${ssh_options[@]}" "deploy@$DEPLOY_HOST" \
            "cd llm-handler && chmod 600 .env && LLM_HANDLER_IMAGE=$IMAGE docker compose up -d --wait && curl -fsS http://127.0.0.1:8200/healthz"

      - name: Roll back Handler A to the previous image
        if: failure() && steps.previous.outputs.image != '' && steps.previous.outputs.image != '__none__'
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          PREVIOUS: ${{ steps.previous.outputs.image }}
        shell: bash
        run: |
          set -euo pipefail
          ssh_options=(-o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new)
          echo "Deploy failed; rolling llm-handler back to $PREVIOUS" >&2
          if ! ssh "${ssh_options[@]}" "deploy@$DEPLOY_HOST" "
            set -euo pipefail
            cd llm-handler
            sed -i \"s|^LLM_HANDLER_IMAGE=.*|LLM_HANDLER_IMAGE=$PREVIOUS|\" .env
            LLM_HANDLER_IMAGE='$PREVIOUS' docker compose up -d --wait
            curl -fsS http://127.0.0.1:8200/healthz
          "; then
            echo "::error::ROLLBACK FAILED for llm-handler: the previous image ($PREVIOUS) did not come back healthy -- the service needs manual attention NOW (runbook: manual rollback section)." >&2
            exit 1
          fi
          echo "Rolled back: llm-handler is serving $PREVIOUS again."
      - name: Prune superseded Handler A images (10-cicd-deployment.md section 8.3b, keep newest 3)
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          IMAGE: ghcr.io/${{ github.repository }}/llm-handler:sha-${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          ssh_options=(-o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new)
          scp "${ssh_options[@]}" docs/ops/prune-docker-images.sh "deploy@$DEPLOY_HOST:llm-handler/prune-docker-images.sh"
          ssh "${ssh_options[@]}" "deploy@$DEPLOY_HOST" \
            "chmod 0755 llm-handler/prune-docker-images.sh && llm-handler/prune-docker-images.sh ghcr.io/${{ github.repository }}/llm-handler '$IMAGE'"

  build-brain:
    name: Build the Brain
    needs: changes
    if: >-
      needs.changes.outputs.brain == 'true' &&
      vars.DEPLOY_ENABLED == 'true' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the Brain image
        # Deliberately a NEW image name under this repository (10-cicd-
        # deployment.md section 2.3), never the bare
        # ghcr.io/kgsmith19/hyperbolic-core the root AGENTS.md warns
        # about, and gated inside deploy.yml only -- the same posture
        # build-llm-handler already established, above.
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: services/brain/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/brain:main
            ghcr.io/${{ github.repository }}/brain:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-brain:
    name: Deploy the Brain
    needs: [changes, migrate-platform, build-brain]
    if: >-
      always() &&
      needs.changes.outputs.brain == 'true' &&
      vars.DEPLOY_ENABLED == 'true' &&
      github.ref == 'refs/heads/main' &&
      needs.build-brain.result == 'success' &&
      (needs.migrate-platform.result == 'success' || needs.migrate-platform.result == 'skipped')
    runs-on: ubuntu-latest
    environment: brain-deploy-production
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      packages: read
    concurrency:
      group: deploy-brain-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_BRAIN_DEPLOY_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          secret-path: "/brain/"
          domain: https://app.infisical.com
      - name: Load the deploy SSH key
        # Same gap and same fix as deploy-shell's/deploy-llm-handler's own
        # "Load the deploy SSH key" step: Infisical/secrets-action never
        # writes an SSH key file itself. A distinct key from either of
        # theirs (ADR-05: one identity's leaked secret must not grant
        # another identity's access), materialized at the same default
        # path since each job runs on its own fresh, single-use runner.
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${BRAIN_DEPLOY_SSH_KEY:-}" ]; then
            echo "::error::BRAIN_DEPLOY_SSH_KEY was not injected from Infisical (/brain/) -- cannot authenticate to the deploy host." >&2
            exit 1
          fi
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$BRAIN_DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
      - name: Join tailnet
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ env.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ env.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ vars.DEPLOY_HOST }}
      - name: Record the running Brain image for rollback
        id: previous
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        shell: bash
        run: |
          set -euo pipefail
          ssh_options=(-o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new)
          # The image reference the box is running now, from the compose .env
          # this workflow itself renders on every deploy. First-ever deploy
          # (no .env yet) records __none__ and rollback degrades gracefully.
          previous="$(ssh "${ssh_options[@]}" "deploy@$DEPLOY_HOST" \
            "grep -m1 '^BRAIN_IMAGE=' brain/.env 2>/dev/null | cut -d= -f2- || true")"
          if [[ -n "$previous" && ! "$previous" =~ ^ghcr\.io/[A-Za-z0-9_./-]+:sha-[0-9a-f]{40}$ ]]; then
            echo "Refusing to trust an unexpected running-image reference: $previous" >&2
            exit 1
          fi
          echo "image=${previous:-__none__}" >> "$GITHUB_OUTPUT"

      - name: Deploy the Brain
        # Same shape as deploy-llm-handler above; the one addition is the
        # ADR-05 secrets-mount file (compose.yaml's own `secrets:` block,
        # BRAIN_SECRET_FILE, isolation-check.mjs) -- rendered here,
        # alongside .env, never baked into the image or committed.
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          IMAGE: ghcr.io/${{ github.repository }}/brain:sha-${{ github.sha }}
          # Public project values (same convention Shell's and Handler A's
          # own deploy jobs already use, above) -- never sourced from
          # Infisical, which is reserved for values that are actually
          # secret. Only SUPABASE_SERVICE_ROLE_KEY (truly secret) comes
          # from this job's own /brain/ Infisical path, below.
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          ssh_options=(-o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new)
          test -n "${BRAIN_ANTHROPIC_API_KEY:-}"
          umask 077
          {
            printf 'BRAIN_IMAGE=%s\n' "$IMAGE"
            printf 'BRAIN_SECRET_FILE=/run/secrets/anthropic-api-key\n'
            [ -n "${SUPABASE_URL:-}" ] && printf 'SUPABASE_URL=%s\n' "$SUPABASE_URL"
            [ -n "${SUPABASE_PUBLISHABLE_KEY:-}" ] && printf 'SUPABASE_PUBLISHABLE_KEY=%s\n' "$SUPABASE_PUBLISHABLE_KEY"
            [ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ] && printf 'SUPABASE_SERVICE_ROLE_KEY=%s\n' "$SUPABASE_SERVICE_ROLE_KEY"
            [ -n "${BRAIN_AGENT_TOKEN_PUBLIC_KEY:-}" ] && printf 'BRAIN_AGENT_TOKEN_PUBLIC_KEY=%s\n' "$BRAIN_AGENT_TOKEN_PUBLIC_KEY"
            [ -n "${BRAIN_AGENT_TOKEN_ISSUER:-}" ] && printf 'BRAIN_AGENT_TOKEN_ISSUER=%s\n' "$BRAIN_AGENT_TOKEN_ISSUER"
            [ -n "${BRAIN_AGENT_TOKEN_AUDIENCE:-}" ] && printf 'BRAIN_AGENT_TOKEN_AUDIENCE=%s\n' "$BRAIN_AGENT_TOKEN_AUDIENCE"
            [ -n "${BRAIN_LIFEOS_API_URL:-}" ] && printf 'BRAIN_LIFEOS_API_URL=%s\n' "$BRAIN_LIFEOS_API_URL"
            [ -n "${BRAIN_LIFEOS_AGENT_TOKEN:-}" ] && printf 'BRAIN_LIFEOS_AGENT_TOKEN=%s\n' "$BRAIN_LIFEOS_AGENT_TOKEN"
          } > "$RUNNER_TEMP/.env.prod"
          printf '%s' "$BRAIN_ANTHROPIC_API_KEY" > "$RUNNER_TEMP/anthropic-api-key"
          docker pull --quiet "$IMAGE"
          docker save "$IMAGE" | gzip | ssh "${ssh_options[@]}" "deploy@$DEPLOY_HOST" 'gunzip | docker load'
          ssh "${ssh_options[@]}" "deploy@$DEPLOY_HOST" 'mkdir -p brain'
          scp "${ssh_options[@]}" services/brain/compose.yaml "deploy@$DEPLOY_HOST:brain/compose.yaml"
          scp "${ssh_options[@]}" "$RUNNER_TEMP/.env.prod" "deploy@$DEPLOY_HOST:brain/.env"
          scp "${ssh_options[@]}" "$RUNNER_TEMP/anthropic-api-key" "deploy@$DEPLOY_HOST:brain/anthropic-api-key"
          ssh "${ssh_options[@]}" "deploy@$DEPLOY_HOST" \
            "cd brain && chmod 600 .env anthropic-api-key && BRAIN_IMAGE=$IMAGE docker compose up -d --wait && curl -fsS http://127.0.0.1:8100/healthz"

      - name: Roll back the Brain to the previous image
        if: failure() && steps.previous.outputs.image != '' && steps.previous.outputs.image != '__none__'
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          PREVIOUS: ${{ steps.previous.outputs.image }}
        shell: bash
        run: |
          set -euo pipefail
          ssh_options=(-o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new)
          echo "Deploy failed; rolling brain back to $PREVIOUS" >&2
          if ! ssh "${ssh_options[@]}" "deploy@$DEPLOY_HOST" "
            set -euo pipefail
            cd brain
            sed -i \"s|^BRAIN_IMAGE=.*|BRAIN_IMAGE=$PREVIOUS|\" .env
            BRAIN_IMAGE='$PREVIOUS' docker compose up -d --wait
            curl -fsS http://127.0.0.1:8100/healthz
          "; then
            echo "::error::ROLLBACK FAILED for brain: the previous image ($PREVIOUS) did not come back healthy -- the service needs manual attention NOW (runbook: manual rollback section)." >&2
            exit 1
          fi
          echo "Rolled back: brain is serving $PREVIOUS again."
      - name: Prune superseded Brain images (10-cicd-deployment.md section 8.3, keep newest 3)
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          IMAGE: ghcr.io/${{ github.repository }}/brain:sha-${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          ssh_options=(-o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new)
          scp "${ssh_options[@]}" docs/ops/prune-docker-images.sh "deploy@$DEPLOY_HOST:brain/prune-docker-images.sh"
          ssh "${ssh_options[@]}" "deploy@$DEPLOY_HOST" \
            "chmod 0755 brain/prune-docker-images.sh && brain/prune-docker-images.sh ghcr.io/${{ github.repository }}/brain '$IMAGE'"

  smoke:
    name: Post-deploy smoke
    # Runs whenever at least one unit actually deployed, even if a sibling
    # failed (always() beats the default failure-skip): the surviving units
    # still deserve a live verdict, and a red smoke keeps the run red.
    needs: [deploy-shell, deploy-llm-handler, deploy-brain]
    if: >-
      always() &&
      vars.DEPLOY_ENABLED == 'true' &&
      github.ref == 'refs/heads/main' &&
      (needs.deploy-shell.result == 'success' ||
       needs.deploy-llm-handler.result == 'success' ||
       needs.deploy-brain.result == 'success')
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/platform-smoke.yml

  tag-release:
    name: Tag successful releases
    # Only once the run's overall post-deploy smoke actually succeeded --
    # a unit whose own deploy job succeeded but that fails smoke has not
    # earned a release tag, since smoke is this pipeline's live verdict on
    # whether the deploy is actually good (see the smoke job's own header
    # comment above: "a red smoke keeps the run red").
    needs: [deploy-shell, deploy-llm-handler, deploy-brain, smoke]
    if: >-
      always() &&
      vars.DEPLOY_ENABLED == 'true' &&
      github.ref == 'refs/heads/main' &&
      needs.smoke.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag each unit that deployed successfully this run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          SHELL_RESULT: ${{ needs.deploy-shell.result }}
          LLM_HANDLER_RESULT: ${{ needs.deploy-llm-handler.result }}
          BRAIN_RESULT: ${{ needs.deploy-brain.result }}
        run: |
          set -euo pipefail
          docs/ops/tag-release.sh shell "$SHELL_RESULT" "$SHA"
          docs/ops/tag-release.sh llm-handler "$LLM_HANDLER_RESULT" "$SHA"
          docs/ops/tag-release.sh brain "$BRAIN_RESULT" "$SHA"
