name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: ${{ github.event.pull_request.draft && 'Draft CI (local only)' || 'PR Gate' }}
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Decide whether runtime verification is required
        id: changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "runtime=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.ref }}"; then
            echo "::warning::Could not fetch the PR base; running the full suite."
            echo "runtime=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! changed=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD); then
            echo "::warning::Could not compute the PR diff; running the full suite."
            echo "runtime=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$changed" ]; then
            echo "::warning::PR diff was unexpectedly empty; running the full suite."
            echo "runtime=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf 'Changed files:\n%s\n' "$changed"
          runtime_files=$(printf '%s\n' "$changed" | grep -Ev '(^|/).*\.md$|^docs/|^\.github/CODEOWNERS$|^\.agent/|^\.agents/' || true)

          if [ -n "$runtime_files" ]; then
            echo "runtime=true" >> "$GITHUB_OUTPUT"
            printf 'Runtime verification required by:\n%s\n' "$runtime_files"
          else
            echo "runtime=false" >> "$GITHUB_OUTPUT"
            echo 'Documentation/governance-only diff; preserving PR Gate while skipping the runtime suite.'
          fi
      - uses: actions/setup-node@v7
        if: steps.changes.outputs.runtime == 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: steps.changes.outputs.runtime == 'true'
      - run: npm run lint
        if: steps.changes.outputs.runtime == 'true'
      - run: npx tsc -b
        if: steps.changes.outputs.runtime == 'true'
      - run: npm run test
        if: steps.changes.outputs.runtime == 'true'
      - name: Cache Playwright Chromium
        if: steps.changes.outputs.runtime == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
        if: steps.changes.outputs.runtime == 'true'
      - run: npm run e2e
        if: steps.changes.outputs.runtime == 'true'
      - name: Upload Playwright failure evidence
        if: failure() && steps.changes.outputs.runtime == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failure-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
      - run: npm run build
        if: steps.changes.outputs.runtime == 'true'
      - name: Documentation-only verification
        if: steps.changes.outputs.runtime != 'true'
        run: echo 'No runtime-affecting files changed; required PR Gate remains green.'

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-ui
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci && npm run build
      - uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          domain: https://app.infisical.com
      - name: Join tailnet
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ env.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ env.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Deploy static bundle
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          scp -o StrictHostKeyChecking=accept-new -r dist deploy@"$DEPLOY_HOST":lifeos-ui-incoming
          ssh -o StrictHostKeyChecking=accept-new deploy@"$DEPLOY_HOST" \
            'mkdir -p lifeos-ui && rm -rf lifeos-ui/dist && mv lifeos-ui-incoming lifeos-ui/dist'
