name: PR Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: ${{ github.event.pull_request.draft && 'Draft CI (local only)' || 'PR Gate' }}
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - name: Decide whether runtime verification is required
        id: changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "runtime=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.ref }}"; then
            echo "::error::Could not fetch the PR base; cell-scope verification cannot run."
            exit 1
          fi

          if ! changed=$(git diff --name-only --no-renames "${{ github.event.pull_request.base.sha }}" HEAD); then
            echo "::error::Could not compute the PR diff; cell-scope verification cannot run."
            exit 1
          fi

          if [ -z "$changed" ]; then
            echo "::error::PR diff was unexpectedly empty; refusing to guess cell scope."
            exit 1
          fi

          printf '%s\n' "$changed" > "$RUNNER_TEMP/lifeos-changed-files.txt"
          printf 'Changed files:\n%s\n' "$changed"
          runtime_files=$(printf '%s\n' "$changed" | grep -Ev '(^|/).*\.md$|^docs/|^\.github/CODEOWNERS$|^\.agent/|^\.agents/' || true)

          if [ -n "$runtime_files" ]; then
            echo "runtime=true" >> "$GITHUB_OUTPUT"
            printf 'Runtime verification required by:\n%s\n' "$runtime_files"
          else
            echo "runtime=false" >> "$GITHUB_OUTPUT"
            echo 'Documentation/governance-only diff; preserving PR Gate while skipping the runtime suite.'
          fi
      - name: Enforce declared cell scope
        if: github.event_name == 'pull_request'
        run: >-
          python3 scripts/check_cell_scope.py
          --root .
          --changed-files "$RUNNER_TEMP/lifeos-changed-files.txt"
          --event "$GITHUB_EVENT_PATH"
          --base-sha "${{ github.event.pull_request.base.sha }}"
      - name: Start Postgres for runtime verification
        if: steps.changes.outputs.runtime == 'true'
        shell: bash
        run: |
          docker run --detach --name lifeos-ci-postgres \
            -e POSTGRES_PASSWORD=postgres \
            -p 5432:5432 \
            pgvector/pgvector:pg17

          for attempt in $(seq 1 30); do
            if docker exec lifeos-ci-postgres pg_isready -U postgres >/dev/null 2>&1; then
              echo 'Postgres is ready.'
              exit 0
            fi
            sleep 1
          done

          docker logs lifeos-ci-postgres
          echo '::error::Postgres did not become ready within 30 seconds.'
          exit 1
      - uses: actions/setup-python@v7
        if: steps.changes.outputs.runtime == 'true'
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -e .[dev]
        if: steps.changes.outputs.runtime == 'true'
      - run: ruff check .
        if: steps.changes.outputs.runtime == 'true'
      - run: mypy
        if: steps.changes.outputs.runtime == 'true'
      - name: Apply migrations
        if: steps.changes.outputs.runtime == 'true'
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'create schema if not exists extensions'
          for f in supabase/migrations/*.sql; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done
      - run: pytest
        if: steps.changes.outputs.runtime == 'true'
      - name: Documentation-only verification
        if: steps.changes.outputs.runtime != 'true'
        run: echo 'No runtime-affecting files changed; required PR Gate remains green.'
      - name: Stop Postgres
        if: always() && steps.changes.outputs.runtime == 'true'
        run: docker rm --force lifeos-ci-postgres >/dev/null 2>&1 || true

  build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:main
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: read
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          domain: https://app.infisical.com
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - name: Apply migrations
        run: supabase db push --db-url "$DATABASE_URL" --include-all --yes
      - name: Join tailnet
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ env.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ env.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Deploy
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          IMAGE: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
        run: |
          umask 077
          printf 'DATABASE_URL=%s\nLIFEOS_SUPABASE_URL=%s\nLIFEOS_OWNER_USER_ID=%s\nANTHROPIC_API_KEY=%s\nLIFEOS_ICS_URLS=%s\nLIFEOS_IMAGE=%s\n' \
            "$DATABASE_URL" "$LIFEOS_SUPABASE_URL" "$LIFEOS_OWNER_USER_ID" "$ANTHROPIC_API_KEY" "$LIFEOS_ICS_URLS" "$IMAGE" > .env.prod
          docker pull --quiet "$IMAGE"
          docker save "$IMAGE" | gzip | ssh -o StrictHostKeyChecking=accept-new deploy@"$DEPLOY_HOST" 'gunzip | docker load'
          scp -o StrictHostKeyChecking=accept-new compose.yaml deploy@"$DEPLOY_HOST":lifeos/compose.yaml
          scp -o StrictHostKeyChecking=accept-new .env.prod deploy@"$DEPLOY_HOST":lifeos/.env
          ssh -o StrictHostKeyChecking=accept-new deploy@"$DEPLOY_HOST" \
            "cd lifeos && chmod 600 .env && LIFEOS_IMAGE=$IMAGE docker compose up -d --wait && curl -fsS http://127.0.0.1:8000/healthz"
