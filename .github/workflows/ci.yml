name: PR Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:

permissions:
  contents: read

concurrency:
  group: pr-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-gate:
    name: PR Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.0'
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Require ACC repository token
        shell: bash
        env:
          ACC_REPOSITORY_TOKEN: ${{ secrets.ACC_REPOSITORY_TOKEN }}
        run: |
          if [[ -z "${ACC_REPOSITORY_TOKEN}" ]]; then
            echo "::error::ACC_REPOSITORY_TOKEN is required to check out the private agentic-command-center repository."
            exit 1
          fi
      - name: Check out the ACC contract server
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kgsmith19/agentic-command-center
          path: acc-checkout
          token: ${{ secrets.ACC_REPOSITORY_TOKEN }}
          persist-credentials: false
          ref: main
      - name: Cache Playwright Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - name: Contract test against ACC
        run: npm run e2e
        env:
          ACC_DIR: ${{ github.workspace }}/acc-checkout
      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failure-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
