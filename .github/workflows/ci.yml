name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -e .[dev]
      - run: ruff check .
      - run: mypy
      - name: Apply migrations
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'create schema if not exists extensions'
          for f in supabase/migrations/*.sql; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done
      - run: pytest

  build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:main
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    # No `environment:` here — it would change the OIDC subject to
    # environment:production, splitting it from backup.yml's ref-based
    # subject; one exact Infisical binding covers every job this way.
    permissions:
      contents: read
      id-token: write
      packages: read
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Secrets come from Infisical via OIDC at run time — GitHub stores none (ADR 009).
      - uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          domain: https://app.infisical.com
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - name: Apply migrations
        run: supabase db push --db-url "$DATABASE_URL" --include-all --yes
      - name: Join tailnet
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4.1.2
        with:
          oauth-client-id: ${{ env.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ env.TS_OAUTH_SECRET }}
          tags: tag:ci
      # Auth to the VPS is Tailscale SSH: the ephemeral tag:ci node is allowed
      # to reach tag:prod as `deploy` by the tailnet ACL — no SSH key secrets.
      # The image streams over that same channel (docker save | docker load),
      # so the VPS holds no registry credentials either. The runtime .env is
      # rendered from Infisical on every deploy; rotation = edit + re-run.
      # LIFEOS_IMAGE is recorded in that same .env: compose interpolates its
      # image from the project-directory .env, so the scheduled-jobs cron
      # (ops.yml install-scheduled-jobs) runs exactly the image this deploy
      # runs — recorded atomically with the deploy, it cannot drift.
      - name: Deploy
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          IMAGE: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
        run: |
          umask 077
          printf 'DATABASE_URL=%s\nLIFEOS_SUPABASE_URL=%s\nLIFEOS_OWNER_USER_ID=%s\nANTHROPIC_API_KEY=%s\nLIFEOS_ICS_URLS=%s\nLIFEOS_IMAGE=%s\n' \
            "$DATABASE_URL" "$LIFEOS_SUPABASE_URL" "$LIFEOS_OWNER_USER_ID" "$ANTHROPIC_API_KEY" "$LIFEOS_ICS_URLS" "$IMAGE" > .env.prod
          docker pull --quiet "$IMAGE"
          docker save "$IMAGE" | gzip | ssh -o StrictHostKeyChecking=accept-new deploy@"$DEPLOY_HOST" 'gunzip | docker load'
          scp -o StrictHostKeyChecking=accept-new compose.yaml deploy@"$DEPLOY_HOST":lifeos/compose.yaml
          scp -o StrictHostKeyChecking=accept-new .env.prod deploy@"$DEPLOY_HOST":lifeos/.env
          ssh -o StrictHostKeyChecking=accept-new deploy@"$DEPLOY_HOST" \
            "cd lifeos && chmod 600 .env && LIFEOS_IMAGE=$IMAGE docker compose up -d --wait && curl -fsS http://127.0.0.1:8000/healthz"
