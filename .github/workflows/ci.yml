name: PR Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start Postgres
        shell: bash
        run: |
          docker run --detach --name lifeos-ci-postgres \
            -e POSTGRES_PASSWORD=postgres \
            -p 5432:5432 \
            pgvector/pgvector:pg17
          for attempt in $(seq 1 30); do
            if docker exec lifeos-ci-postgres pg_isready -U postgres >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker logs lifeos-ci-postgres
          exit 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install -e .[dev]
      - run: ruff check .
      - run: mypy
      - name: Apply migrations
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'create schema if not exists extensions'
          for migration in supabase/migrations/*.sql; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done
      - run: pytest
      - name: Stop Postgres
        if: always()
        run: docker rm --force lifeos-ci-postgres >/dev/null 2>&1 || true

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - run: npm run test
      - name: Cache Playwright Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: lifeos-playwright-chromium-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lifeos-playwright-failure-evidence
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 14
      - run: npm run build

  pr-gate:
    name: PR Gate
    if: always()
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Confirm both applications passed
        shell: bash
        run: |
          test "${{ needs.backend.result }}" = success
          test "${{ needs.frontend.result }}" = success

  build-backend:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: pr-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:main
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-backend:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: build-backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: read
    concurrency:
      group: deploy-backend-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          domain: https://app.infisical.com
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          version: latest
      - name: Apply migrations
        working-directory: backend
        run: supabase db push --db-url "$DATABASE_URL" --include-all --yes
      - name: Join tailnet
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ env.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ env.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Deploy backend
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          IMAGE: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
        run: |
          umask 077
          printf 'DATABASE_URL=%s\nLIFEOS_SUPABASE_URL=%s\nLIFEOS_OWNER_USER_ID=%s\nANTHROPIC_API_KEY=%s\nLIFEOS_ICS_URLS=%s\nLIFEOS_IMAGE=%s\n' \
            "$DATABASE_URL" "$LIFEOS_SUPABASE_URL" "$LIFEOS_OWNER_USER_ID" "$ANTHROPIC_API_KEY" "$LIFEOS_ICS_URLS" "$IMAGE" > .env.prod
          docker pull --quiet "$IMAGE"
          docker save "$IMAGE" | gzip | ssh -o StrictHostKeyChecking=accept-new deploy@"$DEPLOY_HOST" 'gunzip | docker load'
          scp -o StrictHostKeyChecking=accept-new backend/compose.yaml deploy@"$DEPLOY_HOST":lifeos/compose.yaml
          scp -o StrictHostKeyChecking=accept-new .env.prod deploy@"$DEPLOY_HOST":lifeos/.env
          ssh -o StrictHostKeyChecking=accept-new deploy@"$DEPLOY_HOST" \
            "cd lifeos && chmod 600 .env && LIFEOS_IMAGE=$IMAGE docker compose up -d --wait && curl -fsS http://127.0.0.1:8000/healthz"

  deploy-frontend:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: pr-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-frontend-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend
      - uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          domain: https://app.infisical.com
      - name: Join tailnet
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ env.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ env.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Deploy frontend
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          scp -o StrictHostKeyChecking=accept-new -r frontend/dist deploy@"$DEPLOY_HOST":lifeos-ui-incoming
          ssh -o StrictHostKeyChecking=accept-new deploy@"$DEPLOY_HOST" \
            'mkdir -p lifeos-ui && rm -rf lifeos-ui/dist && mv lifeos-ui-incoming lifeos-ui/dist'
