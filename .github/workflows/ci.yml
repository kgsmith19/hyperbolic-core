name: PR Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:

permissions:
  contents: read

concurrency:
  group: pr-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-gate:
    name: ${{ github.event.pull_request.draft && 'Draft CI (local only)' || 'PR Gate' }}
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Decide whether runtime verification is required
        id: changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "runtime=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! changed=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD); then
            echo "::warning::Could not compute the PR diff; running the full gate."
            echo "runtime=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$changed" ]; then
            echo "::warning::PR diff was unexpectedly empty; running the full gate."
            echo "runtime=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf 'Changed files:\n%s\n' "$changed"
          runtime_files=$(printf '%s\n' "$changed" | grep -Ev '(^|/).*\.md$|^\.github/CODEOWNERS$|^\.agent/' || true)

          if [ -n "$runtime_files" ]; then
            echo "runtime=true" >> "$GITHUB_OUTPUT"
            printf 'Runtime verification required by:\n%s\n' "$runtime_files"
          else
            echo "runtime=false" >> "$GITHUB_OUTPUT"
            echo 'Documentation/governance-only diff; preserving PR Gate while skipping build and E2E.'
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.changes.outputs.runtime == 'true'
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
        if: steps.changes.outputs.runtime == 'true'
      - name: Build (tsc strict + Vite)
        if: steps.changes.outputs.runtime == 'true'
        run: npm run build
      - name: Checkout ACC contract server
        if: steps.changes.outputs.runtime == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kgsmith19/agentic-command-center
          path: acc-checkout
      - name: Cache Playwright Chromium
        if: steps.changes.outputs.runtime == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
        if: steps.changes.outputs.runtime == 'true'
      - name: Contract e2e against a real ACC server
        if: steps.changes.outputs.runtime == 'true'
        run: npm run e2e
        env:
          ACC_DIR: ${{ github.workspace }}/acc-checkout
      - name: Upload Playwright failure evidence
        if: failure() && steps.changes.outputs.runtime == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failure-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Documentation/governance-only verification
        if: steps.changes.outputs.runtime != 'true'
        run: echo 'No runtime-affecting files changed; required PR Gate remains green.'
