name: CI

# Fast PR lane (build) + full required lane (contract e2e) — see AGENTS.md
# and .agent/project.yaml. No deep/scheduled lane exists yet: this repo has
# no mutation/fuzz/perf infra and none is justified by evidence so far.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (tsc strict + Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build

  contract-e2e:
    name: Contract e2e (real ACC server — the drift alarm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Checkout ACC (the API this UI is a contract client of)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: kgsmith19/agentic-command-center
          path: acc-checkout
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Cache Playwright Chromium
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          ACC_DIR: ${{ github.workspace }}/acc-checkout
          # Temporary: the first CI run timed out waiting on config.webServer
          # with zero other output, and it reproduces fine locally (ACC's
          # server + Vite both up in <1s against a fresh clone) — this
          # forces Playwright to print webServer start/poll activity so the
          # real cause is visible instead of guessed at. Remove once diagnosed.
          DEBUG: pw:webserver
