name: PR Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:

permissions:
  contents: read

concurrency:
  group: pr-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ACC_ROUTING_MD: ${{ github.workspace }}/hooks/fixtures/ROUTING.md

jobs:
  portable:
    name: Portable tests and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Portable test suite
        run: npm test
      - name: Expose the integration diff to covgate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.event.pull_request.base.ref }}" --quiet
            BASE_SHA=$(git merge-base "origin/${{ github.event.pull_request.base.ref }}" HEAD)
            git reset --soft "$BASE_SHA"
          elif [ "${{ github.event_name }}" = "merge_group" ]; then
            git reset --soft "${{ github.event.merge_group.base_sha }}"
          fi
      - name: Changed-file coverage
        run: npm run covgate

  windows-integration:
    name: Windows integration
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Create fixture route directories
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path `
            'C:\code', `
            'C:\code\guards', `
            'C:\code\lifeos-ecosystem', `
            'C:\code\lifeos-ecosystem\lifeos', `
            'C:\code\lifeos-ecosystem\lifeos-ui' | Out-Null
      - name: Native test suite
        run: npm run test:windows
      - name: Launch-shim tests
        shell: pwsh
        run: powershell -File shim/claude.test.ps1
      - name: Cap-watcher tests
        shell: pwsh
        run: powershell -File watcher/claude-cap-watch.test.ps1
      - name: Cap-watcher installer tests
        shell: pwsh
        run: powershell -File watcher/install-cap-watch-task.test.ps1
      - name: Remove fixture route directories
        if: always()
        shell: pwsh
        run: Remove-Item -Recurse -Force -ErrorAction SilentlyContinue 'C:\code'

  gui-e2e:
    name: GUI end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e:gui

  pr-gate:
    name: PR Gate
    if: always()
    needs: [portable, windows-integration, gui-e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Confirm every correctness job passed
        shell: bash
        run: |
          test "${{ needs.portable.result }}" = "success"
          test "${{ needs.windows-integration.result }}" = "success"
          test "${{ needs.gui-e2e.result }}" = "success"
