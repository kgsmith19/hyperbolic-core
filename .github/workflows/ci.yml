name: CI

# Fast PR lane and full lane are the same command here: this repo has no
# build/lint/typecheck step and no separate slow test tier (0 dependencies,
# deliberately — see AGENTS.md). Runs against the live toolbelt project using
# only the public anon key already committed in the test files; no secret is
# required or accepted (SR-14).

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: node --test "tests/*.test.mjs"
