name: "Brain PR Gate"

# 10-cicd-deployment.md section 1.3: checkout, setup-node, npm ci, lint,
# type-check, unit+integration tests, then a Docker build-and-smoke of the
# section 3 image (netcheck release workflow's own build-and-smoke pattern,
# toolbelt-network-checker-release.yml) -- built for verification only,
# never pushed from CI.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "services/brain/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/brain-ci.yml"
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-gate:
    name: Brain PR Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install root workspace dependencies
        run: npm ci
      - name: Type-check services/brain
        working-directory: services/brain
        run: npm run typecheck
      - name: Run services/brain tests
        working-directory: services/brain
        run: npm test
      - name: "ADR-05 isolation check (m4-18, BR-3/II-4): this runner is a real non-Brain process context -- no Brain secret file is ever mounted here"
        run: |
          if node services/brain/scripts/isolation-check.mjs; then
            echo "isolation-check exited 0 (secret readable) from a non-Brain CI runner -- this must never happen" >&2
            exit 1
          fi
          echo "isolation-check correctly exited non-zero: the Brain secret is not readable from this context"
      - name: "Eval corpus gate (m4-19, 07 section 7.11): brain eval run over services/brain/evals/cases/*.case.json"
        working-directory: services/brain
        env:
          # Scratch state, never the production /data or /workspaces
          # volumes -- this CLI invocation only needs somewhere to open a
          # throwaway SQLite store and check out worktrees for the
          # duration of the eval run. config.ts's own default
          # workspacesRoot ("/workspaces") assumes the Dockerfile's own
          # VOLUME mkdir -- this bare runner has neither that directory
          # nor permission to create one at the filesystem root, so the
          # m6-01 seed corpus (the first real cases ever dispatched
          # through this step) needs an explicit, writable path.
          BRAIN_DATA_DIR: ${{ runner.temp }}/brain-eval-data
          BRAIN_WORKSPACES_ROOT: ${{ runner.temp }}/brain-eval-workspaces
        run: node bin/brain.mjs eval run --json
      - name: Build the Brain image (verification only, never pushed from CI)
        run: docker build -f services/brain/Dockerfile -t brain:pr-gate .
      - name: Smoke-run the built image (brain status --offline, no live daemon required)
        run: |
          out="$(docker run --rm --entrypoint node brain:pr-gate services/brain/bin/brain.mjs status --offline)"
          echo "$out"
          echo "$out" | grep -q '"status":"ok"'
