name: backup

# Nightly encrypted dump of the prod database. Doubles as database activity,
# which keeps the Supabase free-tier project from pausing after 7 idle days.
# The age private key never touches CI — decryption happens offline.
on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    if: vars.BACKUP_ENABLED == 'true'
    runs-on: ubuntu-latest
    container: postgres:17
    permissions:
      contents: read
      id-token: write
    steps:
      # DATABASE_URL comes from Infisical via OIDC — GitHub stores no secrets (ADR 009).
      - uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          domain: https://app.infisical.com
      - name: Install age
        run: apt-get update -qq && apt-get install -y -qq age
      - name: Dump and encrypt
        env:
          AGE_PUBLIC_KEY: ${{ vars.AGE_PUBLIC_KEY }}
        run: |
          pg_dump --format=custom --no-owner --schema=public \
            --file=lifeos.dump "$DATABASE_URL"
          age -r "$AGE_PUBLIC_KEY" -o lifeos.dump.age lifeos.dump
          rm lifeos.dump
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lifeos-backup-${{ github.run_id }}
          path: lifeos.dump.age
          retention-days: 30
          if-no-files-found: error
