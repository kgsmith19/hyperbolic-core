name: "Shell PR Gate"

# docs/planning/10-cicd-deployment.md section 1.2. packages/** is in the path
# filter because a shared-package change must re-verify the Shell that
# consumes it (packages/platform-client, packages/ui, packages/llm all ship
# through apps/shell). This is an npm workspaces monorepo (root package.json
# "workspaces": ["packages/*", "apps/shell"]), so one root `npm ci` installs
# every workspace member; there is no apps/shell/package-lock.json of its
# own to key the npm cache on, so the cache below keys on the root lockfile
# instead (a deliberate correction of section 1.2's literal wording to match
# the repo's actual single-lockfile structure).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "apps/shell/**"
      - "packages/**"
      - "services/llm-handler/**"
      - "docs/ops/**"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/shell-ci.yml"
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-gate:
    name: Shell PR Gate
    runs-on: ubuntu-latest
    timeout-minutes: 16 # ~2x the 8-minute budget (10-cicd-deployment.md section 10.3)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      # No lint step: neither apps/shell nor any packages/* workspace
      # declares a "lint" script, and no ESLint/Biome config exists anywhere
      # in the repo today (confirmed by search). Adding one is out of scope
      # for this CI chore; noted honestly here rather than inventing a script
      # that doesn't exist.

      - name: Build packages/ui dependency
        run: npm run build --workspace=packages/ui

      - name: Type-check apps/shell
        run: npx tsc -b apps/shell/frontend

      - name: Type-check packages/platform-client
        run: npm run typecheck --workspace=packages/platform-client

      - name: Type-check packages/llm
        run: npm run typecheck --workspace=packages/llm

      - name: Type-check services/llm-handler
        run: npm run typecheck --workspace=@hyperbolic/llm-handler

      - name: Type-check packages/ui
        # The dependency build above already emitted the clean-checkout
        # declarations Shell consumes; this re-runs the compiler explicitly.
        run: npx tsc -b packages/ui

      - name: "Unit tests: apps/shell (vitest)"
        run: npm run test:unit --workspace=apps/shell

      - name: "Unit tests: packages/platform-client (node --test)"
        run: npm test --workspace=packages/platform-client

      - name: "Unit tests: packages/ui (node --test)"
        run: npm test --workspace=packages/ui

      - name: "Unit tests: packages/llm (node --test)"
        run: npm test --workspace=packages/llm

      - name: "Unit tests: services/llm-handler (node --test)"
        run: npm test --workspace=@hyperbolic/llm-handler

      - name: Test deployment operator tooling
        run: node --test docs/ops/*.test.mjs

      - name: Cache Playwright Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: shell-playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: apps/shell

      - name: Start PostgreSQL for the registry-backed browser journey
        run: |
          sudo systemctl start postgresql.service
          sudo -n -u postgres psql -v ON_ERROR_STOP=1 -tAc "select 1"

      - name: Run every Shell e2e suite
        run: npx playwright test
        working-directory: apps/shell

      - name: Production build
        run: npm run build:app --workspace=apps/shell

      - name: Verify the static health endpoint
        run: npm run healthz-check --workspace=apps/shell

      - name: Enforce UI size budget
        run: node packages/ui/test/size-check.mjs

      - name: Enforce Shell size budget
        run: npm run size-check --workspace=apps/shell

      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shell-e2e-evidence
          path: |
            apps/shell/frontend/playwright-report/
            apps/shell/frontend/test-results/
          if-no-files-found: ignore
          retention-days: 14
