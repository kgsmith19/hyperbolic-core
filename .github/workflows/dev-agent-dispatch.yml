name: "Dev Agent Dispatch"

# Wakes the developer agent when AI Review blocks a pull request.
# llm-review-dialogue.yml posts the findings and then fires this via
# repository_dispatch; this workflow is the half that can actually change
# code. Issue #231. Generalized in Issue #252's follow-on slice 7 to read
# agent-roles.yaml's dev.provider instead of being hardcoded to Claude Code
# -- was claude-dispatch.yml.
#
# WHY repository_dispatch AND NOT an @mention. A comment posted with
# GITHUB_TOKEN cannot trigger an issue_comment workflow -- GitHub suppresses
# workflow runs from events its own token authored, to prevent recursion --
# and repository_dispatch is one of the two documented exceptions
# (the other being workflow_dispatch). Routing the handoff this way means the
# loop closes without a PAT. The validated dispatch mints the dev App's
# short-lived installation token and uses that token for every repository
# mutation.
#
# TRUST NOTE. This job checks out and executes pull-request-authored code, so
# it validates the dispatch, default-branch role policy, live PR provenance,
# and exact head before reading any secret. Its ambient token stays read-only.
# Only after validation does it mint the dev App's short-lived write token;
# the App private key is cleared before checkout, and checkout persists no
# credential.
#
# PROVIDER RESOLUTION. `agent-roles.yaml`'s `dev.provider` says which vendor
# is currently assigned -- but this workflow reads it from the repository's
# DEFAULT branch via the Contents API, never from the checked-out pull
# request branch. A PR branch could otherwise edit its own agent-roles.yaml
# and claim a different dev identity for itself; reading only the
# CODEOWNERS-gated main-branch copy is what keeps role assignment an owner
# decision, not something a pull request can grant itself.
#
# ONLY anthropic IS WIRED TODAY. openai and google fail the preflight
# closed with a clear, named reason rather than attempting a speculative call
# against an action/SDK shape nobody has verified here yet (Codex's headless
# action, Antigravity's still-OAuth-only auth -- see AGENTS.md's own note on
# the Antigravity gap). Flipping agent-roles.yaml's dev.provider to either
# before that lands fails this job loudly instead of silently doing nothing,
# or worse, doing the wrong thing.
#
# OWNER-PROVISIONED PREREQUISITES. This cannot resolve anything until the
# owner has provisioned, for whichever provider agent-roles.yaml names:
#   anthropic (the only one implemented) -- everything below comes from
#   Infisical's /dev/ secret path (env prod), one credential store rather
#   than a model key duplicated into a second, separately-maintained GitHub
#   secret (the operational hazard AGENTS.md documents for the platform
#   publishable key):
#     - vars.INFISICAL_DEV_IDENTITY_ID    Infisical machine identity scoped
#                                         to the /dev/ secret path
#     - vars.INFISICAL_PROJECT_SLUG       shared with the reviewer's own pull
#     - Infisical /dev/ (env prod): DEV_GITHUB_APP_ID, DEV_GITHUB_APP_PRIVATE_KEY,
#       and DEV_ANTHROPIC_API_KEY (or DEV_CLAUDE_CODE_OAUTH_TOKEN -- from the
#       Claude GitHub App, run /install-github-app -- either satisfies preflight)
# Until the relevant ones exist, the preflight step below fails this job's
# run explicitly, and llm-review-dialogue.yml never attempts the dispatch in
# the first place (AGENT_PROVISIONED is false), escalating straight to the
# owner instead.
on:
  repository_dispatch:
    types: [llm-review-finding]

permissions:
  contents: read

concurrency:
  # One agent per pull request. Two concurrent fixers on one branch would
  # race each other's pushes.
  group: dev-agent-dispatch-${{ github.event.client_payload.prNumber }}
  cancel-in-progress: false

jobs:
  resolve:
    name: "Resolve review findings"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    steps:
      # client_payload is caller-supplied data. Validate its schema, the
      # CODEOWNERS-protected default-branch role policy, and the live PR before
      # OIDC, Infisical, token minting, checkout, or model execution.
       - name: Preflight · Validate dispatch, dev role, and exact PR head
         id: preflight
         uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
         env:
           PR_NUMBER: ${{ github.event.client_payload.prNumber }}
           DISPATCH_HEAD_SHA: ${{ github.event.client_payload.headSha }}
           ROUND: ${{ github.event.client_payload.round }}
           RUN_URL: ${{ github.event.client_payload.runUrl }}
           DEV_PROVIDER: ${{ vars.DEV_PROVIDER }}
           DEV_MODEL: ${{ vars.DEV_MODEL }}
        with:
          script: |
            const { owner, repo } = context.repo;
            core.setOutput("eligible", "false");

            const rawPrNumber = process.env.PR_NUMBER ?? "";
            const headSha = process.env.DISPATCH_HEAD_SHA ?? "";
            const rawRound = process.env.ROUND ?? "";
            const runUrl = process.env.RUN_URL ?? "";
            const positiveInteger = /^[1-9]\d*$/;

            if (!positiveInteger.test(rawPrNumber)) {
              core.setFailed("client_payload.prNumber must be a positive integer.");
              return;
            }
            if (!/^[0-9a-f]{40}$/i.test(headSha)) {
              core.setFailed("client_payload.headSha must be an exact 40-character hexadecimal commit SHA.");
              return;
            }
            if (!positiveInteger.test(rawRound)) {
              core.setFailed("client_payload.round must be a positive integer.");
              return;
            }
            const runUrlPrefix = `https://github.com/${owner}/${repo}/actions/runs/`;
            if (!runUrl.startsWith(runUrlPrefix) || !/^\d+$/.test(runUrl.slice(runUrlPrefix.length))) {
              core.setFailed(`client_payload.runUrl must name an Actions run in ${owner}/${repo}.`);
              return;
            }

            let provider = (process.env.DEV_PROVIDER || "").trim().toLowerCase();
            let model = (process.env.DEV_MODEL || "").trim();

            if (!provider || !model) {
              try {
                const { data } = await github.rest.repos.getContent({ owner, repo, path: "agent-roles.yaml" });
                const content = Buffer.from(data.content, data.encoding).toString("utf8").replace(/\r\n/g, "\n");
                const devBlockMatch = /^dev:[ \t]*(?:#[^\n]*)?\n((?:[ \t]+[^\n]*(?:\n|$))*)/m.exec(content);
                const devBlock = devBlockMatch ? devBlockMatch[1] : "";
                const providerMatch = /^[ \t]+provider:[ \t]*(\S+)/m.exec(devBlock);
                const modelMatch = /^[ \t]+model:[ \t]*(\S+)/m.exec(devBlock);
                if (!provider) provider = providerMatch ? providerMatch[1].trim().toLowerCase() : null;
                if (!model) model = modelMatch ? modelMatch[1].trim() : null;
              } catch (error) {
                core.setFailed(`Could not read agent-roles.yaml from the default branch: ${error.message}`);
                return;
              }
            }

            if (!provider || provider === '""' || provider === "''") {
              core.setFailed("Could not resolve dev.provider from vars.DEV_PROVIDER or agent-roles.yaml -- refusing to guess which vendor to wake.");
              return;
            }
            core.setOutput("provider", provider);
            if (!model || model === '""' || model === "''") {
              core.setFailed("Could not resolve dev.model from vars.DEV_MODEL or agent-roles.yaml -- refusing to use an adapter default.");
              return;
            }
            core.setOutput("model", model);
            if (provider !== "anthropic") {
              core.setFailed(
                `dev.provider="${provider}", but this dispatcher only implements "anthropic" today. ` +
                  "Nothing will reach a pull request or credential until that provider's real adapter is implemented."
              );
              return;
            }

            const prNumber = Number(rawPrNumber);
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });

            const fullName = `${owner}/${repo}`;
            const headRepo = pr.head?.repo;
            if (!headRepo || headRepo.fork !== false || headRepo.full_name !== fullName || pr.base?.repo?.full_name !== fullName) {
              core.setFailed(`PR #${prNumber} is forked or cross-repository; refusing to execute its head.`);
              return;
            }
            if (pr.state !== "open") {
              core.setFailed(`PR #${prNumber} is ${pr.state}; refusing to dispatch an agent.`);
              return;
            }
            if (pr.head.sha !== headSha) {
              core.setFailed(`PR #${prNumber} moved to ${pr.head.sha}; this dispatch names ${headSha}.`);
              return;
            }

            core.setOutput("pr_number", String(prNumber));
            core.setOutput("head_sha", headSha);
            core.setOutput("branch", pr.head.ref);
            core.setOutput("round", String(Number(rawRound)));
            core.setOutput("run_url", runUrl);
            core.setOutput("eligible", "true");
            core.info(`Validated PR #${prNumber} at ${headSha}; dev provider ${provider}, model ${model}.`);

      # The dev identity's App and model credentials share the Infisical /dev/
      # path. This is the first credential-bearing step and is unreachable for
      # an ineligible dispatch.
      - name: Setup · Pull the dev App's credentials from Infisical
        if: steps.preflight.outputs.eligible == 'true'
        uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_DEV_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          secret-path: "/dev/"
          domain: https://app.infisical.com

      - name: Preflight · Confirm the dev agent's credentials are provisioned
        if: steps.preflight.outputs.eligible == 'true'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          OAUTH: ${{ env.DEV_CLAUDE_CODE_OAUTH_TOKEN }}
          API_KEY: ${{ env.DEV_ANTHROPIC_API_KEY }}
          APP_ID: ${{ env.DEV_GITHUB_APP_ID }}
          APP_PRIVATE_KEY: ${{ env.DEV_GITHUB_APP_PRIVATE_KEY }}
        with:
          script: |
            if (!process.env.APP_ID || !process.env.APP_PRIVATE_KEY) {
              core.setFailed(
                "The dev App's own posting/push identity is not provisioned. Add BOTH " +
                  "DEV_GITHUB_APP_ID and DEV_GITHUB_APP_PRIVATE_KEY to Infisical's /dev/ secret path (env prod) -- " +
                  "see Issue #290. Until then llm-review-dialogue.yml escalates straight to the owner instead of " +
                  "waiting on a fixer that cannot start."
              );
              return;
            }

            if (!process.env.OAUTH && !process.env.API_KEY) {
              core.setFailed(
                "No Anthropic agent credential is provisioned. Add ONE of these to Infisical's " +
                  "/dev/ secret path (env prod): DEV_CLAUDE_CODE_OAUTH_TOKEN (from the Claude GitHub App; run " +
                  "/install-github-app), or DEV_ANTHROPIC_API_KEY. Until then llm-review-dialogue.yml escalates " +
                  "straight to the owner instead of waiting on a fixer that cannot start -- see Issue #231."
              );
              return;
            }

            core.info("Dev App and Anthropic model credentials are present.");

      - name: Setup · Mint the dev App's installation token
        if: steps.preflight.outputs.eligible == 'true'
        id: dev-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ env.DEV_GITHUB_APP_ID }}
          private-key: ${{ env.DEV_GITHUB_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          # PR conversation comments (rebuttals, out-of-scope proposals -- the
          # prompt below asks for both) go through the Issues API even on a
          # pull request, so pull-requests alone does not cover posting them.
          permission-issues: write

      # The installation token is now the only credential needed downstream.
      # Clear the long-lived App material before PR-authored bytes reach the
      # runner. GITHUB_ENV makes the blanking persist for every later step.
      - name: Setup · Clear the dev App's private key
        if: steps.preflight.outputs.eligible == 'true'
        shell: bash
        run: |
          printf '%s\n' 'DEV_GITHUB_APP_ID=' 'DEV_GITHUB_APP_PRIVATE_KEY=' >> "$GITHUB_ENV"

      - name: Setup · Checkout the validated pull request head
        if: steps.preflight.outputs.eligible == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.preflight.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.dev-app-token.outputs.token }}

      - name: Resolve · Hand the findings to the developer agent
        if: steps.preflight.outputs.eligible == 'true'
        uses: anthropics/claude-code-action@1d9782c6c3a2eaaf8845d33b203bea0ec00c1596 # v1
        with:
          claude_code_oauth_token: ${{ env.DEV_CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ env.DEV_ANTHROPIC_API_KEY }}
          github_token: ${{ steps.dev-app-token.outputs.token }}
          # Milestone 2 adds the Controller App to this exact allowlist only
          # after its installed bot login is provisioned and verified.
          allowed_bots: hyperbolic-core-reviewer[bot]
          claude_args: |
            --model ${{ steps.preflight.outputs.model }}
          prompt: |
            You are the developer agent for pull request #${{ steps.preflight.outputs.pr_number }}
            in this repository, on branch `${{ steps.preflight.outputs.branch }}`.

            The adversarial review gate (`AI Review`) is blocking this pull
            request. Its findings are in the single managed comment on the pull
            request whose body starts with:

                <!-- agent-engineering-standard:llm-review:v1 -->

            Read that comment. This is round ${{ steps.preflight.outputs.round }};
            the review run is ${{ steps.preflight.outputs.run_url }}.

            Read `AGENTS.md` at the repository root first — it governs how you work
            here — and read the Issue this pull request closes.

            For EACH blocking finding, do exactly one of:

            1. FIX IT. Make the smallest change that fully resolves the finding, and
               commit it to this branch. Every fix needs a test that would have failed
               before it. Never weaken, delete, or skip a test to turn the gate green —
               `AGENTS.md` forbids it outright, and doing so is worse than leaving the
               finding open.
            2. REBUT IT. Reply in the pull request discussion with the argument. Ground
               it in the linked Issue's acceptance criteria, a named `AGENTS.md`
               section, and the diff itself. Objectively, never from taste. A finding
               that cites nothing checkable is discarded by the gate already, so say so
               plainly if that is the case.
            3. PROPOSE OUT OF SCOPE. When a finding is real but does not belong in THIS
               pull request, say so explicitly in your reply and propose it become a
               separate, non-blocking Issue instead. Only the reviewer can actually mark
               a finding `outOfScope` — your reply is the proposal, not the decision —
               and it can only do that in response to an explicit proposal like this one,
               never on its own. Be concrete about why the finding is out of scope: what
               makes it a separate concern from what this pull request claims to do.

            Judge each finding on its merits — you are looking for the correct outcome,
            not for agreement and not for a way to dismiss the reviewer. Partial
            agreement is a fine answer: fix what is right, rebut what is not, and propose
            deferring what is real but out of scope.

            Structure every reply about a finding as a real deliberation turn
            (Issue #325). Open with your explicit position — **Agree**,
            **Disagree**, or **Other** — on the reviewer's most recent
            citation-grounded reasoning for that finding, then justify your
            position against the finding's own citation: when you propose an
            alternate fix, argue why it satisfies the cited requirement, not
            why the reviewer's suggestion is wrong. A reply that repeats a
            prior position without new citation-grounded reasoning does not
            count as a real turn — it advances nothing and spends a round.
            The reviewer is held to the same bar in the other direction: to
            keep a finding blocking after your justified alternate, it must
            engage that justification against the original citation with new
            reasoning, never just restate its own preferred implementation.

            If you genuinely cannot resolve a finding either way, say so in the reply
            and explain what is blocking you. Do not guess, and do not silently drop it —
            the dialogue workflow escalates unresolved rounds to @kgsmith19, and it can
            only do that honestly if you have said where you got stuck.

            Never merge the pull request, never approve it, never change repository
            settings, and never use an administrative bypass.

            End every comment or reply you post in this pull request with this exact
            footer, on its own line, so a reader always knows which agent and model
            posted it without opening the run log:

            _Dev Agent — role `dev` · provider `${{ steps.preflight.outputs.provider }}` · model `${{ steps.preflight.outputs.model }}`_

      # A pushed commit already retriggers pr-verify.yml on its own via
      # pull_request:synchronize -- nothing further is needed for that case.
      # This step exists for the OTHER case: the agent replied with a
      # comment-only rebuttal or out-of-scope proposal and pushed nothing,
      # so nothing would otherwise cause AI Review to look at it. Firing
      # llm-review-recheck.yml via the same repository_dispatch mechanism
      # (Issue #262's follow-on slice 8) closes that gap the same way the
      # initial wake does: GITHUB_TOKEN cannot retrigger a pull_request
      # workflow, and repository_dispatch is one of the two exceptions.
      - name: Recheck · Fire a recheck if the agent replied without pushing a commit
        if: steps.preflight.outputs.eligible == 'true'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          PR_NUMBER: ${{ steps.preflight.outputs.pr_number }}
          DISPATCH_HEAD_SHA: ${{ steps.preflight.outputs.head_sha }}
        with:
          github-token: ${{ steps.dev-app-token.outputs.token }}
          script: |
            const { owner, repo } = context.repo;
            const prNumber = Number(process.env.PR_NUMBER);
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });

            if (pr.head.sha !== process.env.DISPATCH_HEAD_SHA) {
              core.info(
                `PR #${prNumber} moved to ${pr.head.sha} during this run -- the agent pushed, so pull_request:synchronize ` +
                  "already retriggers AI Review on its own. Not firing a recheck."
              );
              return;
            }

            try {
              await github.rest.repos.createDispatchEvent({
                owner,
                repo,
                event_type: "llm-review-recheck",
                client_payload: { prNumber, headSha: pr.head.sha },
              });
              core.info(`Dispatched llm-review-recheck for PR #${prNumber} at unchanged head ${pr.head.sha}.`);
            } catch (error) {
              core.warning(`Could not fire the recheck dispatch: ${error.message}`);
            }
