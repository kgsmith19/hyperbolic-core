name: Apply Label Taxonomy

on:
  workflow_dispatch:

permissions:
  labels: write

jobs:
  apply-labels:
    name: Sync full label taxonomy
    runs-on: ubuntu-latest
    steps:
      - name: Apply labels
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const labels = [
              // type:*
              { name: "type:feature",   color: "0075ca", description: "New feature or behaviour" },
              { name: "type:bug",        color: "d73a4a", description: "Defect in existing behaviour" },
              { name: "type:chore",      color: "fef2c0", description: "Maintenance, dependency, or tooling work" },
              { name: "type:docs",       color: "0075ca", description: "Documentation only" },
              { name: "type:refactor",   color: "c5def5", description: "Code change without behaviour change" },
              // agent:*
              { name: "agent:human",     color: "ededed", description: "Authored or reviewed by a human" },
              { name: "agent:copilot",   color: "ededed", description: "Authored or reviewed by Copilot agent" },
              // priority:*
              { name: "priority:p0",     color: "b60205", description: "Critical — blocks release or users" },
              { name: "priority:p1",     color: "e11d48", description: "High — address this sprint" },
              { name: "priority:p2",     color: "f97316", description: "Normal — address when capacity allows" },
              // automerge:*
              { name: "automerge:squash", color: "bfd4f2", description: "Auto-merge via squash when checks pass" },
              { name: "automerge:merge",  color: "bfd4f2", description: "Auto-merge via merge commit when checks pass" },
              // ci / release
              { name: "ci:full",          color: "e4e669", description: "Trigger full (extended) CI suite" },
              { name: "release:requested", color: "0e8a16", description: "Marks a PR as a release candidate" },
              // status:* (ensure complete set)
              { name: "status:in-progress", color: "ededed", description: "Actively being worked" },
              { name: "status:ready",       color: "ededed", description: "Ready for review or merge" },
              { name: "status:blocked",     color: "ededed", description: "Blocked on an external dependency" },
              // risk:* (ensure complete set)
              { name: "risk:R0", color: "ededed", description: "Trivial / non-behavioural" },
              { name: "risk:R1", color: "ededed", description: "Docs, comments, pure-function refactor" },
              { name: "risk:R2", color: "ededed", description: "Normal feature slice" },
              { name: "risk:R3", color: "ededed", description: "Migration, RLS, auth-path change" },
              { name: "risk:R4", color: "ededed", description: "Destructive / forbidden by architecture" },
            ];

            for (const label of labels) {
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ...label,
                });
                console.log(`Created: ${label.name}`);
              } catch (err) {
                if (err.status === 422) {
                  // Already exists — update description/color in case they drifted
                  await github.rest.issues.updateLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name: label.name,
                    color: label.color,
                    description: label.description,
                  });
                  console.log(`Updated: ${label.name}`);
                } else {
                  throw err;
                }
              }
            }
