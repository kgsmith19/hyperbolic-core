name: "Secret Scan"

# Called as the "Verify: Secrets" stage of pr-verify.yml's sequential
# chain -- the FIRST stage, deliberately: no point spending compute on any
# other gate if a secret was just committed. See repo-policy.yml's header
# comment for why pull_request-specific data arrives via inputs rather
# than github.event.pull_request.

on:
  workflow_call:
    inputs:
      pr_number:
        type: string
        required: false
      pr_head_sha:
        type: string
        required: false
      pr_base_sha:
        type: string
        required: false
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.pr_number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup · Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup · Install checksum-verified Gitleaks
        shell: bash
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          archive="${RUNNER_TEMP}/${asset}"
          curl --fail --location --silent --show-error --retry 3 \
            --output "${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${asset}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --status
          tar --no-same-owner -xzf "${archive}" -C "${RUNNER_TEMP}" gitleaks
          chmod 0755 "${RUNNER_TEMP}/gitleaks"
      - name: Scan · Scan the repository working tree
        shell: bash
        run: |
          "${RUNNER_TEMP}/gitleaks" dir --no-banner --redact --verbose --config .gitleaks.toml .
      - name: Scan · Scan commits introduced by this change
        shell: bash
        env:
          BASE_SHA: ${{ inputs.pr_base_sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ inputs.pr_head_sha || github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          sha_pattern='^[0-9a-f]{40}$'
          if [[ ! "${BASE_SHA}" =~ ${sha_pattern} || ! "${HEAD_SHA}" =~ ${sha_pattern} ]]; then
            echo "GitHub did not provide a valid base/head commit range." >&2
            exit 1
          fi
          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"
          "${RUNNER_TEMP}/gitleaks" git --no-banner --redact --verbose \
            --config .gitleaks.toml --log-opts="${BASE_SHA}..${HEAD_SHA}" .

  pr-gate:
    name: "Verify: Secrets"
    needs: [gitleaks]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - name: Gate · Confirm Gitleaks passed
        shell: bash
        run: |
          test "${{ needs.gitleaks.result }}" = "success"
      - name: Gate · Confirm tested SHA matches the live PR head
        if: inputs.pr_number != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          TESTED_SHA: ${{ inputs.pr_head_sha }}
        run: |
          set -euo pipefail
          live_sha="$(curl --fail --silent \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/pulls/${PR_NUMBER}" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["head"]["sha"])')"
          if [ "${live_sha}" != "${TESTED_SHA}" ]; then
            echo "Tested SHA (${TESTED_SHA}) no longer matches the live PR head (${live_sha})." >&2
            exit 1
          fi
          echo "Tested SHA matches the live PR head (${TESTED_SHA})."
      - name: Gate · Publish step summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Verify: Secrets"
            echo ""
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "| gitleaks | ${{ needs.gitleaks.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
