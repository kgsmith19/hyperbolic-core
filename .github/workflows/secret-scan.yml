name: "Verify: Secrets"

# Standalone entry point for merge_group/push/workflow_dispatch only -- the
# pull_request path runs this same logic as a native job in pr-verify.yml
# (see that file's header), both calling the verify-secrets composite
# action under .github/actions/ so the actual scanning logic has exactly
# one source. No paths: filter, deliberately -- see repo-policy.yml's
# header comment.

on:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  verify-secrets:
    name: "Verify: Secrets"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: ./.github/actions/verify-secrets
        with:
          base_sha: ${{ github.event.merge_group.base_sha }}
          head_sha: ${{ github.event.merge_group.head_sha }}
