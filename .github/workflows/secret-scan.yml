name: "Secret Scan"

# Independent security review, Finding 40 (re-verified against current
# HEAD): gitleaks steps exist only inside acc-ci.yml (paths:
# agentic-command-center/**, toolbelt/guards/**) and toolbelt-ci.yml (paths:
# toolbelt/**), and both instances are additionally gated
# `if: github.event_name == 'pull_request'` on the scan step itself -- even
# though both workflows also declare `merge_group:` as a real trigger, so a
# merge-queue run of either workflow silently skips its own secret scan.
# Between the two of them, shell-ci.yml's whole surface (Shell, UI, LLM,
# CLI, packages/platform-client and the rest of packages/*) has NO gitleaks
# step at all, and none of the three workflows' own path filters cover
# .gitleaks.toml or the workflow YAML files themselves -- so a change to the
# scan's own configuration, or to a workflow file, can land without ever
# being scanned by the path-filtered workflows that would otherwise have
# covered the code around it.
#
# Fix: one new, dedicated, repo-wide workflow, deliberately NOT gated by any
# path filter (a secret can land in any file in this repo, not just the
# paths the three existing per-app gates happen to watch) and NOT
# conditioned on event_name -- unlike the per-app scans, this one genuinely
# runs on both `pull_request` and `merge_group`. The existing per-workflow
# scans in acc-ci.yml/toolbelt-ci.yml are left in place deliberately
# (redundant but harmless defense-in-depth for their own narrower surfaces;
# removing them is out of scope here and adds risk for no benefit).
#
# Same gitleaks action, exact pinned SHA, and .gitleaks.toml config already
# used by acc-ci.yml/toolbelt-ci.yml -- mirrored verbatim, not a new pin.

on:
  pull_request:
  merge_group:

concurrency:
  group: secret-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: false
