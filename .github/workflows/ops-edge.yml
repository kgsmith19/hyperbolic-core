name: Ops Origin

# Deploys the loopback-only nginx origin required by Tailscale Serve. The
# Cloudflare tunnel is an optional profile and remains dark unless its
# independent gate and credential are present. PRIVATE_ORIGIN_GATEWAY_ENABLED
# is a migration gate: this file can merge without a push-triggered deploy.
on:
  push:
    branches: [main]
    paths:
      - "docs/ops/edge-origin/**"
      - ".github/workflows/ops-edge.yml"
  workflow_dispatch:

concurrency:
  group: deploy-edge-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: vars.DEPLOY_ENABLED == 'true' && vars.PRIVATE_ORIGIN_GATEWAY_ENABLED == 'true'
    name: Deploy private origin and optional public tunnel
    runs-on: ubuntu-latest
    environment: ops-edge-production
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Secrets · Pull tailnet credentials
        uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_SHELL_DEPLOY_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          secret-path: "/platform/shell-deploy/"
          domain: https://app.infisical.com

      - name: Secrets · Pull optional Cloudflare tunnel token
        if: vars.CLOUDFLARE_EDGE_ENABLED == 'true'
        uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_PLATFORM_EDGE_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          secret-path: "/platform/edge/"
          domain: https://app.infisical.com

      - name: Network · Join tailnet
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ env.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ env.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ vars.DEPLOY_HOST }}

      - name: Deploy · Start nginx, then optionally cloudflared
        shell: bash
        env:
          CLOUDFLARE_EDGE_ENABLED: ${{ vars.CLOUDFLARE_EDGE_ENABLED }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          ssh_options=(-o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new)
          if [[ ! "$DEPLOY_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]{0,252}[A-Za-z0-9]$ ]]; then
            echo "DEPLOY_HOST must be a non-empty DNS name or IPv4 address." >&2
            exit 1
          fi
          cloudflare_enabled=false
          if [[ "${CLOUDFLARE_EDGE_ENABLED:-}" == "true" ]]; then
            cloudflare_enabled=true
            if [[ -z "${CLOUDFLARE_TUNNEL_TOKEN:-}" ]]; then
              echo "::error::CLOUDFLARE_EDGE_ENABLED is true but CLOUDFLARE_TUNNEL_TOKEN was not supplied by Infisical (/platform/edge/)." >&2
              exit 1
            fi
            umask 077
            printf 'CLOUDFLARE_TUNNEL_TOKEN=%s\n' "$CLOUDFLARE_TUNNEL_TOKEN" > "$RUNNER_TEMP/.env.edge"
          fi

          ssh "${ssh_options[@]}" "deploy@$DEPLOY_HOST" 'mkdir -p edge-origin'
          scp "${ssh_options[@]}" docs/ops/edge-origin/compose.yml docs/ops/edge-origin/nginx.conf \
            docs/ops/edge-origin/private_spa_locations.conf docs/ops/edge-origin/public_paths.conf \
            "deploy@$DEPLOY_HOST:edge-origin/"
          if [[ "$cloudflare_enabled" == "true" ]]; then
            ssh "${ssh_options[@]}" "deploy@$DEPLOY_HOST" \
              'touch edge-origin/.env && chmod 600 edge-origin/.env'
            scp "${ssh_options[@]}" "$RUNNER_TEMP/.env.edge" "deploy@$DEPLOY_HOST:edge-origin/.env"
          fi

          ssh "${ssh_options[@]}" "deploy@$DEPLOY_HOST" "bash -s -- '$cloudflare_enabled'" <<'REMOTE'
          set -euo pipefail
          cd edge-origin
          if [[ "$1" == "true" ]]; then
            chmod 600 .env
            docker compose --profile cloudflare pull
            docker compose --profile cloudflare up -d --wait
          else
            docker compose --profile cloudflare stop cloudflared
            docker compose pull edge-origin
            docker compose up -d --wait edge-origin
          fi
          curl -fsS http://127.0.0.1:8080/healthz
          curl -fsS http://127.0.0.1:8081/healthz
          REMOTE

          # Health alone cannot prove browser-history routing. Probe through
          # the same tailnet HTTPS boundary a browser uses, and keep asset/API
          # negative controls honest so an over-broad SPA fallback cannot pass.
          origin="https://$DEPLOY_HOST"
          probe_document() {
            local label="$1" path="$2" expect="$3"
            local body="$RUNNER_TEMP/ops-origin-document.html"
            if ! curl --fail --silent --show-error --max-time 15 \
              "$origin$path" > "$body"; then
              echo "::error::$label ($path) did not return a successful document." >&2
              return 1
            fi
            if ! grep -qE "$expect" "$body"; then
              echo "::error::$label ($path) did not contain its expected production bundle marker." >&2
              return 1
            fi
            echo "ok   $label ($path)"
          }
          probe_404() {
            local label="$1" path="$2" require_non_html="$3"
            local body="$RUNNER_TEMP/ops-origin-negative-body"
            local headers="$RUNNER_TEMP/ops-origin-negative-headers"
            local status
            status="$(curl --silent --show-error --max-time 15 \
              --output "$body" --dump-header "$headers" \
              --write-out '%{http_code}' "$origin$path")"
            if [[ "$status" != "404" ]]; then
              echo "::error::$label ($path) returned HTTP $status instead of an honest 404." >&2
              return 1
            fi
            if [[ "$require_non_html" == "true" ]] && \
              grep -qiE '^content-type:[[:space:]]*text/html' "$headers"; then
              echo "::error::$label ($path) returned an SPA HTML document from an API prefix." >&2
              return 1
            fi
            echo "ok   $label ($path: 404)"
          }

          probe_document "Shell login" "/login" 'src="/assets/[A-Za-z0-9_.-]+\.js"'
          probe_document "Shell settings" "/settings" 'src="/assets/[A-Za-z0-9_.-]+\.js"'
          probe_document "LifeOS capture" "/life/capture" 'src="/life/assets/[A-Za-z0-9_.-]+\.js"'
          probe_404 "Missing Shell asset" "/assets/__ops_origin_missing__.js" "false"
          probe_404 "Missing LifeOS asset" "/life/assets/__ops_origin_missing__.js" "false"
          probe_404 "Handler API boundary" "/api/__ops_origin_boundary__.js" "true"
          probe_404 "Brain API boundary" "/api/brain/__ops_origin_boundary__.js" "true"
          probe_404 "LifeOS API boundary" "/life/api/__ops_origin_boundary__.js" "true"
