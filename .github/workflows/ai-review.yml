name: AI Review Gate

on:
  pull_request_review:
    types: [submitted, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  issue_comment:
    types: [created, edited]

concurrency:
  group: ai-review-${{ github.repository }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  update-ai-review:
    if: >-
      ((github.event_name != 'pull_request_review' && github.event_name != 'pull_request_review_comment') || github.event.pull_request.draft == false) &&
      (github.event_name != 'issue_comment' || (
        github.event.issue.pull_request != null &&
        (github.event.comment.user.login == 'Copilot' || github.event.comment.user.login == 'copilot-pull-request-reviewer[bot]' || github.event.comment.user.login == 'copilot-swe-agent[bot]') &&
        (contains(github.event.comment.body, 'AI-REVIEW PASS') || contains(github.event.comment.body, 'AI-REVIEW FAIL'))
      ))
    permissions:
      checks: write
      contents: read
      issues: write
      pull-requests: write
    uses: kgsmith19/agent-engineering-standard/.github/workflows/ai-review-reusable.yml@a9d1bf7a43dd8727d8ae7f031da2abe9ad9ff0b1
    with:
      pr_number: ${{ github.event.pull_request.number || github.event.issue.number }}
      standard_sha: a9d1bf7a43dd8727d8ae7f031da2abe9ad9ff0b1
