name: "Toolbelt PR Gate"

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited, labeled, unlabeled]
    paths:
      - "apps/toolbelt/**"
      - "packages/toolbelt-cli/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/toolbelt-ci.yml"
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout · Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup · Configure Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Setup · Configure Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Database · Start disposable PostgreSQL for migration E2E tests
        shell: bash
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -v ON_ERROR_STOP=1 -tAc "select 1"
      - name: Dependencies · Install root workspace dependencies
        run: npm ci
      - name: Toolbelt · Check manifests
        run: npm run manifests:check -- --registry
        working-directory: apps/toolbelt
      - name: Migrations · Validate and stage the unified migration ledger
        run: |
          npm run migrations:check
          stage_dir="${RUNNER_TEMP}/platform-migration-stage"
          npm run migrations:stage -- "${stage_dir}"
          test -n "$(find "${stage_dir}/supabase/migrations" -maxdepth 1 -type f -name '*.sql' -print -quit)"
        working-directory: apps/toolbelt
      - name: Test · Run Toolbelt CLI tests
        run: npm test --workspace=@hyperbolic/toolbelt-cli
      - name: Test · Run hermetic Toolbelt tests
        run: |
          node --test \
            tests/core-rpc-migration.test.mjs \
            tests/core-event-retention-atomic.test.mjs \
            tests/registration-toolbelt.test.mjs \
            tests/registry-manifest-hash.test.mjs \
            tests/registry-migrations-idempotency.test.mjs \
            tests/stage-migrations.test.mjs \
            tests/toolbelt-workflow.test.mjs \
            tests/validate-manifests.test.mjs \
            tests/validate-migrations.property.test.mjs \
            tests/validate-migrations.test.mjs
        working-directory: apps/toolbelt
        env:
          TOOLBELT_REQUIRE_POSTGRES: "1"
      - name: Test · Run Guards tests
        run: node --test *.test.mjs
        working-directory: apps/toolbelt/guards
      # Enumerated, not globbed, and the distinction is load-bearing: this
      # step runs the unit and real-local-Postgres suites, which need no
      # credential and write nothing outside their own disposable database.
      # tests/ also holds eight live-Supabase suites (archive, configuration,
      # render-endpoint, restore, skeleton, tags, usage, versions) that
      # authenticate via helpers.mjs's primaryToken() and write to the real
      # hosted project. Since m1-08 pinned prompt.* RLS to the owner UUID they
      # cannot pass on a fixture identity at all, so they are owner-only
      # manual proofs -- a glob here would fail the gate outright.
      - name: Test · Run Prompt Organizer tests
        run: |
          node --test --test-concurrency=1 \
            backend/tests/contract.test.mjs \
            backend/tests/get-prompt.test.mjs \
            backend/tests/helpers.unit.test.mjs \
            backend/tests/migration-contract.test.mjs \
            backend/tests/owner-session.test.mjs \
            frontend/tests/panel.test.mjs \
            backend/tests/performance.test.mjs \
            backend/tests/prompt-usage-retention-atomic.test.mjs \
            backend/tests/purge_old_usage_revoke_public.test.mjs \
            frontend/tests/render.test.mjs \
            backend/tests/retention.test.mjs \
            frontend/tests/search.test.mjs \
            frontend/tests/sections.test.mjs \
            backend/tests/seed.test.mjs
        working-directory: apps/toolbelt/apps/prompt-organizer
        env:
          PROMPT_REQUIRE_POSTGRES: "1"
      - name: Test · Run Idea Intake tests
        run: node --test --test-concurrency=1 "tests/*.test.mjs"
        working-directory: apps/toolbelt/apps/idea-intake
        env:
          TOOLBELT_REQUIRE_POSTGRES: "1"
      - name: Dependencies · Cache Playwright Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: toolbelt-playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Dependencies · Install Playwright Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: E2E · Start Prompt Organizer
        run: python3 -m http.server 8812 --directory frontend >/tmp/prompt-organizer.log 2>&1 &
        working-directory: apps/toolbelt/apps/prompt-organizer
      - name: E2E · Wait for Prompt Organizer
        shell: bash
        run: |
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://localhost:8812 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/prompt-organizer.log
          echo "Prompt Organizer did not become ready." >&2
          exit 1
      # Mints the owner session AT JOB START rather than reading a
      # hand-pasted access token straight out of the secret. Supabase access
      # tokens expire in about an hour, so the previous wiring here (the raw
      # secret threaded directly into the journey below) went red again within
      # the hour of every manual re-mint, and its failure was indistinguishable
      # from the token never having been set at all. The refresh token is
      # long-lived, and export-test-sessions.mjs exchanges it for a fresh
      # access token, exporting that through $GITHUB_ENV -- exactly what
      # platform-contract.yml's own verify job already does.
      #
      # It also calls verifyOwnerAccessToken(), which fails this step outright
      # when the resolved session is not platform.owner(). That matters: a
      # wrong or expired credential otherwise surfaces only as an
      # unrelated-looking "element(s) not found" in the journey below, because
      # the test silently falls back to an RLS-powerless fixture login.
      #
      # Runs export-OWNER-session.mjs, not the export-test-sessions.mjs that
      # platform-contract.yml uses: that one also mints TEST_USER_A/B fixture
      # sessions its deployed suites need, and TEST_USER_B does not exist in
      # the platform project (its password grant 400s). The journey below uses
      # only the owner token, so it should not depend on that fixture existing.
      #
      # REFRESH TOKEN ONLY. TOOLBELT_OWNER_TOKEN is deliberately not passed:
      # a stored access token is a snapshot that expires in about an hour, and
      # every failure it causes looks exactly like the credential was never
      # configured at all. Not passing it means this step cannot silently
      # depend on one, and cannot go green on a token that happens to still be
      # inside its window. If no refresh token is configured the step fails
      # closed with "TOOLBELT_OWNER_REFRESH_TOKEN is required", which is the
      # honest outcome.
      - name: E2E · Exchange and verify the owner session
        run: node backend/tests/export-owner-session.mjs
        working-directory: apps/toolbelt/apps/prompt-organizer
        env:
          TOOLBELT_OWNER_REFRESH_TOKEN: ${{ secrets.TOOLBELT_OWNER_REFRESH_TOKEN }}
      - name: E2E · Run Prompt Organizer critical browser journey
        run: ./node_modules/.bin/playwright test --config apps/toolbelt/apps/prompt-organizer/frontend/playwright.config.mjs
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8812
          # TOOLBELT_OWNER_TOKEN is deliberately NOT set here. The exchange
          # step above already exported a freshly minted one through
          # $GITHUB_ENV, and a step-level env entry takes precedence over that
          # -- re-pinning this step to the possibly-stale secret value and
          # reintroducing the very expiry problem the exchange step removes.
          # critical-flow.test.mjs reads the same variable either way (see its
          # own "Owner-credential threading" header comment).
      - name: Evidence · Upload Prompt Organizer browser evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prompt-organizer-e2e-evidence
          path: |
            apps/toolbelt/apps/prompt-organizer/frontend/playwright-report/
            apps/toolbelt/apps/prompt-organizer/frontend/test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Test · Run Network Checker tests and deterministic scanners
        run: bash backend/tools/check.sh
        working-directory: apps/toolbelt/apps/network-checker
      - name: E2E · Prepare Network Checker dashboard fixture
        run: python3 backend/tests/e2e/seed_dashboard_fixture.py
        working-directory: apps/toolbelt/apps/network-checker
      - name: E2E · Start Network Checker dashboard
        run: python3 -m network_checker serve --no-open >network-checker.log 2>&1 &
        working-directory: apps/toolbelt/apps/network-checker/backend
        env:
          NETWORK_CHECKER_DB: ${{ github.workspace }}/apps/toolbelt/apps/network-checker/backend/tests/e2e/dashboard-fixture.db
      - name: E2E · Wait for Network Checker dashboard
        shell: bash
        run: |
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8787 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat apps/toolbelt/apps/network-checker/backend/network-checker.log
          echo "Network Checker did not become ready." >&2
          exit 1
      - name: E2E · Run Network Checker critical browser journey
        run: ./node_modules/.bin/playwright test --config apps/toolbelt/apps/network-checker/frontend/playwright.config.mjs
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8787
      - name: Evidence · Upload Network Checker browser evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: network-checker-e2e-evidence
          path: |
            apps/toolbelt/apps/network-checker/frontend/playwright-report/
            apps/toolbelt/apps/network-checker/frontend/test-results/
            apps/toolbelt/apps/network-checker/backend/network-checker.log
          if-no-files-found: ignore
          retention-days: 14

  pr-gate:
    name: Toolbelt PR Gate
    needs: [checks]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - name: Gate · Confirm every required job passed
        shell: bash
        run: |
          test "${{ needs.checks.result }}" = "success"
      - name: Gate · Confirm tested SHA matches the live PR head
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TESTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          live_sha="$(curl --fail --silent \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/pulls/${PR_NUMBER}" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["head"]["sha"])')"
          if [ "${live_sha}" != "${TESTED_SHA}" ]; then
            echo "Tested SHA (${TESTED_SHA}) no longer matches the live PR head (${live_sha})." >&2
            exit 1
          fi
          echo "Tested SHA matches the live PR head (${TESTED_SHA})."
      - name: Gate · Publish step summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Toolbelt PR Gate"
            echo ""
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "| checks | ${{ needs.checks.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
