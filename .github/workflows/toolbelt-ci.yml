name: "Toolbelt PR Gate"

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "apps/toolbelt/**"
      - "packages/toolbelt-cli/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/toolbelt-ci.yml"
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-gate:
    name: Toolbelt PR Gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Start disposable PostgreSQL for migration E2E tests
        shell: bash
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -v ON_ERROR_STOP=1 -tAc "select 1"
      - name: Install root workspace dependencies
        run: npm ci
      - name: Check Toolbelt manifests
        run: npm run manifests:check -- --registry
        working-directory: apps/toolbelt
      - name: Validate and stage the unified migration ledger
        run: |
          npm run migrations:check
          stage_dir="${RUNNER_TEMP}/platform-migration-stage"
          npm run migrations:stage -- "${stage_dir}"
          test -n "$(find "${stage_dir}/supabase/migrations" -maxdepth 1 -type f -name '*.sql' -print -quit)"
        working-directory: apps/toolbelt
      - name: Run Toolbelt CLI tests
        run: npm test --workspace=@hyperbolic/toolbelt-cli
      - name: Run hermetic Toolbelt tests
        run: |
          node --test \
            tests/core-rpc-migration.test.mjs \
            tests/core-event-retention-atomic.test.mjs \
            tests/registration-toolbelt.test.mjs \
            tests/registry-manifest-hash.test.mjs \
            tests/registry-migrations-idempotency.test.mjs \
            tests/stage-migrations.test.mjs \
            tests/toolbelt-workflow.test.mjs \
            tests/validate-manifests.test.mjs \
            tests/validate-migrations.property.test.mjs \
            tests/validate-migrations.test.mjs
        working-directory: apps/toolbelt
        env:
          TOOLBELT_REQUIRE_POSTGRES: "1"
      - name: Run Guards tests
        run: node --test *.test.mjs
        working-directory: apps/toolbelt/guards
      - name: Run Prompt Organizer tests
        run: |
          node --test --test-concurrency=1 \
            tests/get-prompt.test.mjs \
            tests/helpers.unit.test.mjs \
            tests/migration-contract.test.mjs \
            tests/owner-session.test.mjs \
            tests/panel.test.mjs \
            tests/performance.test.mjs \
            tests/prompt-usage-retention-atomic.test.mjs \
            tests/render.test.mjs \
            tests/retention.test.mjs \
            tests/search.test.mjs \
            tests/sections.test.mjs \
            tests/seed.test.mjs
        working-directory: apps/toolbelt/apps/prompt-organizer
        env:
          PROMPT_REQUIRE_POSTGRES: "1"
      - name: Run Idea Intake tests
        run: node --test --test-concurrency=1 "tests/*.test.mjs"
        working-directory: apps/toolbelt/apps/idea-intake
        env:
          TOOLBELT_REQUIRE_POSTGRES: "1"
      - name: Cache Playwright Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: toolbelt-playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Start Prompt Organizer
        run: python3 -m http.server 8812 --directory web >/tmp/prompt-organizer.log 2>&1 &
        working-directory: apps/toolbelt/apps/prompt-organizer
      - name: Wait for Prompt Organizer
        shell: bash
        run: |
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://localhost:8812 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/prompt-organizer.log
          echo "Prompt Organizer did not become ready." >&2
          exit 1
      - name: Run Prompt Organizer critical browser journey
        run: ./node_modules/.bin/playwright test --config apps/toolbelt/apps/prompt-organizer/playwright.config.mjs
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8812
          # Threads the real owner session into critical-flow.test.mjs (see
          # that file's own "Owner-credential threading" header comment) the
          # same way platform-contract.yml's verify job already does. A noop
          # until the TOOLBELT_OWNER_TOKEN secret itself exists (m1-07) --
          # this alone does not turn the job green, it just removes the one
          # missing wire so it does the moment that secret is set.
          TOOLBELT_OWNER_TOKEN: ${{ secrets.TOOLBELT_OWNER_TOKEN }}
      - name: Upload Prompt Organizer browser evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prompt-organizer-e2e-evidence
          path: |
            apps/toolbelt/apps/prompt-organizer/playwright-report/
            apps/toolbelt/apps/prompt-organizer/test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Run Network Checker tests and deterministic scanners
        run: bash tools/check.sh
        working-directory: apps/toolbelt/apps/network-checker
      - name: Prepare Network Checker dashboard fixture
        run: python3 tests/e2e/seed_dashboard_fixture.py
        working-directory: apps/toolbelt/apps/network-checker
      - name: Start Network Checker dashboard
        run: python3 -m netcheck serve --no-open >network-checker.log 2>&1 &
        working-directory: apps/toolbelt/apps/network-checker
        env:
          NETCHECK_DB: ${{ github.workspace }}/apps/toolbelt/apps/network-checker/tests/e2e/dashboard-fixture.db
      - name: Wait for Network Checker dashboard
        shell: bash
        run: |
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8787 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat apps/toolbelt/apps/network-checker/network-checker.log
          echo "Network Checker did not become ready." >&2
          exit 1
      - name: Run Network Checker critical browser journey
        run: ./node_modules/.bin/playwright test --config apps/toolbelt/apps/network-checker/playwright.config.mjs
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8787
      - name: Upload Network Checker browser evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: network-checker-e2e-evidence
          path: |
            apps/toolbelt/apps/network-checker/playwright-report/
            apps/toolbelt/apps/network-checker/test-results/
            apps/toolbelt/apps/network-checker/network-checker.log
          if-no-files-found: ignore
          retention-days: 14
