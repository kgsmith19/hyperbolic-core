name: "Verify: Tests (Toolbelt)"

# Standalone entry point for merge_group/push/workflow_dispatch only. The
# pull_request path runs this same suite as a native job in pr-verify.yml
# (see that file's header for why nothing here is workflow_call any more),
# both calling the verify-tests-toolbelt composite action under
# .github/actions/ so the suite has exactly one source.

on:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  verify-tests-toolbelt:
    name: "Verify: Tests (Toolbelt)"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Setup · Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/verify-tests-toolbelt
