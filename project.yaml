project:
  name: hyperbolic-core
  type: monorepo — each apps/<name>/ and services/<name>/ is independently
    built, tested, and gated by its own PR Gate; see that component's own
    project.yaml/AGENTS.md for its facts.

apps:
  - apps/toolbelt
  - apps/toolbelt/guards
  - apps/lifeos
  - apps/agentic-command-center
  - apps/shell

services:
  - services/brain
  - services/llm-handler

ci:
  # Seven named gate stages, run by .github/workflows/pr-verify.yml ("PR
  # Verification"). Stages 1-4 are NATIVE jobs (no workflow_call) so each
  # reports a bare "Verify: X" check name with no compound prefix --
  # workflow_call always exposes "<caller job> / <callee job>" instead, and
  # a required check needs the literal reported name to match. Stages 1, 2,
  # and 4's actual check logic lives in a composite action under
  # .github/actions/, shared with the standalone secret-scan.yml/
  # repo-policy.yml files' own merge_group/push/workflow_dispatch triggers
  # so the logic has exactly one source; stage 3 does the same via
  # template-lint.yml. Stages 1-4 are needs:-chained in strict order (each
  # starts only once the previous succeeded). Stage 5 (the five app-scoped
  # gates) runs as five parallel workflow_call jobs, all depending only on
  # stage 4 -- none of them individually gates merge. Stage 6,
  # "Verify: Tests", is a native job that needs all five of stage 5 and is
  # the single required umbrella over them. Stage 7, LLM Review, runs last
  # (workflow_call) and stays non-required. `required:` below states the
  # INTENDED branch-ruleset configuration -- it is a specification, not a
  # live read of the ruleset, which an agent cannot write in this harness
  # and which may lag behind this file. See AGENTS.md's "PR Gate and merge
  # behavior" / "Path-scoped gates in monorepo topologies" note: a required
  # check tied to a paths: filter blocks forever on any PR that never
  # triggers it, which is exactly what happened live on PRs #118 and #120.
  # Verify: Linting (stage 4) and the five app-scoped gates (stage 5) each
  # carry a leading detect-changes job that replaces a top-level paths:
  # filter, so they always report -- a trivial pass when their own paths
  # weren't touched -- which is what keeps a path-scoped gate safe to
  # require (Linting directly; the app gates via the Verify: Tests
  # umbrella that depends on them).
  workflows:
    - order: 1
      path: .github/workflows/pr-verify.yml
      gate: "Verify: Secrets"
      covers: whole repo, every PR — no path filter; leaked-credential
        scan via the verify-secrets composite action (also the standalone
        entry point secret-scan.yml uses for merge_group/push/
        workflow_dispatch)
      required: true
    - order: 2
      path: .github/workflows/pr-verify.yml
      gate: "Verify: Repo Policy"
      covers: whole repo, every PR — no path filter; structural checks on
        CLAUDE.md/GEMINI.md/AGENTS.md/action pinning/YAML validity/
        whitespace via the verify-repo-policy composite action (also the
        standalone entry point repo-policy.yml uses)
      required: true
    - order: 3
      path: .github/workflows/pr-verify.yml
      gate: "Verify: PR Description"
      covers: whole repo, every PR — no path filter; PR body vs
        PULL_REQUEST_TEMPLATE.md's required sections via the
        verify-pr-description composite action (also the standalone
        entry point template-lint.yml uses)
      required: true
    - order: 4
      path: .github/workflows/pr-verify.yml
      gate: "Verify: Linting"
      covers: apps/lifeos/** — LifeOS's own ruff/npm-lint commands via the
        verify-linting composite action; LifeOS is the only app with a
        lint command configured today
      required: true
    - order: 5
      path: .github/workflows/toolbelt-ci.yml
      gate: "Verify: Toolbelt"
      covers: apps/toolbelt/** (root tools, guards/, prompt-organizer,
        idea-intake, network-checker)
      required: false # covered by the "Verify: Tests" umbrella (order 6)
    - order: 5
      path: .github/workflows/acc-ci.yml
      gate: "Verify: ACC"
      covers: apps/agentic-command-center/**, apps/toolbelt/guards/**
      required: false # covered by the "Verify: Tests" umbrella (order 6)
    - order: 5
      path: .github/workflows/brain-ci.yml
      gate: "Verify: Brain"
      covers: services/brain/**
      required: false # covered by the "Verify: Tests" umbrella (order 6)
    - order: 5
      path: .github/workflows/shell-ci.yml
      gate: "Verify: Shell"
      covers: apps/shell/**, packages/**, services/llm-handler/**,
        docs/ops/**
      required: false # covered by the "Verify: Tests" umbrella (order 6)
    - order: 5
      path: .github/workflows/lifeos-ci.yml
      gate: "Verify: LifeOS"
      covers: apps/lifeos/**
      required: false # covered by the "Verify: Tests" umbrella (order 6)
    - order: 6
      path: .github/workflows/pr-verify.yml
      gate: "Verify: Tests"
      covers: umbrella over the order-5 app gates — a native job (not
        workflow_call) that needs all five and passes only when every one
        of them did, whether by really running or by correctly skipping
        as not-relevant
      required: true
    - order: 7
      path: .github/workflows/llm-review.yml
      gate: "Verify: LLM Review"
      covers: whole repo, every PR — no path filter; adversarial LLM review
        of the diff against the Issue and AGENTS.md. Runs LAST, after the
        Verify Tests umbrella (order 6) has succeeded.
      required: false # pending owner-provisioned reviewer credentials
  orchestrator: .github/workflows/pr-verify.yml
  composite_actions: .github/actions/{verify-secrets,verify-repo-policy,verify-pr-description,verify-linting}
  note: >-
    apps/lifeos's own nested workflows (apps/lifeos/.github/workflows/) are
    intentionally inert here (see AGENTS.md's Workflow Safety Invariant) —
    its authoritative CI runs from the standalone lifeos repo; lifeos-ci.yml
    above is written fresh for this monorepo and is the real gate here. Not
    required: the five order-5 app gates individually (only the
    "Verify: Tests" umbrella that depends on them is), "Verify: LLM Review"
    (pending credentials), and "Hyperbolic Core Merge Policy"
    (merge-policy.yml — orchestration, not verification; it arms auto-merge
    and manages the Work State/Evidence Index comments but never checks out
    or executes PR-controlled code). Any one of the five app gates can still
    become its own required check later, alongside "Verify: Tests", if a
    specific app needs a stronger guarantee than the shared umbrella.

vendors:
  # Full detail (auth, secret paths, cost, rotation) lives in
  # docs/ops/vendors.md; this block is the machine-declared summary.
  - name: Hetzner
    purpose: VPS hosting every deployed unit; a Storage Box (planned) for
      restic backups
    cost_eur_month: 5.50
    auth: SSH via Tailscale (no Hetzner API automation in this repo)
    docs: docs/ops/vendors.md#hetzner
  - name: Tailscale
    purpose: private network fabric — deploy transport, TLS termination,
      authorization boundary, CI identity
    cost_eur_month: 0
    auth: OAuth client (auth_keys scope), injected per pipeline via Infisical
    docs: docs/ops/vendors.md#tailscale
  - name: Infisical
    purpose: sole secret store for every pipeline; one machine identity per
      pipeline, each scoped to exactly one secret path
    cost_eur_month: 0
    auth: OIDC (GitHub Actions identity token exchange) — no static API key
    docs: docs/ops/vendors.md#infisical
  - name: Cloudflare
    purpose: public-internet edge (Tunnel + Access) for selected paths;
      additive to the tailnet-only private path
    cost_eur_month: 0
    auth: tunnel token (Infisical); Access policies configured in dashboard
    docs: docs/ops/vendors.md#cloudflare-planned--168170
  - name: Supabase
    purpose: hosted Postgres + PostgREST + Auth across three projects
      (toolbelt/platform, lifeos prod, lifeos test)
    cost_eur_month: 0
    auth: publishable key (public) + service-role/table-owner secrets
      (Infisical, pipeline-scoped)
    docs: docs/ops/vendors.md#supabase
  - name: GitHub
    purpose: source of truth, CI/CD, container registry (ghcr.io) for the
      Brain and Handler A images
    cost_eur_month: 0
    auth: built-in GITHUB_TOKEN, minted per-run
    docs: docs/ops/vendors.md#github
  - name: age
    purpose: asymmetric encryption for every backup bundle before it
      leaves CI
    cost_eur_month: 0
    auth: public-key encryption; CI holds only the public recipient key
    docs: docs/ops/vendors.md#age

work_tracking:
  system: github-issues

standard:
  repo: kgsmith19/agent-engineering-standard
  lock_file: standard.lock
  # tools/standardctl.py and TEMPLATES/ are not carried in this repo;
  # verification commands live directly in this file and in each
  # component's own project.yaml.
  vendored: false
