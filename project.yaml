project:
  name: hyperbolic-core
  type: monorepo — each apps/<name>/ and services/<name>/ is independently
    built, tested, and gated by its own PR Gate; see that component's own
    project.yaml/AGENTS.md for its facts.

apps:
  - apps/toolbelt
  - apps/toolbelt/guards
  - apps/lifeos
  - apps/agentic-command-center
  - apps/shell

services:
  - services/brain
  - services/llm-handler

ci:
  # Nine workflows total: the independent, path-scoped app gates plus the
  # repo-wide checks. `required:` below states the INTENDED branch-ruleset
  # configuration (only the repo-wide, no-paths:-filter checks should be
  # required) -- it is a specification, not a live read of the ruleset,
  # which an agent cannot write in this harness and which may lag behind
  # this file. See AGENTS.md's "PR Gate and merge behavior" / "Path-scoped
  # gates in monorepo topologies" note: a required check tied to a paths:
  # filter blocks forever on any PR that never triggers it, which is
  # exactly what happened live on PRs #118 and #120 before this file's own
  # required: values were corrected to match the intended design.
  workflows:
    - path: .github/workflows/toolbelt-ci.yml
      gate: Toolbelt PR Gate
      covers: apps/toolbelt/** (root tools, guards/, prompt-organizer,
        idea-intake, network-checker)
      required: false
    - path: .github/workflows/acc-ci.yml
      gate: ACC PR Gate
      covers: apps/agentic-command-center/**, apps/toolbelt/guards/**
      required: false
    - path: .github/workflows/brain-ci.yml
      gate: Brain PR Gate
      covers: services/brain/**
      required: false
    - path: .github/workflows/shell-ci.yml
      gate: Shell PR Gate
      covers: apps/shell/**, packages/**, services/llm-handler/**,
        docs/ops/**
      required: false
    - path: .github/workflows/lifeos-ci.yml
      gate: LifeOS PR Gate
      covers: apps/lifeos/**
      required: false
    - path: .github/workflows/secret-scan.yml
      gate: Gitleaks
      covers: whole repo, every PR — no path filter
      required: true
    - path: .github/workflows/repo-policy.yml
      gate: Repo Policy
      covers: whole repo, every PR — no path filter; structural checks on
        CLAUDE.md/GEMINI.md/AGENTS.md/action pinning/YAML validity/whitespace
      required: true
    - path: .github/workflows/template-lint.yml
      gate: Template Lint
      covers: whole repo, every PR — no path filter; PR body vs
        PULL_REQUEST_TEMPLATE.md's required sections
      required: true
    - path: .github/workflows/llm-review.yml
      gate: LLM Review
      covers: whole repo, every PR — no path filter; adversarial LLM review
        of the diff against the Issue and AGENTS.md
      required: true
  note: apps/lifeos's own nested workflows (apps/lifeos/.github/workflows/)
    are intentionally inert here (see AGENTS.md's Workflow Safety
    Invariant) — its authoritative CI runs from the standalone lifeos repo;
    lifeos-ci.yml above is written fresh for this monorepo and is the real
    gate here. The six app gates are not required — they still run and
    report on every relevant PR, but are not enforced by the branch ruleset,
    since GitHub cannot safely require a paths:-filtered check without it
    either never having a filter or being restructured to always report.

vendors:
  # Full detail (auth, secret paths, cost, rotation) lives in
  # docs/ops/vendors.md; this block is the machine-declared summary.
  - name: Hetzner
    purpose: VPS hosting every deployed unit; a Storage Box (planned) for
      restic backups
    cost_eur_month: 5.50
    auth: SSH via Tailscale (no Hetzner API automation in this repo)
    docs: docs/ops/vendors.md#hetzner
  - name: Tailscale
    purpose: private network fabric — deploy transport, TLS termination,
      authorization boundary, CI identity
    cost_eur_month: 0
    auth: OAuth client (auth_keys scope), injected per pipeline via Infisical
    docs: docs/ops/vendors.md#tailscale
  - name: Infisical
    purpose: sole secret store for every pipeline; one machine identity per
      pipeline, each scoped to exactly one secret path
    cost_eur_month: 0
    auth: OIDC (GitHub Actions identity token exchange) — no static API key
    docs: docs/ops/vendors.md#infisical
  - name: Cloudflare
    purpose: public-internet edge (Tunnel + Access) for selected paths;
      additive to the tailnet-only private path
    cost_eur_month: 0
    auth: tunnel token (Infisical); Access policies configured in dashboard
    docs: docs/ops/vendors.md#cloudflare-planned--168170
  - name: Supabase
    purpose: hosted Postgres + PostgREST + Auth across three projects
      (toolbelt/platform, lifeos prod, lifeos test)
    cost_eur_month: 0
    auth: publishable key (public) + service-role/table-owner secrets
      (Infisical, pipeline-scoped)
    docs: docs/ops/vendors.md#supabase
  - name: GitHub
    purpose: source of truth, CI/CD, container registry (ghcr.io) for the
      Brain and Handler A images
    cost_eur_month: 0
    auth: built-in GITHUB_TOKEN, minted per-run
    docs: docs/ops/vendors.md#github
  - name: age
    purpose: asymmetric encryption for every backup bundle before it
      leaves CI
    cost_eur_month: 0
    auth: public-key encryption; CI holds only the public recipient key
    docs: docs/ops/vendors.md#age

work_tracking:
  system: github-issues

standard:
  repo: kgsmith19/agent-engineering-standard
  lock_file: standard.lock
  # tools/standardctl.py and TEMPLATES/ are not carried in this repo;
  # verification commands live directly in this file and in each
  # component's own project.yaml.
  vendored: false
