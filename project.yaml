project:
  name: hyperbolic-core
  type: monorepo — each apps/<name>/ and services/<name>/ is independently
    built, tested, and gated by its own PR Gate; see that component's own
    project.yaml/AGENTS.md for its facts.

apps:
  - apps/toolbelt
  - apps/toolbelt/guards
  - apps/lifeos
  - apps/agentic-command-center
  - apps/shell

services:
  - services/brain
  - services/llm-handler
  - services/broker

ci:
  # pr-verify.yml ("PR Verification") is the ONLY workflow that triggers on
  # a pull request, and every gate in it is a NATIVE job whose name starts
  # with "Verify: ", each producing exactly ONE check row with that exact
  # bare name. Nothing there uses workflow_call: a workflow_call-invoked job
  # is always reported as "<caller job> / <callee job>", so a bare name typed
  # into the ruleset would create a required check that never reports and
  # blocks every PR forever. The real work lives in composite actions under
  # .github/actions/, which run inside the calling job and add no rows; each
  # is reused by the matching standalone workflow file below for that file's
  # own merge_group/push/workflow_dispatch triggers, so every check has
  # exactly one source of logic despite two trigger paths.
  #
  # ONE CHECK ROW PER JOB is a GitHub invariant with no suppression, so the
  # only way to shorten the PR checks list is to run fewer jobs. That is why
  # every repo-wide conformance check and all five Linux suites share ONE
  # job: four rows total instead of ten. The cost is real and deliberate --
  # measured on PR #205 (a CI change, so every suite ran for real) the old
  # parallel shape took 8.0 min and the same work sums to 17.3 min. ACC's
  # Windows suite cannot join it (one job runs on one runner image), so it
  # stays its own row and does its own change detection to remain parallel.
  #
  # Each suite still skips in seconds when its app was not touched: relevance
  # comes from the detect-changes composite action, not from a paths: filter
  # on the workflow. A required check tied to a paths: filter blocks forever
  # on any PR that never triggers it, which is exactly what happened live on
  # PRs #118 and #120. A change to .github/workflows/** or .github/actions/**
  # marks every app relevant, so a CI edit is exercised end to end.
  #
  # Order 3, "Verify: All Gates", is the ONLY gate below with required: true.
  # Its verdict comes from the workflow's own needs.*.result, so anything not
  # exactly "success" (including skipped or cancelled) fails it. The jobs it
  # rolls up keep required: false here even though they are real,
  # required-in-substance checks -- All Gates cannot go green without them --
  # they are simply no longer typed into the branch ruleset individually. One
  # name instead of many is one fewer thing to drift out of sync with this
  # file, the exact failure mode that stranded PRs #118, #120 and #160 on
  # stale required-check lists.
  #
  # `required:` below states the INTENDED branch-ruleset configuration --
  # it is a specification, not a live read of the ruleset, which an agent
  # cannot write in this harness and which may lag behind this file.
  workflows:
    - order: 1
      path: .github/workflows/pr-verify.yml
      standalone: .github/workflows/{secret-scan,repo-policy,template-lint,toolbelt-ci,acc-ci,brain-ci,shell-ci,lifeos-ci}.yml
      action: .github/actions/{detect-changes,verify-secrets,verify-repo-policy,verify-pr-description,verify-linting,verify-tests-toolbelt,verify-tests-acc,verify-tests-brain,verify-tests-shell,verify-tests-lifeos}
      gate: "Verify: Tests (Linux)"
      covers: whole repo, every PR — no path filter; which apps changed,
        leaked-credential scan, repo structure (CLAUDE.md/GEMINI.md/
        AGENTS.md/action pinning/YAML validity/whitespace), PR body vs
        PULL_REQUEST_TEMPLATE.md's required sections, LifeOS's ruff/npm-lint
        commands, and then the Toolbelt, ACC (Linux), Brain, Shell and
        LifeOS suites. One job, because one check row per job is a GitHub
        invariant with no suppression — the only way to shorten the checks
        list is to run fewer jobs. Each suite still skips in seconds when
        its app was not touched.
      required: false # rolled into "Verify: All Gates" below, not typed here individually
    - order: 1
      path: .github/workflows/pr-verify.yml
      standalone: .github/workflows/acc-ci.yml
      action: .github/actions/{detect-changes,verify-tests-acc-windows}
      gate: "Verify: Tests (Windows)"
      covers: the ACC paths — native and PowerShell suites that need a
        windows-latest runner. A separate row because one job cannot span
        two runner images; that is a platform constraint, not a choice. It
        runs its own change detection so it stays parallel with the Linux
        job rather than waiting on it.
      required: false # rolled into "Verify: All Gates" below, not typed here individually
    - order: 2
      path: .github/workflows/pr-verify.yml
      standalone: .github/workflows/llm-review.yml
      action: .github/actions/verify-llm-review
      gate: "Verify: LLM Review"
      covers: whole repo, every PR — no path filter; adversarial LLM review
        of the diff against the Issue and AGENTS.md. Needs both test jobs so
        no reviewer tokens are spent on a PR failing anything else.
        Deliberately NOT a dependency of the rollup below — it fails closed
        while uncredentialed, and depending on it would make the one
        required check permanently red. Stages its verdict as an artifact
        (always(), so a blocking or failed run is captured, not just a
        passing one) for .github/workflows/llm-review-dialogue.yml to post
        — this job stays read-only and never writes to the pull request
        itself.
      required: false # pending owner-provisioned reviewer credentials
    - order: 3
      path: .github/workflows/pr-verify.yml
      gate: "Verify: All Gates"
      covers: whole repo, every PR — no path filter. Two things at once.
        (1) The rollup — needs both order-1 test jobs, always reporting even
        when one failed, and its verdict comes from this workflow's own
        needs.*.result, so anything that is not exactly success (including
        skipped or cancelled) fails it. This is the ONLY gate typed into the
        branch ruleset's required-status-checks list.
        (2) Merge orchestration, absorbed from the deleted merge-policy.yml —
        maintains the managed Work State/Evidence Index comments, enforces
        owner:hold-merge and owner:allow-draft, and arms native squash
        auto-merge. Arming is a later step of the same job that computes the
        verdict, so a merge cannot be enabled ahead of the verification it
        depends on. It is the only job holding a write token and performs no
        checkout and no shell over repository content.
      required: true
  orchestrator: .github/workflows/pr-verify.yml
  note: >-
    apps/lifeos's own nested workflows (apps/lifeos/.github/workflows/) are
    intentionally inert here (see AGENTS.md's Workflow Safety Invariant) —
    its authoritative CI runs from the standalone lifeos repo; the
    verify-tests-lifeos composite action above is written fresh for this
    monorepo and is the real gate here. "Verify: Tests (Linux)" and
    "Verify: Tests (Windows)" are real, required-in-substance checks --
    "Verify: All Gates" cannot go green without them -- but only that one
    rollup name is typed into the branch ruleset, to keep the required-check
    list from drifting out of sync with this file. "Verify: LLM Review" is
    not required and fails closed until the owner provisions reviewer
    credentials; while it reports failure the pull request stays "unstable"
    and GitHub's own auto-merge will not fire even though every required
    check passes, so auto-merge starts working once that row stops being
    red. There is no separate merge-policy workflow any more: merge-policy.yml
    was deleted and its behavior lives in the "Verify: All Gates" job.

    Two further workflows implement Issue #128's deferred review-dialogue
    design (Issue #231) and are deliberately NOT in the gates list above —
    neither produces a pull-request check row, so neither can be typed into
    a required-checks list.
    .github/workflows/llm-review-dialogue.yml (on: workflow_run, keyed to
    "PR Verification") reads Verify: LLM Review's staged verdict artifact
    and posts it into the pull request as exactly one managed comment
    (marker "<!-- agent-engineering-standard:llm-review:v1 -->", updated in
    place per head) carrying a round counter, and — same discipline as
    Verify: All Gates — holds pull-requests: write while performing no
    checkout and no shell over repository content.
    .github/workflows/claude-dispatch.yml (on: repository_dispatch, fired
    by the dialogue workflow only for a blocking verdict on a
    same-repository PR) hands the findings to the developer agent, which
    fixes or rebuts them in place. Owner-provisioned prerequisites:
    vars.LLM_REVIEW_ESCALATE_AFTER (round threshold, default 3) and one of
    secrets.CLAUDE_CODE_OAUTH_TOKEN / secrets.ANTHROPIC_API_KEY — until
    provisioned, the dialogue workflow still posts findings and escalates
    to the owner immediately rather than waiting on a fixer that can never
    start.

vendors:
  # Full detail (auth, secret paths, cost, rotation) lives in
  # docs/ops/vendors.md; this block is the machine-declared summary.
  - name: Hetzner
    purpose: VPS hosting every deployed unit; a Storage Box (planned) for
      restic backups
    cost_eur_month: 5.50
    auth: SSH via Tailscale (no Hetzner API automation in this repo)
    docs: docs/ops/vendors.md#hetzner
  - name: Tailscale
    purpose: private network fabric — deploy transport, TLS termination,
      authorization boundary, CI identity
    cost_eur_month: 0
    auth: OAuth client (auth_keys scope), injected per pipeline via Infisical
    docs: docs/ops/vendors.md#tailscale
  - name: Infisical
    purpose: sole secret store for every pipeline; one machine identity per
      pipeline, each scoped to exactly one secret path
    cost_eur_month: 0
    auth: OIDC (GitHub Actions identity token exchange) — no static API key
    docs: docs/ops/vendors.md#infisical
  - name: Cloudflare
    purpose: public-internet edge (Tunnel + Access) for selected paths;
      additive to the tailnet-only private path
    cost_eur_month: 0
    auth: tunnel token (Infisical); Access policies configured in dashboard
    docs: docs/ops/vendors.md#cloudflare-planned--168170
  - name: Supabase
    purpose: hosted Postgres + PostgREST + Auth across three projects
      (toolbelt/platform, lifeos prod, lifeos test)
    cost_eur_month: 0
    auth: publishable key (public) + service-role/table-owner secrets
      (Infisical, pipeline-scoped)
    docs: docs/ops/vendors.md#supabase
  - name: GitHub
    purpose: source of truth, CI/CD, container registry (ghcr.io) for the
      Brain and Handler A images
    cost_eur_month: 0
    auth: built-in GITHUB_TOKEN, minted per-run
    docs: docs/ops/vendors.md#github
  - name: age
    purpose: asymmetric encryption for every backup bundle before it
      leaves CI
    cost_eur_month: 0
    auth: public-key encryption; CI holds only the public recipient key
    docs: docs/ops/vendors.md#age

work_tracking:
  system: github-issues

standard:
  repo: kgsmith19/agent-engineering-standard
  lock_file: standard.lock
  # tools/standardctl.py and TEMPLATES/ are not carried in this repo;
  # verification commands live directly in this file and in each
  # component's own project.yaml.
  vendored: false
