project:
  name: hyperbolic-core
  type: monorepo — each apps/<name>/ and services/<name>/ is independently built, tested, and gated by its own PR Gate; see that component's own project.yaml/AGENTS.md for its facts.

apps:
  - apps/idea-intake
  - apps/network-checker
  - apps/prompt-organizer
  - apps/lifeos
  - apps/agentic-command-center
  - apps/shell
  - apps/deep-search
  - apps/creative-studio

services:
  - services/brain
  - services/llm-handler
  - services/broker

ci:
  # pr-verify.yml ("PR Verification") is the ONLY workflow that triggers on
  # a pull request. Every gate in it is a NATIVE job producing exactly ONE
  # check row with its exact bare name. Nothing there uses workflow_call: a
  # workflow_call-invoked job is always reported as "<caller job> / <callee
  # job>", so a bare name typed into the ruleset would create a required
  # check that never reports and blocks every PR forever. The real work
  # lives in composite actions under .github/actions/, which run inside the
  # calling job and add no rows; each is reused by the matching standalone
  # workflow file below for that file's own merge_group/push/
  # workflow_dispatch triggers, so every check has exactly one source of
  # logic despite two trigger paths.
  #
  # Architecture: Repository Standards verifies the repository; each app
  # lane verifies itself; PR
  # Gate verifies that every one of those lanes succeeded and alone
  # controls merge authorization. By owner directive this repository
  # optimizes for clear ownership, parallel execution, and diagnostics over
  # the fewest visible check rows — the seven worker lanes (Repository
  # Standards plus six app lanes) all start in parallel at T=0, and ACC's
  # Windows suite gets its own row because one job cannot span two runner
  # images, a platform constraint, not a choice.
  #
  # Every lane still reports in seconds when its app was not touched:
  # relevance comes from the detect-changes composite action INSIDE each
  # job, never from a paths: filter on the workflow. A required check tied
  # to a paths: filter blocks forever on any PR that never triggers it,
  # which is exactly what happened live on PRs #118 and #120. A change to
  # .github/workflows/** or .github/actions/** marks every app relevant, so
  # a CI edit is exercised end to end. Every lane below EXISTS on every PR —
  # an irrelevant lane reports success via an explicit "not applicable"
  # step, never a job-level path condition — so PR Gate's invariant stays
  # simple: every expected dependency exists and must conclude "success".
  #
  # Order 3, "PR Gate", is the ONLY gate below with required: true. Its
  # verdict comes from the workflow's own needs.*.result, so anything not
  # exactly "success" (including skipped or cancelled) fails it. The lanes
  # it rolls up keep required: false here even though they are real,
  # required-in-substance checks -- PR Gate cannot go green without them --
  # they are simply no longer typed into the branch ruleset individually.
  # One name instead of many is one fewer thing to drift out of sync with
  # this file, the exact failure mode that stranded PRs #118, #120 and #160
  # on stale required-check lists.
  #
  # AI Review was removed by owner decision (2026-11-04, #547); independent
  # review moves to kgsmith19/hyper-agents.
  #
  # `required:` below states the INTENDED branch-ruleset configuration --
  # it is a specification, not a live read of the ruleset, which an agent
  # cannot write in this harness and which may lag behind this file.
  workflows:
    - order: 1
      path: .github/workflows/pr-verify.yml
      standalone: .github/workflows/{secret-scan,repo-policy,template-lint}.yml
      action: .github/actions/{verify-secrets,verify-repo-policy,verify-pr-description}
      gate: "Repository Standards"
      covers: whole repo, every PR — no path filter; leaked-credential scan, repo structure (no-root-CLAUDE.md/GEMINI.md-adapter/AGENTS.md/action pinning/YAML validity/whitespace), PR body vs PULL_REQUEST_TEMPLATE.md's required sections, and exact-head consistency. Repository-wide concerns only — no app-specific engineering check (lint, typecheck, build, coverage) belongs here; each app lane owns its own.
      # rolled into "PR Gate" below, not typed here individually
      required: false
    - order: 1
      path: .github/workflows/pr-verify.yml
      standalone: .github/workflows/toolbelt-ci.yml
      action: .github/actions/{detect-changes,verify-tests-toolbelt}
      gate: "Toolbelt"
      covers: the root spine (tool.json, supabase/, tests/spine/), packages/manifest-tools and packages/hyp-cli — self-contained; skips in seconds via detect-changes when untouched.
      # rolled into "PR Gate" below, not typed here individually
      required: false
    - order: 1
      path: .github/workflows/pr-verify.yml
      standalone: .github/workflows/acc-ci.yml
      action: .github/actions/{detect-changes,verify-tests-acc}
      gate: "ACC Linux"
      covers: apps/agentic-command-center and packages/guards — the Linux-native suites and covgate. Runs its own change detection so it stays parallel with every other lane.
      # rolled into "PR Gate" below, not typed here individually
      required: false
    - order: 1
      path: .github/workflows/pr-verify.yml
      standalone: .github/workflows/acc-ci.yml
      action: .github/actions/{detect-changes,verify-tests-acc-windows}
      gate: "ACC Windows"
      covers: apps/agentic-command-center's PowerShell launch-shim, cap-watcher and installer suites — needs a windows-latest runner. A separate row because one job cannot span two runner images; that is a platform constraint, not a choice.
      # rolled into "PR Gate" below, not typed here individually
      required: false
    - order: 1
      path: .github/workflows/pr-verify.yml
      standalone: .github/workflows/brain-ci.yml
      action: .github/actions/{detect-changes,verify-tests-brain}
      gate: "Brain"
      covers: services/brain — typecheck, tests, ADR-05 isolation check, eval corpus gate, Docker build/smoke. Skips in seconds when untouched.
      # rolled into "PR Gate" below, not typed here individually
      required: false
    - order: 1
      path: .github/workflows/pr-verify.yml
      standalone: .github/workflows/shell-ci.yml
      action: .github/actions/{detect-changes,verify-tests-shell}
      gate: "Platform"
      covers: apps/shell, every packages/* workspace, services/llm-handler, services/broker, services/platform-api, and the docs/ops operator tooling (including this workflow's own topology contract test) — type-checks, unit tests, e2e, production build, size budgets.
      # rolled into "PR Gate" below, not typed here individually
      required: false
    - order: 1
      path: .github/workflows/pr-verify.yml
      standalone: .github/workflows/lifeos-ci.yml
      action: .github/actions/{detect-changes,verify-tests-lifeos}
      gate: "LifeOS"
      covers: apps/lifeos — lint (ruff, npm run lint; the only app with a linter configured, run early inside verify-tests-lifeos itself) ahead of its backend/frontend suites.
      # rolled into "PR Gate" below, not typed here individually
      required: false
    - order: 1
      path: .github/workflows/pr-verify.yml
      action: .github/actions/{detect-changes,verify-tests-deep-search}
      gate: "Deep Search"
      covers: apps/deep-search — ruff E9,F lint and the unittest suite; skips in seconds via detect-changes when untouched. Type checking is not yet configured (docs/planning/leanness/deep-search.md).
      # rolled into "PR Gate" below, not typed here individually
      required: false
    - order: 1
      path: .github/workflows/pr-verify.yml
      action: .github/actions/{detect-changes,verify-tests-creative-studio}
      gate: "Creative Studio"
      covers: apps/creative-studio — the registry validator (scripts/validate.py); skips in seconds via detect-changes when untouched.
      # rolled into "PR Gate" below, not typed here individually
      required: false
    - order: 3
      path: .github/workflows/pr-verify.yml
      gate: "PR Gate"
      covers: whole repo, every PR — no path filter. Two things at once. (1) The rollup — needs every lane above, always reporting even when one failed, and its verdict comes from this workflow's own needs.*.result, so anything that is not exactly success (including skipped or cancelled) fails it. This is the ONLY gate typed into the branch ruleset's required-status-checks list. (2) Merge orchestration — maintains the managed Work State comments, enforces owner:hold-merge and owner:allow-draft, and arms native squash auto-merge. Arming is a later step of the same job that computes the verdict, so a merge cannot be enabled ahead of the verification it depends on. It is the only job holding a write token and performs no checkout and no shell over repository content.
      required: true
  orchestrator: .github/workflows/pr-verify.yml
  # The AES final-gate contract: one workflow, one required check (#541).
  workflow: .github/workflows/pr-verify.yml
  required_check: PR Gate
  # note:
  #   No app carries a nested .github directory (AGENTS.md's Workflow Safety Invariant); the verify-tests-lifeos composite action above is LifeOS's real gate here, like every other app's lane. "Repository Standards" and the six app lanes are real, required-in-substance checks -- "PR Gate" cannot go green without them -- but only that one rollup name is typed into the branch ruleset, to keep the required-check list from drifting out of sync with this file. There is no separate merge-policy workflow: merge orchestration lives entirely in the "PR Gate" job.
vendors:
  # Full detail (auth, secret paths, cost, rotation) lives in
  # docs/ops/vendors.md; this block is the machine-declared summary.
  - name: Hetzner
    purpose: "ACTIVE since 2026-11-11 (#562): CX33 hyperbolic-core-prod runs the stack behind Cloudflare (ops/cloud/); Storage Box hyperbolic-backups holds restic backups. The legacy lifeos-prod VPS was deleted on 2026-11-11 (#566)."
    cost_eur_month: 11
    auth: API token in Infisical (/providers/hetzner); no inbound ports on the host
    docs: "docs/ops/cloud-deploy.md"
  - name: Tailscale
    purpose: "RETIRED for good (owner decision 2026-11-11, #562): Cloudflare Tunnel + Access is the only access path for browsers, operators and CI. Nothing in this repo uses Tailscale."
    cost_eur_month: 0
    auth: none (retired)
    docs: "docs/ops/vendors.md#tailscale"
  - name: Infisical
    purpose: "sole secret store: cloud deploy (Core Deploy via GitHub OIDC), Cloudflare automation, runtime keys. Not needed for local work."
    cost_eur_month: 0
    auth: OIDC (GitHub Actions identity token exchange) — no static API key
    docs: "docs/ops/vendors.md#infisical"
  - name: Cloudflare
    purpose: "ACTIVE since 2026-11-11 (#562): DNS for kylegsmith.com, Tunnel hyperbolic-core-prod, Access (owner-only login and single sign-on into the platform). Managed as code in infra/cloudflare/."
    cost_eur_month: 0
    auth: scoped API token in Infisical (/CLOUDFLARE_API_TOKEN); tunnel token separately
    docs: "docs/ops/cloudflare-agent-access.md"
  - name: Supabase
    purpose: "SUPERSEDED (owner decision 2026-10-29, local-only; removed with the cloud workflows by #503). Each sub-app runs on SQLite on localhost; the hosted registry rows are retired in Phase 4 (D5, #450), which still needs owner-approved production steps."
    cost_eur_month: 0
    auth: none for the local platform (SQLite on localhost; owner key via platform-api)
    docs: "docs/ops/vendors.md#supabase"
  - name: GitHub
    purpose: source of truth, CI/CD, container registry (ghcr.io) for the Brain and Handler A images
    cost_eur_month: 0
    auth: built-in GITHUB_TOKEN, minted per-run
    docs: "docs/ops/vendors.md#github"
  - name: age
    purpose: asymmetric encryption for every backup bundle before it leaves CI
    cost_eur_month: 0
    auth: public-key encryption; CI holds only the public recipient key
    docs: "docs/ops/vendors.md#age"

work_tracking:
  system: github-issues

standard:
  repo: kgsmith19/agent-engineering-standard
  lock_file: standard.lock
  # tools/standardctl.py and TEMPLATES/ are not carried in this repo;
  # verification commands live directly in this file and in each
  # component's own project.yaml.
  vendored: false
