project:
  name: hyperbolic-core
  type: monorepo — each apps/<name>/ and services/<name>/ is independently
    built, tested, and gated by its own PR Gate; see that component's own
    project.yaml/AGENTS.md for its facts.

apps:
  - apps/toolbelt
  - apps/toolbelt/guards
  - apps/lifeos
  - apps/agentic-command-center
  - apps/shell

services:
  - services/brain
  - services/llm-handler

ci:
  # Every gate runs as a NATIVE job in .github/workflows/pr-verify.yml
  # ("PR Verification") whose name starts with "Verify: ", each producing
  # exactly ONE check row with that exact bare name. Nothing there uses
  # workflow_call: a workflow_call-invoked job is always reported as
  # "<caller job> / <callee job>", so a bare name typed into the ruleset
  # would create a required check that never reports and blocks every PR
  # forever. The real work lives in composite actions under
  # .github/actions/, which run inside the calling job and add no rows;
  # each is reused by the matching standalone workflow file below for that
  # file's own merge_group/push/workflow_dispatch triggers, so every check
  # has exactly one source of logic despite two trigger paths.
  #
  # Orders 1-5 are needs:-chained in strict sequence. The order-6 test
  # gates then run in parallel with each other. Every order-6 gate ALWAYS
  # runs and always reports: when its app's paths were not touched it
  # reports a trivial pass in seconds instead of running the suite, using
  # order 1's outputs rather than a paths: filter on the workflow. That is
  # what makes a path-scoped check safe to require -- a required check tied
  # to a paths: filter blocks forever on any PR that never triggers it,
  # which is exactly what happened live on PRs #118 and #120. A change to
  # .github/workflows/** or .github/actions/** marks every app relevant, so
  # a CI edit is exercised end to end.
  #
  # `required:` below states the INTENDED branch-ruleset configuration --
  # it is a specification, not a live read of the ruleset, which an agent
  # cannot write in this harness and which may lag behind this file.
  workflows:
    - order: 1
      path: .github/workflows/pr-verify.yml
      gate: "Verify: Detect Changes"
      covers: whole repo, every PR — computes which apps this PR touches,
        consumed by every gate below
      required: true
    - order: 2
      path: .github/workflows/pr-verify.yml
      standalone: .github/workflows/secret-scan.yml
      action: .github/actions/verify-secrets
      gate: "Verify: Secrets"
      covers: whole repo, every PR — no path filter; leaked-credential scan
      required: true
    - order: 3
      path: .github/workflows/pr-verify.yml
      standalone: .github/workflows/repo-policy.yml
      action: .github/actions/verify-repo-policy
      gate: "Verify: Repo Policy"
      covers: whole repo, every PR — no path filter; structural checks on
        CLAUDE.md/GEMINI.md/AGENTS.md/action pinning/YAML validity/
        whitespace
      required: true
    - order: 4
      path: .github/workflows/pr-verify.yml
      standalone: .github/workflows/template-lint.yml
      action: .github/actions/verify-pr-description
      gate: "Verify: PR Description"
      covers: whole repo, every PR — no path filter; PR body vs
        PULL_REQUEST_TEMPLATE.md's required sections
      required: true
    - order: 5
      path: .github/workflows/pr-verify.yml
      action: .github/actions/verify-linting
      gate: "Verify: Linting"
      covers: apps/lifeos/** — LifeOS's own ruff/npm-lint commands; LifeOS
        is the only app with a lint command configured today
      required: true
    - order: 6
      path: .github/workflows/pr-verify.yml
      standalone: .github/workflows/toolbelt-ci.yml
      action: .github/actions/verify-tests-toolbelt
      gate: "Verify: Tests (Toolbelt)"
      covers: apps/toolbelt/** (root tools, guards/, prompt-organizer,
        idea-intake, network-checker), packages/toolbelt-cli/**
      required: true
    - order: 6
      path: .github/workflows/pr-verify.yml
      standalone: .github/workflows/acc-ci.yml
      action: .github/actions/verify-tests-acc
      gate: "Verify: Tests (ACC)"
      covers: apps/agentic-command-center/**, apps/toolbelt/guards/** —
        the Linux suites (UI build, contract e2e, portable, coverage gate)
      required: true
    - order: 6
      path: .github/workflows/pr-verify.yml
      standalone: .github/workflows/acc-ci.yml
      action: .github/actions/verify-tests-acc-windows
      gate: "Verify: Tests (ACC Windows)"
      covers: the same ACC paths — native and PowerShell suites that need a
        windows-latest runner. A separate row because one job cannot span
        two runner images; that is a platform constraint, not a choice.
      required: true
    - order: 6
      path: .github/workflows/pr-verify.yml
      standalone: .github/workflows/brain-ci.yml
      action: .github/actions/verify-tests-brain
      gate: "Verify: Tests (Brain)"
      covers: services/brain/**
      required: true
    - order: 6
      path: .github/workflows/pr-verify.yml
      standalone: .github/workflows/shell-ci.yml
      action: .github/actions/verify-tests-shell
      gate: "Verify: Tests (Shell)"
      covers: apps/shell/**, packages/**, services/llm-handler/**,
        docs/ops/**
      required: true
    - order: 6
      path: .github/workflows/pr-verify.yml
      standalone: .github/workflows/lifeos-ci.yml
      action: .github/actions/verify-tests-lifeos
      gate: "Verify: Tests (LifeOS)"
      covers: apps/lifeos/**
      required: true
    - order: 7
      path: .github/workflows/pr-verify.yml
      standalone: .github/workflows/llm-review.yml
      action: .github/actions/verify-llm-review
      gate: "Verify: LLM Review"
      covers: whole repo, every PR — no path filter; adversarial LLM review
        of the diff against the Issue and AGENTS.md. Runs LAST, after every
        order-6 test gate has succeeded.
      required: false # pending owner-provisioned reviewer credentials
    - path: .github/workflows/merge-policy.yml
      gate: "Verify: Merge Policy"
      covers: orchestration, not verification — arms native squash
        auto-merge and maintains the managed Work State and Evidence Index
        comments. Runs on pull_request_target, outside the pr-verify.yml
        chain, so it has no order.
      required: false # and must never be; see the note below
  orchestrator: .github/workflows/pr-verify.yml
  note: >-
    apps/lifeos's own nested workflows (apps/lifeos/.github/workflows/) are
    intentionally inert here (see AGENTS.md's Workflow Safety Invariant) —
    its authoritative CI runs from the standalone lifeos repo; the
    verify-tests-lifeos composite action above is written fresh for this
    monorepo and is the real gate here. Not required, deliberately:
    "Verify: LLM Review" (fails closed until the owner provisions reviewer
    credentials) and "Verify: Merge Policy" (merge-policy.yml — it is built
    never to fail, so requiring it would add a rubber stamp rather than a
    check, and would block every PR repo-wide on the rare occasion it broke;
    it also cannot be removed from the Checks tab, since any workflow that
    runs on a PR reports a row and there is no suppression). Deleting
    merge-policy.yml would disable auto-merge for the whole repository.

vendors:
  # Full detail (auth, secret paths, cost, rotation) lives in
  # docs/ops/vendors.md; this block is the machine-declared summary.
  - name: Hetzner
    purpose: VPS hosting every deployed unit; a Storage Box (planned) for
      restic backups
    cost_eur_month: 5.50
    auth: SSH via Tailscale (no Hetzner API automation in this repo)
    docs: docs/ops/vendors.md#hetzner
  - name: Tailscale
    purpose: private network fabric — deploy transport, TLS termination,
      authorization boundary, CI identity
    cost_eur_month: 0
    auth: OAuth client (auth_keys scope), injected per pipeline via Infisical
    docs: docs/ops/vendors.md#tailscale
  - name: Infisical
    purpose: sole secret store for every pipeline; one machine identity per
      pipeline, each scoped to exactly one secret path
    cost_eur_month: 0
    auth: OIDC (GitHub Actions identity token exchange) — no static API key
    docs: docs/ops/vendors.md#infisical
  - name: Cloudflare
    purpose: public-internet edge (Tunnel + Access) for selected paths;
      additive to the tailnet-only private path
    cost_eur_month: 0
    auth: tunnel token (Infisical); Access policies configured in dashboard
    docs: docs/ops/vendors.md#cloudflare-planned--168170
  - name: Supabase
    purpose: hosted Postgres + PostgREST + Auth across three projects
      (toolbelt/platform, lifeos prod, lifeos test)
    cost_eur_month: 0
    auth: publishable key (public) + service-role/table-owner secrets
      (Infisical, pipeline-scoped)
    docs: docs/ops/vendors.md#supabase
  - name: GitHub
    purpose: source of truth, CI/CD, container registry (ghcr.io) for the
      Brain and Handler A images
    cost_eur_month: 0
    auth: built-in GITHUB_TOKEN, minted per-run
    docs: docs/ops/vendors.md#github
  - name: age
    purpose: asymmetric encryption for every backup bundle before it
      leaves CI
    cost_eur_month: 0
    auth: public-key encryption; CI holds only the public recipient key
    docs: docs/ops/vendors.md#age

work_tracking:
  system: github-issues

standard:
  repo: kgsmith19/agent-engineering-standard
  lock_file: standard.lock
  # tools/standardctl.py and TEMPLATES/ are not carried in this repo;
  # verification commands live directly in this file and in each
  # component's own project.yaml.
  vendored: false
