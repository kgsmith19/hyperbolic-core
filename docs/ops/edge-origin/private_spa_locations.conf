# Server-context include for the tailnet-only private origin. The including
# server owns the API proxy locations and must declare /life/api/,
# /api/brain/, and /api/ with ^~ so they take precedence over the asset
# guards below. This file owns frontend routing only; it is deliberately not
# included by the deny-by-default public listener.

include /etc/nginx/mime.types;
default_type application/octet-stream;

# Keep the zone mount canonical. Without this exact match, `/life` reaches
# Shell's root fallback because it does not match the `/life/` prefix.
location = /life {
    return 308 /life/;
}

# A request whose last path segment has an extension is asset-like. Match it
# before the document fallbacks so a missing JS, CSS, image, source map,
# favicon, font, or other static file remains a real 404 instead of receiving
# an SPA document. `alias` removes the /life/ URL prefix from the filesystem
# path: /life/assets/app.js -> lifeos-ui/current/assets/app.js.
location ~* ^/life/(?<life_asset>.+\.[^/]+)$ {
    alias /home/deploy/lifeos-ui/current/$life_asset;
}

location /life/ {
    alias /home/deploy/lifeos-ui/current/;
    try_files $uri $uri/ /life/index.html;
}

# Shell is mounted at the URI root, so `root` appends the complete request
# URI without rewriting it. Explicit =404 is what keeps absent root assets
# from falling through to Shell's index document.
location ~* ^/(?<shell_asset>.+\.[^/]+)$ {
    root /home/deploy/shell/current;
    try_files /$shell_asset =404;
}

location / {
    root /home/deploy/shell/current;
    try_files $uri $uri/ /index.html;
}
