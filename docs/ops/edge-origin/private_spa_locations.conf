# Server-context include for the tailnet-only private origin. The including
# server owns the API proxy locations and must declare /life/api/,
# /api/brain/, and /api/ with ^~ so they take precedence over the asset
# guards below. This file owns frontend routing only; it is deliberately not
# included by the deny-by-default public listener.

include /etc/nginx/mime.types;
default_type application/octet-stream;

# Location selection uses nginx's decoded, dot-segment-normalized URI while
# `$request_uri` retains the original target. Reject traversal below the one
# reserved API/static namespace vocabulary before normalization can move the
# request into either document fallback. The exact api/assets component may
# appear anywhere in the path (including after components that normalization
# later cancels); query/fragment data can never satisfy the path scan. Literal
# and encoded separators, namespace letters (including either ASCII case byte),
# and traversal dots are equivalent.
# The encoded spellings are kept here, once, rather than duplicated across the
# Shell and LifeOS fallback blocks.
# `return` is the only rewrite-module operation, and the explicit body inherits
# the non-HTML default type above.
if ($request_uri ~* "^(?:(?:(?!(?:/|%2f|[?#])).)*(?:/|%2f))*(?:(?:a|%[46]1)(?:p|%[57]0)(?:i|%[46]9)|(?:a|%[46]1)(?:s|%[57]3)(?:s|%[57]3)(?:e|%[46]5)(?:t|%[57]4)(?:s|%[57]3))(?:/|%2f)(?:(?:(?!(?:/|%2f|[?#])).)*(?:/|%2f))*(?:\.|%2e)(?:\.|%2e)(?:(?:/|%2f)|[?#]|$)") {
    return 404 "not found\n";
}

# Keep the zone mount canonical. Without this exact match, `/life` reaches
# Shell's root fallback because it does not match the `/life/` prefix.
location = /lifeos {
    return 308 /life/;
}

location ^~ /lifeos/ {
    rewrite ^/lifeos/(.*)$ /life/$1 permanent;
}

location = /life {
    # nginx selected this location from its normalized URI, but React Router
    # strips the LifeOS basename from the browser's original encoded path.
    # Reject a noncanonical raw boundary instead of redirecting to a document
    # that the destination bundle cannot mount. `if` is safe here: return only.
    if ($request_uri !~ "^/life(?:[?]|$)") {
        return 404;
    }
    return 308 /life/;
}

# Own the build-output namespaces before the generic SPA locations so every
# static name, including an extensionless one, is handled as a file request.
# LifeOS is mounted below /life/, so `alias` replaces the /life/assets/ URI
# prefix with the build's assets directory. With no document fallback in this
# location, nginx's static handler returns 404 when the mapped file is absent.
location ^~ /life/assets/ {
    alias /home/deploy/lifeos-ui/current/assets/;
}

# Shell is mounted at the URI root, so `root` preserves /assets/ in the disk
# path. The explicit terminal =404 prevents a miss from reaching Shell's SPA
# document fallback.
location ^~ /assets/ {
    root /home/deploy/shell/current;
    try_files $uri =404;
}

# A trailing slash after an extension-bearing segment is still asset-like,
# but it cannot name a regular file. Reject it before either SPA fallback.
location ~* ^/.+\.[^/]+/+$ {
    return 404;
}

# Root dotfiles and dot-directories are private-origin data, never SPA routes.
# Own the complete root dot-prefixed namespace before Shell's fallback.
location ~* ^/\. {
    return 404;
}

# A request whose last path segment has an extension is asset-like. Match it
# before the document fallbacks so a missing JS, CSS, image, source map,
# favicon, font, or other static file remains a real 404 instead of receiving
# an SPA document. `alias` removes the /life/ URL prefix from the filesystem
# path: /life/assets/app.js -> lifeos-ui/current/assets/app.js.
location ~* ^/life/(?<life_asset>.+\.[^/]+)$ {
    alias /home/deploy/lifeos-ui/current/$life_asset;
}

location /life/ {
    # Preserve all encoded bytes after a literal `/life/` boundary. Only the
    # boundary itself must be canonical so BrowserRouter basename="/life"
    # sees the same mount that nginx selected after URI normalization.
    if ($request_uri !~ "^/life/") {
        return 404;
    }
    alias /home/deploy/lifeos-ui/current/;
    try_files $uri $uri/ /life/index.html;
}

# Shell is mounted at the URI root, so `root` appends the complete request
# URI without rewriting it. Explicit =404 is what keeps absent root assets
# from falling through to Shell's index document.
location ~* ^/(?<shell_asset>.+\.[^/]+)$ {
    root /home/deploy/shell/current;
    try_files /$shell_asset =404;
}

location / {
    root /home/deploy/shell/current;
    try_files $uri $uri/ /index.html;
}
