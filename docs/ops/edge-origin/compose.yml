# Local-only HTTP origin cloudflared (#168) points at. Loopback-bound, same
# posture as every other unit's compose file on this box (services/llm-handler,
# services/brain, apps/lifeos/backend): the only way in is a route another
# layer explicitly opens, and here that layer is public_paths.conf, which
# opens nothing until the owner edits it.
services:
  edge-origin:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./public_paths.conf:/etc/nginx/public_paths.conf:ro
      - /home/deploy/shell:/home/deploy/shell:ro
      - /home/deploy/lifeos-ui:/home/deploy/lifeos-ui:ro
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - --quiet
        - http://127.0.0.1:8081/healthz
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
