# One nginx process owns two isolated loopback origins. Tailscale Serve sends
# every private request to 127.0.0.1:8080. cloudflared may send explicitly
# allowed public requests to 127.0.0.1:8081. Neither listener is reachable on
# a non-loopback host address.
worker_processes 1;
pid /tmp/edge-origin-nginx.pid;

events {
  worker_connections 64;
}

http {
  access_log off;

  server {
    listen 127.0.0.1:8080;
    server_name private-origin;
    absolute_redirect off;

    location = /healthz {
      default_type application/json;
      return 200 '{"status":"ok"}';
    }

    # No URI suffix on proxy_pass: nginx therefore forwards the complete
    # incoming path. A trailing slash here would silently strip the matched
    # prefix and break each upstream's existing route contract.
    location = /life/api {
      return 308 /life/api/;
    }

    location ^~ /life/api/ {
      proxy_http_version 1.1;
      proxy_buffering off;
      proxy_pass http://127.0.0.1:8000;
    }

    location = /api/brain {
      return 308 /api/brain/;
    }

    location ^~ /api/brain/ {
      proxy_http_version 1.1;
      proxy_buffering off;
      proxy_pass http://127.0.0.1:8100;
    }

    location = /api {
      return 308 /api/;
    }

    location ^~ /api/ {
      proxy_http_version 1.1;
      proxy_buffering off;
      proxy_pass http://127.0.0.1:8200;
    }

    # Issue #346 owns detailed SPA fallback and missing-asset behavior. Keep
    # this include as the single focused extension seam for those rules.
    include /etc/nginx/private_spa_locations.conf;
  }

  server {
    listen 127.0.0.1:8081;
    server_name public-origin;
    root /var/empty;

    # Container/public-origin liveness only. It does not activate an app path.
    location = /healthz {
      default_type text/plain;
      return 200 "ok";
    }

    # Checked in deny-by-default. This server never imports private routes.
    include /etc/nginx/public_paths.conf;
  }
}
