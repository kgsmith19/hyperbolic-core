# Local HTTP origin for cloudflared (compose.yml), mirroring the private route
# table docs/ops/tailscale-serve-apply.sh applies over Tailscale. Bound to
# 127.0.0.1:8081 only -- cloudflared (#168) is the sole intended caller, reached
# over its own outbound-only tunnel; this file is never a public listener itself.
#
# Nothing is public by default: every route lives in public_paths.conf,
# commented out, until the owner explicitly uncomments the paths they want
# Cloudflare Access to front. With public_paths.conf fully commented (the
# checked-in default), every request here 404s -- no location block matches,
# so there is no root or proxy target to fall through to.
# See docs/ops/runbook.md's "Cloudflare edge origin" section.
worker_processes 1;
pid /tmp/edge-origin-nginx.pid;

events {
  worker_connections 64;
}

http {
  access_log off;

  server {
    listen 127.0.0.1:8081;
    server_name edge-origin;

    # Always available regardless of public_paths.conf's content -- the
    # container healthcheck (compose.yml) must stay green in the default,
    # fully-locked-down state, not only once a path is uncommented.
    location = /healthz {
      default_type text/plain;
      return 200 "ok";
    }

    include /etc/nginx/public_paths.conf;
  }
}
