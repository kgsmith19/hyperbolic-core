# See shell.canary.yml header for the shape contract + edit rules.
unit: lifeos-backend
exposure: 0.01
baseline: previous release tag (lifeos image sha-tag diff)
window_hours: 24
invariants:
  - name: lifeos-api-healthz-ok
    signal: platform-smoke /life/api/healthz probe
    halt_if: any probe failure during window
  - name: lifeos-api-latency-bounded
    signal: lifeos API p95 latency (G3 telemetry)
    halt_if: p95 > 2x baseline for 15 consecutive minutes
  - name: lifeos-migration-clean
    signal: deploy log (supabase db push exit 0, no drift warning)
    halt_if: any migration failure or drift warning
success: all smoke probes green for the full window and no halt threshold tripped
halt: any invariant breach halts promotion; previous image tag stays live
