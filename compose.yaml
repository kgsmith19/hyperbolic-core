# Production runtime on the VPS (docs/runbook.md). The API listens on
# loopback only; `tailscale serve` fronts it with HTTPS on the tailnet —
# nothing is reachable from the public internet.
services:
  api:
    image: ${LIFEOS_IMAGE:-ghcr.io/kgsmith19/lifeos:main}
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # Document bytes and extracted text (ADR 015). They deliberately do not
      # live in Postgres, so the nightly pg_dump does not cover them — see
      # docs/runbook.md.
      - lifeos-blobs:/app/var/blobs
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  lifeos-blobs:
